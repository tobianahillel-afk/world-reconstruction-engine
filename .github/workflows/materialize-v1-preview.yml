name: materialize-v1-preview

on:
  push:
    branches:
      - demo-v1-preview
    paths:
      - ".github/workflows/materialize-v1-preview.yml"
      - "demo/v1_preview/README.md"
      - "demo/v1_preview/scene.json"
      - "demo/v1_preview/manifest.json"
      - "demo/v1_preview/render_inputs.py"
      - "demo/v1_preview/run_demo.py"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout preview branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: demo-v1-preview
          persist-credentials: true

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install locked WRE environment
        run: uv sync --frozen --group dev

      - name: Install exact external PyCOLMAP environment
        run: |
          uv pip install --python .venv/bin/python "numpy==2.5.3" "pycolmap==4.2.0"
          .venv/bin/python -c 'import numpy, pycolmap; assert numpy.__version__ == "2.5.3"; assert pycolmap.__version__ == "4.2.0"'

      - name: Render exact fixture images
        run: .venv/bin/python demo/v1_preview/render_inputs.py

      - name: Fix demo text-export directory creation
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          path = Path("demo/v1_preview/run_demo.py")
          text = path.read_text(encoding="utf-8")
          old = '    text_dir = output_dir / "colmap_text_model"\n    native.write_text(str(text_dir))'
          new = '    text_dir = output_dir / "colmap_text_model"\n    text_dir.mkdir()\n    native.write_text(str(text_dir))'
          if old not in text:
              raise SystemExit("expected run_demo.py export block not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Build actual sparse reconstruction
        run: .venv/bin/python demo/v1_preview/run_demo.py --force

      - name: Commit user-preview assets to preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            demo/v1_preview/run_demo.py \
            demo/v1_preview/input_images \
            demo/v1_preview/input_previews \
            demo/v1_preview/generated/reconstruction_wre_ascii.ply \
            demo/v1_preview/generated/summary.json \
            demo/v1_preview/generated/colmap_text_model
          git commit -m "demo: materialize V1 sparse preview assets [skip ci]"
          git push origin HEAD:demo-v1-preview
