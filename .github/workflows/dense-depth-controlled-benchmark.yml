name: dense-depth-controlled-benchmark

on:
  pull_request:
    paths:
      - ".github/workflows/dense-depth-controlled-benchmark.yml"
      - "src/wre/reconstruction/dense_depth.py"
      - "src/wre/reconstruction/dense_depth_coverage.py"
      - "src/wre/reconstruction/dense_depth_benchmark.py"
      - "src/wre/reconstruction/__init__.py"
      - "tests/test_dense_depth_benchmark.py"
      - "tests/fixtures/synthetic/dense-depth-controlled/**"
      - "docs/reviews/V2L15-dense-depth-mvs-fusion-review.md"
      - "registry/components.yaml"
      - "registry/reviews.yaml"
      - "registry/work-items/v2m2.yaml"
      - "PROJECT_STATE.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: cpu-controlled-dense-depth-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout WRE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and exact Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.13"
          python-version: "3.12.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install locked WRE environment
        run: uv sync --locked --all-groups

      - name: Exercise controlled dense-depth benchmark
        env:
          WRE_DENSE_DEPTH_CONTROLLED_BENCHMARK_OUTPUT: ${{ runner.temp }}/v2l15-6-controlled-dense-depth.json
        run: >-
          uv run python -m pytest
          tests/test_dense_depth_benchmark.py
          -vv

      - name: Retain machine-readable benchmark evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v2l15-6-controlled-dense-depth-benchmark
          path: ${{ runner.temp }}/v2l15-6-controlled-dense-depth.json
          if-no-files-found: error
          retention-days: 30
