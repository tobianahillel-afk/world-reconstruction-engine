name: ffmpeg8-compat

on:
  pull_request:
    paths:
      - ".github/workflows/ffmpeg8-compat.yml"
      - "src/wre/ingestion/**"
      - "tests/test_keyframe_extraction.py"
      - "tests/test_video_ingestion.py"
      - "tests/test_adapter_model_registry_baselines.py"
      - "registry/dependencies.yaml"
      - "registry/adapter-models.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ffmpeg-8:
    name: ubuntu-26.04-ffmpeg-8.0.1
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install locked development environment
        run: uv sync --frozen --group dev

      - name: Install exact Ubuntu 26.04 FFmpeg 8 package
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg=7:8.0.1-3ubuntu2
          test "$(dpkg-query -W -f='${Version}' ffmpeg)" = "7:8.0.1-3ubuntu2"
          test "$(ffmpeg -version | head -n 1 | awk '{print $3}')" = "8.0.1-3ubuntu2"
          test "$(ffprobe -version | head -n 1 | awk '{print $3}')" = "8.0.1-3ubuntu2"

      - name: Exercise WRE media ingestion against FFmpeg 8
        run: >-
          uv run pytest
          tests/test_video_ingestion.py
          tests/test_keyframe_extraction.py

      - name: Validate current registered FFmpeg assumptions remain intentionally separate
        run: uv run pytest tests/test_adapter_model_registry_baselines.py
