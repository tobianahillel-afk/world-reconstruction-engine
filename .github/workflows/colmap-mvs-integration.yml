name: colmap-mvs-integration

on:
  pull_request:
    paths:
      - ".github/workflows/colmap-mvs-integration.yml"
      - "registry/external-environments/colmap-mvs-cuda12-4.2.0.json"
      - "registry/dependencies.yaml"
      - "registry/adapter-models.yaml"
      - "registry/work-items/v2m2.yaml"
      - "PROJECT_STATE.yaml"
      - "src/wre/reconstruction/colmap_dense_depth.py"
      - "src/wre/reconstruction/__init__.py"
      - "tests/test_colmap_dense_depth.py"
  workflow_dispatch:
    inputs:
      run_real_cuda:
        description: "Run the retained real COLMAP PatchMatch CUDA fixture on trusted main"
        required: true
        default: false
        type: boolean
      runner_label:
        description: "Trusted self-hosted CUDA runner label"
        required: true
        default: "wre-cuda12"
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify-environment:
    name: pycolmap-cuda12-4.2.0-artifact-resolution-only
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LOCK_PATH: registry/external-environments/colmap-mvs-cuda12-4.2.0.json
      TARGET_PYTHON: "3.12.12"
      PYCOLMAP_PACKAGE: pycolmap-cuda12
      PYCOLMAP_VERSION: "4.2.0"
      NUMPY_VERSION: "2.5.3"
      COLMAP_REVISION: be5e29168d4aff238409d60424812df66aac919f
      COLMAP_TREE: 26de80748b919eda849f28206bb738778edbb493
      COLMAP_LICENSE_BLOB: 868e5accaf67f8fa58e7728b46634b0be7be16e9
      COLMAP_BUILD_WORKFLOW_BLOB: ce51c309472062bb8d65cf2c79ad924f48477608

    steps:
      - name: Checkout WRE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.12.12"
          enable-cache: false

      - name: Resolve and hash exact accelerator wheel closure without installing it
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"

          venv="$RUNNER_TEMP/colmap-mvs-lock-venv"
          downloads="$RUNNER_TEMP/colmap-mvs-wheels"
          constraints="$RUNNER_TEMP/colmap-mvs-constraints.txt"
          generated="$RUNNER_TEMP/colmap-mvs-cuda12-4.2.0.json"

          uv venv "$venv" --python "$TARGET_PYTHON" --seed
          uv pip install --python "$venv/bin/python" "pip==25.2"
          "$venv/bin/python" - <<'PY'
          import os
          import sys
          assert sys.version.split()[0] == os.environ["TARGET_PYTHON"], sys.version
          PY

          mkdir -p "$downloads"
          if test -f "$LOCK_PATH"; then
            "$venv/bin/python" - <<'PY' > "$constraints"
          import json
          import os
          from pathlib import Path

          lock = json.loads(Path(os.environ["LOCK_PATH"]).read_text(encoding="utf-8"))
          for item in sorted(lock["artifacts"], key=lambda value: value["name"].lower()):
              print(f"{item['name']}=={item['version']}")
          PY
            constraint_args=(--constraint "$constraints")
          else
            constraint_args=()
          fi

          "$venv/bin/python" -m pip download \
            --disable-pip-version-check \
            --no-cache-dir \
            --only-binary=:all: \
            --dest "$downloads" \
            "${constraint_args[@]}" \
            "numpy==$NUMPY_VERSION" \
            "$PYCOLMAP_PACKAGE==$PYCOLMAP_VERSION"

          VENV_PYTHON="$venv/bin/python" DOWNLOADS="$downloads" GENERATED="$generated" "$venv/bin/python" - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import subprocess
          import urllib.request
          import zipfile
          from email.parser import BytesParser
          from email.policy import compat32
          from pathlib import Path

          downloads = Path(os.environ["DOWNLOADS"])
          generated = Path(os.environ["GENERATED"])
          python_bin = os.environ["VENV_PYTHON"]

          def get_json(url: str) -> dict:
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "WRE-V2L15.2-COLMAP-MVS-qualification/1"},
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          artifacts: list[dict[str, object]] = []
          seen_names: set[str] = set()

          wheel_paths = sorted(downloads.glob("*.whl"), key=lambda path: path.name)
          if not wheel_paths:
              raise SystemExit("pip download produced no wheels")
          if list(downloads.glob("*.tar.gz")) or list(downloads.glob("*.zip")):
              raise SystemExit("source distributions are forbidden in the accelerator lock")

          for wheel_path in wheel_paths:
              payload = wheel_path.read_bytes()
              digest = hashlib.sha256(payload).hexdigest()

              with zipfile.ZipFile(wheel_path) as archive:
                  metadata_names = [
                      name for name in archive.namelist()
                      if name.endswith(".dist-info/METADATA")
                  ]
                  wheel_names = [
                      name for name in archive.namelist()
                      if name.endswith(".dist-info/WHEEL")
                  ]
                  if len(metadata_names) != 1 or len(wheel_names) != 1:
                      raise SystemExit(
                          f"{wheel_path.name}: expected exactly one METADATA and WHEEL file"
                      )
                  metadata = BytesParser(policy=compat32).parsebytes(
                      archive.read(metadata_names[0])
                  )
                  wheel_metadata = archive.read(wheel_names[0]).decode("utf-8")

              name = str(metadata.get("Name") or "").strip()
              version = str(metadata.get("Version") or "").strip()
              if not name or not version:
                  raise SystemExit(f"{wheel_path.name}: missing package name/version metadata")
              normalized_name = name.lower().replace("_", "-")
              if normalized_name in seen_names:
                  raise SystemExit(f"duplicate resolved package {normalized_name}")
              seen_names.add(normalized_name)

              project = get_json(f"https://pypi.org/pypi/{normalized_name}/{version}/json")
              matches = [
                  item for item in project["urls"]
                  if item.get("filename") == wheel_path.name
                  and item.get("packagetype") == "bdist_wheel"
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"{normalized_name}=={version}: exact downloaded wheel missing from PyPI metadata"
                  )
              published = matches[0]
              expected_digest = published["digests"]["sha256"]
              if digest != expected_digest:
                  raise SystemExit(
                      f"{wheel_path.name}: SHA-256 mismatch {digest} != {expected_digest}"
                  )
              if len(payload) != published["size"]:
                  raise SystemExit(
                      f"{wheel_path.name}: byte length mismatch "
                      f"{len(payload)} != {published['size']}"
                  )

              requires_dist = sorted(
                  str(value).strip()
                  for value in (metadata.get_all("Requires-Dist") or [])
                  if str(value).strip()
              )
              license_expression = str(
                  metadata.get("License-Expression")
                  or project["info"].get("license_expression")
                  or ""
              ).strip()
              legacy_license = str(
                  metadata.get("License")
                  or project["info"].get("license")
                  or ""
              ).strip()
              classifiers = sorted(
                  str(value).strip()
                  for value in (metadata.get_all("Classifier") or [])
                  if str(value).startswith("License ::")
              )
              tags = sorted(
                  line.removeprefix("Tag: ").strip()
                  for line in wheel_metadata.splitlines()
                  if line.startswith("Tag: ")
              )
              if not tags:
                  raise SystemExit(f"{wheel_path.name}: WHEEL metadata exposes no Tag entries")

              artifacts.append(
                  {
                      "name": normalized_name,
                      "version": version,
                      "filename": wheel_path.name,
                      "url": published["url"],
                      "sha256": digest,
                      "byte_length": len(payload),
                      "requires_python": (
                          published.get("requires_python")
                          or project["info"].get("requires_python")
                      ),
                      "requires_dist": requires_dist,
                      "wheel_tags": tags,
                      "license_expression": license_expression or None,
                      "legacy_license": legacy_license or None,
                      "license_classifiers": classifiers,
                  }
              )

          artifacts.sort(key=lambda item: (item["name"], item["version"], item["filename"]))
          by_name = {item["name"]: item for item in artifacts}

          required = {
              "numpy": os.environ["NUMPY_VERSION"],
              os.environ["PYCOLMAP_PACKAGE"]: os.environ["PYCOLMAP_VERSION"],
          }
          for name, version in required.items():
              item = by_name.get(name)
              if item is None or item["version"] != version:
                  raise SystemExit(f"missing exact required artifact {name}=={version}")

          pycolmap = by_name[os.environ["PYCOLMAP_PACKAGE"]]
          expected_requires = sorted([
              "cuda-toolkit[cudart,curand]<13,>=12",
              "numpy",
              'opencv-python-headless; extra == "panorama"',
              'pillow; extra == "panorama"',
              'tqdm; extra == "panorama"',
          ])
          if pycolmap["requires_dist"] != expected_requires:
              raise SystemExit(
                  "pycolmap-cuda12 Requires-Dist drift: "
                  f"{pycolmap['requires_dist']} != {expected_requires}"
              )
          if "cp312-cp312-manylinux_2_28_x86_64" not in pycolmap["filename"]:
              raise SystemExit(
                  "unexpected pycolmap-cuda12 target wheel: " + str(pycolmap["filename"])
              )

          pip_version = subprocess.check_output(
              [python_bin, "-m", "pip", "--version"],
              text=True,
          ).split()[1]
          if pip_version != "25.2":
              raise SystemExit(f"unexpected pip resolver version {pip_version}")

          manifest = {
              "schema_version": 1,
              "evidence_kind": "external_accelerator_artifact_resolution_only",
              "runtime_execution_evidence": False,
              "gpu_execution_evidence": False,
              "installer_execution_evidence": False,
              "wheel_import_execution_evidence": False,
              "target": {
                  "python": os.environ["TARGET_PYTHON"],
                  "implementation": "CPython",
                  "platform": "linux_x86_64",
                  "architecture": "x86_64",
                  "cuda_major": 12,
              },
              "source": {
                  "repository": "colmap/colmap",
                  "tag": "4.2.0",
                  "revision": os.environ["COLMAP_REVISION"],
                  "tree": os.environ["COLMAP_TREE"],
                  "license_git_blob_sha1": os.environ["COLMAP_LICENSE_BLOB"],
                  "build_workflow_git_blob_sha1": os.environ["COLMAP_BUILD_WORKFLOW_BLOB"],
                  "direct_license": "BSD-3-Clause",
              },
              "resolver": {
                  "pip": pip_version,
                  "only_binary": True,
                  "no_cache": True,
                  "constraints_from_committed_lock_when_present": True,
              },
              "requested": [
                  {"name": "numpy", "version": os.environ["NUMPY_VERSION"]},
                  {
                      "name": os.environ["PYCOLMAP_PACKAGE"],
                      "version": os.environ["PYCOLMAP_VERSION"],
                  },
              ],
              "artifacts": artifacts,
          }
          generated.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(
              f"resolved {len(artifacts)} exact wheels / "
              f"{sum(int(item['byte_length']) for item in artifacts)} bytes"
          )
          PY

      - name: Verify committed lock or expose first qualification result
        shell: bash
        run: |
          set -euo pipefail
          generated="$RUNNER_TEMP/colmap-mvs-cuda12-4.2.0.json"
          sha256sum "$generated"
          if test -f "$LOCK_PATH"; then
            diff -u "$LOCK_PATH" "$generated"
            echo "Committed COLMAP MVS accelerator lock matches exact regeneration."
          else
            echo "No committed COLMAP MVS accelerator lock exists yet; this run is first-artifact qualification evidence."
            echo "----- BEGIN GENERATED COLMAP MVS ENVIRONMENT LOCK -----"
            cat "$generated"
            echo "----- END GENERATED COLMAP MVS ENVIRONMENT LOCK -----"
          fi

      - name: Retain machine-readable environment qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v2l15-2-colmap-mvs-environment-lock
          path: ${{ runner.temp }}/colmap-mvs-cuda12-4.2.0.json
          if-no-files-found: error
          retention-days: 30

  cuda-wheel-import-preflight:
    name: pycolmap-cuda12-4.2.0-cpu-import-preflight
    needs: qualify-environment
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LOCK_PATH: registry/external-environments/colmap-mvs-cuda12-4.2.0.json

    steps:
      - name: Checkout WRE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CPU import preflight evidence path
        shell: bash
        run: |
          set -euo pipefail
          echo "WRE_COLMAP_MVS_IMPORT_PREFLIGHT_EVIDENCE=$RUNNER_TEMP/wre-colmap-mvs-cuda-import-preflight.json" >> "$GITHUB_ENV"

      - name: Install exact uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.12.12"
          enable-cache: false

      - name: Sync frozen WRE test harness without PyCOLMAP
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --group dev
          .venv/bin/python - <<'PY'
          import importlib.util
          import sys

          assert sys.version.split()[0] == "3.12.12", sys.version
          assert importlib.util.find_spec("pycolmap") is None, (
              "frozen WRE test harness must not preinstall a CPU PyCOLMAP"
          )
          PY

      - name: Download verify and install exact accelerator wheel closure
        shell: bash
        run: |
          set -euo pipefail
          wheel_dir="$RUNNER_TEMP/colmap-mvs-import-preflight-wheels"
          rm -rf "$wheel_dir"
          mkdir -p "$wheel_dir"

          WHEEL_DIR="$wheel_dir" .venv/bin/python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          lock = json.loads(Path(os.environ["LOCK_PATH"]).read_text(encoding="utf-8"))
          wheel_dir = Path(os.environ["WHEEL_DIR"])
          artifacts = lock["artifacts"]
          if len(artifacts) != 5:
              raise SystemExit(
                  f"expected exactly five reviewed accelerator wheels, got {len(artifacts)}"
              )

          for item in artifacts:
              filename = str(item["filename"])
              if Path(filename).name != filename or not filename.endswith(".whl"):
                  raise SystemExit(f"unsafe reviewed wheel filename: {filename}")
              request = urllib.request.Request(
                  str(item["url"]),
                  headers={"User-Agent": "WRE-V2L15.2-CUDA-import-preflight/1"},
              )
              with urllib.request.urlopen(request, timeout=120) as response:
                  payload = response.read()
              digest = hashlib.sha256(payload).hexdigest()
              if digest != item["sha256"]:
                  raise SystemExit(
                      f"{filename}: SHA-256 mismatch {digest} != {item['sha256']}"
                  )
              if len(payload) != item["byte_length"]:
                  raise SystemExit(
                      f"{filename}: byte length mismatch "
                      f"{len(payload)} != {item['byte_length']}"
                  )
              (wheel_dir / filename).write_bytes(payload)

          actual = sorted(path.name for path in wheel_dir.glob("*.whl"))
          expected = sorted(str(item["filename"]) for item in artifacts)
          if actual != expected:
              raise SystemExit(f"downloaded wheel membership drift: {actual} != {expected}")
          PY

          uv pip install --python .venv/bin/python --no-deps "$wheel_dir"/*.whl

      - name: Import exact CUDA wheel and exercise synthetic fixture APIs without PatchMatch
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import tempfile
          from pathlib import Path

          import numpy
          import pycolmap

          from wre.reconstruction.colmap_dense_depth import (
              COLMAP_PATCH_MATCH_DENSE_DEPTH_SOURCE_REVISION,
              inspect_colmap_dense_depth_environment,
          )

          assert numpy.__version__ == "2.5.3", numpy.__version__
          environment = inspect_colmap_dense_depth_environment(pycolmap)
          assert environment.pycolmap_version == "4.2.0"
          assert environment.upstream_has_cuda is True
          assert COLMAP_PATCH_MATCH_DENSE_DEPTH_SOURCE_REVISION in environment.colmap_build
          assert callable(pycolmap.synthesize_dataset)
          assert callable(pycolmap.synthesize_images)
          assert callable(pycolmap.undistort_images)
          assert callable(pycolmap.patch_match_stereo)

          with tempfile.TemporaryDirectory(
              prefix="wre-colmap-mvs-import-preflight-",
              dir=os.environ["RUNNER_TEMP"],
          ) as tmp_raw:
              root = Path(tmp_raw)
              database_path = root / "synthetic.db"
              options = pycolmap.SyntheticDatasetOptions()
              options.num_rigs = 1
              options.num_cameras_per_rig = 1
              options.num_frames_per_rig = 4
              options.num_points3D = 600
              options.track_length = -1
              options.sensor_from_rig_translation_stddev = 0.0
              options.sensor_from_rig_rotation_stddev = 0.0
              options.camera_width = 320
              options.camera_height = 240
              options.camera_model_id = pycolmap.CameraModelId.PINHOLE
              options.camera_params = [280.0, 280.0, 160.0, 120.0]
              options.camera_has_prior_focal_length = True
              options.num_points2D_without_point3D = 0
              options.inlier_match_ratio = 1.0
              options.match_config = pycolmap.SyntheticDatasetMatchConfig.EXHAUSTIVE

              pycolmap.set_random_seed(20260924)
              with pycolmap.Database.open(database_path) as database:
                  reconstruction = pycolmap.synthesize_dataset(options, database)
              assert bool(reconstruction.is_valid())
              assert int(reconstruction.num_reg_images()) == 4
              assert int(reconstruction.num_points3D()) == 600

              image_root = root / "images"
              image_root.mkdir()
              image_options = pycolmap.SyntheticImageOptions()
              image_options.feature_peak_radius = 1
              image_options.feature_patch_radius = 4
              image_options.feature_patch_max_brightness = 220
              pycolmap.synthesize_images(image_options, reconstruction, image_root)

              image_names = sorted(
                  str(reconstruction.image(int(image_id)).name)
                  for image_id in reconstruction.reg_image_ids()
              )
              assert len(image_names) == 4
              assert all((image_root / image_name).is_file() for image_name in image_names)

              model_path = root / "model"
              model_path.mkdir()
              reconstruction.write(model_path)
              reloaded = pycolmap.Reconstruction(model_path)
              assert bool(reloaded.is_valid())
              assert int(reloaded.num_reg_images()) == 4
              assert int(reloaded.num_points3D()) == 600

          evidence = {
              "schema_version": 1,
              "evidence_kind": "pycolmap_cuda12_4_2_0_cpu_import_preflight",
              "wheel_import_execution_evidence": True,
              "synthetic_fixture_execution_evidence": True,
              "gpu_execution_evidence": False,
              "patchmatch_execution_evidence": False,
              "stereo_fusion_execution_evidence": False,
              "environment": {
                  "ceres_version": environment.ceres_version,
                  "colmap_build": environment.colmap_build,
                  "colmap_version": environment.colmap_version,
                  "pycolmap_version": environment.pycolmap_version,
                  "upstream_has_cuda": environment.upstream_has_cuda,
              },
              "fixture": {
                  "seed": 20260924,
                  "camera_model": "PINHOLE",
                  "camera_width": 320,
                  "camera_height": 240,
                  "num_frames": 4,
                  "num_points3D": 600,
              },
          }
          Path(os.environ["WRE_COLMAP_MVS_IMPORT_PREFLIGHT_EVIDENCE"]).write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(evidence, sort_keys=True))
          PY

      - name: Retain CPU import preflight evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v2l15-2-colmap-mvs-cuda-import-preflight
          path: ${{ env.WRE_COLMAP_MVS_IMPORT_PREFLIGHT_EVIDENCE }}
          if-no-files-found: error
          retention-days: 30

  real-cuda-patchmatch:
    name: pycolmap-cuda12-4.2.0-real-patchmatch
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_real_cuda && github.ref == 'refs/heads/main' && github.repository == 'tobianahillel-afk/world-reconstruction-engine' }}
    needs: qualify-environment
    runs-on: [self-hosted, linux, x64, "${{ inputs.runner_label }}"]
    timeout-minutes: 45
    env:
      LOCK_PATH: registry/external-environments/colmap-mvs-cuda12-4.2.0.json
      WRE_COLMAP_MVS_REAL_CUDA: "1"

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize retained evidence paths
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "WRE_COLMAP_MVS_REAL_ROOT=$RUNNER_TEMP/wre-colmap-mvs-real"
            echo "WRE_COLMAP_MVS_HARDWARE_EVIDENCE=$RUNNER_TEMP/wre-colmap-mvs-hardware.json"
            echo "WRE_COLMAP_MVS_EVIDENCE_PATH=$RUNNER_TEMP/wre-colmap-mvs-real-evidence.json"
          } >> "$GITHUB_ENV"

      - name: Install exact uv Python and frozen WRE test harness
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.12.12"
          enable-cache: false

      - name: Sync frozen WRE test harness without PyCOLMAP
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --group dev
          .venv/bin/python - <<'PY'
          import importlib.util
          import sys

          assert sys.version.split()[0] == "3.12.12", sys.version
          assert importlib.util.find_spec("pycolmap") is None, (
              "frozen WRE test harness must not preinstall a CPU PyCOLMAP"
          )
          PY

      - name: Download verify and install exact accelerator wheel closure
        shell: bash
        run: |
          set -euo pipefail
          wheel_dir="$RUNNER_TEMP/colmap-mvs-real-wheels"
          rm -rf "$wheel_dir"
          mkdir -p "$wheel_dir"

          WHEEL_DIR="$wheel_dir" .venv/bin/python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          lock = json.loads(Path(os.environ["LOCK_PATH"]).read_text(encoding="utf-8"))
          wheel_dir = Path(os.environ["WHEEL_DIR"])
          artifacts = lock["artifacts"]
          if len(artifacts) != 5:
              raise SystemExit(f"expected exactly five reviewed accelerator wheels, got {len(artifacts)}")

          for item in artifacts:
              filename = str(item["filename"])
              if Path(filename).name != filename or not filename.endswith(".whl"):
                  raise SystemExit(f"unsafe reviewed wheel filename: {filename}")
              request = urllib.request.Request(
                  str(item["url"]),
                  headers={"User-Agent": "WRE-V2L15.2-real-CUDA-evidence/1"},
              )
              with urllib.request.urlopen(request, timeout=120) as response:
                  payload = response.read()
              digest = hashlib.sha256(payload).hexdigest()
              if digest != item["sha256"]:
                  raise SystemExit(
                      f"{filename}: SHA-256 mismatch {digest} != {item['sha256']}"
                  )
              if len(payload) != item["byte_length"]:
                  raise SystemExit(
                      f"{filename}: byte length mismatch {len(payload)} != {item['byte_length']}"
                  )
              (wheel_dir / filename).write_bytes(payload)

          actual = sorted(path.name for path in wheel_dir.glob("*.whl"))
          expected = sorted(str(item["filename"]) for item in artifacts)
          if actual != expected:
              raise SystemExit(f"downloaded wheel membership drift: {actual} != {expected}")
          PY

          uv pip install --python .venv/bin/python --no-deps "$wheel_dir"/*.whl

      - name: Verify exact real CUDA PyCOLMAP environment
        shell: bash
        run: |
          set -euo pipefail
          command -v nvidia-smi >/dev/null
          nvidia-smi -L

          .venv/bin/python - <<'PY'
          import numpy
          import pycolmap

          from wre.reconstruction.colmap_dense_depth import (
              COLMAP_PATCH_MATCH_DENSE_DEPTH_SOURCE_REVISION,
              inspect_colmap_dense_depth_environment,
          )

          assert numpy.__version__ == "2.5.3", numpy.__version__
          environment = inspect_colmap_dense_depth_environment(pycolmap)
          assert environment.pycolmap_version == "4.2.0"
          assert environment.upstream_has_cuda is True
          assert COLMAP_PATCH_MATCH_DENSE_DEPTH_SOURCE_REVISION in environment.colmap_build
          print(environment)
          PY

      - name: Record material GPU hardware identity
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WRE_COLMAP_MVS_REAL_ROOT"
          rm -f "$WRE_COLMAP_MVS_HARDWARE_EVIDENCE" "$WRE_COLMAP_MVS_EVIDENCE_PATH"

          .venv/bin/python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path

          query = subprocess.check_output(
              [
                  "nvidia-smi",
                  "--query-gpu=index,uuid,name,driver_version,pci.bus_id",
                  "--format=csv,noheader,nounits",
              ],
              text=True,
          ).strip()
          if not query:
              raise SystemExit("nvidia-smi returned no GPU rows")

          document = {
              "schema_version": 1,
              "evidence_kind": "wre_hardware_runtime_identity",
              "gpu_execution_evidence": True,
              "machine": platform.machine(),
              "kernel_release": platform.release(),
              "system": platform.system(),
              "nvidia_gpus": [line.strip() for line in query.splitlines() if line.strip()],
          }
          payload = (
              json.dumps(document, indent=2, sort_keys=True) + "\n"
          ).encode("utf-8")
          path = Path(os.environ["WRE_COLMAP_MVS_HARDWARE_EVIDENCE"])
          path.write_bytes(payload)
          digest = hashlib.sha256(payload).hexdigest()
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              stream.write(f"WRE_COLMAP_MVS_HARDWARE_SHA256={digest}\n")
          print(f"hardware_sha256={digest}")
          PY

