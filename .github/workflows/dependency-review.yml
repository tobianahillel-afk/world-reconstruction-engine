name: dependency-review

on:
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      # Source-of-truth external Python/CUDA wheel and model dependency pins.
      - "registry/dependencies.yaml"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Dependency Graph availability
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(
            curl --silent --show-error --output /tmp/wre-sbom.json --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/dependency-graph/sbom"
          )"

          case "${status}" in
            200)
              # HTTP 200 alone is not proof of an available usable SBOM.
              # A malformed/empty graph must fail before dependency-review.
              python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/wre-sbom.json").read_text(encoding="utf-8"))
          sbom = result.get("sbom")
          if not isinstance(sbom, dict):
              raise SystemExit("Dependency Graph returned HTTP 200 without an SPDX SBOM")
          version = sbom.get("spdxVersion")
          packages = sbom.get("packages")
          if not isinstance(version, str) or not version.startswith("SPDX-"):
              raise SystemExit("Dependency Graph returned an invalid SPDX version")
          if not isinstance(packages, list) or not packages:
              raise SystemExit("Dependency Graph SBOM package inventory is empty or malformed")
          if any(not isinstance(package, dict) or not package.get("name") for package in packages):
              raise SystemExit("Dependency Graph SBOM has malformed package entries")
          print(f"Dependency Graph accessible: {len(packages)} SPDX packages present.")
          PY
              echo "enabled=true" >> "${GITHUB_OUTPUT}"
              ;;
            403|404)
              echo "::error::Dependency Graph unavailable (HTTP ${status}). Dependency Review did NOT execute. Enable the repository Dependency Graph and required token permissions; fail closed instead of reporting a false green."
              exit 1
              ;;
            *)
              echo "Unexpected Dependency Graph API response: HTTP ${status}" >&2
              exit 1
              ;;
          esac

      - name: Review dependency changes
        if: steps.dependency-graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: "runtime, development, unknown"
          comment-summary-in-pr: never
