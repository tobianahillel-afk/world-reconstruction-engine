name: dependency-review

on:
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Dependency Graph availability
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(
            curl --silent --show-error --output /tmp/wre-sbom.json --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/dependency-graph/sbom"
          )"

          case "${status}" in
            200)
              echo "enabled=true" >> "${GITHUB_OUTPUT}"
              ;;
            403|404)
              echo "enabled=false" >> "${GITHUB_OUTPUT}"
              echo "::warning::Dependency Graph is not enabled or not available (HTTP ${status}); strict Dependency Review is configured but cannot run until the repository setting is enabled."
              ;;
            *)
              echo "Unexpected Dependency Graph API response: HTTP ${status}" >&2
              exit 1
              ;;
          esac

      - name: Review dependency changes
        if: steps.dependency-graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: "runtime, development, unknown"
          comment-summary-in-pr: never
