name: v2l4-3-handoff

on:
  push:
    branches:
      - feature/v2l4-3-quality-decision

permissions:
  contents: write

jobs:
  handoff:
    if: ${{ !contains(github.event.head_commit.message, 'Record lifecycle handoff') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/v2l4-3-quality-decision
          fetch-depth: 0
          persist-credentials: true
      - name: Apply lifecycle handoff
        env:
          CONTRACT_B64: 
          COMPONENT_B64: 
          STATE_B64: 
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label} expected exactly once, found {count}")
              return text.replace(old, new, 1)

          roadmap = Path("registry/work-items/v2m0.yaml")
          roadmap_text = roadmap.read_text(encoding="utf-8")
          roadmap_text = replace_once(
              roadmap_text,
              "  - id: V2L4.3\n    lot: V2L4\n    title: Quality decision contract\n    status: ready\n",
              "  - id: V2L4.3\n    lot: V2L4\n    title: Quality decision contract\n    status: done\n",
              "V2L4.3 ready block",
          )
          old_stub = "  - {id: V2L4.4, lot: V2L4, title: Benchmark record schema, status: planned, depends_on: [V2L4.3]}"
          new_contract = base64.b64decode(os.environ["CONTRACT_B64"]).decode("utf-8").rstrip("\n")
          roadmap_text = replace_once(roadmap_text, old_stub, new_contract, "V2L4.4 planned stub")
          roadmap.write_text(roadmap_text, encoding="utf-8")

          components = Path("registry/components.yaml")
          components_text = components.read_text(encoding="utf-8")
          old_component = (
              "  quality_failure_benchmarks:\n"
              "    owner_lot: V2L4\n"
              "    implementation:\n"
              "      - src/wre/domain/failures.py\n"
              "      - src/wre/domain/metrics.py\n"
              "      - src/wre/domain/__init__.py\n"
              "    tests:\n"
              "      - tests/test_failure_taxonomy.py\n"
              "      - tests/test_metrics.py\n"
              "    status: implementing\n"
          )
          new_component = base64.b64decode(os.environ["COMPONENT_B64"]).decode("utf-8")
          components_text = replace_once(
              components_text, old_component, new_component, "V2L4 component block"
          )
          components.write_text(components_text, encoding="utf-8")

          state = Path("PROJECT_STATE.yaml")
          state_text = state.read_text(encoding="utf-8")
          state_text = replace_once(
              state_text, "active_work_item: V2L4.3", "active_work_item: V2L4.4", "active work item"
          )
          state_text = replace_once(
              state_text, "V2L4.2]", "V2L4.2, V2L4.3]", "last completed tail"
          )
          state_text = replace_once(
              state_text, "last_merged_pr: 60", "last_merged_pr: 61", "last merged PR"
          )
          start = state_text.index("current_goal: >-")
          end = state_text.index("blockers: []", start)
          replacement = base64.b64decode(os.environ["STATE_B64"]).decode("utf-8")
          state_text = state_text[:start] + replacement + state_text[end:]
          state_text = state_text.replace("updated_at: '2026-09-16'", "updated_at: '2026-09-17'", 1)
          state.write_text(state_text, encoding="utf-8")
          PY
      - name: Commit handoff metadata
        run: |
          if git diff --quiet; then
            echo "No handoff changes to commit"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add PROJECT_STATE.yaml registry/components.yaml registry/work-items/v2m0.yaml
          git commit -m "[V2L4.3] Record lifecycle handoff"
          git push origin HEAD:feature/v2l4-3-quality-decision
