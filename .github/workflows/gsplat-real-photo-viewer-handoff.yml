name: gsplat-real-photo-viewer-handoff
on:
  pull_request:
    paths:
      - .github/workflows/gsplat-real-photo-viewer-handoff.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  viewer:
    name: real-16-photo-COLMAP-Gaussian-viewer-bundle-no-GPU
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout audited WRE viewer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned WRE Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Download real 16-photo upstream Gaussian seed artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          repository: tobianahillel-afk/world-reconstruction-engine
          run-id: 39082307350
          name: wre-real-photo-GAUSSIANS-UNTRAINED
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/real-photo-gaussians
      - name: Export canonical WRE viewer ZIP from actual real-photo Gaussian PLY
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import struct
          import zipfile
          from collections import Counter
          from pathlib import Path

          from wre.domain.appearance import APPEARANCE_MODEL_ARTIFACT_KIND
          from wre.domain.artifacts import ArtifactId, ArtifactRef
          from wre.reconstruction.static_appearance_baseline import (
              GsplatStaticAppearanceTrainingProfile,
              export_verified_gsplat_viewer_bundle,
          )

          temp = Path(os.environ["RUNNER_TEMP"])
          source = temp / "real-photo-gaussians"
          def only(name):
              matches = list(source.rglob(name))
              assert len(matches) == 1, (name, len(matches))
              return matches[0]

          raw_ply = only("observed-GAUSSIANS-UNTRAINED.ply")
          raw_splat = only("observed-GAUSSIANS-UNTRAINED.splat")
          provenance = json.loads(only("untrained-gaussian-provenance.json").read_text())
          n = provenance["gaussians_original_rgb_observed"]
          assert n == 6917
          assert provenance["training_steps"] == 0
          assert provenance["gpu_kernel_executed"] is False
          assert provenance["source_gsplat_commit"] == "937e29912570c372bed6747a5c9bf85fed877bae"
          assert provenance["dataset_license"].startswith("CC BY-NC 4.0: Attribution-NonCommercial")
          source_sha = provenance["upstream_exporter_ply_sha256"]
          assert hashlib.sha256(raw_ply.read_bytes()).hexdigest() == source_sha
          native = raw_splat.read_bytes()
          assert len(native) == n * 32
          assert hashlib.sha256(native).hexdigest() == provenance["upstream_exporter_splat_sha256"]

          # max_steps=1 is used solely for the WRE *filename* point_cloud_0.ply.
          # The source is explicitly UNTRAINED: 0 optimization iterations.
          profile = GsplatStaticAppearanceTrainingProfile(max_steps=1)
          staged = temp / "wre-verified-source"
          ply = staged / profile.expected_ply_relative_path
          ply.parent.mkdir(parents=True)
          shutil.copyfile(raw_ply, ply)
          result = temp / "wre-real-photo-viewer-result"
          result.mkdir()
          bundle = result / "16-real-photo-untrained-gaussians.zip"
          digest = export_verified_gsplat_viewer_bundle(
              artifact_ref=ArtifactRef(
                  ArtifactId("appearance:gsplat:real-16photo-untrained"),
                  APPEARANCE_MODEL_ARTIFACT_KIND,
              ),
              output_root=staged,
              profile=profile,
              bundle_path=bundle,
          )
          assert hashlib.sha256(bundle.read_bytes()).hexdigest() == str(digest)
          with zipfile.ZipFile(bundle) as archive:
              assert set(archive.namelist()) == {"scene.splat", "centers.glb", "manifest.json"}
              derived = archive.read("scene.splat")
              glb = archive.read("centers.glb")
              manifest = json.loads(archive.read("manifest.json"))
          assert len(derived) == n * 32
          assert glb[:4] == b"glTF"
          assert manifest["source_ply"]["sha256"] == source_sha
          for name, value in (("scene.splat", derived), ("centers.glb", glb)):
              assert manifest["outputs"][name]["sha256"] == hashlib.sha256(value).hexdigest()
              assert manifest["outputs"][name]["size_bytes"] == len(value)
          json_size, chunk_type = struct.unpack_from("<I4s", glb, 12)
          assert chunk_type == b"JSON"
          scene = json.loads(glb[20:20 + json_size])
          assert scene["accessors"][0]["count"] == n
          assert scene["meshes"][0]["primitives"][0]["mode"] == 0
          def positions(data):
              return Counter(
                  struct.unpack_from("<3f", data, offset)
                  for offset in range(0, len(data), 32)
              )
          assert positions(derived) == positions(native)
          assert hashlib.sha256(ply.read_bytes()).hexdigest() == source_sha

          # Reuse the exact already-proven 16-camera offline WebGL viewer from
          # the pinned real-photo producer, but display WRE's DERIVED .splat.
          # No original upstream .splat is copied into this browser handoff.
          viewer = result / "offline-viewer"
          viewer.mkdir()
          vendor_html = only("index.html").read_bytes()
          vendor_js = only("main.js").read_bytes()
          vendor_license = only("Gaussian-WebGL-viewer-MIT-LICENSE.txt").read_bytes()
          assert b"UNTRAINED (0 steps)" in vendor_html
          assert b"observed-GAUSSIANS-UNTRAINED.splat" in vendor_js
          assert b"Copyright (c) 2023 Kevin Kwok" in vendor_license
          assert hashlib.sha256(vendor_js).hexdigest() == provenance["real_gaussian_webgl"]["local_main_js_sha256"]
          (viewer / "index.html").write_bytes(vendor_html)
          (viewer / "main.js").write_bytes(vendor_js)
          (viewer / "Gaussian-WebGL-viewer-MIT-LICENSE.txt").write_bytes(vendor_license)
          (viewer / "observed-GAUSSIANS-UNTRAINED.splat").write_bytes(derived)
          (viewer / "HOW_TO_VIEW.txt").write_text(
              "UNTRAINED Gaussian scene from 16 real photos, nonmetric, noncommercial.\n"
              "Run: python3 -m http.server 8767 --bind 127.0.0.1\n"
              "Open http://127.0.0.1:8767/offline-viewer/index.html and orbit/zoom.\n"
              "Keyboard 0-9 or +/- changes real recovered camera positions.\n"
              "The .splat is generated by the WRE exporter; CUDA/training steps: 0.\n"
              "Pierre Moulon original photographs: CC BY-NC 4.0.\n",
              encoding="utf-8",
          )
          assert hashlib.sha256(
              (viewer / "observed-GAUSSIANS-UNTRAINED.splat").read_bytes()
          ).hexdigest() == manifest["outputs"]["scene.splat"]["sha256"]

          evidence = {
              "source_workflow_run": 39082307350,
              "source_head_sha": "6e503dbff2c8df6dad0ecd82cbcddb9657ed5070",
              "input": "16 genuine DJI photos -> actual CPU COLMAP -> pinned gsplat CPU export",
              "gaussians": n,
              "training_steps": 0,
              "gpu_training_verified": False,
              "viewer_zip_sha256": str(digest),
              "offline_webgl_viewer": {
                  "entrypoint": "offline-viewer/index.html",
                  "source": "pinned 16-view upstream WebGL viewer; WRE-derived splat",
                  "splat_sha256": manifest["outputs"]["scene.splat"]["sha256"],
                  "javascript_sha256": hashlib.sha256(vendor_js).hexdigest(),
                  "training_steps": 0,
                  "gpu_training": False,
              },
              "input_ply_sha256": source_sha,
              "original_splat_sha256": provenance["upstream_exporter_splat_sha256"],
              "source_license": provenance["dataset_license"],
              "source_credit": provenance["dataset_credit"],
              "limits": "Untrained static SH0 Gaussian seeds; no 4D, real GPU training or held-out quality",
          }
          (result / "evidence.json").write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n")
          (result / "LICENSE-NOTICE.txt").write_text(
              "16 source DJI photos: Pierre Moulon, CC BY-NC 4.0 (noncommercial).\n"
              "Generated WRE viewer ZIP: untrained Gaussian seeds (0 steps).\n"
              "scene.splat: SH0 only. centers.glb: RGB point cloud, not radiance.\n"
              "No GPU kernel/training, metric scale or 4D validated.\n"
          )
          print(f"REAL-PHOTO WRE VIEWER ZIP PASS: {n} Gaussians, 16 photos; SHA256 {digest}")
          PY
      - name: Render WRE-derived 6917 real-photo Gaussian splats in headless Chrome WebGL
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/wre-real-photo-viewer-result"
          google-chrome --version
          driver="$CHROMEWEBDRIVER/chromedriver"
          test -x "$driver"
          python3 -m http.server 8767 --bind 127.0.0.1 --directory "$root" >/tmp/wre-handoff-http.log 2>&1 &
          http_pid="$!"
          "$driver" --port=9517 --allowed-ips=127.0.0.1 >/tmp/wre-handoff-driver.log 2>&1 &
          driver_pid="$!"
          trap 'kill "$http_pid" "$driver_pid" 2>/dev/null || true' EXIT
          uv run --no-sync python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import struct
          import time
          from pathlib import Path
          from urllib.request import Request, urlopen

          destination = Path(os.environ["RUNNER_TEMP"]) / "wre-real-photo-viewer-result"
          evidence_path = destination / "evidence.json"
          evidence = json.loads(evidence_path.read_text())
          assert evidence["gaussians"] == 6917
          url_base = "http://127.0.0.1:9517"
          def webdriver(method, route, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = Request(url_base + route, data=data, method=method,
                                headers={"Content-Type": "application/json"})
              with urlopen(request, timeout=45) as response:
                  result = json.load(response)["value"]
              if isinstance(result, dict) and result.get("error"):
                  raise RuntimeError(str(result))
              return result

          for _ in range(75):
              try:
                  if webdriver("GET", "/status")["ready"]:
                      break
              except (OSError, KeyError):
                  time.sleep(0.4)
          else:
              raise RuntimeError("Real ChromeDriver was not ready")
          options = {"browserName": "chrome", "goog:chromeOptions": {"args": [
              "--headless=new", "--no-sandbox", "--disable-dev-shm-usage",
              "--enable-unsafe-swiftshader", "--use-gl=angle",
              "--use-angle=swiftshader", "--window-size=1280,900",
              "--disable-background-networking",
              "--host-resolver-rules=MAP * 0.0.0.0, EXCLUDE localhost",
          ]}}
          session = webdriver("POST", "/session", {"capabilities": {"alwaysMatch": options}})["sessionId"]
          try:
              webdriver("POST", f"/session/{session}/url", {
                  "url": "http://127.0.0.1:8767/offline-viewer/index.html",
              })
              for _ in range(125):
                  rendered = webdriver("POST", f"/session/{session}/execute/sync", {
                      "script": """const canvas=document.getElementById('canvas');
                        return {count: window.__wreRenderedGaussianCount || 0,
                          error: document.getElementById('message')?.textContent || '',
                          webgl: Boolean(canvas?.getContext('webgl2')),
                          width: canvas?.width || 0};""",
                      "args": [],
                  })
                  if rendered["error"]:
                      raise RuntimeError("WebGL viewer: " + rendered["error"])
                  if rendered["count"] == 6917 and rendered["webgl"] and rendered["width"] >= 640:
                      break
                  time.sleep(0.35)
              else:
                  raise RuntimeError("WRE-derived .splat not drawn in real WebGL: " + str(rendered))
              screenshot = base64.b64decode(webdriver("GET", f"/session/{session}/screenshot"))
              assert screenshot[:8] == b"\x89PNG\r\n\x1a\n"
              width, height = struct.unpack_from(">II", screenshot, 16)
              assert width >= 1100 and height >= 700 and len(screenshot) > 10_000
              (destination / "WRE-derived-real-photo-WebGL.png").write_bytes(screenshot)
              evidence["webgl_chrome"] = {
                  "actual_webgl2": True,
                  "drawn_gaussians": rendered["count"],
                  "screenshot_sha256": hashlib.sha256(screenshot).hexdigest(),
                  "renderer": "headless Chrome SwiftShader, CPU; CUDA training 0",
              }
              evidence_path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n")
              print("ACTUAL WRE-DERIVED WEBGL PASS: 6917 real-photo, untrained splats; GPU training 0")
          finally:
              webdriver("DELETE", f"/session/{session}")
          PY
      - name: Package a single portable offline 16-photo WebGL viewer ZIP
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python - <<'PY'
          import hashlib
          import json
          import os
          import zipfile
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "wre-real-photo-viewer-result"
          evidence = json.loads((root / "evidence.json").read_text())
          assert evidence["gaussians"] == 6917
          assert evidence["training_steps"] == 0
          assert evidence["gpu_training_verified"] is False
          assert evidence["webgl_chrome"]["actual_webgl2"] is True
          assert evidence["webgl_chrome"]["drawn_gaussians"] == 6917

          viewer = "offline-viewer/observed-GAUSSIANS-UNTRAINED.splat"
          source = root / viewer
          with zipfile.ZipFile(root / "16-real-photo-untrained-gaussians.zip") as inner:
              manifest = json.loads(inner.read("manifest.json"))
              canonical = inner.read("scene.splat")
          assert source.read_bytes() == canonical
          assert hashlib.sha256(canonical).hexdigest() == manifest["outputs"]["scene.splat"]["sha256"]
          screenshot = root / "WRE-derived-real-photo-WebGL.png"
          assert hashlib.sha256(screenshot.read_bytes()).hexdigest() == (
              evidence["webgl_chrome"]["screenshot_sha256"]
          )

          # One HTML that opens directly under file:// with NO web server and
          # NO runtime network, reusing the very same audited WRE-derived scene.
          import base64
          vendor_html = (root / "offline-viewer" / "index.html").read_text(encoding="utf-8")
          vendor_js = (root / "offline-viewer" / "main.js").read_text(encoding="utf-8")
          script_tag = '<script src="main.js"></script>'
          assert vendor_html.count(script_tag) == 1
          assert "fetch(" in vendor_js and vendor_js.count("fetch(") == 1
          assert "</script" not in vendor_js.lower()
          begin = vendor_js.index("    const req = await fetch(url, {")
          end = vendor_js.index("    console.log(req);", begin)
          assert begin < end
          # Keep the upstream WebGL shaders, worker, camera controls and data
          # streamer; replace ONLY the network load with an in-memory Response.
          offline_js = (
              vendor_js[:begin]
              + "    const req = new Response(window.__wreEmbeddedSplat, "
                "{status: 200, headers: {'content-length': '"
              + str(len(canonical))
              + "'}});\n"
              + vendor_js[end:]
          )
          assert "fetch(" not in offline_js
          # Keep the upstream file-drop handler intact: this one-file viewer
          # also opens operator-owned .splat scenes without a server or upload.
          assert 'document.addEventListener("drop", (e) => {' in offline_js
          assert "selectFile(e.dataTransfer.files[0])" in offline_js
          data_b64 = base64.b64encode(canonical).decode("ascii")
          bootstrap = (
              "<script>window.__wreEmbeddedSplat=Uint8Array.from("
              "atob('" + data_b64 + "'),c=>c.charCodeAt(0));</script>"
          )
          inline = (
              bootstrap
              + "<script>\n"
              + offline_js
              + "\n</script>"
          )
          # Usable touch/keyboard alternative to upstream drag/drop. The
          # existing pinned selectFile -> FileReader -> WebGL path is reused;
          # nothing reads or uploads the selected file except local Chrome.
          controls = (
              '<section id="wre-local-controls" role="region" aria-label="Local 3D scene" '
              'style="position:fixed;bottom:12px;left:12px;z-index:1000;'
              'background:#171d28;color:#fff;padding:10px;border-radius:8px;'
              'font:14px sans-serif;max-width:min(95vw,560px)">'
              '<label for="wre-local-splat">Open a local .splat file: </label>'
              '<input id="wre-local-splat" type="file" accept=".splat" '
              'aria-label="Choose local Gaussian splat file">'
              '<button id="wre-restore-original" type="button">'
              'Restore 16-photo scene</button>'
              '<button id="wre-save-current" type="button">'
              'Save displayed .splat</button>'
              '<button id="wre-compare-scene" type="button" disabled>'
              'Compare original / local</button>'
              '<button id="wre-save-view" type="button">Save camera viewpoint</button>'
              '<label for="wre-load-view">Load camera viewpoint JSON: </label>'
              '<input id="wre-load-view" type="file" accept=".json" '
              'aria-label="Load saved camera viewpoint">'
              '<output id="wre-local-status" aria-live="polite"></output>'
              '</section>'
          )
          ui_logic = """<script>
          (() => {
            const picker = document.getElementById('wre-local-splat');
            const reset = document.getElementById('wre-restore-original');
            const save = document.getElementById('wre-save-current');
            const compare = document.getElementById('wre-compare-scene');
            const saveView = document.getElementById('wre-save-view');
            const loadView = document.getElementById('wre-load-view');
            const status = document.getElementById('wre-local-status');
            const originalFile = new File([window.__wreEmbeddedSplat],
              'WRE-16-photos.splat', {type: 'application/octet-stream'});
            let activeFile = originalFile;
            let localFile = null;
            let internalDrop = false;
            const valid = file => file && file.size > 0 &&
              file.size % 32 === 0 && file.size <= 256 * 1024 * 1024;
            function show(file) {
              if (!valid(file)) {
                status.textContent = 'Invalid .splat: expected 32-byte records, maximum 256 MiB.';
                return;
              }
              const transfer = new DataTransfer();
              transfer.items.add(file);
              internalDrop = true;
              try {
                document.dispatchEvent(new DragEvent('drop', {
                  bubbles: true, cancelable: true, dataTransfer: transfer
                }));
              } finally {
                internalDrop = false;
              }
              activeFile = file;
              if (file !== originalFile) {
                localFile = file;
                compare.disabled = false;
              }
              status.textContent = 'Loading ' + file.name + ': ' +
                (file.size / 32) + ' Gaussian records';
            }
            // The pinned upstream handler also accepts raw drag/drop directly.
            document.addEventListener('drop', event => {
              const file = event.dataTransfer?.files?.[0];
              if (valid(file) && !internalDrop) {
                activeFile = file;
                if (file !== originalFile) {
                  localFile = file;
                  compare.disabled = false;
                }
              }
            }, true);
            save.addEventListener('click', () => {
              const url = URL.createObjectURL(activeFile);
              const link = document.createElement('a');
              link.href = url;
              link.download = activeFile.name.endsWith('.splat') ?
                activeFile.name : 'wre-current-scene.splat';
              link.click();
              setTimeout(() => URL.revokeObjectURL(url), 30000);
              status.textContent = 'Saving ' + link.download + ': ' +
                (activeFile.size / 32) + ' Gaussian records';
            });
            picker.addEventListener('change', () => {
              if (picker.files && picker.files.length === 1) show(picker.files[0]);
            });
            reset.addEventListener('click', () => {
              picker.value = '';
              show(originalFile);
            });
            compare.addEventListener('click', () => {
              if (!localFile) return;
              show(activeFile === originalFile ? localFile : originalFile);
            });
            // A camera pose is a view in a coordinate frame, not model registration.
            saveView.addEventListener('click', () => {
              const pose = {format: 'wre-view-matrix-v1', matrix: Array.from(viewMatrix)};
              const url = URL.createObjectURL(new Blob([JSON.stringify(pose)],
                {type: 'application/json'}));
              const link = document.createElement('a');
              link.href = url;
              link.download = 'wre-camera-viewpoint.json';
              link.click();
              setTimeout(() => URL.revokeObjectURL(url), 30000);
              status.textContent = 'Saved camera view; no alignment inferred.';
            });
            loadView.addEventListener('change', async () => {
              const file = loadView.files?.[0];
              if (!file || file.size > 4096) {
                status.textContent = 'Invalid viewpoint: max 4 KiB JSON.';
                return;
              }
              try {
                const pose = JSON.parse(await file.text());
                const m = pose?.matrix;
                if (pose.format !== 'wre-view-matrix-v1' || !Array.isArray(m) ||
                    m.length !== 16 || !m.every(Number.isFinite) ||
                    Math.abs(m[3]) > 1e-5 || Math.abs(m[7]) > 1e-5 ||
                    Math.abs(m[11]) > 1e-5 || Math.abs(m[15] - 1) > 1e-5) {
                  throw Error('Invalid affine camera matrix');
                }
                const det = m[0]*(m[5]*m[10]-m[6]*m[9]) -
                  m[1]*(m[4]*m[10]-m[6]*m[8]) +
                  m[2]*(m[4]*m[9]-m[5]*m[8]);
                if (!Number.isFinite(det) || Math.abs(det) < 1e-6) {
                  throw Error('Non-invertible camera matrix');
                }
                // The upstream carousel must not overwrite a restored view.
                window.dispatchEvent(new KeyboardEvent('keydown',
                  {key:'F13',code:'F13'}));
                window.dispatchEvent(new KeyboardEvent('keyup',
                  {key:'F13',code:'F13'}));
                viewMatrix = m.slice();
                status.textContent = 'Loaded camera view; scene frames may differ.';
              } catch (error) {
                status.textContent = 'Invalid camera JSON; current view unchanged.';
              }
            });
          })();
          </script>"""
          assert vendor_html.count("</body>") == 1
          standalone = (
              vendor_html.replace(script_tag, inline)
              .replace("</body>", controls + ui_logic + "</body>")
              .encode("utf-8")
          )
          assert standalone.count(b"window.__wreEmbeddedSplat") >= 2
          assert b"UNTRAINED (0 steps)" in standalone
          assert b"http://127.0.0.1:8767" not in standalone
          (root / "VIEW-IN-BROWSER.html").write_bytes(standalone)

          instructions = (
              "WRE — 16 genuine DJI photos -> native CPU COLMAP -> 6917 untrained Gaussians.\n"
              "UNTRAINED, zero CUDA steps, unknown metric scale; NOT a GPU-trained radiance scene.\n"
              "Photos: Pierre Moulon, CC BY-NC 4.0; NONCOMMERCIAL use only.\n"
              "Unzip and double-click VIEW-IN-BROWSER.html (no server required).\n"
              "Optional classic viewer: run in the extracted directory:\n"
              "  python3 -m http.server 8767 --bind 127.0.0.1\n"
              "Open http://127.0.0.1:8767/offline-viewer/index.html in a WebGL2 browser.\n"
              "Mouse orbit/zoom and keyboard 0-9 / +/- for recovered cameras.\n"
              "Choose a local .splat using the file picker, or drag one onto the page.\n"
              "Use Restore 16-photo scene to return to the included example.\n"
              "Use Compare original / local to toggle without reselecting the local file.\n"
              "Save camera viewpoint as JSON, then load to revisit the same view.\n"
              "Camera viewpoint does not align unrelated scenes or infer metric scale.\n"
              "Different scenes may not share geometry, metric scale or camera registration.\n"
              "Use Save displayed .splat to download the currently shown scene locally.\n"
              "The example scene comes from CC BY-NC 4.0 NONCOMMERCIAL photos.\n"
              "A .splat must have 32-byte Gaussian records (max 256 MiB, not ZIP/OBJ).\n"
              "The original 16 photo camera presets do not calibrate your custom scene.\n"
              "Only your local browser reads dropped files; nothing is uploaded.\n"
              "No internet, paid API, Torch, CUDA, installation or server upload is required.\n"
              "The inner ZIP contains canonical WRE scene.splat, centers.glb, manifest.json.\n"
              "The screenshot and evidence.json record actual headless Chrome CPU/WebGL proof.\n"
          ).encode("utf-8")
          contents = {
              "START_HERE.txt": instructions,
              "VIEW-IN-BROWSER.html": standalone,
              "16-real-photo-untrained-gaussians.zip": (
                  root / "16-real-photo-untrained-gaussians.zip"
              ).read_bytes(),
              "LICENSE-NOTICE.txt": (root / "LICENSE-NOTICE.txt").read_bytes(),
              "WRE-derived-real-photo-WebGL.png": screenshot.read_bytes(),
              "evidence.json": (root / "evidence.json").read_bytes(),
          }
          for name in (
              "index.html",
              "main.js",
              "Gaussian-WebGL-viewer-MIT-LICENSE.txt",
              "observed-GAUSSIANS-UNTRAINED.splat",
              "HOW_TO_VIEW.txt",
          ):
              path = f"offline-viewer/{name}"
              contents[path] = (root / path).read_bytes()
          assert len(contents) == 11

          portable = root / "WRE-16-real-photos-OPEN-ME.zip"
          with zipfile.ZipFile(portable, "x", compression=zipfile.ZIP_STORED) as archive:
              for name in sorted(contents):
                  info = zipfile.ZipInfo(name, date_time=(1980, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_STORED
                  info.external_attr = 0o100644 << 16
                  archive.writestr(info, contents[name])
          with zipfile.ZipFile(portable) as archive:
              assert set(archive.namelist()) == set(contents)
              for name, original in contents.items():
                  assert archive.read(name) == original
          portable_hash = hashlib.sha256(portable.read_bytes()).hexdigest()
          receipt = {
              "filename": portable.name,
              "sha256": portable_hash,
              "gaussians": 6917,
              "input_photos": 16,
              "training_steps": 0,
              "cuda_training": False,
              "browser_entrypoint": "offline-viewer/index.html",
              "direct_file_browser_entrypoint": "VIEW-IN-BROWSER.html",
              "license": "CC BY-NC 4.0 (noncommercial source photographs)",
              "files": sorted(contents),
          }
          (root / "portable-viewer-receipt.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"PORTABLE REAL-PHOTO VIEWER ZIP PASS: {portable.name} sha256={portable_hash}")
          PY
      - name: Validate single-file viewer directly from disk in actual Chrome WebGL
        shell: bash
        run: |
          set -euo pipefail
          driver="$CHROMEWEBDRIVER/chromedriver"
          test -x "$driver"
          "$driver" --port=9521 --allowed-ips=127.0.0.1 >/tmp/wre-standalone-chrome.log 2>&1 &
          driver_pid="$!"
          trap 'kill "$driver_pid" 2>/dev/null || true' EXIT
          uv run --no-sync python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import struct
          import time
          from pathlib import Path
          from urllib.request import Request, urlopen

          root = Path(os.environ["RUNNER_TEMP"]) / "wre-real-photo-viewer-result"
          page = root / "VIEW-IN-BROWSER.html"
          assert page.is_file() and page.stat().st_size > 200_000
          saved_scenes = root / "local-splat-exports"
          saved_scenes.mkdir()
          driver_base = "http://127.0.0.1:9521"
          def webdriver(method, route, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = Request(driver_base + route, data=data, method=method,
                                headers={"Content-Type": "application/json"})
              with urlopen(request, timeout=60) as response:
                  result = json.load(response)["value"]
              if isinstance(result, dict) and result.get("error"):
                  raise RuntimeError(str(result))
              return result

          for _ in range(75):
              try:
                  if webdriver("GET", "/status")["ready"]:
                      break
              except (OSError, KeyError):
                  time.sleep(0.4)
          else:
              raise RuntimeError("ChromeDriver not ready for standalone viewer")
          options = {"browserName": "chrome", "goog:chromeOptions": {"args": [
              "--headless=new", "--no-sandbox", "--disable-dev-shm-usage",
              "--enable-unsafe-swiftshader", "--use-gl=angle",
              "--use-angle=swiftshader", "--window-size=1280,900",
              "--disable-background-networking",
              "--host-resolver-rules=MAP * 0.0.0.0, EXCLUDE localhost",
          ], "prefs": {
              "download.default_directory": str(saved_scenes),
              "download.prompt_for_download": False,
              "download.directory_upgrade": True,
          }}}
          session = webdriver("POST", "/session", {"capabilities": {"alwaysMatch": options}})["sessionId"]
          def check_browser_download(filename, expected):
              target = saved_scenes / filename
              for _ in range(100):
                  if target.is_file() and target.stat().st_size == len(expected):
                      break
                  time.sleep(0.15)
              else:
                  raise RuntimeError("Browser did not download " + filename)
              actual = target.read_bytes()
              assert actual == expected, filename
              return hashlib.sha256(actual).hexdigest()
          try:
              webdriver("POST", f"/session/{session}/url", {"url": page.resolve().as_uri()})
              for _ in range(125):
                  state = webdriver("POST", f"/session/{session}/execute/sync", {
                      "script": """const canvas=document.getElementById('canvas');
                        return {count:window.__wreRenderedGaussianCount || 0,
                        embedded:window.__wreEmbeddedSplat?.byteLength || 0,
                        error:document.getElementById('message')?.textContent || '',
                        webgl:!!canvas?.getContext('webgl2'),
                        external:performance.getEntriesByType('resource')
                          .filter(x=>/^https?:/.test(x.name)).map(x=>x.name),
                        width:canvas?.width || 0};""",
                      "args": [],
                  })
                  if state["error"]:
                      raise RuntimeError("Standalone WebGL: " + state["error"])
                  if state["count"] == 6917 and state["webgl"] and state["width"] >= 640:
                      break
                  time.sleep(0.35)
              else:
                  raise RuntimeError("Standalone WRE splats not drawn: " + str(state))
              assert state["embedded"] == 6917 * 32, state
              assert state["external"] == [], state
              png = base64.b64decode(webdriver("GET", f"/session/{session}/screenshot"))
              assert png[:8] == b"\x89PNG\r\n\x1a\n"
              width, height = struct.unpack_from(">II", png, 16)
              assert width >= 1100 and height >= 700 and len(png) > 10_000
              (root / "WRE-one-file-real-photo-WebGL.png").write_bytes(png)
              receipt_path = root / "portable-viewer-receipt.json"
              receipt = json.loads(receipt_path.read_text())
              receipt["direct_file_browser_test"] = {
                  "actual_webgl2": True, "drawn_gaussians": state["count"],
                  "screenshot_sha256": hashlib.sha256(png).hexdigest(),
                  "page_scheme": "file", "external_resource_requests": 0,
                  "gpu_training": False,
              }
              receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
              print("DIRECT FILE WEBGL PASS: 6917 WRE 16-photo untrained Gaussians")

              # Actually exercise upstream drag/drop + FileReader + WebGL worker.
              # A subset of the REAL exported scene is a second valid .splat;
              # this is not a claim of another reconstruction or GPU training.
              replacement_count = 1024
              subset = (
                  root / "offline-viewer" / "observed-GAUSSIANS-UNTRAINED.splat"
              ).read_bytes()[:replacement_count * 32]
              assert len(subset) == replacement_count * 32
              webdriver("POST", f"/session/{session}/execute/sync", {
                  "script": """const source=window.__wreEmbeddedSplat;
                    if (!source || source.byteLength !== 6917*32)
                      throw Error('Expected WRE source data is unavailable');
                    const transfer=new DataTransfer();
                    transfer.items.add(new File(
                      [source.slice(0,1024*32)], 'operator-local.splat',
                      {type:'application/octet-stream'}));
                    document.dispatchEvent(new DragEvent('drop',{
                      bubbles:true,cancelable:true,dataTransfer:transfer}));
                    return transfer.files.length;""",
                  "args": [],
              })
              for _ in range(125):
                  switched = webdriver("POST", f"/session/{session}/execute/sync", {
                      "script": """const canvas=document.getElementById('canvas');
                        return {count:window.__wreRenderedGaussianCount || 0,
                          error:document.getElementById('message')?.textContent || '',
                          webgl:!!canvas?.getContext('webgl2'),
                          external:performance.getEntriesByType('resource')
                            .filter(x=>/^https?:/.test(x.name)).map(x=>x.name)};""",
                      "args": [],
                  })
                  if switched["error"]:
                      raise RuntimeError("Operator .splat drop: " + switched["error"])
                  if switched["count"] == replacement_count and switched["webgl"]:
                      break
                  time.sleep(0.35)
              else:
                  raise RuntimeError("Dropped operator .splat was not displayed: " + str(switched))
              assert switched["external"] == [], switched
              replacement_png = base64.b64decode(
                  webdriver("GET", f"/session/{session}/screenshot")
              )
              assert replacement_png[:8] == b"\x89PNG\r\n\x1a\n"
              assert len(replacement_png) > 10_000
              (root / "WRE-local-splat-drop-WebGL.png").write_bytes(replacement_png)
              receipt["operator_local_splat_test"] = {
                  "input": "1024 real WRE-exported records via browser FileReader",
                  "bytes": len(subset),
                  "sha256": hashlib.sha256(subset).hexdigest(),
                  "drawn_gaussians": switched["count"],
                  "page_scheme": "file",
                  "external_resource_requests": len(switched["external"]),
                  "screenshot_sha256": hashlib.sha256(replacement_png).hexdigest(),
                  "cuda_training": False,
              }
              receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
              print("DIRECT FILE OPERATOR SPLAT PASS: 1024 real WRE Gaussian records")
              save_button = webdriver("POST", f"/session/{session}/element", {
                  "using": "css selector", "value": "#wre-save-current"
              })["element-6066-11e4-a52e-4f735466cecf"]
              webdriver("POST", f"/session/{session}/element/{save_button}/click", {})
              assert check_browser_download("operator-local.splat", subset) == hashlib.sha256(subset).hexdigest()
              print("REAL BROWSER DOWNLOAD PASS: 1024 dropped Gaussian records")

              # Exercise the ACTUAL HTML <input type=file> control through
              # ChromeDriver's file upload protocol, not by faking JS changes.
              # The control dispatches the existing MIT viewer drop handler.
              picker_count = 2048
              picked_bytes = (
                  root / "offline-viewer" / "observed-GAUSSIANS-UNTRAINED.splat"
              ).read_bytes()[:picker_count * 32]
              picked_path = root / "operator-picked.splat"
              picked_path.write_bytes(picked_bytes)
              picker_element = webdriver("POST", f"/session/{session}/element", {
                  "using": "css selector", "value": "#wre-local-splat"
              })["element-6066-11e4-a52e-4f735466cecf"]
              webdriver("POST", f"/session/{session}/element/{picker_element}/value", {
                  "text": str(picked_path)
              })
              for _ in range(125):
                  selected = webdriver("POST", f"/session/{session}/execute/sync", {
                      "script": """return {
                        count: window.__wreRenderedGaussianCount || 0,
                        status: document.getElementById('wre-local-status').textContent,
                        external: performance.getEntriesByType('resource')
                          .filter(x=>/^https?:/.test(x.name)).map(x=>x.name)};""",
                      "args": [],
                  })
                  if selected["count"] == picker_count and "2048 Gaussian" in selected["status"]:
                      break
                  time.sleep(0.35)
              else:
                  raise RuntimeError("Actual browser file picker did not load: " + str(selected))
              assert selected["external"] == [], selected
              webdriver("POST", f"/session/{session}/element/{save_button}/click", {})
              picked_sha = check_browser_download("operator-picked.splat", picked_bytes)
              assert picked_sha == hashlib.sha256(picked_bytes).hexdigest()
              print("REAL BROWSER DOWNLOAD PASS: 2048 picked Gaussian records")
              receipt["operator_file_picker_test"] = {
                  "input": "real local file selected via ChromeDriver file upload",
                  "bytes": len(picked_bytes),
                  "sha256": hashlib.sha256(picked_bytes).hexdigest(),
                  "drawn_gaussians": selected["count"],
                  "page_scheme": "file", "external_resource_requests": 0,
                  "cuda_training": False,
              }
              # Real browser A/B flip: preserve the selected local scene while
              # switching twice through the upstream WebGL FileReader worker.
              compare_element = webdriver("POST", f"/session/{session}/element", {
                  "using": "css selector", "value": "#wre-compare-scene"
              })["element-6066-11e4-a52e-4f735466cecf"]
              for target_count, label in ((6917, "WRE-16-photos.splat"),
                                          (2048, "operator-picked.splat")):
                  webdriver("POST", f"/session/{session}/element/{compare_element}/click", {})
                  for _ in range(125):
                      current = webdriver("POST", f"/session/{session}/execute/sync", {
                          "script": """return {
                            count: window.__wreRenderedGaussianCount || 0,
                            status: document.getElementById('wre-local-status').textContent,
                            external: performance.getEntriesByType('resource')
                              .filter(x=>/^https?:/.test(x.name)).map(x=>x.name)};""",
                          "args": [],
                      })
                      if current["count"] == target_count and label in current["status"]:
                          break
                      time.sleep(0.35)
                  else:
                      raise RuntimeError("Offline WRE 3D A/B comparison failed: " + str(current))
                  assert current["external"] == [], current
              receipt["operator_ab_compare_test"] = {
                  "original_drawn_gaussians": 6917,
                  "restored_operator_drawn_gaussians": picker_count,
                  "operator_sha256": picked_sha,
                  "external_resource_requests": 0,
                  "cuda_training": False,
              }
              print("REAL WEBGL A/B COMPARE PASS: original 6917 -> local 2048")
              reset_element = webdriver("POST", f"/session/{session}/element", {
                  "using": "css selector", "value": "#wre-restore-original"
              })["element-6066-11e4-a52e-4f735466cecf"]
              webdriver("POST", f"/session/{session}/element/{reset_element}/click", {})
              for _ in range(125):
                  restored = webdriver("POST", f"/session/{session}/execute/sync", {
                      "script": """return {
                        count: window.__wreRenderedGaussianCount || 0,
                        status: document.getElementById('wre-local-status').textContent,
                        external: performance.getEntriesByType('resource')
                          .filter(x=>/^https?:/.test(x.name)).map(x=>x.name)};""",
                      "args": [],
                  })
                  if restored["count"] == 6917 and "6917 Gaussian" in restored["status"]:
                      break
                  time.sleep(0.35)
              else:
                  raise RuntimeError("Browser restore original WRE scene failed: " + str(restored))
              assert restored["external"] == [], restored
              webdriver("POST", f"/session/{session}/element/{save_button}/click", {})
              original_scene = (
                  root / "offline-viewer" / "observed-GAUSSIANS-UNTRAINED.splat"
              ).read_bytes()
              original_sha = check_browser_download("WRE-16-photos.splat", original_scene)
              assert original_sha == hashlib.sha256(original_scene).hexdigest()
              print("REAL BROWSER DOWNLOAD PASS: 6917 restored Gaussian records")
              receipt["restore_original_test"] = {
                  "drawn_gaussians": restored["count"],
                  "page_scheme": "file", "external_resource_requests": 0,
                  "cuda_training": False,
              }
              receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
              print("DIRECT FILE PICKER PASS: 2048 WRE records, then RESTORE PASS: 6917")
          finally:
              webdriver("DELETE", f"/session/{session}")
          PY
      - name: Upload WRE real-photo 3D viewer archive and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
