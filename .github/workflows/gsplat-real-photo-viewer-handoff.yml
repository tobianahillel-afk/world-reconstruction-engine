                  const link = document.createElement('a');
                  link.href = url;
                  link.download = 'wre-3d-camera-move.webm';
                  link.click();
                  setTimeout(() => URL.revokeObjectURL(url), 30000);
                  status.textContent = 'Saved WebM of static 3D camera motion.';
                };
                recorder.start(200);
                status.textContent = 'Recording a 3-second local 3D camera move...';
                const started = performance.now();
                const animate = now => {
                  if (!videoRecording) return;
                  const progress = Math.min(1, (now - started) / 3000);
                  const offset = Math.sin(Math.PI * progress);
                  viewMatrix[12] = original[12] + 0.5 * offset;
                  viewMatrix[13] = original[13] + 0.15 * offset;
                  if (progress < 1) requestAnimationFrame(animate);
                  else recorder.stop();
                };
                requestAnimationFrame(animate);
              } catch (error) {
                viewMatrix = original.slice();
                stream?.getTracks().forEach(track => track.stop());
                videoRecording = false;
                recordVideo.disabled = false;
                status.textContent = 'Local browser WebM recording failed.';
              }
            });
