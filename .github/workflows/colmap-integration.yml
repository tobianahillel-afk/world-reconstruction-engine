name: colmap-integration

on:
  pull_request:
    paths:
      - ".github/workflows/colmap-integration.yml"
      - "PROJECT_STATE.yaml"
      - "registry/components.yaml"
      - "registry/dependencies.yaml"
      - "registry/reviews.yaml"
      - "registry/work-items.yaml"
      - "src/wre/domain/estimated_geometry.py"
      - "src/wre/reconstruction/**"
      - "src/wre/retrieval/**"
      - "tests/test_colmap_environment.py"
      - "tests/test_colmap_features.py"
      - "tests/test_colmap_matching.py"
      - "tests/test_colmap_geometric_verification.py"
      - "tests/test_colmap_incremental_reconstruction.py"
      - "tests/test_colmap_reconstruction_import.py"
      - "tests/test_colmap_end_to_end_fixture.py"
      - "tests/test_sequential_pairing.py"
      - "tests/test_gps_pairing.py"
      - "tests/fixtures/synthetic/colmap-l3-end-to-end/**"
      - "docs/14_COLMAP_ENVIRONMENT.md"
      - "docs/15_COLMAP_FEATURE_EXTRACTION.md"
      - "docs/16_COLMAP_PAIR_MATCHING.md"
      - "docs/17_COLMAP_GEOMETRIC_VERIFICATION.md"
      - "docs/18_COLMAP_INCREMENTAL_RECONSTRUCTION.md"
      - "docs/19_COLMAP_RECONSTRUCTION_IMPORT.md"
      - "docs/20_COLMAP_END_TO_END_FIXTURE.md"
      - "docs/21_SEQUENTIAL_PAIRING.md"
      - "docs/22_GPS_PAIRING.md"
      - "docs/reviews/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/colmap-integration.yml"
      - "PROJECT_STATE.yaml"
      - "registry/components.yaml"
      - "registry/dependencies.yaml"
      - "registry/reviews.yaml"
      - "registry/work-items.yaml"
      - "src/wre/domain/estimated_geometry.py"
      - "src/wre/reconstruction/**"
      - "src/wre/retrieval/**"
      - "tests/test_colmap_environment.py"
      - "tests/test_colmap_features.py"
      - "tests/test_colmap_matching.py"
      - "tests/test_colmap_geometric_verification.py"
      - "tests/test_colmap_incremental_reconstruction.py"
      - "tests/test_colmap_reconstruction_import.py"
      - "tests/test_colmap_end_to_end_fixture.py"
      - "tests/test_sequential_pairing.py"
      - "tests/test_gps_pairing.py"
      - "tests/fixtures/synthetic/colmap-l3-end-to-end/**"
      - "docs/14_COLMAP_ENVIRONMENT.md"
      - "docs/15_COLMAP_FEATURE_EXTRACTION.md"
      - "docs/16_COLMAP_PAIR_MATCHING.md"
      - "docs/17_COLMAP_GEOMETRIC_VERIFICATION.md"
      - "docs/18_COLMAP_INCREMENTAL_RECONSTRUCTION.md"
      - "docs/19_COLMAP_RECONSTRUCTION_IMPORT.md"
      - "docs/20_COLMAP_END_TO_END_FIXTURE.md"
      - "docs/21_SEQUENTIAL_PAIRING.md"
      - "docs/22_GPS_PAIRING.md"
      - "docs/reviews/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pycolmap-420:
    name: pycolmap-4.2.0
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install locked WRE environment
        run: uv sync --frozen --group dev

      - name: Install exact external PyCOLMAP environment
        run: |
          uv pip install --python .venv/bin/python "numpy==2.5.3" "pycolmap==4.2.0"
          .venv/bin/python -c 'import numpy, pycolmap; assert numpy.__version__ == "2.5.3"; assert pycolmap.__version__ == "4.2.0"'

      - name: Exercise exact COLMAP environment through L3 and L4 retrieval references
        env:
          WRE_COLMAP_INTEGRATION: "1"
        run: >-
          .venv/bin/python -m pytest
          tests/test_colmap_environment.py
          tests/test_colmap_features.py
          tests/test_colmap_matching.py
          tests/test_colmap_geometric_verification.py
          tests/test_colmap_incremental_reconstruction.py
          tests/test_colmap_reconstruction_import.py
          tests/test_colmap_end_to_end_fixture.py
          tests/test_sequential_pairing.py
          tests/test_gps_pairing.py
