name: v2l4-1-handoff

on:
  push:
    branches: ["feature/v2l4-1-failure-taxonomy"]

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/v2l4-1-failure-taxonomy
          fetch-depth: 0
      - name: Apply lifecycle handoff
        shell: python
        env:
          CONTRACT_B64: 
          COMPONENT_B64: ICBxdWFsaXR5X2ZhaWx1cmVfYmVuY2htYXJrczoKICAgIG93bmVyX2xvdDogVjJMNAogICAgaW1wbGVtZW50YXRpb246CiAgICAgIC0gc3JjL3dyZS9kb21haW4vZmFpbHVyZXMucHkKICAgICAgLSBzcmMvd3JlL2RvbWFpbi9fX2luaXRfXy5weQogICAgdGVzdHM6CiAgICAgIC0gdGVzdHMvdGVzdF9mYWlsdXJlX3RheG9ub215LnB5CiAgICBzdGF0dXM6IGltcGxlbWVudGluZw==
          STATE_B64: 
        run: |
          import base64
          import os
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one {label}, found {count}")
              return text.replace(old, new, 1)

          state = Path("PROJECT_STATE.yaml")
          state_text = state.read_text(encoding="utf-8")
          if "active_work_item: V2L4.2" in state_text:
              print("handoff already applied")
              raise SystemExit(0)

          roadmap = Path("registry/work-items/v2m0.yaml")
          roadmap_text = roadmap.read_text(encoding="utf-8")
          roadmap_text = replace_once(
              roadmap_text,
              "  - id: V2L4.1\n    lot: V2L4\n    title: Stable failure taxonomy\n    status: ready\n",
              "  - id: V2L4.1\n    lot: V2L4\n    title: Stable failure taxonomy\n    status: done\n",
              "V2L4.1 ready block",
          )
          old_stub = "  - {id: V2L4.2, lot: V2L4, title: Multidimensional metric vector, status: planned, depends_on: [V2L4.1]}"
          new_contract = base64.b64decode(os.environ["CONTRACT_B64"]).decode("utf-8").rstrip("\n")
          roadmap_text = replace_once(roadmap_text, old_stub, new_contract, "V2L4.2 planned stub")
          roadmap.write_text(roadmap_text, encoding="utf-8")

          components = Path("registry/components.yaml")
          components_text = components.read_text(encoding="utf-8")
          old_component = "  quality_failure_benchmarks: {owner_lot: V2L4, implementation: [], tests: [], status: planned}"
          new_component = base64.b64decode(os.environ["COMPONENT_B64"]).decode("utf-8")
          components_text = replace_once(components_text, old_component, new_component, "V2L4 component stub")
          components.write_text(components_text, encoding="utf-8")

          state_text = replace_once(state_text, "active_work_item: V2L4.1", "active_work_item: V2L4.2", "active work item")
          state_text = replace_once(state_text, "V2L3.6]", "V2L3.6, V2L4.1]", "last completed tail")
          state_text = replace_once(state_text, "last_merged_pr: 50", "last_merged_pr: 59", "last merged PR")
          start = state_text.index("current_goal: >-")
          end = state_text.index("blockers: []", start)
          replacement = base64.b64decode(os.environ["STATE_B64"]).decode("utf-8")
          state_text = state_text[:start] + replacement + state_text[end:]
          state.write_text(state_text, encoding="utf-8")
      - name: Commit handoff metadata
        run: |
          if git diff --quiet; then
            echo "No handoff changes to commit"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add registry/work-items/v2m0.yaml registry/components.yaml PROJECT_STATE.yaml
          git diff --cached --check
          git commit -m "[V2L4.1] Record handoff to V2L4.2"
          git push origin HEAD:feature/v2l4-1-failure-taxonomy
