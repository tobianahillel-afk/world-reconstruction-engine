          cp "$RUNNER_TEMP/wre-colmap-preview-source/sparse/0/"*.bin "$colmap/sparse/0/"
          cp "$RUNNER_TEMP/wre-upstream-exporter-smoke/ply/point_cloud_0.ply" "$exporter/ply/"
          cp "$RUNNER_TEMP/wre-upstream-exporter-smoke/point_cloud_0.splat" "$exporter/"
          cp "$RUNNER_TEMP/wre-config-bridge.json" "$exporter/"
          cp "$RUNNER_TEMP/gsplat-common-runtime-native-files.json" "$exporter/"
          # All nine source/output proof files and four bridge/runtime files
          # must exist before an artifact upload can report success.
          test "$(find "$colmap" -type f | wc -l)" -eq 9
          test "$(find "$exporter" -type f | wc -l)" -eq 4
          "$COMMON_PYTHON" - "$colmap" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          manifest = json.loads((root / "wre-cpu-colmap-init-manifest.json").read_text())
          assert len(manifest["input_sha256"]) == 6
          for relative, expected in manifest["input_sha256"].items():
              observed = hashlib.sha256((root / relative).read_bytes()).hexdigest()
              assert observed == expected, relative
          for kind, filename in (("ply", root / "ply/point_cloud_0.ply"), ("splat", root / "point_cloud_0.splat")):
              assert hashlib.sha256(filename.read_bytes()).hexdigest() == manifest[f"{kind}_sha256"]
              assert filename.stat().st_size == manifest[f"{kind}_bytes"]
          assert manifest["gpu_training_executed"] is False
          assert manifest["optimizer_steps_executed"] == 0
          print("Retained nine verified COLMAP/gsplat files and four native bridge files; NO GPU training.")
          PY

      - name: Retain COLMAP-derived Gaussian preview and WRE hash evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wre-colmap-to-gsplat-cpu-preview
          path: wre-ci-evidence/colmap/
          if-no-files-found: error
          retention-days: 7

      - name: Retain true exporter to WRE materialization artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wre-real-gsplat-exporter-to-materializer-cpu
          path: wre-ci-evidence/exporter/
          if-no-files-found: error
          retention-days: 7

      # Execute after native tests so discovered advisories do not mask CPU
      # compatibility/contract proofs. The scan still FAILS the whole job.
      # 'always' also preserves the audit result if an earlier native step fails.
      # This is an independent vulnerability audit of the 76 locked wheel
      # identities only. It does NOT replace GitHub Dependency Review/SBOM,
      # native/CUDA closure security, checkpoint trust or license approval.
      - name: Audit all 76 locked Python wheel versions against PyPI advisories
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -l < "$RUNNER_TEMP/common-locked-advisories.txt")" -eq 76
          uvx --python 3.10.21 --from "pip-audit==2.10.1" pip-audit \
            --no-deps --disable-pip --vulnerability-service pypi \
            --format json \
            --requirement "$RUNNER_TEMP/common-locked-advisories.txt" \
            --output "$GITHUB_WORKSPACE/wre-76-wheel-advisory-report.json"

      - name: Retain 76-wheel advisory report even if vulnerabilities are found
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wre-76-wheel-python-advisory-report
          path: wre-76-wheel-advisory-report.json
          if-no-files-found: warn
          retention-days: 7

  # EXPERIMENTAL proof only: this job does not change the Python 3.10
  # reviewed runtime, its empty native/LPIPS trust roots, or shipping status.
  # The exact SHA-bound GitHub artifact is a temporary qualification input,
  # not a permanent approved lock. A full reviewed in-repo lock is required
  # before choosing this Python 3.11 runtime for shipping.
  experimental-py311-native-import:
    name: experimental-py311-pillow13-actual-gsplat-fused-ssim-import-no-gpu
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    container:
      image: nvidia/cuda@sha256:da6791294b0b04d7e65d87b7451d6f2390b4d36225ab0701ee7dfec5769829f5
    env:
      CUDA_HOME: /usr/local/cuda
      TORCH_CUDA_ARCH_LIST: "7.5"
      MAX_JOBS: "1"
      PYTHONPATH: ""
      GSPLAT_REVISION: "937e29912570c372bed6747a5c9bf85fed877bae"
      GSPLAT_TREE: "90c3f0b2352e6d2725bcba1ef0407168f922c0fa"
      SSIM_REVISION: "328dc9836f513d00c4b5bc38fe30478b4435cbb5"
      SSIM_TREE: "ac5f1d8fe5d519f9c44b220d235bf1f198463da7"
      GLM_REVISION: "33b4a621a697a305bc3a7610d290677b96beb181"
      GLM_TREE: "e57f342f0fb63852d65e0da2090528fdca9b0117"
      NERFVIEW_REVISION: "4538024fe0d15fd1a0e4d760f3695fc44ca72787"
      NERFVIEW_TREE: "e333400e39605978a3d1f9cf6d73ddf577a8c8e3"
      SCENE_MANAGER_REVISION: "cc7ea4b7301720ac29287dbe450952511b32125e"
    steps:
      - name: Checkout WRE to keep the branch and source identity explicit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Python 3.11.14 without GPU
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.11.14"
          enable-cache: false

      - name: Reconstruct pinned experimental Python 3.11 native identity overlay and install all 76 wheels
        shell: bash
        run: |
          set -euo pipefail
          test -x "$CUDA_HOME/bin/nvcc"
          "$CUDA_HOME/bin/nvcc" --version | grep -F 'release 12.4,'
          uv venv --seed --python 3.11.14 "$RUNNER_TEMP/wre-py311-native"
          echo "CANDIDATE_PYTHON=$RUNNER_TEMP/wre-py311-native/bin/python" >> "$GITHUB_ENV"

          # Use the immutable WRE repository registry, not an expiring Actions artifact.
          # Bootstrap PyYAML is isolated from the sealed 76-wheel native environment.
          uv run --no-project --with "pyyaml==6.0.2" python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          import yaml

          entry = yaml.safe_load(
              Path("registry/dependencies.yaml").read_text(encoding="utf-8")
          )["dependencies"]["gsplat_static_appearance"]
          candidate = entry["runtime_python_311_candidate"]
          if (
              candidate["status"] != "experimental_non_default_not_approved"
              or candidate["evidence_kind"] != "pinned_wheel_identity_overlay_not_released_runtime"
              or candidate["target_python"] != "3.11.14"
              or candidate["target_cuda"] != "12.4"
              or candidate["gpu_execution_evidence"] is not False
              or candidate["runtime_approved"] is not False
              or candidate["license_review"] != "pending"
          ):
              raise SystemExit("candidate not eligible for experimental CPU compilation")
          base = entry[candidate["base_lock_key"]]["packages"]
          changes = candidate["wheel_overrides"]
          if len(base) != 76 or len(changes) != 21:
              raise SystemExit("expected 76 base and 21 changed wheel identities")
          def canonical(value):
              return re.sub(r"[-_.]+", "-", value).lower()
          by_name = {canonical(p["name"]): dict(p) for p in base}
          if len(by_name) != 76:
              raise SystemExit("duplicate original dependencies")
          seen = set()
          for item in changes:
              key = canonical(item["name"])
              if key not in by_name or key in seen:
                  raise SystemExit("invalid duplicate or additional wheel")
              seen.add(key)
              record = by_name[key]
              if all(record[field] == item[field] for field in ("version", "url", "sha256")):
                  raise SystemExit("unnecessary wheel overlay entry")
              record.update({field: item[field] for field in ("version", "url", "sha256")})
              record["filename"] = unquote(urlsplit(item["url"]).path.rsplit("/", 1)[-1])
          allowed_hosts = {
              "files.pythonhosted.org",
              "download.pytorch.org",
              "download-r2.pytorch.org",
              "pypi.nvidia.com",
          }
          wheel_lines = []
          records = []
          for p in sorted(by_name.values(), key=lambda p: p["name"].lower()):
              parsed = urlsplit(p["url"])
              if (
                  not re.fullmatch(r"[A-Za-z0-9_.-]+", p["name"])
                  or not re.fullmatch(r"[a-f0-9]{64}", p["sha256"])
                  or parsed.scheme != "https"
                  or parsed.hostname not in allowed_hosts
                  or parsed.username or parsed.password or parsed.fragment or parsed.query
                  or unquote(parsed.path.rsplit("/", 1)[-1]) != p["filename"]
                  or not p["filename"].endswith(".whl")
              ):
                  raise SystemExit("invalid or untrusted wheel identity")
              wheel_lines.append(f'{p["name"]} @ {p["url"]}#sha256={p["sha256"]}')
              records.append({k: p[k] for k in ("name", "version", "url", "sha256", "filename")})
          out = Path(os.environ["RUNNER_TEMP"])
          (out / "py311-exact-wheels.txt").write_text("\n".join(wheel_lines) + "\n")
          (out / "py311-locked-manifest.json").write_text(
              json.dumps({
                  "evidence_kind": "permanent_registry_identity_overlay_only",
                  "target": {"python": "3.11.14", "torch_cuda": "12.4"},
                  "packages": records,
                  "native_extension_build_evidence": False,
                  "gpu_execution_evidence": False,
                  "approved_runtime": False,
              }, sort_keys=True, indent=2) + "\n"
          )
          print("Exact 76 Python 3.11 artifact URLs/SHA-256 reconstructed from WRE registry")
          PY
          "$RUNNER_TEMP/wre-py311-native/bin/python" -m pip install --no-index --no-deps --no-cache-dir --require-hashes \
            -r "$RUNNER_TEMP/py311-exact-wheels.txt"
          "$RUNNER_TEMP/wre-py311-native/bin/python" -m pip check
          "$RUNNER_TEMP/wre-py311-native/bin/python" - <<'PY'
          import importlib.metadata as metadata
          import json
          import os
          import sys
          from pathlib import Path
          import numpy
          import torch
          from PIL import __version__ as pillow_version

          record = json.loads(Path(os.environ["RUNNER_TEMP"], "py311-locked-manifest.json").read_text())
          assert sys.version.startswith("3.11.14")
          assert all(metadata.version(x["name"]) == x["version"] for x in record["packages"])
          assert len(record["packages"]) == 76
          assert pillow_version == "13.0.0"
          assert numpy.__version__ == "1.26.4"
          assert torch.__version__ == "2.4.0+cu124"
          assert torch.version.cuda == "12.4"
          assert not torch.cuda.is_available()
          print("Exact 76-wheel Python3.11/Torch/Pillow environment imports on CPU")
          PY

      - name: Fetch upstream source commits and verify git tree identities
        shell: bash
        run: |
          set -euo pipefail
          DEBIAN_FRONTEND=noninteractive apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates libgl1 libglib2.0-0
          root="$RUNNER_TEMP/py311-selected-upstreams"
          mkdir -p "$root"
          fetch_exact() {
            name="$1"; remote="$2"; rev="$3"; tree="$4"
            git init -q "$root/$name"
            git -C "$root/$name" remote add origin "$remote"
            git -C "$root/$name" fetch --quiet --depth 1 origin "$rev"
            git -C "$root/$name" checkout -q --detach FETCH_HEAD
            test "$(git -C "$root/$name" rev-parse HEAD)" = "$rev"
            if test "$tree" != "-"; then
              test "$(git -C "$root/$name" rev-parse HEAD^{tree})" = "$tree"
            fi
          }
          fetch_exact gsplat https://github.com/nerfstudio-project/gsplat.git "$GSPLAT_REVISION" "$GSPLAT_TREE"
          fetch_exact ssim https://github.com/rahul-goel/fused-ssim.git "$SSIM_REVISION" "$SSIM_TREE"
          fetch_exact nerfview https://github.com/nerfstudio-project/nerfview.git "$NERFVIEW_REVISION" "$NERFVIEW_TREE"
          fetch_exact scene-manager https://github.com/rmbrualla/pycolmap.git "$SCENE_MANAGER_REVISION" "-"
          test "$(git -C "$root/gsplat" ls-tree HEAD gsplat/cuda/csrc/third_party/glm | awk '{print $3}')" = "$GLM_REVISION"
          git -C "$root/gsplat" submodule update --init --depth 1 -- gsplat/cuda/csrc/third_party/glm
          test "$(git -C "$root/gsplat/gsplat/cuda/csrc/third_party/glm" rev-parse HEAD)" = "$GLM_REVISION"
          test "$(git -C "$root/gsplat/gsplat/cuda/csrc/third_party/glm" rev-parse HEAD^{tree})" = "$GLM_TREE"
          echo "PY311_SOURCES=$root" >> "$GITHUB_ENV"

      - name: Actually build gsplat and fused-ssim CUDA extensions on CPU runner for Python 3.11
        shell: bash
        run: |
          set -euo pipefail
          export BUILD_NO_CUDA=0
          "$CANDIDATE_PYTHON" -m pip install --no-deps --no-build-isolation --no-cache-dir "$PY311_SOURCES/ssim"
          "$CANDIDATE_PYTHON" -m pip install --no-deps --no-build-isolation --no-cache-dir "$PY311_SOURCES/gsplat"
          "$CANDIDATE_PYTHON" -m pip install --no-deps --no-build-isolation --no-cache-dir "$PY311_SOURCES/nerfview"
          "$CANDIDATE_PYTHON" -m pip install --no-deps --no-build-isolation --no-cache-dir "$PY311_SOURCES/scene-manager"

      - name: Import selected native extensions and trainer in exact Python 3.11 interpreter
        shell: bash
        run: |
          set -euo pipefail
          "$CANDIDATE_PYTHON" -I - <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(os.environ["PY311_SOURCES"])
          sys.path.insert(0, str(root / "gsplat" / "examples"))
          import torch
          import gsplat
          from gsplat.cuda._backend import _C
          from fused_ssim import fused_ssim
          import fused_ssim_cuda
          from nerfview import CameraState
          import pycolmap
          from pycolmap import SceneManager
          from datasets.colmap import Dataset, Parser
          from simple_trainer import Config, main
          if torch.__version__ != "2.4.0+cu124" or torch.version.cuda != "12.4":
              raise SystemExit("changed Torch ABI")
          if torch.cuda.is_available():
              raise SystemExit("no-GPU native import was not CPU-hosted")
          if gsplat.__version__ != "1.5.3" or _C is None or not callable(fused_ssim):
              raise SystemExit("real native extensions are not importable")
          if not all(x is not None for x in (CameraState, SceneManager, Dataset, Parser, Config, main)):
              raise SystemExit("trainer source closure is not importable")
          native = [Path(_C.__file__).resolve(), Path(fused_ssim_cuda.__file__).resolve()]
          if not all(x.is_file() and x.suffix == ".so" for x in native):
              raise SystemExit("native extension binaries missing")
          manifest = Path(os.environ["RUNNER_TEMP"], "py311-locked-manifest.json").read_bytes()
          evidence = {
              "evidence_kind": "experimental_py311_cpu_hosted_cuda_native_import",
              "source_revision_gsplat": os.environ["GSPLAT_REVISION"],
              "source_revision_fused_ssim": os.environ["SSIM_REVISION"],
              "manifest_sha256": hashlib.sha256(manifest).hexdigest(),
              "python": sys.version.split()[0],
              "torch": torch.__version__,
              "cuda_compiled": torch.version.cuda,
              "native_files_sha256": {
                  x.name: hashlib.sha256(x.read_bytes()).hexdigest() for x in native
              },
              "gpu_execution_evidence": False,
              "actual_training_evidence": False,
              "approved_runtime": False,
              "checkpoint_license_approved": False,
          }
          Path("gsplat-py311-native-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n"
          )
          print("REAL Python3.11 gsplat+fused-ssim native imports; NO GPU training")
          PY

      - name: Retain experimental Python 3.11 native build/import proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v2l18-3-gsplat-py311-native-import
          path: gsplat-py311-native-evidence.json
          if-no-files-found: warn
          retention-days: 30
