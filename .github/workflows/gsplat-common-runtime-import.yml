                  """) == area_status["clicked"]
              js("""
                window.__wreExportedMeasurement=null;
                document.getElementById('wre-measure-export').click();
              """)
              assert json.loads(until("return window.__wreExportedMeasurement;")) == area_json
              assert js("""
                const button=document.getElementById('wre-area-toggle');
                button.click();button.click();
                return button.getAttribute('aria-pressed')==='false' &&
                  document.getElementById('wre-measure-export').disabled &&
