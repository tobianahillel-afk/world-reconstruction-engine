                    "Observed stereo point marked in approximate photo-derived 3D; " +
                    "relative units only, no exact surface correspondence or metric scale.";
                }
              }
              const compareChoice = document.getElementById("wre-compare-choice");
              const compareScene = document.getElementById("wre-compare-scene");
              const compareSync = document.getElementById("wre-compare-sync");
              const compareLink = document.getElementById("wre-compare-link");
              const compareStatus = document.getElementById("wre-compare-status");
              const viewPair = document.getElementById("wre-views");
              const photoToggle = document.getElementById("wre-photo-toggle");
              const photoPanel = document.getElementById("wre-source-panel");
              const photoFrame = document.getElementById("wre-source-frame");
              const photoCrop = document.getElementById("wre-photo-crop");
              const photoFrameStatus = document.getElementById("wre-source-frame-status");
              const sourceImage = document.getElementById("wre-live-source-photos");
              const sourceExport = document.getElementById("wre-source-export");
              const sourceExportStatus = document.getElementById("wre-source-export-status");
              const provenance = document.getElementById("wre-scene-provenance");
              const localInput = document.getElementById("wre-local-glb");
              const measureButton = document.getElementById("wre-measure-toggle");
              const pathButton = document.getElementById("wre-path-toggle");
              const areaButton = document.getElementById("wre-area-toggle");
              const angleButton = document.getElementById("wre-angle-toggle");
              const exportButton = document.getElementById("wre-measure-export");
              const measureImport = document.getElementById("wre-measure-import");
              const measureImportStatus = document.getElementById("wre-measure-import-status");
              const viewExportButton = document.getElementById("wre-view-export");
              const viewExportStatus = document.getElementById("wre-view-export-status");
              const measureResult = document.getElementById("wre-measure-result");
              const cameraExport = document.getElementById("wre-camera-export");
              const cameraImport = document.getElementById("wre-camera-import");
              const cameraStatus = document.getElementById("wre-camera-status");
              const tourRecord = document.getElementById("wre-tour-record");
              const tourPlay = document.getElementById("wre-tour-play");
              const tourStep = document.getElementById("wre-tour-step");
              const tourClear = document.getElementById("wre-tour-clear");
              const tourExport = document.getElementById("wre-tour-export");
              const tourStoryboard = document.getElementById("wre-tour-storyboard");
              const tourImport = document.getElementById("wre-tour-import");
              const tourStatus = document.getElementById("wre-tour-status");
              const referenceMetres = document.getElementById("wre-reference-metres");
              const referenceApply = document.getElementById("wre-reference-apply");
              const referenceEstimate = document.getElementById("wre-reference-estimate");
              const secondReferenceMetres = document.getElementById("wre-second-reference-metres");
              const referenceCrosscheck = document.getElementById("wre-reference-crosscheck");
              const referenceCrosscheckStatus = document.getElementById("wre-reference-crosscheck-status");
              const referenceClear = document.getElementById("wre-reference-clear");
              const referenceExport = document.getElementById("wre-reference-export");
              const referenceImport = document.getElementById("wre-reference-import");
              const referenceStatus = document.getElementById("wre-reference-status");
              // Reuse the real model-viewer camera; never invent scene motion.
              // Camera travel is NOT temporal reconstruction of the 3D scene.
              let cameraTour = [];
              let cameraTourSource = null;
              let tourEpoch = 0;
              let tourPlaying = false;
              function syncTourStep(selected = cameraTour.length) {
                const count = Math.max(1, cameraTour.length);
                tourStep.max = String(count);
                tourStep.value = String(Math.min(Math.max(1, selected), count));
                tourStep.disabled = tourPlaying || !scene.loaded || cameraTour.length === 0;
              }
              function resetCameraTour() {
                ++tourEpoch;
                cameraTour = [];
                cameraTourSource = null;
                tourPlaying = false;
                tourPlay.disabled = true;
                tourExport.disabled = true;
                tourStoryboard.disabled = true;
                tourRecord.disabled = !scene.loaded;
                syncTourStep();
                tourStatus.textContent = "No saved camera tour.";
              }
              tourRecord.addEventListener("click", () => {
                if (!scene.loaded || tourPlaying || cameraTour.length >= 8) return;
                const src = scene.getAttribute("src");
                if (cameraTourSource !== null && cameraTourSource !== src) resetCameraTour();
                const orbit = scene.getCameraOrbit();
                const target = scene.getCameraTarget();
                const frame = [orbit.theta, orbit.phi, orbit.radius,
                  target.x, target.y, target.z, scene.getFieldOfView()];
                if (!frame.every(Number.isFinite) || frame[2] <= 0) {
                  tourStatus.textContent = "Cannot record an invalid 3D camera.";
                  return;
                }
                scene.removeAttribute("auto-rotate");
                cameraTourSource = src;
                cameraTour.push(frame);
                tourPlay.disabled = cameraTour.length < 2;
                tourExport.disabled = cameraTour.length < 2;
                tourStoryboard.disabled = cameraTour.length < 2;
                tourRecord.disabled = cameraTour.length >= 8;
                syncTourStep(cameraTour.length);
                tourStatus.textContent = cameraTour.length +
                  " viewpoint(s) saved for this model; camera-only, nonmetric.";
              });
              tourStep.addEventListener("input", () => {
                if (!scene.loaded || tourPlaying ||
                    cameraTourSource !== scene.getAttribute("src")) return;
                const index = Number(tourStep.value) - 1;
                if (!Number.isInteger(index) || index < 0 || index >= cameraTour.length) return;
                const frame = cameraTour[index];
                scene.removeAttribute("auto-rotate");
                scene.cameraOrbit = frame[0] + "rad " + frame[1] + "rad " + frame[2] + "m";
                scene.cameraTarget = frame.slice(3, 6).map(value => value + "m").join(" ");
                scene.fieldOfView = frame[6] + "deg";
                scene.jumpCameraToGoal();
                tourStatus.textContent = "Previewing saved viewpoint " + (index + 1) +
                  "/" + cameraTour.length + " (static 3D, NOT 4D reconstruction).";
              });
              tourPlay.addEventListener("click", async () => {
                if (!scene.loaded || tourPlaying || cameraTour.length < 2 ||
                    cameraTourSource !== scene.getAttribute("src")) return;
                const epoch = ++tourEpoch;
                const frames = cameraTour.map(frame => frame.slice());
                tourPlaying = true;
                syncTourStep(1);
                tourPlay.disabled = true;
                tourStoryboard.disabled = true;
                tourRecord.disabled = true;
                scene.removeAttribute("auto-rotate");
                try {
                  // Smooth the viewing camera, never the reconstructed scene.
                  const applyCamera = frame => {
                    scene.cameraOrbit = frame[0] + "rad " + frame[1] + "rad " + frame[2] + "m";
                    scene.cameraTarget = frame.slice(3, 6).map(value => value + "m").join(" ");
                    scene.fieldOfView = frame[6] + "deg";
                    scene.jumpCameraToGoal();
                  };
                  for (const [index, frame] of frames.entries()) {
                    if (epoch !== tourEpoch || !scene.loaded ||
                        cameraTourSource !== scene.getAttribute("src")) return;
                    if (index === 0) {
                      applyCamera(frame);
                      await new Promise(resolve => setTimeout(resolve, 180));
                    } else {
                      const previous = frames[index - 1];
                      for (let step = 1; step <= 16; step++) {
                        if (epoch !== tourEpoch || !scene.loaded ||
                            cameraTourSource !== scene.getAttribute("src")) return;
                        const t = step / 16;
                        const eased = t * t * (3 - 2 * t);
                        const between = frame.map((value, coordinate) =>
                          previous[coordinate] + (value - previous[coordinate]) * eased);
                        applyCamera(between);
                        tourStatus.textContent = "Interpolating camera viewpoint " +
                          index + "/" + frames.length + " (static 3D, NOT 4D).";
                        await new Promise(resolve => setTimeout(resolve, 40));
                      }
                    }
                    tourStep.value = String(index + 1);
                    tourStatus.textContent = "Playing camera viewpoint " + (index + 1) +
                      "/" + frames.length + ".";
                  }
                  if (epoch === tourEpoch) {
                    tourStatus.textContent = "Tour complete: " + frames.length +
                      " viewpoints (viewer motion only; NOT 4D reconstruction).";
                  }
                } finally {
                  if (epoch === tourEpoch) {
                    tourPlaying = false;
