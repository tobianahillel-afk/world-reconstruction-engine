              quats=torch.tensor([[1., 0., 0., 0.], [1., 0., 0., 0.]]),
              opacities=torch.tensor([0.0, 0.5], dtype=torch.float32),
              sh0=torch.tensor([[[0.2, 0.1, 0.3]], [[0.1, 0.3, 0.2]]]),
              shN=torch.zeros((2, 15, 3), dtype=torch.float32),
              format="ply",
              save_to=str(output),
          )
          assert isinstance(produced, bytes)
          assert output.read_bytes() == produced
          assert b"element vertex 2\n" in produced
          # The same real upstream exporter also writes a viewer-compatible
          # binary Gaussian .splat (XYZ, scale, RGBA, normalized quaternion).
          # No handwritten conversion or simulated native package is involved.
          splat_path = root / "point_cloud_0.splat"
          splat_data = export_splats(
              means=torch.tensor([[0.0, 0.0, 2.0], [0.4, 0.2, 2.4]]),
              scales=torch.zeros((2, 3), dtype=torch.float32),
              quats=torch.tensor([[1., 0., 0., 0.], [1., 0., 0., 0.]]),
              opacities=torch.tensor([0.0, 0.5], dtype=torch.float32),
              sh0=torch.tensor([[[0.2, 0.1, 0.3]], [[0.1, 0.3, 0.2]]]),
              shN=torch.zeros((2, 15, 3), dtype=torch.float32),
              format="splat",
              save_to=str(splat_path),
          )
          assert isinstance(splat_data, bytes)
          assert splat_path.read_bytes() == splat_data
          assert len(splat_data) == 2 * 32  # Native splat: 32 bytes/vertex.
          # Upstream sorts centers by Morton order; never assume original
          # input tensor order is retained in the portable .splat bytes.
          assert {splat_data[i:i + 12] for i in (0, 32)} == {
              struct.pack("<3f", 0.0, 0.0, 2.0),
              struct.pack("<3f", 0.4, 0.2, 2.4),
