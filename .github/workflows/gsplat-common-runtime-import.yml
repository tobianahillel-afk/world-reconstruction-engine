      # Make the genuine 16-camera glTF scene directly discoverable without
      # extracting the full SfM experiment bundle or building CUDA extensions.
      - name: Package standalone real-photo 3D scene and verified receipt
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -I - <<'PY'
          import hashlib
          import json
          import shutil
          from pathlib import Path

          source = Path("wre-real16-early-gltf/viewable-scene-with-cameras.glb")
          manifest = json.loads(Path("wre-real16-early-gltf/manifest.json").read_text())
          expected = manifest["files"]["viewable-scene-with-cameras.glb"]
          payload = source.read_bytes()
          digest = hashlib.sha256(payload).hexdigest()
          assert len(payload) == expected["bytes"]
          assert digest == expected["sha256"]
          assert payload[:4] == b"glTF"
          destination = Path("wre-real16-viewable-scene.glb")
          shutil.copyfile(source, destination)
          assert hashlib.sha256(destination.read_bytes()).hexdigest() == digest
          receipt = {
              "schema": "wre.experimental.real16_standalone_scene.v1",
              "scene_file": destination.name,
              "sha256": digest,
              "bytes": destination.stat().st_size,
              "source_dataset_commit": manifest["source_dataset_commit"],
              "license": manifest["license"],
              "registered_cameras": manifest["registered_camera_nodes"],
              "camera_center_connections": manifest["camera_center_connections"],
              "connection_order": "filename_only_not_capture_time",
              "gpu_training_executed": False,
              "metric_scale_known": False,
              "temporal_reconstruction_executed": False,
          }
          Path("wre-real16-viewable-scene-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish standalone real-photo 3D scene independently of CUDA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wre-real16-viewable-3d-scene
          path: |
            wre-real16-viewable-scene.glb
            wre-real16-viewable-scene-receipt.json
            wre-real16-observed-rgb-LICENSE.txt
            wre-real16-camera-poses.json
          if-no-files-found: error
          retention-days: 7

      # One usable, self-contained browser presentation of the real 16-camera
      # SfM scene. Reuses the vetted model-viewer 4.1.0 bundle from WRE #281.
      # Publication happens BEFORE slow CUDA compilation; no GPU is needed.
      - name: Package offline interactive 16-camera scene (CPU)
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -I - <<'PY'
          import csv
          import hashlib
          import json
          import math
          import shutil
          import struct
          from pathlib import Path
          from urllib.request import urlopen

          source = Path("wre-real16-viewable-scene.glb")
          receipt = json.loads(
              Path("wre-real16-viewable-scene-receipt.json").read_text(encoding="utf-8")
          )
          content = source.read_bytes()
          assert struct.unpack_from("<4sII", content) == (b"glTF", 2, len(content))
          assert receipt["sha256"] == hashlib.sha256(content).hexdigest()
          assert receipt["bytes"] == len(content)
          assert receipt["registered_cameras"] == 16
          assert receipt["gpu_training_executed"] is False
          assert receipt["metric_scale_known"] is False

          quality = json.loads(Path("wre-real16-sfm-quality.json").read_text())
          geom = quality["geometry_quality"]
          assert quality["schema"] == "wre.experimental.real_photo_sfm_quality.v1"
          assert quality["source_dataset_commit"] == receipt["source_dataset_commit"]
          assert geom["kind"] == "native_sparse_sfm_in_sample_geometry_v1"
          assert geom["registered_views"] == 16
          assert geom["sparse_points3d"] > 100
          assert geom["track_observations"] >= 2 * geom["sparse_points3d"]
          assert 0 <= geom["mean_reprojection_error_colmap_px"] < float("inf")
          assert geom["held_out_image_quality_measured"] is False
          assert geom["gpu_optimization_executed"] is False
          assert geom["metric_scale_known"] is False
          measured_quality = (
              f'{geom["registered_views"]} registered cameras · '
              f'{geom["sparse_points3d"]} real 3D points · '
              f'{geom["track_observations"]} track observations · '
              f'mean reprojection error {geom["mean_reprojection_error_colmap_px"]:.3f} px '
              '(COLMAP, in-sample; NOT held-out image quality or trained 3DGS).'
          )
          observed_rgb = json.loads(
              Path("wre-real16-observed-rgb-agreement.json").read_text()
          )
          assert observed_rgb["schema"] == "wre.experimental.real16_observed_rgb_agreement.v1"
          assert observed_rgb["source_dataset_commit"] == quality["source_dataset_commit"]
          assert observed_rgb["image_count"] == 16
          assert observed_rgb["sparse_points3d"] == geom["sparse_points3d"]
          assert observed_rgb["track_observations"] == geom["track_observations"]
          assert observed_rgb["held_out_image_quality_measured"] is False
          assert observed_rgb["gpu_training_executed"] is False
          score = observed_rgb["mean_rgb_difference_0_to_255"]
          assert 0 <= score <= 255
          colour_summary = (
              f'{observed_rgb["points_with_cross_view_observations"]} real 3D landmarks · '
              f'{observed_rgb["cross_view_pairs"]} observed view pairs · '
              f'mean RGB disagreement {score:.2f}/255 '
              '(measured source pixels; affected by lighting, exposure and occlusion; '
              'NOT held-out reconstruction quality, trained 3DGS or temporal 4D).'
          )
          output = Path("wre-real16-offline-viewer")
          output.mkdir(exist_ok=False)
          shutil.copyfile(source, output / source.name)
          shutil.copyfile("wre-real16-sfm-quality.json", output / "wre-real16-sfm-quality.json")
          for name in (
              "wre-real16-viewable-scene-receipt.json",
              "wre-real16-observed-rgb-LICENSE.txt",
              "wre-real16-camera-poses.json",
              "wre-real16-native-2d3d-tracks.csv",
              "wre-real16-observed-rgb-agreement.json",
              "wre-real16-native-sparse-depth.npz",
              "wre-real16-native-sparse-depth.json",
              "wre-real16-native-sparse-depth-preview.png",
              "wre-real16-native-sparse-depth-observations.csv",
          ):
              shutil.copyfile(name, output / name)

          # Real native Point3D/Point2D lookup: a search index over EVERY
          # measurement, not only eight sampled landmarks in a camera pair.
          poses = json.loads(Path("wre-real16-camera-poses.json").read_text())
          cameras_by_id = {int(c["image_id"]): c for c in poses["cameras"]}
          points = {}
          seen_pixels = set()
          with Path("wre-real16-native-2d3d-tracks.csv").open(
              encoding="utf-8", newline=""
          ) as stream:
              for row in csv.DictReader(stream):
                  pid, image_id = int(row["point3d_id"]), int(row["image_id"])
                  pixel_id = int(row["point2d_idx"])
                  c = cameras_by_id[image_id]
                  assert (image_id, pixel_id) not in seen_pixels
                  seen_pixels.add((image_id, pixel_id))
                  assert row["image_name"] == c["image_name"]
                  assert row["image_sha256"] == c["image_sha256"]
                  xyz = [float(row[key]) for key in ("x", "y", "z")]
                  error = float(row["in_sample_error_px"])
                  uv = [float(row["pixel_x"]), float(row["pixel_y"])]
                  assert pid > 0 and pixel_id >= 0 and error >= 0
                  assert all(math.isfinite(v) for v in (*xyz, error, *uv))
                  assert 0 <= uv[0] < c["image_width"]
                  assert 0 <= uv[1] < c["image_height"]
                  point = points.setdefault(str(pid), {
                      "xyz": xyz, "in_sample_error_px": error, "observations": [],
                  })
                  assert point["xyz"] == xyz and point["in_sample_error_px"] == error
                  point["observations"].append({
                      "image_id": image_id, "image_name": row["image_name"],
                      "point2d_idx": pixel_id, "pixel": uv,
                  })
          assert len(points) == geom["sparse_points3d"]
          assert len(seen_pixels) == geom["track_observations"]
          # The 4x4 measured-depth sheet is sparse: resolve occupied cells
          # to real original COLMAP point IDs with nearest positive camera-Z.
          depth_meta = json.loads(
              Path("wre-real16-native-sparse-depth.json").read_text()
          )
          depth_tiles = sorted(cameras_by_id.values(), key=lambda camera: camera["image_name"])
          tile_for_image = {
              int(camera["image_id"]): tile
              for tile, camera in enumerate(depth_tiles)
          }
          depth_bins = {}
          depth_rows_seen = 0
          with Path("wre-real16-native-sparse-depth-observations.csv").open(
              encoding="utf-8", newline=""
          ) as stream:
              for record in csv.DictReader(stream):
                  image_id = int(record["image_id"])
                  pid = str(int(record["point3d_id"]))
                  point_index = int(record["point2d_idx"])
                  camera = cameras_by_id[image_id]
                  point = points[pid]
                  uv = (float(record["pixel_x"]), float(record["pixel_y"]))
                  z = float(record["camera_z_sfm_units"])
                  assert record["image_name"] == camera["image_name"]
                  assert record["image_sha256"] == camera["image_sha256"]
                  assert math.isfinite(z) and z > 0
                  assert any(
                      obs["image_id"] == image_id
                      and obs["point2d_idx"] == point_index
                      and all(
                          math.isclose(a, b, rel_tol=1e-9, abs_tol=1e-8)
                          for a, b in zip(obs["pixel"], uv)
                      )
                      for obs in point["observations"]
                  ), "Depth pixel must match a measured COLMAP observation"
                  tile = tile_for_image[image_id]
                  x = min(255, int(uv[0] * 256 / camera["image_width"]))
                  y = min(255, int(uv[1] * 256 / camera["image_height"]))
                  key = f"{tile}:{x}:{y}"
                  if key not in depth_bins or z < depth_bins[key][0]:
                      depth_bins[key] = (z, pid)
                  depth_rows_seen += 1
          assert depth_rows_seen == depth_meta["depth_observations_csv_records"]
          assert len(depth_bins) > 100
          for point in points.values():
              point["observations"].sort(
                  key=lambda obs: (obs["image_name"], obs["point2d_idx"])
              )
              assert len(point["observations"]) >= 2
          lookup = {
              "schema": "wre.experimental.real16_native_landmark_lookup.v1",
              "license": receipt["license"],
              "source_dataset_commit": receipt["source_dataset_commit"],
              "point_count": len(points),
              "observation_count": len(seen_pixels),
              "gpu_training_executed": False,
              "depth_tile_resolution": 256,
              "depth_tile_order": "image_name_sorted_four_by_four",
              "depth_bin_to_point3d_id": {
                  key: value[1] for key, value in sorted(depth_bins.items())
              },
              "depth_bin_to_camera_z_sfm_units": {
                  key: value[0] for key, value in sorted(depth_bins.items())
              },
              "points": points,
          }
          (output / "wre-real16-native-landmark-lookup.json").write_text(
              json.dumps(lookup, separators=(",", ":"), sort_keys=True, allow_nan=False),
              encoding="utf-8",
          )

          # Hash-bound Apache-2.0 viewer already used by WRE's working Chrome
          # real-photo browser smoke; NOT a new 3D viewer implementation.
          js_url = (
              "https://cdnjs.cloudflare.com/ajax/libs/model-viewer/4.1.0/"
              "model-viewer.min.js"
          )
          expected_sha512 = (
              "PMy/x5h09gVKwc21Cdcgu/VWJwgmeJ7uivJkbTar3vh5t8uz"
              "Yo3NQgTkZE0fsfUd+9vihkAcLNAh6mv9mEXkZQ=="
          )
          import base64
          with urlopen(js_url, timeout=30) as response:
              vendor = response.read(5_000_001)
          assert 100_000 < len(vendor) <= 5_000_000
          assert (
              base64.b64encode(hashlib.sha512(vendor).digest()).decode("ascii")
              == expected_sha512
          )
          (output / "wre-model-viewer-4.1.0.min.js").write_bytes(vendor)
          with urlopen(
              "https://raw.githubusercontent.com/google/model-viewer/v4.1.0/LICENSE",
              timeout=30,
          ) as response:
              vendor_license = response.read(20_001)
          assert 11_000 < len(vendor_license) <= 20_000
          assert b"Apache License" in vendor_license[:110]
          (output / "wre-model-viewer-4.1.0-LICENSE.txt").write_bytes(vendor_license)

          html = """<!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta http-equiv="Content-Security-Policy"
            content="default-src 'none'; script-src 'self' 'unsafe-inline' blob:;
              style-src 'unsafe-inline'; connect-src 'self' blob: data:;
              img-src 'self' blob: data:; worker-src 'self' blob:;
              font-src 'self' data:">
          <title>WRE · Real 16-photo reconstructed 3D</title>
          <script type="module" src="./wre-model-viewer-4.1.0.min.js"
            integrity="sha512-PMy/x5h09gVKwc21Cdcgu/VWJwgmeJ7uivJkbTar3vh5t8uzYo3NQgTkZE0fsfUd+9vihkAcLNAh6mv9mEXkZQ=="></script>
          <style>
          html,body {height:100%;margin:0;background:#101721;color:#e5effb;
            font:15px system-ui,sans-serif}
          main {height:100%;display:flex;flex-direction:column}
          header,footer {padding:12px 18px;background:#202b3d}
          h1 {font-size:20px;margin:0 0 6px}
          p {margin:5px 0;line-height:1.4}
          model-viewer {width:100%;flex:1;min-height:330px}
          a {color:#9bdeff}
          #camera-navigation {display:flex;flex-wrap:wrap;gap:9px;align-items:center;
            padding:10px 18px;background:#182437}
          #camera-navigation select,#camera-navigation button {background:#273950;
            border:1px solid #8097b2;border-radius:5px;color:#fff;padding:8px}
          #camera-details {font-size:13px;line-height:1.45;flex-basis:100%}
          #wre-native-lookup {padding:9px 18px;background:#1b2a3d;display:flex;
            flex-wrap:wrap;gap:9px;align-items:center}
          #wre-native-lookup input,#wre-native-lookup button,
          #wre-native-lookup select {padding:8px;
            background:#273950;border:1px solid #8097b2;color:white;border-radius:5px}
          #wre-native-observation-status {flex-basis:100%;font-size:13px}
          #wre-native-lookup-output {flex-basis:100%;font-size:13px;line-height:1.5}
          #wre-sfm-quality {padding:9px 18px;background:#162235;line-height:1.45}
          #local-model {display:flex;flex-wrap:wrap;align-items:center;gap:9px;
            padding:10px 18px;background:#202b3d}
          #local-model input,#local-model button {color:#fff;padding:7px}
          #local-model-status {font-size:13px;flex-basis:100%}
          #wre-source-photo {padding:8px 18px;background:#152238;
            display:flex;align-items:center;flex-wrap:wrap;gap:10px}
          #wre-source-photo input {color:#fff}
          #wre-photo-status {font-size:13px;flex-basis:100%}
          #wre-photo-image,#wre-photo-image-b {max-height:180px;max-width:100%;object-fit:contain}
          #wre-source-photo .wre-photo-pair {display:flex;gap:12px;flex-wrap:wrap;width:100%}
          #wre-source-photo figure {margin:0;max-width:46%;min-width:170px}
          #wre-source-photo figcaption {font-size:12px;margin-top:4px}
          .wre-pair-hotspot {border:2px solid #eaf5ff;border-radius:50%;
            width:30px;height:30px;display:grid;place-items:center;
            font:bold 16px system-ui;box-shadow:0 0 0 2px #162236;
            color:#162236;background:#ffc65a;pointer-events:none}
          .wre-pair-hotspot.secondary {background:#70d7ff}
          .wre-photo-frame {position:relative;display:inline-block;line-height:0}
          .wre-measured-pixel {position:absolute;width:13px;height:13px;
            border:2px solid #fff;border-radius:50%;background:#ff7733;
            box-shadow:0 0 0 2px #242424;pointer-events:none;
            transform:translate(-50%,-50%);z-index:2}
          .wre-measured-pixel[hidden] {display:none}
          .wre-track-hotspot {border:1px solid #fff;border-radius:50%;
            width:13px;height:13px;padding:0;background:#92ffad;
            box-shadow:0 0 0 2px #123225;pointer-events:auto;cursor:pointer}
          </style></head><body><main>
          <header><h1>WRE · Real 16-photograph SfM 3D</h1>
          <p>Orbit and zoom the actual reconstructed RGB point cloud,
          16 calibrated camera frustums and filename-ordered camera connections.</p>
          <p>Source: Pierre Moulon, OpenMVG Palm Desert Micro, CC BY-NC 4.0
          <strong>NONCOMMERCIAL</strong>. No original photographs are distributed.</p>
          </header>
          <section id="wre-sfm-quality" aria-label="Measured real SfM geometry">
            <strong>Measured CPU SfM quality (in-sample)</strong>
            <output id="wre-sfm-quality-value">WRE_MEASURED_QUALITY</output>
          </section>
          <section id="wre-source-rgb-agreement" aria-label="Measured source-view RGB agreement">
            <strong>Cross-view original-photo RGB differences (in-sample, CPU)</strong>
            <output id="wre-source-rgb-agreement-value">WRE_OBSERVED_RGB_AGREEMENT</output>
          </section>
          <section id="wre-sparse-depth" aria-label="Observed real SfM sparse camera depth">
            <strong>Measured sparse camera depth (CPU, arbitrary SfM units)</strong>
            <p>16 registered views. Bright = nearer tracked 3D landmarks; black = no observed depth.
            NOT dense depth, meters, held-out, or GPU.</p>
            <img id="wre-sparse-depth-preview" alt="Sixteen real COLMAP sparse depth tiles"
              src="./wre-real16-native-sparse-depth-preview.png"
              style="max-width:100%;height:auto;cursor:crosshair">
            <output id="wre-depth-selection-status">Click a bright depth cell to select its measured COLMAP 3D point. Black is unobserved.</output>
            <p>Shift-click two corners in the same camera tile to measure an observed sparse-depth region.</p>
            <output id="wre-depth-roi-status" aria-live="polite">No measured region selected.</output>
            <button id="wre-depth-roi-download" type="button" disabled>Download measured ROI and 3D point IDs (JSON)</button>
            <button id="wre-depth-roi-ply-download" type="button" disabled>Download measured native ROI as viewable XYZ PLY</button>
            <button id="wre-depth-roi-inspect-3d" type="button" disabled>Inspect nearest measured ROI point in 3D</button>
            <p><a download href="./wre-real16-native-sparse-depth.npz">Sparse camera depth maps (NPZ)</a>
            · <a download href="./wre-real16-native-sparse-depth.json">Depth scale and observation metadata</a>
            · <a download href="./wre-real16-native-sparse-depth-observations.csv">Original-resolution measured depths (CSV)</a></p>
          </section>
          <section id="camera-navigation" aria-label="Inspect reconstructed cameras">
            <label for="wre-camera-choice">Reconstructed camera (filename order, not time)</label>
            <select id="wre-camera-choice" disabled>
              <option>Loading camera poses...</option>
            </select>
            <label for="wre-baseline-choice">Measure to second SfM camera</label>
            <select id="wre-baseline-choice" disabled>
              <option>Loading camera poses...</option>
            </select>
            <button id="wre-camera-reset" type="button">Reset orbit</button>
            <button id="wre-frame-baseline" type="button" disabled>
              Frame selected camera pair in 3D
            </button>
            <button id="wre-nearest-camera" type="button" disabled>
              Find nearest other reconstructed camera
            </button>
            <button id="wre-most-shared-camera" type="button" disabled>
              Find camera sharing most triangulated 3D tracks
            </button>
            <output id="camera-details" aria-live="polite">
              Choose a camera to inspect its SfM position (not an exact source photo view).
            </output>
            <output id="wre-camera-baseline" aria-live="polite">
              Select two cameras to measure their SfM baseline; no metric scale.
            </output>
            <output id="wre-landmark-inspection" aria-live="polite">
              Select a green shared 3D landmark to inspect its real SfM support.
            </output>
          </section>
          <section id="wre-native-lookup" aria-label="Find a measured 3D landmark">
            <label for="wre-native-point-id">COLMAP 3D point ID</label>
            <input id="wre-native-point-id" type="number" min="1" step="1"
              placeholder="Point ID">
            <button id="wre-native-point-find" type="button">Find 3D point</button>
            <label for="wre-native-observation-camera">Measured camera</label>
            <select id="wre-native-observation-camera" disabled>
              <option value="">Find a point first</option>
            </select>
            <button id="wre-native-observation-open" type="button" disabled>
              Go to observed camera
            </button>
            <output id="wre-native-observation-status" aria-live="polite">
              Select an observed camera to inspect its measured pixel.
            </output>
            <output id="wre-native-lookup-output" aria-live="polite">
              Look up all measured SfM 3D points, not only camera-pair samples.
              Coordinates in arbitrary SfM units; no GPU training or capture time.
            </output>
          </section>
          <section id="local-model" aria-label="Open your own 3D GLB">
            <label for="wre-local-glb">Open your own 3D model (.glb, max 128 MiB)</label>
            <input id="wre-local-glb" type="file" accept=".glb,model/gltf-binary">
            <button id="wre-restore-demo" type="button">Restore 16-photo scene</button>
          <button id="wre-export-png" type="button">Save current 3D view as PNG</button>
            <output id="local-model-status" aria-live="polite">
              Only the original scene is verified. Local files stay in this browser.
            </output>
          </section>
          <section id="wre-source-photo" aria-label="Compare locally supplied source photograph">
            <label for="wre-source-files">Compare original camera photographs (local only)</label>
            <input id="wre-source-files" type="file" multiple
              accept="image/jpeg,image/png,image/webp">
            <output id="wre-photo-status" aria-live="polite">
              Source photos are not bundled. Supply files matching reconstructed camera names;
              they stay in this browser, with no upload or calibration claim.
            </output>
            <button id="wre-verify-photo-hashes" type="button">
              Check supplied photos against recorded SfM image SHA-256
            </button>
            <output id="wre-photo-hash-status" aria-live="polite">
              Not checked. Matching a source digest is not a signed provenance guarantee.
            </output>
            <div class="wre-photo-pair">
              <figure><div class="wre-photo-frame"><img id="wre-photo-image" hidden
                alt="Locally provided first reconstructed camera photograph">
                <span id="wre-measured-pixel-a" class="wre-measured-pixel" hidden
                  aria-label="Measured SfM observation in camera A"></span>
                <span id="wre-native-photo-pixel" class="wre-measured-pixel" hidden
                  aria-label="Measured native 3D point pixel in local photo"></span></div>
                <figcaption>Camera A · <span id="wre-photo-hash-a">local photo unverified</span></figcaption></figure>
              <figure><div class="wre-photo-frame"><img id="wre-photo-image-b" hidden
                alt="Locally provided second reconstructed camera photograph">
                <span id="wre-measured-pixel-b" class="wre-measured-pixel" hidden
                  aria-label="Measured SfM observation in camera B"></span>
                <span id="wre-native-photo-pixel-b" class="wre-measured-pixel" hidden
                  aria-label="Native triangulated point measured in camera B"></span></div>
                <figcaption>Camera B · <span id="wre-photo-hash-b">local photo unverified</span></figcaption></figure>
            </div>
          </section>
          <model-viewer id="wre-scene" camera-controls auto-rotate
            loading="eager" interaction-prompt="auto"
            alt="Sparse CPU 3D reconstruction of 16 real photographs"
            src="./wre-real16-viewable-scene.glb"></model-viewer>
          <footer><p>SfM RGB geometry from real photographs. No metric scale,
          no verified capture-time order, no 4D, no CUDA GPU training,
          no Gaussian appearance optimization.</p>
          <p>Scene SHA-256: WRE_SCENE_SHA256</p>
          <p><a download href="./wre-real16-viewable-scene.glb">Download GLB</a>
          · <a download href="./wre-real16-camera-poses.json">Camera poses</a>
          · <a download href="./wre-real16-native-2d3d-tracks.csv">All measured 2D/3D tracks (CSV)</a>
          · <a download href="./wre-real16-sfm-quality.json">SfM quality evidence</a>
          · <a download href="./wre-real16-observed-rgb-agreement.json">Original-photo RGB observations</a>
          · <a href="./wre-real16-viewable-scene-receipt.json">Provenance</a></p>
          <p>Offline: extract the archive and run
          <code>python3 -m http.server 8765 --bind 127.0.0.1</code>,
          then open <code>http://127.0.0.1:8765/wre-real16-viewer.html</code>.
          No internet access is required at viewing time.</p></footer>
          </main>
          <script type="module">
          const viewer=document.getElementById('wre-scene');
          const choice=document.getElementById('wre-camera-choice');
          const lookupInput=document.getElementById('wre-native-point-id');
          const lookupButton=document.getElementById('wre-native-point-find');
          const lookupOutput=document.getElementById('wre-native-lookup-output');
          const nativeCameraChoice=document.getElementById('wre-native-observation-camera');
          const nativeCameraOpen=document.getElementById('wre-native-observation-open');
          const nativeCameraStatus=document.getElementById('wre-native-observation-status');
          const nativePhotoPixel=document.getElementById('wre-native-photo-pixel');
          const nativePhotoPixelB=document.getElementById('wre-native-photo-pixel-b');
          let nativeLookup=null;
          const loadNativeIndex=()=>{
              if(nativeLookup===null){
                nativeLookup=fetch('./wre-real16-native-landmark-lookup.json')
                  .then(response=>{
                    if(!response.ok) throw Error('Missing native SfM landmark index');
                    return response.json();
                  }).then(index=>{
                    if(index.schema!=='wre.experimental.real16_native_landmark_lookup.v1' ||
                       !Number.isSafeInteger(index.point_count) ||
                       index.point_count<=100 ||
                       !Number.isSafeInteger(index.observation_count) ||
                       index.observation_count<2*index.point_count ||
                       index.gpu_training_executed!==false) {
                      throw Error('Invalid native SfM landmark index');
                    }
                    return index;
                  });
              }
            return nativeLookup;
          };
          let nativeRgbEvidence=null;
          const loadNativeRgbEvidence=()=>{
            if(nativeRgbEvidence===null){
              nativeRgbEvidence=fetch('./wre-real16-observed-rgb-agreement.json')
                .then(response=>{
                  if(!response.ok) throw Error('Missing source RGB observation report');
                  return response.json();
                }).then(report=>{
                  if(report.schema!=='wre.experimental.real16_observed_rgb_agreement.v1' ||
                     report.gpu_training_executed!==false ||
                     report.held_out_image_quality_measured!==false ||
                     !report.per_landmark_mean_rgb_difference_0_to_255 ||
                     typeof report.per_landmark_mean_rgb_difference_0_to_255!=='object'){
                    throw Error('Invalid native landmark RGB observation report');
                  }
                  return report;
                });
            }
            return nativeRgbEvidence;
          };
          let nativePoint=null;
          let nativeObservation=null;
          const clearNativeLookupMarker=()=>{
            viewer.querySelector('[slot="hotspot-native-lookup"]')?.remove();
            nativePoint=null;nativeObservation=null;
            nativeCameraChoice.replaceChildren(new Option('Find a point first',''));
            nativeCameraChoice.disabled=true;nativeCameraOpen.disabled=true;
            nativePhotoPixel.hidden=true;nativePhotoPixelB.hidden=true;
          };
          const findNativePoint=async()=>{
            clearNativeLookupMarker();
            if(localUrl!==null){
              lookupOutput.textContent='Native SfM lookup disabled for unverified GLB.';
              return;
            }
            const id=Number(lookupInput.value);
            if(!Number.isSafeInteger(id) || id<=0){
              lookupOutput.textContent='Enter a positive native COLMAP point ID.';
              return;
            }
            try {
              const [index,colourEvidence]=await Promise.all([
                loadNativeIndex(),loadNativeRgbEvidence()
              ]);
              if(localUrl!==null) return;
              if(colourEvidence.source_dataset_commit!==index.source_dataset_commit ||
                 colourEvidence.sparse_points3d!==index.point_count){
                throw Error('Landmark RGB data does not belong to this SfM scene');
              }
              const point=index.points[String(id)];
              if(!point){
                lookupOutput.textContent='No triangulated COLMAP point '+id+'.';
                return;
              }
              const xyz=point.xyz,observations=point.observations;
              if(!Array.isArray(xyz) || xyz.length!==3 ||
                 !xyz.every(Number.isFinite) ||
                 !Array.isArray(observations) || observations.length<2 ||
                 !Number.isFinite(point.in_sample_error_px) ||
                 point.in_sample_error_px<0 ||
                 !observations.every(o=>Number.isSafeInteger(o.image_id) &&
                   typeof o.image_name==='string' &&
                   Number.isSafeInteger(o.point2d_idx) &&
                   Array.isArray(o.pixel) && o.pixel.length===2 &&
                   o.pixel.every(Number.isFinite))) {
                throw Error('Invalid native COLMAP point evidence');
              }
              // Resolve every native image ID against the 16 actual SfM cameras.
              // Never navigate by filename alone or extrapolate an unmeasured pixel.
              const observed=observations.map(o=>{
                const match=[...cameraEvidence.entries()].find(([,camera])=>
                  camera.image_id===o.image_id && camera.image_name===o.image_name);
                if(!match) throw Error('Native observation has no registered camera');
                return {index:match[0],pixel:o.pixel,image_name:o.image_name};
              });
              nativePoint={id,observed};
              nativeCameraChoice.replaceChildren(new Option('Choose measured camera',''));
              observed.forEach(o=>nativeCameraChoice.add(new Option(
                o.image_name+' ('+o.pixel.map(v=>v.toFixed(1)).join(', ')+')',o.index)));
              nativeCameraChoice.disabled=false;nativeCameraOpen.disabled=false;
              nativeCameraStatus.textContent='Choose a real observing camera; provide '+
                'its original photograph locally to display the measured pixel.';
              const marker=document.createElement('button');
              marker.type='button';marker.className='wre-track-hotspot';
              marker.slot='hotspot-native-lookup';
              marker.setAttribute('data-position',xyz.map(v=>v+'m').join(' '));
              marker.setAttribute('data-normal','0 1 0');
              marker.setAttribute('aria-label','Native COLMAP 3D point '+id);
              marker.textContent='◆';
              viewer.appendChild(marker);
              const observedRgb=colourEvidence
                .per_landmark_mean_rgb_difference_0_to_255[String(id)];
              const rgbDescription=Number.isFinite(observedRgb) &&
                observedRgb>=0 && observedRgb<=255
                ? observedRgb.toFixed(2)+'/255 observed in-sample source-view RGB disagreement; '
                : 'no comparable cross-view RGB observation for this point; ';
              lookupOutput.textContent='Real COLMAP point '+id+' XYZ ('+
                xyz.map(v=>v.toFixed(5)).join(', ')+') in arbitrary SfM units; '+
                observations.length+' measured camera observations; '+
                'native in-sample reprojection error '+
                point.in_sample_error_px.toFixed(4)+' px. '+
                rgbDescription+
                observations.map(o=>o.image_name+' #'+o.point2d_idx+
                  ' ('+o.pixel.map(v=>v.toFixed(1)).join(', ')+')').join(' · ')+
                '. Not metric, held-out quality, time, GPU training or 4D.';
            } catch(error){
              clearNativeLookupMarker();
              lookupOutput.textContent='Native point lookup failed: '+String(error);
              nativeLookup=null;
            }
          };
          lookupButton.addEventListener('click',findNativePoint);

          // Native frontmost sparse-depth sample -> exact SfM Point3D lookup.
          // Do not project any unobserved black bin or infer dense depth.
          const depthPreview=document.getElementById('wre-sparse-depth-preview');
          const depthStatus=document.getElementById('wre-depth-selection-status');
          const depthRoiStatus=document.getElementById('wre-depth-roi-status');
          const depthRoiDownload=document.getElementById('wre-depth-roi-download');
          const depthRoiPlyDownload=document.getElementById('wre-depth-roi-ply-download');
          const depthRoiInspect3d=document.getElementById('wre-depth-roi-inspect-3d');
          let depthRoiCorner=null,depthRoiReport=null;
          depthRoiDownload.addEventListener('click',()=>{
            if(!depthRoiReport || localUrl!==null) return;
            const blob=new Blob([JSON.stringify(depthRoiReport,null,2)],{type:'application/json'});
            const href=URL.createObjectURL(blob);
            const link=document.createElement('a');
            link.href=href;link.download='wre-measured-sparse-depth-roi.json';
            document.body.appendChild(link);link.click();link.remove();
            setTimeout(()=>URL.revokeObjectURL(href),1000);
          });
          depthRoiInspect3d.addEventListener('click',async()=>{
            if(!depthRoiReport || depthRoiInspect3d.disabled || localUrl!==null) return;
            // Measurements are sorted by actual positive camera-Z within ONE tile.
            // Reuse the existing native Point3D finder, not a new projection/solver.
            const nearest=depthRoiReport.measurements[0];
            if(!nearest) return;
            lookupInput.value=nearest.point3d_id;
            await findNativePoint();
          });
          depthRoiPlyDownload.addEventListener('click',()=>{
            if(!depthRoiReport || depthRoiPlyDownload.disabled || localUrl!==null) return;
            // One actual native SfM XYZ per measured Point3D, not dense or inferred depth.
            const positions=new Map();
            for(const m of depthRoiReport.measurements){
              positions.set(m.point3d_id,m.world_xyz_sfm_units);
            }
            const lines=[
              'ply','format ascii 1.0',
              'comment WRE native COLMAP sparse measured ROI; arbitrary SfM units, not meters',
              'comment source license CC BY-NC 4.0 NONCOMMERCIAL',
              'element vertex '+positions.size,
              'property double x','property double y','property double z','end_header'
            ];
            for(const xyz of positions.values()) lines.push(xyz.join(' '));
            const blob=new Blob([lines.join('\\n')+'\\n'],{type:'application/octet-stream'});
            const href=URL.createObjectURL(blob);
            const link=document.createElement('a');
            link.href=href;link.download='wre-measured-sparse-depth-roi-native.ply';
            document.body.appendChild(link);link.click();link.remove();
            setTimeout(()=>URL.revokeObjectURL(href),1000);
          });
          depthPreview.addEventListener('click',async event=>{
            if(localUrl!==null || !viewer.loaded){
              depthStatus.textContent='Restore the verified original 3D scene first.';
              return;
            }
            const box=depthPreview.getBoundingClientRect();
            if(depthPreview.naturalWidth!==1024 || depthPreview.naturalHeight!==1024 ||
               box.width<=0 || box.height<=0) return;
            const x=(event.clientX-box.left)/box.width*1024;
            const y=(event.clientY-box.top)/box.height*1024;
            if(x<0 || x>=1024 || y<0 || y>=1024) return;
            const ix=Math.floor(x),iy=Math.floor(y);
            const tile=4*Math.floor(iy/256)+Math.floor(ix/256);
            const key=tile+':'+(ix%256)+':'+(iy%256);
            if(event.shiftKey){
              try{
                const index=await loadNativeIndex();
                if(localUrl!==null) return;
                if(index.depth_tile_resolution!==256 ||
                   index.depth_tile_order!=='image_name_sorted_four_by_four' ||
                   !index.depth_bin_to_point3d_id ||
                   !index.depth_bin_to_camera_z_sfm_units){
                  throw Error('Measured sparse-depth cells lack camera-Z provenance');
                }
                depthRoiReport=null;depthRoiDownload.disabled=true;
                depthRoiPlyDownload.disabled=true;
                depthRoiInspect3d.disabled=true;
                const corner={tile,x:ix%256,y:iy%256};
                if(!depthRoiCorner){
                  depthRoiCorner=corner;
                  depthRoiStatus.textContent='First ROI corner in camera '+tile+
                    ' at ('+corner.x+','+corner.y+'). Shift-click the second corner.';
                  return;
                }
                const start=depthRoiCorner;depthRoiCorner=null;
                if(tile!==start.tile){
                  depthRoiStatus.textContent='ROI must remain within one measured camera tile.';
                  return;
                }
                const xmin=Math.min(start.x,corner.x),xmax=Math.max(start.x,corner.x);
                const ymin=Math.min(start.y,corner.y),ymax=Math.max(start.y,corner.y);
                const measurements=[];
                for(let ry=ymin;ry<=ymax;ry++) for(let rx=xmin;rx<=xmax;rx++){
                  const bin=tile+':'+rx+':'+ry;
                  const id=index.depth_bin_to_point3d_id[bin];
                  if(id===undefined) continue;
                  const z=index.depth_bin_to_camera_z_sfm_units[bin];
                  if(!Number.isFinite(z) || z<=0 || !index.points[String(id)]){
                    throw Error('A measured depth bin lacks its native COLMAP Point3D');
                  }
                  const xyz=index.points[String(id)].xyz;
                  if(!Array.isArray(xyz) || xyz.length!==3 ||
                     !xyz.every(Number.isFinite)){
                    throw Error('Measured COLMAP Point3D lacks finite native world XYZ');
                  }
                  measurements.push({
                    tile_x:rx,tile_y:ry,point3d_id:String(id),
                    camera_z_sfm_units:z,world_xyz_sfm_units:xyz
                  });
                }
                measurements.sort((a,b)=>a.camera_z_sfm_units-b.camera_z_sfm_units);
                if(measurements.length===0){
                  depthRoiStatus.textContent='ROI has no measured positive camera-Z bins.';
                  return;
                }
                const n=measurements.length;
                const median=n%2
                  ?measurements[(n-1)/2].camera_z_sfm_units
                  :(measurements[n/2-1].camera_z_sfm_units+
                    measurements[n/2].camera_z_sfm_units)/2;
                const min=measurements[0].camera_z_sfm_units;
                const max=measurements[n-1].camera_z_sfm_units;
                depthRoiReport={
                  schema:'wre.experimental.real16_measured_sparse_depth_roi.v1',
                  source_dataset_commit:index.source_dataset_commit,
                  license:index.license,
                  camera_tile_index:tile,
                  tile_coordinates_256:{xmin,xmax,ymin,ymax},
                  measured_frontmost_bins:n,
                  camera_z_min_sfm_units:min,
                  camera_z_median_sfm_units:median,
                  camera_z_max_sfm_units:max,
                  dense_depth_inferred:false,
                  metric_depth_verified:false,
                  measurements
                };
                depthRoiDownload.disabled=false;
                depthRoiPlyDownload.disabled=false;
                depthRoiInspect3d.disabled=false;
                depthRoiStatus.textContent='Camera '+tile+' ROI: '+n+
                  ' observed frontmost SfM bins; camera-Z min '+min.toFixed(4)+
                  ', median '+median.toFixed(4)+', max '+max.toFixed(4)+
                  ' (arbitrary units). Empty cells excluded; NOT dense depth or meters.';
              }catch(error){
                depthRoiCorner=null;depthRoiReport=null;depthRoiDownload.disabled=true;
                depthRoiPlyDownload.disabled=true;
                depthRoiInspect3d.disabled=true;
                depthRoiStatus.textContent='Measured ROI failed: '+String(error);
              }
              return;
            }
            try {
              const index=await loadNativeIndex();
              if(localUrl!==null) return;
              if(index.depth_tile_resolution!==256 ||
                 index.depth_tile_order!=='image_name_sorted_four_by_four' ||
                 !index.depth_bin_to_point3d_id){
                throw Error('Missing measured sparse-depth provenance');
              }
              const pid=index.depth_bin_to_point3d_id[key];
              if(pid===undefined){
                clearNativeLookupMarker();
                lookupOutput.textContent='No real COLMAP 3D point in this sparse depth cell.';
                depthStatus.textContent='Black cell: no measured positive camera-Z depth.';
                return;
              }
              lookupInput.value=String(pid);
              await findNativePoint();
              if(nativePoint && String(nativePoint.id)===String(pid)){
                depthStatus.textContent='Selected real COLMAP point '+pid+
                  ' from positive camera-Z in arbitrary SfM units; no dense or GPU inference.';
              }
            } catch(error){
              depthStatus.textContent='Sparse depth lookup failed: '+String(error);
            }
          });

          nativeCameraOpen.addEventListener('click',()=>{
            if(localUrl!==null || !nativePoint || nativeCameraChoice.disabled) return;
            const observation=nativePoint.observed.find(o=>
              o.index===nativeCameraChoice.value);
            if(!observation || choice.disabled) return;
            nativeObservation=observation;
            choice.value=observation.index;
            choice.dispatchEvent(new Event('change',{bubbles:true}));
            nativeCameraStatus.textContent='Observed native 3D point '+nativePoint.id+
              ' in camera '+observation.image_name+' at measured pixel ('+
              observation.pixel.map(v=>v.toFixed(2)).join(', ')+
              '). A local source photo is required for the image overlay.';
            drawNativePhotoPixel();
          });
          const baselineChoice=document.getElementById('wre-baseline-choice');
          const baselineOutput=document.getElementById('wre-camera-baseline');
          const landmarkInspection=document.getElementById('wre-landmark-inspection');
          const framePair=document.getElementById('wre-frame-baseline');
          const nearestButton=document.getElementById('wre-nearest-camera');
          const sharedButton=document.getElementById('wre-most-shared-camera');
          const details=document.getElementById('camera-details');
          const photoInput=document.getElementById('wre-source-files');
          const photoStatus=document.getElementById('wre-photo-status');
          const photoImage=document.getElementById('wre-photo-image');
          const photoImageB=document.getElementById('wre-photo-image-b');
          const photoMarkerA=document.getElementById('wre-measured-pixel-a');
          const photoMarkerB=document.getElementById('wre-measured-pixel-b');
          const photoUrls=new Map();
          const photoFiles=new Map();
          const photoHashMatches=new Map();
          let photoSelectionGeneration=0;
          const verifyPhotoHashes=document.getElementById('wre-verify-photo-hashes');
          const photoHashStatus=document.getElementById('wre-photo-hash-status');
          const photoHashA=document.getElementById('wre-photo-hash-a');
          const photoHashB=document.getElementById('wre-photo-hash-b');
          const cameraNames=new Set();
          const cameraEvidence=new Map();
          const updatePhotoHashLabels=()=>{
            [
              [choice,photoHashA],[baselineChoice,photoHashB]
            ].forEach(([control,label])=>{
              const name=control.selectedOptions[0]?.textContent?.split(' · ').slice(1).join(' · ');
              if(localUrl!==null || !photoFiles.has(name)){
                label.textContent='no verified source photo';
              } else if(!photoHashMatches.has(name)){
                label.textContent='local photo unverified';
              } else {
                label.textContent=photoHashMatches.get(name)
                  ? 'SHA-256 matches the recorded SfM source image'
                  : 'SHA-256 mismatch (not the recorded SfM image)';
              }
            });
          };
          let selectedPhotoPoint=null;
          const drawNativePhotoPixel=()=>{
            nativePhotoPixel.hidden=true;nativePhotoPixelB.hidden=true;
            if(!nativeObservation || !nativePoint || localUrl!==null) return;
            // A/B remain independent camera selections. Overlay only genuine
            // measured native 2D observations, never a computed projection.
            [
              [photoImage,nativePhotoPixel,choice],
              [photoImageB,nativePhotoPixelB,baselineChoice]
            ].forEach(([img,marker,control])=>{
              const camera=cameraEvidence.get(control.value);
              const observation=nativePoint.observed.find(o=>o.index===control.value);
              if(!camera || !observation || img.hidden || !img.complete ||
                 img.naturalWidth!==camera.image_width ||
                 img.naturalHeight!==camera.image_height) return;
              const uv=observation.pixel;
              if(!uv.every(Number.isFinite) || uv[0]<0 || uv[1]<0 ||
                 uv[0]>=camera.image_width || uv[1]>=camera.image_height) return;
              marker.style.left=(100*uv[0]/camera.image_width)+'%';
              marker.style.top=(100*uv[1]/camera.image_height)+'%';
              marker.dataset.pixelX=String(uv[0]);
              marker.dataset.pixelY=String(uv[1]);
              marker.title='Native SfM pixel measured in this camera; local photo NOT authenticated';
              marker.hidden=false;
            });
          };
          const drawMeasuredPhotoPixels=()=>{
            photoMarkerA.hidden=true;photoMarkerB.hidden=true;
            if(!selectedPhotoPoint || localUrl!==null) return;
            if(choice.value!==String(selectedPhotoPoint.first) ||
                baselineChoice.value!==String(selectedPhotoPoint.second)) return;
            [
              [photoImage,photoMarkerA,selectedPhotoPoint.first,selectedPhotoPoint.a],
              [photoImageB,photoMarkerB,selectedPhotoPoint.second,selectedPhotoPoint.b]
            ].forEach(([img,marker,index,xy])=>{
              const camera=cameraEvidence.get(String(index));
              // Matching filename and dimensions never authenticate a local photograph.
              if(!camera || img.hidden || !img.complete ||
                  img.naturalWidth!==camera.image_width ||
                  img.naturalHeight!==camera.image_height ||
                  !xy.every(Number.isFinite) || xy[0]<0 || xy[1]<0 ||
                  xy[0]>=camera.image_width || xy[1]>=camera.image_height) return;
              marker.style.left=(100*xy[0]/camera.image_width)+'%';
              marker.style.top=(100*xy[1]/camera.image_height)+'%';
              marker.dataset.pixelX=String(xy[0]);
              marker.dataset.pixelY=String(xy[1]);
              marker.title='Measured in-sample SfM pixel; local photo not authenticated';
              marker.hidden=false;
            });
          };
          // Reverse navigation searches ONLY measured native observations.
          // Pixel proximity is an explicit selection aid, not new triangulation.
          const selectNativePointFromPhoto=async (event,img,cameraControl)=>{
            if(localUrl!==null || img.hidden || !img.complete ||
               cameraControl.disabled || cameraControl.value==='') return;
            const selectedCamera=cameraControl.value;
            const camera=cameraEvidence.get(selectedCamera);
            const rect=img.getBoundingClientRect();
            if(!camera || img.naturalWidth!==camera.image_width ||
               img.naturalHeight!==camera.image_height ||
               rect.width<=0 || rect.height<=0) return;
            const u=(event.clientX-rect.left)*camera.image_width/rect.width;
            const v=(event.clientY-rect.top)*camera.image_height/rect.height;
            if(u<0 || v<0 || u>=camera.image_width || v>=camera.image_height) return;
            try {
              const index=await loadNativeIndex();
              if(localUrl!==null || cameraControl.value!==selectedCamera) return;
              let nearest=null, bestDistance=64;
              for(const [id,point] of Object.entries(index.points)){
                if(!Array.isArray(point.observations)) continue;
                for(const observed of point.observations){
                  if(observed.image_id!==camera.image_id ||
                     observed.image_name!==camera.image_name ||
                     !Array.isArray(observed.pixel) || observed.pixel.length!==2 ||
                     !observed.pixel.every(Number.isFinite)) continue;
                  const dx=u-observed.pixel[0],dy=v-observed.pixel[1];
                  const squaredDistance=dx*dx+dy*dy;
                  if(squaredDistance<bestDistance){
                    bestDistance=squaredDistance;nearest=id;
                  }
                }
              }
              if(nearest===null){
                nativeCameraStatus.textContent='No measured SfM point within 8 pixels. '+
                  'No 3D coordinate was invented.';
                return;
              }
              lookupInput.value=nearest;
              await findNativePoint();
              if(localUrl!==null || cameraControl.value!==selectedCamera ||
                 !nativePoint || String(nativePoint.id)!==nearest) return;
              const observation=nativePoint.observed.find(o=>o.index===selectedCamera);
              if(!observation) return;
              nativeCameraChoice.value=selectedCamera;
              if(cameraControl===baselineChoice){
                // Clicking photo B must not silently overwrite camera A.
                nativeObservation=observation;
                if(focusCamera) focusCamera(Number(selectedCamera));
                drawNativePhotoPixel();
                nativeCameraStatus.textContent='Real 3D point '+nativePoint.id+
                  ' selected from measured camera B pixel ('+
                  observation.pixel.map(v=>v.toFixed(2)).join(', ')+
                  '); A/B comparison retained.';
              } else {
                nativeCameraOpen.click();
              }
              nativeCameraStatus.textContent+=' Selected by clicking the local photograph.';
            } catch(error){
              nativeCameraStatus.textContent='Photo-to-3D navigation failed: '+String(error);
            }
          };
          photoImage.addEventListener('click',event=>
