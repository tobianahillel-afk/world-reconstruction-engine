name: gsplat-common-runtime-import

# One exact Python/Torch/CUDA environment for the pinned trainer's *eager imports*.
# CPU-hosted CUDA toolkit only: no GPU kernels, reconstruction, or training.
on:
  pull_request:
    paths:
      - ".github/workflows/gsplat-common-runtime-import.yml"
      - "registry/dependencies.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined-native-import:
    name: pinned-trainer-eager-import-one-native-environment-no-gpu
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda@sha256:da6791294b0b04d7e65d87b7451d6f2390b4d36225ab0701ee7dfec5769829f5
    timeout-minutes: 120
    env:
      CUDA_HOME: /usr/local/cuda
      TORCH_CUDA_ARCH_LIST: "7.5"
      MAX_JOBS: "1"
      PYTHONPATH: ""
      GSPLAT_REVISION: 937e29912570c372bed6747a5c9bf85fed877bae
      GSPLAT_TREE: 90c3f0b2352e6d2725bcba1ef0407168f922c0fa
      GLM_REVISION: 33b4a621a697a305bc3a7610d290677b96beb181
      GLM_TREE: e57f342f0fb63852d65e0da2090528fdca9b0117
      SSIM_REVISION: 328dc9836f513d00c4b5bc38fe30478b4435cbb5
      SSIM_TREE: ac5f1d8fe5d519f9c44b220d235bf1f198463da7
      NERFVIEW_REVISION: 4538024fe0d15fd1a0e4d760f3695fc44ca72787
      NERFVIEW_TREE: e333400e39605978a3d1f9cf6d73ddf577a8c8e3
      SCENE_MANAGER_REVISION: cc7ea4b7301720ac29287dbe450952511b32125e

    steps:
      - name: Checkout exact WRE dependency registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned uv and Python 3.10.21
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.10.21"
          enable-cache: false

      - name: Create one native environment and hash-pinned wheel manifest
        shell: bash
        run: |
          set -euo pipefail
          test -x "$CUDA_HOME/bin/nvcc"
          "$CUDA_HOME/bin/nvcc" --version | grep 'release 12.4,'
          uv venv --seed --python 3.10.21 "$RUNNER_TEMP/gsplat-common-venv"
          echo "COMMON_PYTHON=$RUNNER_TEMP/gsplat-common-venv/bin/python" >> "$GITHUB_ENV"
          uv run --no-project --with "pyyaml==6.0.2" python - <<'PY'
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlsplit
          import yaml

          record = yaml.safe_load(Path("registry/dependencies.yaml").read_text())[
              "dependencies"
          ]["gsplat_static_appearance"]["runtime_python_lock"]
          assert record["target"]["python"] == "3.10.21"
          assert record["target"]["torch_cuda"] == "12.4"
          assert record["gpu_execution_evidence"] is False
          wheels = record["packages"]
          assert len(wheels) == 76
          assert next(x for x in wheels if x["name"] == "torch")["version"] == "2.4.0+cu124"
          lines = []
          for item in sorted(wheels, key=lambda entry: entry["name"].lower()):
              url, digest = item["url"], item["sha256"]
              parts = urlsplit(url)
              assert parts.scheme == "https" and not parts.fragment
              assert re.fullmatch("[0-9a-f]{64}", digest)
              lines.append(f'{item["name"]} @ {url}#sha256={digest}')
          (Path(os.environ["RUNNER_TEMP"]) / "common-locked-wheels.txt").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          print(f"One common environment requires {len(wheels)} pinned wheels")
          PY

      - name: Install all 76 reviewed wheels without resolving new dependencies
        shell: bash
        run: |
          set -euo pipefail
          "$COMMON_PYTHON" -m pip install --no-index --no-deps --no-cache-dir \
            --require-hashes -r "$RUNNER_TEMP/common-locked-wheels.txt"
          "$COMMON_PYTHON" -m pip check
          "$COMMON_PYTHON" - <<'PY'
          import sys
          import numpy
          import torch
          assert sys.version.startswith("3.10.21")
          assert numpy.__version__ == "1.26.4"
          assert torch.__version__ == "2.4.0+cu124"
          assert torch.version.cuda == "12.4"
          assert not torch.cuda.is_available()
          print("Exact Python/Torch/CUDA wheel ABI loaded, GPU unavailable")
          PY

      - name: Install git for immutable upstream source checkout
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          # The pinned opencv-python wheel needs libGL.so.1 when COLMAP imports cv2.
          # CUDA's minimal container lacks OpenCV's GL and GLib/gthread libraries.
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates libgl1 libglib2.0-0

      - name: Materialize exact gsplat, fused-ssim, nerfview and legacy COLMAP sources
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/wre-common-upstream"
          mkdir -p "$root"
          fetch_exact() {
            name="$1"; remote="$2"; revision="$3"; tree="$4"
            git init -q "$root/$name"
            git -C "$root/$name" remote add origin "$remote"
            git -C "$root/$name" fetch --quiet --depth=1 origin "$revision"
            git -C "$root/$name" checkout --quiet --detach FETCH_HEAD
            test "$(git -C "$root/$name" rev-parse HEAD)" = "$revision"
            if test "$tree" != "-"; then
              test "$(git -C "$root/$name" rev-parse HEAD^{tree})" = "$tree"
            fi
          }
          fetch_exact gsplat https://github.com/nerfstudio-project/gsplat.git \
            "$GSPLAT_REVISION" "$GSPLAT_TREE"
          fetch_exact ssim https://github.com/rahul-goel/fused-ssim.git \
            "$SSIM_REVISION" "$SSIM_TREE"
          fetch_exact nerfview https://github.com/nerfstudio-project/nerfview.git \
            "$NERFVIEW_REVISION" "$NERFVIEW_TREE"
          fetch_exact scene-manager https://github.com/rmbrualla/pycolmap.git \
            "$SCENE_MANAGER_REVISION" "-"
          test "$(git -C "$root/gsplat" ls-tree HEAD gsplat/cuda/csrc/third_party/glm | awk '{print $3}')" = "$GLM_REVISION"
          git -C "$root/gsplat" submodule update --init --depth 1 -- gsplat/cuda/csrc/third_party/glm
          glm="$root/gsplat/gsplat/cuda/csrc/third_party/glm"
          test "$(git -C "$glm" rev-parse HEAD)" = "$GLM_REVISION"
          test "$(git -C "$glm" rev-parse HEAD^{tree})" = "$GLM_TREE"
          echo "COMMON_SOURCES=$root" >> "$GITHUB_ENV"

      - name: Reconstruct actual Middlebury photographs with pinned OpenCV stereo (CPU)
        shell: bash
        run: |
          set -euo pipefail
          "$COMMON_PYTHON" - <<'PY'
          import hashlib
          import json
          import os
          import struct
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          import cv2
          import numpy as np
          from PIL import Image

          # Two REAL, rectified stereo photographs distributed in the OpenCV
          # example tree; underlying images are from the Middlebury 2006 set.
          # Use an immutable upstream Git revision AND exact Git blob IDs.
          # Dataset credit: Middlebury Stereo 2006 (Scharstein et al.).
          opencv_sha = "9b6287ec500ef7b327ac74c4f6c9cd84a2cbc9cd"
          images = {
              "aloeL.jpg": "4c192768e4ddd2ada20f91a5e0bd3648fbc78818",
              "aloeR.jpg": "7ecdf48919be3ac7dd0cc6e594ab00398ac956b2",
          }
          photos = []
          original_sha256 = {}
          for name, expected_blob in images.items():
              url = (
                  "https://raw.githubusercontent.com/opencv/opencv/"
                  f"{opencv_sha}/samples/data/{name}"
              )
              # The pinned upstream raw endpoint can return transient 503.
              # Retry transport failures only; never retry a mismatched Git blob.
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(url, timeout=45) as response:
                          data = response.read(1_000_001)
                      break
                  except urllib.error.HTTPError as exc:
                      if exc.code not in (429, 500, 502, 503, 504) or attempt == 2:
                          raise
                  except (urllib.error.URLError, TimeoutError):
                      if attempt == 2:
                          raise
                  time.sleep(2 * (attempt + 1))
              assert 0 < len(data) <= 1_000_000, "Stereo photo size exceeds bound"
              git_blob = hashlib.sha1(
                  f"blob {len(data)}\0".encode("ascii") + data
              ).hexdigest()
              assert git_blob == expected_blob, "Pinned real photo Git blob mismatch"
              original_bytes = Path(os.environ["RUNNER_TEMP"]) / f"wre-original-{name}"
              original_bytes.write_bytes(data)
              original_sha256[name] = hashlib.sha256(data).hexdigest()
              image = cv2.imdecode(
                  np.frombuffer(data, dtype=np.uint8), cv2.IMREAD_COLOR
              )
              assert image is not None and image.ndim == 3
              photos.append(image)
          left, right = photos
          assert left.shape == right.shape and left.shape[1] >= 320
          original_shape = [int(left.shape[0]), int(left.shape[1])]
          if left.shape[1] > 768:
              new_size = (left.shape[1] // 2, left.shape[0] // 2)
              left = cv2.resize(left, new_size, interpolation=cv2.INTER_AREA)
              right = cv2.resize(right, new_size, interpolation=cv2.INTER_AREA)
          height, width = left.shape[:2]

          # OpenCV's established native SGBM; no homegrown stereo solver.
          # The example photographs are rectified, but no reliable metric
          # calibration is supplied here. XYZ uses an ARBITRARY baseline=1.
          block = 5
          matcher = cv2.StereoSGBM_create(
              minDisparity=0, numDisparities=128, blockSize=block,
              P1=8 * 3 * block * block, P2=32 * 3 * block * block,
              uniquenessRatio=8, speckleWindowSize=70, speckleRange=2,
              disp12MaxDiff=1,
          )
          disparity = matcher.compute(left, right).astype(np.float32) / 16.0
          valid = np.isfinite(disparity) & (disparity > 2.0) & (disparity < 128.0)
          coverage = float(np.mean(valid))
          assert coverage > 0.03, f"Insufficient real stereo coverage: {coverage}"
          # Photometric consistency is a real observed metric, NOT a
          # ground-truth reconstruction accuracy score.
          yy, xx = np.indices((height, width), dtype=np.float32)
          right_warp = cv2.remap(
              right, xx - disparity, yy, interpolation=cv2.INTER_LINEAR,
              borderMode=cv2.BORDER_CONSTANT,
          )
          residual = np.mean(
              np.abs(left.astype(np.float32) - right_warp.astype(np.float32)),
              axis=2,
          )
          photometric_mae = float(np.mean(residual[valid]))
          assert np.isfinite(photometric_mae)

          # NEW INDEPENDENT CALIBRATED REAL-PHOTO CPU PATH. Middlebury 2006
          # Aloe: full-size focal=3740px, baseline=160mm, dmin=270px.
          # https://vision.middlebury.edu/stereo/data/scenes2006/
          # https://vision.middlebury.edu/stereo/data/scenes2006/FullSize/Aloe/dmin.txt
          # Current OpenCV sample pair is half resolution; retain the older
          # arbitrary-scale previews unchanged until this new route is proven.
          url = (
              "https://raw.githubusercontent.com/opencv/opencv/"
              f"{opencv_sha}/samples/data/aloeGT.png"
          )
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(url, timeout=45) as response:
                      reference_bytes = response.read(150_001)
                  break
              except urllib.error.HTTPError as exc:
                  if exc.code not in (429, 500, 502, 503, 504) or attempt == 2:
                      raise
              except (urllib.error.URLError, TimeoutError):
                  if attempt == 2:
                      raise
              time.sleep(2 * (attempt + 1))
          reference_blob = hashlib.sha1(
              f"blob {len(reference_bytes)}\0".encode("ascii") + reference_bytes
          ).hexdigest()
          assert reference_blob == "43e62ebfe910f6be8c440d57b6ad300743768934"
          reference_full = cv2.imdecode(
              np.frombuffer(reference_bytes, np.uint8), cv2.IMREAD_GRAYSCALE
          )
          assert reference_full is not None and reference_full.shape == (height * 2, width * 2)
          reference = cv2.resize(
              reference_full, (width, height), interpolation=cv2.INTER_NEAREST
          )
          reference_known = reference > 0
          reference_disparity = (reference.astype(np.float32) + 270.0) / 2.0
          calibrated_matcher = cv2.StereoSGBM_create(
              minDisparity=128, numDisparities=160, blockSize=block,
              P1=8 * 3 * block * block, P2=32 * 3 * block * block,
              uniquenessRatio=8, speckleWindowSize=70, speckleRange=2,
              disp12MaxDiff=1,
          )
          calibrated_disp = calibrated_matcher.compute(left, right).astype(np.float32) / 16.0
          calibrated_valid = np.isfinite(calibrated_disp) & (calibrated_disp > 135.0) & (calibrated_disp < 288.0)
          compared = calibrated_valid & reference_known
          compared_count = int(compared.sum())
          assert compared_count >= 500, f"Calibrated/GT overlap too small: {compared_count}"
          abs_error = np.abs(calibrated_disp[compared] - reference_disparity[compared])
          mae = float(np.mean(abs_error))
          rmse = float(np.sqrt(np.mean(abs_error**2)))
          assert np.isfinite(mae) and np.isfinite(rmse)
          baseline_compared = valid & reference_known
          baseline_mae = (
              float(np.mean(np.abs(disparity[baseline_compared] - reference_disparity[baseline_compared])))
              if baseline_compared.any() else None
          )
          # Empirical reference mismatch is a DIAGNOSTIC, not verified metric
          # calibration. The original JPEG pair may not match official GT
          # view1/view5/offset. Never export claimed millimetres from this gate.
          calibrated_dir = Path(os.environ["RUNNER_TEMP"])
          check_name = "wre-real-stereo-cpu-middlebury-reference-check"
          preview = cv2.applyColorMap(
              np.uint8(np.clip((calibrated_disp - 128) / 160 * 255, 0, 255)),
              cv2.COLORMAP_TURBO,
          )
          preview[~calibrated_valid] = 0
          assert cv2.imwrite(str(calibrated_dir / f"{check_name}.png"), preview)
          (calibrated_dir / f"{check_name}.json").write_text(
              json.dumps({
                  "source": "Middlebury 2006 Aloe, pinned OpenCV photographs",
                  "reference_git_blob": reference_blob,
                  "official_dmin_full_px": 270,
                  "official_focal_full_px": 3740,
                  "official_baseline_mm": 160,
                  "reference_downscale_factor": 2,
                  "matcher_disparity_search_px": [128, 288],
                  "reference_compared_pixels": compared_count,
                  "reference_hypothesis_mae_px": mae,
                  "reference_hypothesis_rmse_px": rmse,
                  "legacy_window_reference_mae_px": baseline_mae,
                  "reference_alignment_independently_verified": False,
                  "metric_calibration_validated": False,
                  "reference_disparity_encoding_calibration_verified": False,
                  "physical_scale_output_authorized": False,
                  "gpu_training": False,
                  "dynamic_4d": False,
              }, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          print(
              f"Middlebury reference hypothesis only: overlap {compared_count}, "
              f"MAE {mae:.3f}px, RMSE {rmse:.3f}px; NOT metric-calibrated."
          )

          # Reuse the existing reverse OpenCV matcher early to cross-check
          # left-image 3D points against observed right-image geometry.
          right_matcher = cv2.StereoSGBM_create(
              minDisparity=-128, numDisparities=128, blockSize=block,
              P1=8 * 3 * block * block, P2=32 * 3 * block * block,
              uniquenessRatio=8, speckleWindowSize=70, speckleRange=2,
              disp12MaxDiff=1,
          )
          right_disparity = -right_matcher.compute(right, left).astype(np.float32) / 16.0
          right_valid = (
              np.isfinite(right_disparity)
              & (right_disparity > 2.0)
              & (right_disparity < 128.0)
          )
          assert int(right_valid.sum()) >= 500
          right_x = np.rint(xx - disparity).astype(np.int32)
          within_right = valid & (right_x >= 0) & (right_x < width)
          sampled_x = np.clip(right_x, 0, width - 1)
          sampled_right = right_disparity[yy.astype(np.intp), sampled_x]
          checked = (
              within_right
              & right_valid[yy.astype(np.intp), sampled_x]
              & (np.abs(disparity - sampled_right) <= 2.0)
          )
          checked_count = int(checked.sum())
          assert checked_count >= 500
          assert checked_count <= int(valid.sum())

          focal_guess = float(width)
          baseline_gauge = 1.0

          # Export quantitative fields alongside RGB previews: grayscale PFM
          # float32 little endian with scanlines stored bottom to top.
          # Zero means an unobserved pixel. Relative depth is NOT metres.
          disparity_field = np.where(valid, disparity, 0.0).astype(np.float32)
          depth_field = np.zeros_like(disparity_field)
          np.divide(
              np.float32(focal_guess * baseline_gauge), disparity_field,
              out=depth_field, where=valid,
          )
          assert np.isfinite(depth_field).all() and np.all(depth_field[valid] > 0)

          def write_and_verify_pfm(name, field):
              assert field.shape == (height, width) and field.dtype == np.float32
              destination = Path(os.environ["RUNNER_TEMP"]) / name
              header = f"Pf\n{width} {height}\n-1.0\n".encode("ascii")
              pixels = np.ascontiguousarray(field[::-1, :], dtype="<f4")
              with destination.open("wb") as stream:
                  stream.write(header)
                  stream.write(pixels.tobytes())
              with destination.open("rb") as stream:
                  assert stream.readline() == b"Pf\n"
                  assert stream.readline() == f"{width} {height}\n".encode("ascii")
                  assert stream.readline() == b"-1.0\n"
                  payload = stream.read()
              assert len(payload) == height * width * 4
              restored = np.frombuffer(payload, dtype="<f4").reshape(height, width)[::-1]
              assert np.array_equal(restored, field)
              assert np.count_nonzero(restored) == int(valid.sum())
              return destination.name

          disparity_pfm = write_and_verify_pfm(
              "wre-real-stereo-cpu-disparity-f32.pfm", disparity_field
          )
          depth_pfm = write_and_verify_pfm(
              "wre-real-stereo-cpu-depth-model-f32.pfm", depth_field
          )
          # Portable lossless 16-bit grayscale depth-input interchange.
          # Value 0 = no observed correspondence; positive values encode
          # SGBM horizontal disparity in pixels multiplied by 256.
          # This is NOT depth in metres, and must not be used as a metric map.
          disparity_u16_name = "wre-real-stereo-cpu-disparity-u16.png"
          disparity_u16 = np.where(
              valid, np.rint(disparity_field * 256.0), 0
          ).astype(np.uint16)
          assert np.array_equal(disparity_u16 > 0, valid)
          portable_disparity = Path(os.environ["RUNNER_TEMP"]) / disparity_u16_name
          assert cv2.imwrite(str(portable_disparity), disparity_u16)
          restored_disparity = cv2.imread(
              str(portable_disparity), cv2.IMREAD_UNCHANGED
          )
          assert restored_disparity is not None
          assert restored_disparity.dtype == np.uint16
          assert restored_disparity.shape == (height, width)
          assert np.array_equal(restored_disparity, disparity_u16)
          assert np.all(
              np.abs(restored_disparity[valid].astype(np.float32) / 256.0
                     - disparity_field[valid]) <= 1.0 / 512.0 + 1e-6
          )
          disparity_u16_sha256 = hashlib.sha256(
              portable_disparity.read_bytes()
          ).hexdigest()
          principal_x, principal_y = (width - 1) / 2.0, (height - 1) / 2.0
          yy_selected, xx_selected = np.where(valid[::3, ::3])
          yy_selected *= 3
          xx_selected *= 3
          assert len(xx_selected) >= 1000
          take = max(1, len(xx_selected) // 20000)
          yy_selected = yy_selected[::take][:20000]
          xx_selected = xx_selected[::take][:20000]
          disp_selected = disparity[yy_selected, xx_selected]
          depth = focal_guess * baseline_gauge / disp_selected
          xyz = np.column_stack((
              (xx_selected - principal_x) * depth / focal_guess,
              (yy_selected - principal_y) * depth / focal_guess,
              depth,
          ))
          assert len(xyz) >= 500 and np.all(np.isfinite(xyz))
          rgb = left[yy_selected, xx_selected, ::-1]
          output = Path(os.environ["RUNNER_TEMP"])
          header = (
              "ply\nformat ascii 1.0\n"
              f"element vertex {len(xyz)}\n"
              "property float x\nproperty float y\nproperty float z\n"
              "property uchar red\nproperty uchar green\nproperty uchar blue\n"
              "end_header\n"
          )
          cloud = output / "wre-real-stereo-cpu-reconstruction.ply"
          with cloud.open("w", encoding="ascii", newline="\n") as file:
              file.write(header)
              for point, color in zip(xyz, rgb):
                  file.write(
                      f"{point[0]:.7g} {point[1]:.7g} {point[2]:.7g} "
                      f"{int(color[0])} {int(color[1])} {int(color[2])}\n"
                  )
          # Export a second, viewable RGB 3D cloud from correspondences
          # verified in BOTH real photographs. Preserve the original cloud.
          chosen = checked[yy_selected, xx_selected]
          checked_xyz, checked_rgb = xyz[chosen], rgb[chosen]
          assert len(checked_xyz) >= 100
          checked_cloud = output / "wre-real-stereo-cpu-lr-consistent.ply"
          with checked_cloud.open("w", encoding="ascii", newline="\n") as file:
              file.write(header.replace(
                  f"element vertex {len(xyz)}", f"element vertex {len(checked_xyz)}"
              ))
              for point, color in zip(checked_xyz, checked_rgb):
                  file.write(
                      f"{point[0]:.7g} {point[1]:.7g} {point[2]:.7g} "
                      f"{int(color[0])} {int(color[1])} {int(color[2])}\n"
                  )
          assert checked_cloud.stat().st_size > 100
          # Functional CPU refinement of *already reconstructed* real-photo
          # geometry: accept only both left-right disparity consistency and
          # low observed-image reprojection error; preserve all original clouds.
          photometric_limit = 8.0  # Mean RGB absolute error on 0..255.
          quality_selected = (
              chosen & (residual[yy_selected, xx_selected] <= photometric_limit)
          )
          quality_xyz, quality_rgb = xyz[quality_selected], rgb[quality_selected]
          assert len(quality_xyz) >= 100
          quality_mae = float(
              np.mean(residual[yy_selected[quality_selected], xx_selected[quality_selected]])
          )
          quality_name = "wre-real-stereo-cpu-photometric-consistent.ply"
          with (output / quality_name).open("w", encoding="ascii", newline="\n") as file:
              file.write(header.replace(
                  f"element vertex {len(xyz)}",
                  f"element vertex {len(quality_xyz)}",
              ))
              for xyz_point, color in zip(quality_xyz, quality_rgb):
                  file.write(
                      f"{xyz_point[0]:.7g} {xyz_point[1]:.7g} {xyz_point[2]:.7g} "
                      f"{int(color[0])} {int(color[1])} {int(color[2])}\n"
                  )
          assert (output / quality_name).stat().st_size > 100
          # Functional real-photo 3D export: ALL selected pixels, rather than
          # the old 20k decimated point preview. No new stereo solver.
          dense_mask = checked & (residual <= photometric_limit)
          dense_y, dense_x = np.nonzero(dense_mask)
          dense_count = int(len(dense_x))
          assert dense_count >= len(quality_xyz) >= 100
          dense_depth = depth_field[dense_y, dense_x]
          dense_color = left[dense_y, dense_x, ::-1]
          dense_dtype = np.dtype([
              ("x", "<f4"), ("y", "<f4"), ("z", "<f4"),
              ("red", "u1"), ("green", "u1"), ("blue", "u1"),
          ])
          dense_vertices = np.empty(dense_count, dtype=dense_dtype)
          dense_vertices["x"] = (
              (dense_x - principal_x) * dense_depth / focal_guess
          )
          dense_vertices["y"] = (
              (dense_y - principal_y) * dense_depth / focal_guess
          )
          dense_vertices["z"] = dense_depth
          for name, index in zip(("red", "green", "blue"), range(3)):
              dense_vertices[name] = dense_color[:, index]
          assert np.isfinite(
              np.column_stack((
                  dense_vertices["x"], dense_vertices["y"], dense_vertices["z"]
              ))
          ).all()
          dense_name = "wre-real-stereo-cpu-dense-consistent-rgb.ply"
          dense_header = (
              "ply\nformat binary_little_endian 1.0\n"
              f"element vertex {dense_count}\n"
              "property float x\nproperty float y\nproperty float z\n"
              "property uchar red\nproperty uchar green\nproperty uchar blue\n"
              "end_header\n"
          ).encode("ascii")
          dense_path = output / dense_name
          with dense_path.open("wb") as stream:
              stream.write(dense_header)
              stream.write(dense_vertices.tobytes())
          with dense_path.open("rb") as stream:
              assert stream.read(len(dense_header)) == dense_header
              dense_payload = stream.read()
          assert len(dense_payload) == dense_count * dense_dtype.itemsize
          dense_restored = np.frombuffer(dense_payload, dtype=dense_dtype)
          assert np.array_equal(dense_restored, dense_vertices)
          assert dense_path.stat().st_size == len(dense_header) + len(dense_payload)
          # Green = two-way geometry consistent, red = one-way-only pixel.
          diagnostic = np.zeros_like(left)
          diagnostic[valid & ~checked] = (0, 0, 255)
          diagnostic[checked] = (0, 255, 0)
          consistency_png = output / "wre-real-stereo-cpu-lr-consistency.png"
          assert cv2.imwrite(str(consistency_png), diagnostic)
          assert np.array_equal(cv2.imread(str(consistency_png)), diagnostic)

          # Functional SURFACE reconstruction from the same observed stereo
          # disparity. Only connect local, valid neighbouring pixels whose
          # depths agree; never bridge occlusions or claim watertight geometry.
          mesh_stride = 4
          mesh_y, mesh_x = np.mgrid[0:height:mesh_stride, 0:width:mesh_stride]
          mesh_valid = valid[mesh_y, mesh_x]
          assert int(mesh_valid.sum()) >= 500
          compact_ids = np.full(mesh_valid.shape, -1, dtype=np.int32)
          compact_ids[mesh_valid] = np.arange(int(mesh_valid.sum()))
          mx = mesh_x[mesh_valid].astype(np.float64)
          my = mesh_y[mesh_valid].astype(np.float64)
          mz = focal_guess * baseline_gauge / disparity[mesh_y[mesh_valid], mesh_x[mesh_valid]]
          mesh_xyz = np.column_stack((
              (mx - principal_x) * mz / focal_guess,
              (my - principal_y) * mz / focal_guess,
              mz,
          ))
          mesh_rgb = left[mesh_y[mesh_valid], mesh_x[mesh_valid], ::-1]
          assert np.all(np.isfinite(mesh_xyz)) and np.all(mesh_xyz[:, 2] > 0)
          faces = []
          for row in range(compact_ids.shape[0] - 1):
              for col in range(compact_ids.shape[1] - 1):
                  top_left, top_right = compact_ids[row, col:col + 2]
                  bottom_left, bottom_right = compact_ids[row + 1, col:col + 2]
                  for triangle in (
                      (top_left, bottom_left, top_right),
                      (top_right, bottom_left, bottom_right),
                  ):
                      if min(triangle) < 0:
                          continue
                      zs = mesh_xyz[np.asarray(triangle), 2]
                      if float(zs.max() / zs.min()) > 1.15:
                          continue
                      faces.append(tuple(int(index) for index in triangle))
          assert len(faces) >= 200, "Insufficient measured stereo surface triangles"
          assert max(max(face) for face in faces) < len(mesh_xyz)
          mesh_path = output / "wre-real-stereo-cpu-surface.ply"
          mesh_header = (
              "ply\nformat ascii 1.0\n"
              f"element vertex {len(mesh_xyz)}\n"
              "property float x\nproperty float y\nproperty float z\n"
              "property uchar red\nproperty uchar green\nproperty uchar blue\n"
              f"element face {len(faces)}\n"
              "property list uchar int vertex_indices\nend_header\n"
          )
          with mesh_path.open("w", encoding="ascii", newline="\n") as file:
              file.write(mesh_header)
              for point, color in zip(mesh_xyz, mesh_rgb):
                  file.write(
                      f"{point[0]:.7g} {point[1]:.7g} {point[2]:.7g} "
                      f"{int(color[0])} {int(color[1])} {int(color[2])}\n"
                  )
              for triangle in faces:
                  file.write(f"3 {triangle[0]} {triangle[1]} {triangle[2]}\n")
          # Independently reopen the serialized PLY to ensure the actual
          # published artifact has the declared vertices and triangle count.
          with mesh_path.open("r", encoding="ascii") as file:
              exported = file.readlines()
          header_end = exported.index("end_header\n")
          assert len(exported) - header_end - 1 == len(mesh_xyz) + len(faces)
          assert exported[-1].startswith("3 ")

          # Textured mesh from the same measured stereo XYZ and faces. Each UV is
          # mapped onto the ACTUAL photographed left image: no synthesized texture.
          texture_name = "wre-real-stereo-cpu-texture.png"
          obj_name = "wre-real-stereo-cpu-textured.obj"
          mtl_name = "wre-real-stereo-cpu-textured.mtl"
          assert cv2.imwrite(str(output / texture_name), left)
          decoded_texture = cv2.imread(str(output / texture_name))
          assert decoded_texture is not None and np.array_equal(decoded_texture, left)
          uv = np.column_stack((
              (mx + 0.5) / float(width),
              1.0 - (my + 0.5) / float(height),
          ))
          assert uv.shape == (len(mesh_xyz), 2)
          assert np.all(np.isfinite(uv)) and np.all((uv > 0.0) & (uv < 1.0))
          (output / mtl_name).write_text(
              "newmtl wre_observed_left_photo\n"
              "Ka 0 0 0\nKd 1 1 1\nKs 0 0 0\n"
              f"map_Kd {texture_name}\n",
              encoding="ascii",
          )
          obj_path = output / obj_name
          with obj_path.open("w", encoding="ascii", newline="\n") as obj:
              obj.write(f"mtllib {mtl_name}\no measured_stereo_surface\n")
              for xyz_row in mesh_xyz:
                  obj.write(f"v {xyz_row[0]:.9g} {xyz_row[1]:.9g} {xyz_row[2]:.9g}\n")
              for u, v in uv:
                  obj.write(f"vt {u:.9g} {v:.9g}\n")
              obj.write("usemtl wre_observed_left_photo\ns off\n")
              for a, b, c in faces:
                  obj.write(f"f {a+1}/{a+1} {b+1}/{b+1} {c+1}/{c+1}\n")
          # Self-contained glTF 2.0 binary model for common browser/desktop viewers.
          # Reuse the same measured stereo vertices/faces and OBSERVED left texture.
          # Camera Y-down/Z-forward -> glTF Y-up/-Z-forward (180-degree X rotation).
          glb_name = "wre-real-stereo-cpu-textured.glb"
          gltf_xyz = np.ascontiguousarray(mesh_xyz, dtype="<f4")
          gltf_xyz[:, 1:] *= -1.0
          gltf_uv = np.ascontiguousarray(
              np.column_stack(((mx + 0.5) / width, (my + 0.5) / height)), dtype="<f4",
          )
          gltf_indices = np.ascontiguousarray(faces, dtype="<u4").reshape(-1)
          assert len(gltf_indices) == 3 * len(faces)
          assert np.all(gltf_indices < len(gltf_xyz))
          texture_png = (output / texture_name).read_bytes()
          assert texture_png.startswith(b"\x89PNG\r\n\x1a\n")
          blob, views = bytearray(), []
          for data, target in (
              (gltf_xyz.tobytes(), 34962),
              (gltf_uv.tobytes(), 34962),
              (gltf_indices.tobytes(), 34963),
              (texture_png, None),
          ):
              start = len(blob)
              blob.extend(data)
              blob.extend(b"\0" * (-len(blob) % 4))
              view = {"buffer": 0, "byteOffset": start, "byteLength": len(data)}
              if target is not None:
                  view["target"] = target
              views.append(view)
          document = {
              "asset": {"version": "2.0", "generator": "WRE real-photo stereo CPU"},
              "scene": 0, "scenes": [{"nodes": [0]}],
              "nodes": [{"mesh": 0, "name": "Measured stereo surface"}],
              "meshes": [{"primitives": [{"attributes": {"POSITION": 0, "TEXCOORD_0": 1},
                                         "indices": 2, "material": 0, "mode": 4}]}],
              "materials": [{"name": "Unlit observed photograph", "doubleSided": True,
                             "pbrMetallicRoughness": {"baseColorTexture": {"index": 0},
                                                      "metallicFactor": 0, "roughnessFactor": 1},
                             "extensions": {"KHR_materials_unlit": {}}}],
              "extensionsUsed": ["KHR_materials_unlit"],
              "textures": [{"sampler": 0, "source": 0}],
              "samplers": [{"magFilter": 9729, "minFilter": 9729}],
              "images": [{"bufferView": 3, "mimeType": "image/png"}],
              "buffers": [{"byteLength": len(blob)}], "bufferViews": views,
              "accessors": [
                  {"bufferView": 0, "componentType": 5126, "count": len(gltf_xyz),
                   "type": "VEC3", "min": gltf_xyz.min(axis=0).tolist(),
                   "max": gltf_xyz.max(axis=0).tolist()},
                  {"bufferView": 1, "componentType": 5126, "count": len(gltf_uv),
                   "type": "VEC2"},
                  {"bufferView": 2, "componentType": 5125, "count": len(gltf_indices),
                   "type": "SCALAR"},
              ],
          }
          json_chunk = json.dumps(document, separators=(",", ":")).encode("utf-8")
          json_chunk += b" " * (-len(json_chunk) % 4)
          glb_data = (
              struct.pack("<4sII", b"glTF", 2, 12 + 8 + len(json_chunk) + 8 + len(blob))
              + struct.pack("<I4s", len(json_chunk), b"JSON") + json_chunk
              + struct.pack("<I4s", len(blob), b"BIN\0") + blob
          )
          (output / glb_name).write_bytes(glb_data)
          # Reopen on disk; verify container sizes and each serialized mesh/texture view.
          loaded = (output / glb_name).read_bytes()
          assert struct.unpack_from("<4sII", loaded) == (b"glTF", 2, len(loaded))
          json_length, kind = struct.unpack_from("<I4s", loaded, 12)
          assert kind == b"JSON"
          decoded = json.loads(loaded[20:20 + json_length])
          start = 20 + json_length
          bin_length, kind = struct.unpack_from("<I4s", loaded, start)
          assert kind == b"BIN\0" and start + 8 + bin_length == len(loaded)
          assert decoded["accessors"][0]["count"] == len(mesh_xyz)
          assert decoded["accessors"][2]["count"] == 3 * len(faces)
          assert decoded["buffers"][0]["byteLength"] == bin_length
          binary = loaded[start + 8:]
          for view, expected in zip(
              decoded["bufferViews"],
              (gltf_xyz.tobytes(), gltf_uv.tobytes(), gltf_indices.tobytes(), texture_png),
          ):
              off = view["byteOffset"]
              assert binary[off:off + view["byteLength"]] == expected

          # Portable glTF POINTS preview of the 3D locations actually checked
          # against BOTH photographs. Reuse the GLB/gltf convention above.
          # This is a visualization of observed RGB samples, not Gaussian render.
          checked_glb_name = "wre-real-stereo-cpu-lr-consistent.glb"
          checked_positions = np.ascontiguousarray(checked_xyz, dtype="<f4")
          checked_positions[:, 1:] *= -1.0  # Y-up, Z-back like textured GLB
          checked_colors = np.ascontiguousarray(checked_rgb, dtype="u1")
          assert checked_positions.shape == checked_colors.shape
          assert np.all(np.isfinite(checked_positions))
          point_binary, point_views = bytearray(), []
          for values in (checked_positions.tobytes(), checked_colors.tobytes()):
              offset = len(point_binary)
              point_binary.extend(values)
              point_binary.extend(b"\0" * (-len(point_binary) % 4))
              point_views.append({
                  "buffer": 0, "byteOffset": offset,
                  "byteLength": len(values), "target": 34962,
              })
          # Rotate a real reconstructed RGB point cloud in any glTF viewer
          # supporting POINTS and animations. This is NOT dynamic 4D evidence.
          # Center the orbit on the measured cloud rather than world origin.
          checked_center = checked_positions.astype(np.float64).mean(axis=0).astype("<f4")
          # Include a standard perspective camera so viewers supporting glTF
          # cameras can frame the measured geometry without guessing a pose.
          # glTF -Z looks forward and the cloud already uses Y-up/Z-back.
          cloud_radius = float(np.linalg.norm(
              checked_positions.astype(np.float64) - checked_center, axis=1
          ).max())
          assert np.isfinite(cloud_radius) and cloud_radius > 0
          camera_distance = max(3.5 * cloud_radius, 1.0)
          camera_position = checked_center.astype(np.float64) + [
              0.0, 0.0, camera_distance
          ]
          camera_near = max(0.001, camera_distance * 0.0001)
          camera_far = camera_distance + 2.0 * cloud_radius + 1.0
          orbit_times = np.asarray([0, 2, 4, 6, 8], dtype="<f4")
          half_angles = np.arange(5, dtype=np.float64) * np.pi / 4
          orbit_rotations = np.zeros((5, 4), dtype="<f4")
          orbit_rotations[:, 1] = np.sin(half_angles)
          orbit_rotations[:, 3] = np.cos(half_angles)
          assert np.allclose(np.linalg.norm(orbit_rotations, axis=1), 1, atol=1e-6)
          for values in (orbit_times.tobytes(), orbit_rotations.tobytes()):
              offset = len(point_binary)
              point_binary.extend(values)
              point_binary.extend(b"\0" * (-len(point_binary) % 4))
              point_views.append({
                  "buffer": 0, "byteOffset": offset, "byteLength": len(values),
              })
          point_document = {
              "asset": {"version": "2.0", "generator": "WRE LR-checked real stereo CPU"},
              "scene": 0, "scenes": [{"nodes": [0, 2]}],
              "nodes": [
                  {"name": "RGB cloud orbit", "translation": checked_center.tolist(), "children": [1]},
                  {"mesh": 0, "name": "Two-view consistent RGB points",
                   "translation": (-checked_center).tolist()},
                  {"camera": 0, "name": "Static 3D cloud framing camera",
                   "translation": camera_position.tolist()},
              ],
              "cameras": [{"type": "perspective", "name": "3D cloud overview",
                           "perspective": {"yfov": float(np.pi / 3),
                                           "znear": camera_near, "zfar": camera_far}}],
              "animations": [{
                  "name": "Eight-second RGB point-cloud orbit (static scene)",
                  "samplers": [{"input": 2, "output": 3, "interpolation": "LINEAR"}],
                  "channels": [{"sampler": 0, "target": {"node": 0, "path": "rotation"}}],
              }],
              "meshes": [{"primitives": [{
                  "attributes": {"POSITION": 0, "COLOR_0": 1}, "material": 0, "mode": 0,
              }]}],
              "materials": [{
                  "name": "Observed RGB", "doubleSided": True,
                  "pbrMetallicRoughness": {"metallicFactor": 0, "roughnessFactor": 1},
                  "extensions": {"KHR_materials_unlit": {}},
              }],
              "extensionsUsed": ["KHR_materials_unlit"],
              "buffers": [{"byteLength": len(point_binary)}],
              "bufferViews": point_views,
              "accessors": [
                  {
                      "bufferView": 0, "componentType": 5126,
                      "count": len(checked_positions), "type": "VEC3",
                      "min": checked_positions.min(axis=0).tolist(),
                      "max": checked_positions.max(axis=0).tolist(),
                  },
                  {
                      "bufferView": 1, "componentType": 5121,
                      "count": len(checked_colors), "type": "VEC3", "normalized": True,
                  },
                  {
                      "bufferView": 2, "componentType": 5126,
                      "count": len(orbit_times), "type": "SCALAR",
                      "min": [0.0], "max": [8.0],
                  },
                  {
                      "bufferView": 3, "componentType": 5126,
                      "count": len(orbit_rotations), "type": "VEC4",
                  },
              ],
          }
          point_json = json.dumps(point_document, separators=(",", ":")).encode("utf-8")
          point_json += b" " * (-len(point_json) % 4)
          point_glb = (
              struct.pack("<4sII", b"glTF", 2, 12 + 8 + len(point_json) + 8 + len(point_binary))
              + struct.pack("<I4s", len(point_json), b"JSON") + point_json
              + struct.pack("<I4s", len(point_binary), b"BIN\0") + point_binary
          )
          checked_glb_path = output / checked_glb_name
          checked_glb_path.write_bytes(point_glb)
          readback = checked_glb_path.read_bytes()
          assert struct.unpack_from("<4sII", readback) == (b"glTF", 2, len(readback))
          json_size, kind = struct.unpack_from("<I4s", readback, 12)
          assert kind == b"JSON"
          parsed = json.loads(readback[20:20 + json_size])
          assert parsed["meshes"][0]["primitives"][0]["mode"] == 0
          assert parsed["accessors"][0]["count"] == len(checked_xyz)
          assert parsed["accessors"][1]["normalized"] is True
          assert parsed["nodes"][0]["children"] == [1]
          assert parsed["nodes"][1]["mesh"] == 0
          assert parsed["scenes"][0]["nodes"] == [0, 2]
          assert parsed["nodes"][2]["camera"] == 0
          assert parsed["cameras"][0]["type"] == "perspective"
          assert parsed["animations"][0]["channels"][0]["target"]["node"] == 0
          assert np.allclose(parsed["nodes"][2]["translation"], camera_position)
          assert parsed["nodes"][2]["translation"][2] > checked_center[2] + cloud_radius
          assert camera_near < camera_distance - cloud_radius
          assert camera_far > camera_distance + cloud_radius
          assert parsed["animations"][0]["samplers"] == [
              {"input": 2, "output": 3, "interpolation": "LINEAR"}
          ]
          assert parsed["animations"][0]["channels"][0]["target"] == {
              "node": 0, "path": "rotation"
          }
          assert parsed["accessors"][2]["count"] == len(orbit_times)
          assert parsed["accessors"][3]["count"] == len(orbit_rotations)
          assert np.allclose(
              np.asarray(parsed["nodes"][0]["translation"])
              + np.asarray(parsed["nodes"][1]["translation"]), 0, atol=1e-6
          )
          binary_start = 20 + json_size
          binary_size, kind = struct.unpack_from("<I4s", readback, binary_start)
          assert kind == b"BIN\0" and binary_start + 8 + binary_size == len(readback)
          actual_binary = readback[binary_start + 8:]
          for view, expected in zip(
              parsed["bufferViews"],
              (
                  checked_positions.tobytes(), checked_colors.tobytes(),
                  orbit_times.tobytes(), orbit_rotations.tobytes(),
              ),
          ):
              offset = view["byteOffset"]
              assert actual_binary[offset:offset + view["byteLength"]] == expected

          # Export the higher-consistency REAL RGB 3D cloud as a standalone glTF
          # POINTS preview. Reuse the existing checked-cloud viewer schema, camera
          # and static-scene orbit instead of implementing another serializer.
          quality_glb_name = "wre-real-stereo-cpu-photometric-consistent.glb"
          quality_positions = np.ascontiguousarray(quality_xyz, dtype="<f4")
          quality_positions[:, 1:] *= -1.0
          quality_colors = np.ascontiguousarray(quality_rgb, dtype="u1")
          assert quality_positions.shape == quality_colors.shape
          assert np.all(np.isfinite(quality_positions))
          quality_parts = (
              quality_positions.tobytes(), quality_colors.tobytes(),
              orbit_times.tobytes(), orbit_rotations.tobytes(),
          )
          quality_bin = bytearray()
          quality_views = []
          for index, blob in enumerate(quality_parts):
              view = {"buffer": 0, "byteOffset": len(quality_bin), "byteLength": len(blob)}
              if index < 2:
                  view["target"] = 34962
              quality_views.append(view)
              quality_bin.extend(blob)
              quality_bin.extend(b"\0" * (-len(quality_bin) % 4))
          quality_document = json.loads(json.dumps(point_document))
          quality_document["asset"]["generator"] = "WRE observed photo-consistent 3D"
          quality_document["nodes"][1]["name"] = "Photometric-consistent real-photo points"
          quality_document["bufferViews"] = quality_views
          quality_document["buffers"][0]["byteLength"] = len(quality_bin)
          quality_document["accessors"][0].update({
              "count": len(quality_positions),
              "min": quality_positions.min(axis=0).tolist(),
              "max": quality_positions.max(axis=0).tolist(),
          })
          quality_document["accessors"][1]["count"] = len(quality_colors)
          quality_json = json.dumps(quality_document, separators=(",", ":")).encode("utf-8")
          quality_json += b" " * (-len(quality_json) % 4)
          quality_glb_bytes = (
              struct.pack("<4sII", b"glTF", 2, 12 + 8 + len(quality_json) + 8 + len(quality_bin))
              + struct.pack("<I4s", len(quality_json), b"JSON") + quality_json
              + struct.pack("<I4s", len(quality_bin), b"BIN\0") + quality_bin
          )
          quality_glb_path = output / quality_glb_name
          quality_glb_path.write_bytes(quality_glb_bytes)
          quality_readback = quality_glb_path.read_bytes()
          assert struct.unpack_from("<4sII", quality_readback) == (
              b"glTF", 2, len(quality_readback)
          )
          quality_json_size, chunk_type = struct.unpack_from("<I4s", quality_readback, 12)
          assert chunk_type == b"JSON"
          quality_parsed = json.loads(quality_readback[20:20 + quality_json_size])
          assert quality_parsed["meshes"][0]["primitives"][0]["mode"] == 0
          assert quality_parsed["accessors"][0]["count"] == len(quality_xyz)
          assert quality_parsed["accessors"][1]["count"] == len(quality_rgb)
          assert quality_parsed["accessors"][1]["normalized"] is True
          q_offset = 20 + quality_json_size
          q_size, chunk_type = struct.unpack_from("<I4s", quality_readback, q_offset)
          assert chunk_type == b"BIN\0" and q_offset + 8 + q_size == len(quality_readback)
          quality_payload = quality_readback[q_offset + 8:]
          for view, expected in zip(quality_parsed["bufferViews"], quality_parts):
              offset = view["byteOffset"]
              assert quality_payload[offset:offset + view["byteLength"]] == expected

          # Render ACTUAL measured 3D mesh vertices/faces from a smoothly
          # moving virtual camera, rather than warping a flat photograph.
          # Use OpenCV's existing triangle fill and Pillow's animated GIF
          # writer. No custom native renderer, WebGL, CUDA or neural model.
          # Painter depth ordering is approximate at self-occlusions, so
          # this is a CPU geometry preview, NOT photorealistic 3DGS/4D.
          gif_name = "wre-real-stereo-cpu-3d-flythrough.gif"
          gif_size = (width // 2, height // 2)
          gif_focal = focal_guess * gif_size[0] / width
          triangles = np.asarray(faces, dtype=np.int32)
          painter_order = np.argsort(
              mesh_xyz[triangles, 2].mean(axis=1), kind="stable"
          )[::-1]  # Far to near.
          face_bgr = np.rint(mesh_rgb[triangles].mean(axis=1)[:, ::-1]).astype(np.uint8)
          camera_positions = np.linspace(-0.2, 0.8, 16)
          gif_frames = []
          measured_pixel_counts = []
          for camera_x in camera_positions:
              camera_vertices = mesh_xyz.copy()
              camera_vertices[:, 0] -= float(camera_x)
              assert np.all(camera_vertices[:, 2] > 0.0)
              projected = np.column_stack((
                  np.rint(
                      gif_focal * camera_vertices[:, 0] / camera_vertices[:, 2]
                      + (gif_size[0] - 1) / 2.0
                  ),
                  np.rint(
                      gif_focal * camera_vertices[:, 1] / camera_vertices[:, 2]
                      + (gif_size[1] - 1) / 2.0
                  ),
              )).astype(np.int32)
              frame = np.full((gif_size[1], gif_size[0], 3), (12, 12, 12), dtype=np.uint8)
              for face_index in painter_order:
                  cv2.fillConvexPoly(
                      frame, projected[triangles[face_index]],
                      tuple(int(v) for v in face_bgr[face_index]),
                      lineType=cv2.LINE_8,
                  )
              colored = int(np.count_nonzero(np.any(frame != 12, axis=2)))
              assert colored >= 100, "Real 3D mesh produced an empty orbit view"
              measured_pixel_counts.append(colored)
              gif_frames.append(Image.fromarray(cv2.cvtColor(frame, cv2.COLOR_BGR2RGB)))
          assert len(gif_frames) == 16
          assert not np.array_equal(np.asarray(gif_frames[0]), np.asarray(gif_frames[-1]))
          gif_path = output / gif_name
          gif_frames[0].save(
              gif_path, format="GIF", save_all=True,
              append_images=gif_frames[1:], duration=110, loop=0,
              optimize=False, disposal=2,
          )
          assert 100 < gif_path.stat().st_size < 8_000_000
          with Image.open(gif_path) as decoded_gif:
              assert decoded_gif.format == "GIF"
              assert decoded_gif.n_frames == 16
              assert decoded_gif.size == gif_size
              decoded_gif.seek(0)
              first_frame = decoded_gif.convert("RGB").tobytes()
              decoded_gif.seek(15)
              assert decoded_gif.convert("RGB").tobytes() != first_frame

          # Check the actual serialized OBJ/MTL/PNG bundle, not just in-memory counts.
          obj_lines = obj_path.read_text(encoding="ascii").splitlines()
          assert f"mtllib {mtl_name}" in obj_lines
          assert "usemtl wre_observed_left_photo" in obj_lines
          assert sum(line.startswith("v ") for line in obj_lines) == len(mesh_xyz)
          assert sum(line.startswith("vt ") for line in obj_lines) == len(uv)
          exported_faces = [line for line in obj_lines if line.startswith("f ")]
          assert len(exported_faces) == len(faces)
          for line, face in zip(exported_faces, faces):
              assert line.split()[1:] == [f"{index+1}/{index+1}" for index in face]
          assert f"map_Kd {texture_name}" in (output / mtl_name).read_text(encoding="ascii")

          # Functional 3D output beyond point export: project actual
          # photo-colored reconstructed XYZ from TWO UNOBSERVED camera positions.
          # Use nearest-Z per projected pixel; leave disocclusion holes black.
          # This is sparse CPU reprojection, not Gaussian/NeRF rendering.
          def project_sparse_view(camera_x):
              camera_xyz = xyz.copy()
              camera_xyz[:, 0] -= camera_x
              projected_x = np.rint(
                  focal_guess * camera_xyz[:, 0] / camera_xyz[:, 2] + principal_x
              ).astype(np.int32)
              projected_y = np.rint(
                  focal_guess * camera_xyz[:, 1] / camera_xyz[:, 2] + principal_y
              ).astype(np.int32)
              inside = (
                  (projected_x >= 0) & (projected_x < width)
                  & (projected_y >= 0) & (projected_y < height)
                  & (camera_xyz[:, 2] > 0)
              )
              assert int(inside.sum()) >= 500
              x_inside, y_inside = projected_x[inside], projected_y[inside]
              depth_inside = camera_xyz[inside, 2]
              # Select the nearest actual 3D point at each discrete pixel.
              flat_pixels = y_inside * width + x_inside
              ordered = np.lexsort((depth_inside, flat_pixels))
              _, first = np.unique(flat_pixels[ordered], return_index=True)
              nearest = ordered[first]
              preview = np.zeros((height, width, 3), dtype=np.uint8)
              preview[y_inside[nearest], x_inside[nearest]] = rgb[inside][nearest, ::-1]
              return preview, int(len(nearest))

          camera_shifts = (0.3, 0.7)  # arbitrary stereo-baseline gauge
          virtual_views = [project_sparse_view(shift) for shift in camera_shifts]
          assert all(count >= 300 for _, count in virtual_views)
          assert not np.array_equal(virtual_views[0][0], virtual_views[1][0])
          # Dense CPU forward projection from disparity at each OBSERVED
          # left-image pixel, rather than incorrectly sampling disparity at an
          # unobserved target pixel. Choose the closest source surface when
          # several samples land on one target pixel; leave holes black.
          # This remains stereo 2.5D, NOT Gaussian/4D rendering or inpainting.
          def warp_observed_pixels(camera_x):
              projected_x = np.rint(
                  np.where(valid, xx - camera_x * disparity, -1.0)
              ).astype(np.int32)
              inside = valid & (projected_x >= 0) & (projected_x < width)
              target_pixels = (
                  yy[inside].astype(np.int32) * width + projected_x[inside]
              )
              # Higher positive disparity means smaller positive depth.
              ordered = np.lexsort((-disparity[inside], target_pixels))
              _, first = np.unique(target_pixels[ordered], return_index=True)
              nearest = ordered[first]
              warped = np.zeros_like(left)
              warped.reshape(-1, 3)[target_pixels[nearest]] = left[inside][nearest]
              observed = np.zeros((height * width,), dtype=bool)
              observed[target_pixels[nearest]] = True
              return warped, int(len(nearest)), observed.reshape(height, width)

          dense_views = [warp_observed_pixels(shift) for shift in camera_shifts]
          assert all(count >= 500 for _, count, _ in dense_views)
          assert not np.array_equal(dense_views[0][0], dense_views[1][0])
          dense_preview = cv2.hconcat([
              left, dense_views[0][0], dense_views[1][0]
          ])
          dense_path = output / "wre-real-stereo-cpu-dense-warps.png"
          assert cv2.imwrite(str(dense_path), dense_preview)
          assert np.array_equal(cv2.imread(str(dense_path)), dense_preview)

          # Functional photometric camera fly-through from the *observed*
          # left photo and measured stereo disparity. Reuse the depth-aware
          # forward z-buffer above; every nonempty source pixel comes from
          # the photographed image, not a new Gaussian renderer or inpainting.
          # GIF palette quantization is display-only and is NOT source pixels.
          photo_gif_name = "wre-real-stereo-cpu-photo-flythrough.gif"
          photo_shifts = np.linspace(0.0, 1.0, 16)
          photo_frames = []
          photo_observed_counts = []
          for shift in photo_shifts:
              projected, count, mask = warp_observed_pixels(float(shift))
              assert int(mask.sum()) == count and count >= 500
              photo_observed_counts.append(count)
              reduced = cv2.resize(projected, gif_size, interpolation=cv2.INTER_NEAREST)
              photo_frames.append(Image.fromarray(cv2.cvtColor(reduced, cv2.COLOR_BGR2RGB)))
          assert len(photo_frames) == 16
          assert not np.array_equal(np.asarray(photo_frames[0]), np.asarray(photo_frames[-1]))
          photo_gif_path = output / photo_gif_name
          photo_frames[0].save(
              photo_gif_path, format="GIF", save_all=True,
              append_images=photo_frames[1:], duration=110, loop=0,
              optimize=False, disposal=2,
          )
          assert 100 < photo_gif_path.stat().st_size < 8_000_000
          with Image.open(photo_gif_path) as photo_gif:
              assert photo_gif.format == "GIF" and photo_gif.n_frames == 16
              assert photo_gif.size == gif_size
              photo_gif.seek(0)
              first_photo_frame = photo_gif.convert("RGB").tobytes()
              photo_gif.seek(15)
              assert photo_gif.convert("RGB").tobytes() != first_photo_frame

          # Two REAL observed photographs can fill more intermediate-view
          # pixels than the left source alone. Reuse native OpenCV SGBM with
          # its signed disparity interval reversed for the right camera.
          # Positive right disparity is x_left - x_right, so its observed
          # pixel projects to x_right + (1 - camera_x) * right_disparity.
          # Never synthesize unknown colors or overwrite visible left pixels.


          def warp_right_observed_pixels(camera_x):
              projected_x = np.rint(
                  np.where(right_valid, xx + (1.0 - camera_x) * right_disparity, -1.0)
              ).astype(np.int32)
              inside = right_valid & (projected_x >= 0) & (projected_x < width)
              target_pixels = yy[inside].astype(np.int32) * width + projected_x[inside]
              order = np.lexsort((-right_disparity[inside], target_pixels))
              _, first = np.unique(target_pixels[order], return_index=True)
              nearest = order[first]
              pixels = np.zeros_like(right)
              pixels.reshape(-1, 3)[target_pixels[nearest]] = right[inside][nearest]
              mask = np.zeros(height * width, dtype=bool)
              mask[target_pixels[nearest]] = True
              return pixels, mask.reshape(height, width)

          dual_gif_name = "wre-real-stereo-cpu-dual-photo-flythrough.gif"
          dual_frames = []
          dual_observed_counts = []
          dual_right_added_counts = []
          for shift in photo_shifts:
              left_frame, left_count, left_mask = warp_observed_pixels(float(shift))
              right_frame, right_mask = warp_right_observed_pixels(float(shift))
              from_right_only = right_mask & ~left_mask
              merged = left_frame.copy()
              merged[from_right_only] = right_frame[from_right_only]
              assert np.array_equal(merged[left_mask], left_frame[left_mask])
              added = int(from_right_only.sum())
              total = int((left_mask | right_mask).sum())
              assert total == left_count + added
              dual_right_added_counts.append(added)
              dual_observed_counts.append(total)
              reduced = cv2.resize(merged, gif_size, interpolation=cv2.INTER_NEAREST)
              dual_frames.append(Image.fromarray(cv2.cvtColor(reduced, cv2.COLOR_BGR2RGB)))
          assert len(dual_frames) == 16
          assert max(dual_right_added_counts) > 0
          assert all(
              dual >= left_only
              for dual, left_only in zip(dual_observed_counts, photo_observed_counts)
          )
          assert not np.array_equal(np.asarray(dual_frames[0]), np.asarray(dual_frames[-1]))
          dual_path = output / dual_gif_name
          dual_frames[0].save(
              dual_path, format="GIF", save_all=True,
              append_images=dual_frames[1:], duration=110, loop=0,
              optimize=False, disposal=2,
          )
          assert 100 < dual_path.stat().st_size < 8_000_000
          with Image.open(dual_path) as dual_gif:
              assert dual_gif.format == "GIF" and dual_gif.n_frames == 16
              assert dual_gif.size == gif_size
              dual_gif.seek(0)
              first_dual_frame = dual_gif.convert("RGB").tobytes()
              dual_gif.seek(15)
              assert dual_gif.convert("RGB").tobytes() != first_dual_frame

          # Measure a real reprojection at the observed right-camera baseline.
          # The right photo ALSO contributed to StereoSGBM: this is in-sample
          # photometric consistency, NOT an independent held-out quality score.
          right_projection, right_count, right_mask = warp_observed_pixels(1.0)
          assert right_count >= 500 and int(right_mask.sum()) == right_count
          per_pixel_error = np.mean(
              np.abs(right_projection.astype(np.int16) - right.astype(np.int16)),
              axis=2,
          )
          right_reprojection_mae = float(np.mean(per_pixel_error[right_mask]))
          assert np.isfinite(right_reprojection_mae) and 0 <= right_reprojection_mae <= 255
          error_image = cv2.applyColorMap(
              np.uint8(np.rint(per_pixel_error)), cv2.COLORMAP_TURBO
          )
          error_image[~right_mask] = 0  # Missing observations are not scored.
          comparison = cv2.hconcat([right, right_projection, error_image])
          comparison_path = output / "wre-real-stereo-cpu-right-reprojection.png"
          assert cv2.imwrite(str(comparison_path), comparison)
          assert np.array_equal(cv2.imread(str(comparison_path)), comparison)

          virtual_preview = cv2.hconcat([
              left, virtual_views[0][0], virtual_views[1][0]
          ])
          assert cv2.imwrite(
              str(Path(os.environ["RUNNER_TEMP"]) / "wre-real-stereo-cpu-novel-views.png"),
              virtual_preview,
          )
          normalized = np.uint8(np.clip(disparity / 128.0 * 255.0, 0, 255))
          disparity_preview = cv2.applyColorMap(normalized, cv2.COLORMAP_TURBO)
          disparity_preview[~valid] = 0
          assert cv2.imwrite(
              str(output / "wre-real-stereo-cpu-disparity.png"), disparity_preview
          )
          assert cv2.imwrite(
              str(output / "wre-real-stereo-cpu-photos.png"),
              cv2.hconcat([left, right]),
          )
          metrics = {
              "dataset": "Middlebury 2006 Aloe (OpenCV example photographs)",
              "source_commit": opencv_sha,
              "source_git_blobs": images,
              "original_photo_sha256": original_sha256,
              "original_photo_height_width": original_shape,
              "processed_photo_height_width": [height, width],
              "algorithm": f"OpenCV {cv2.__version__} StereoSGBM (runtime)",
              "calibrated_metric_depth": False,
              "baseline_model_units_arbitrary": baseline_gauge,
              "approximate_focal_pixels": focal_guess,
              "dense_disparity_float32_pfm": disparity_pfm,
              "dense_disparity_float32_pfm_sha256": hashlib.sha256(
                  (Path(os.environ["RUNNER_TEMP"]) / disparity_pfm).read_bytes()
              ).hexdigest(),
              "dense_disparity_uint16_png": disparity_u16_name,
              "dense_disparity_uint16_png_sha256": disparity_u16_sha256,
              "dense_disparity_uint16_units_per_pixel": 256,
              "dense_disparity_uint16_invalid_value": 0,
              "dense_disparity_uint16_metric_scale_known": False,
              "dense_depth_float32_pfm": depth_pfm,
              "dense_pfm_invalid_pixel_value": 0.0,
              "dense_depth_pfm_units": "arbitrary baseline=1, not metres",
              "dense_pfm_shape_height_width": [height, width],
              "dense_pfm_valid_pixels": int(valid.sum()),
              "disparity_valid_fraction": coverage,
              "left_right_consistency_tolerance_pixels": 2.0,
              "left_right_consistent_pixels": checked_count,
              "left_right_consistent_fraction_of_valid": checked_count / int(valid.sum()),
              "left_right_consistent_exported_points": int(len(checked_xyz)),
              "photo_consistent_3d_points": int(len(quality_xyz)),
              "dense_photo_consistent_binary_ply": dense_name,
              "dense_photo_consistent_points": dense_count,
              "dense_photo_consistent_selection": (
                  "all observed pixels with disparity L/R <=2px and RGB MAE <=8/255"
              ),
              "dense_photo_consistent_dtype": "binary_little_endian f32 xyz u8 RGB",
              "dense_photo_consistent_scale_metric": False,
              "dense_photo_consistent_gpu_training": False,
              "photo_consistent_glb": quality_glb_name,
              "photo_consistent_glb_is_dynamic_4d_scene": False,
              "photo_consistent_mae_threshold_rgb_0_255": photometric_limit,
              "photo_consistent_measured_mae_rgb_0_255": quality_mae,
              "photo_consistent_independent_depth_truth": False,
              "photo_consistent_physical_scale_calibrated": False,
              "left_right_consistent_glb": checked_glb_name,
              "left_right_consistent_glb_primitive": "glTF 2.0 POINTS (observed RGB)",
              "left_right_consistent_glb_animation": "8s node rotation around cloud centroid",
              "left_right_consistent_glb_animation_keyframes_seconds": orbit_times.tolist(),
              "left_right_consistent_glb_animation_is_scene_motion_4d": False,
              "left_right_consistent_glb_metric_depth_calibrated": False,
              "left_right_consistency_png": consistency_png.name,
              "left_right_consistency_is_independent_ground_truth": False,
              "median_disparity_pixels": float(np.median(disparity[valid])),
              "stereo_photometric_mae_0_255": photometric_mae,
              "exported_colored_3d_points": int(len(xyz)),
              "exported_surface_vertices": int(len(mesh_xyz)),
              "exported_surface_triangles": int(len(faces)),
              "exported_textured_obj_vertices": int(len(mesh_xyz)),
              "exported_textured_obj_uv": int(len(uv)),
