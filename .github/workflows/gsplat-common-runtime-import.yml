          observed_images = bytearray(struct.pack("<Q", 2))
          for image_id, (name, pixels, (quaternion, translation)) in enumerate(
              zip(sift_names, (p0, p1), recovered_poses, strict=True), 1
          ):
              observed_images.extend(struct.pack(
                  "<I4d3dI", image_id, *quaternion, *translation, 1
              ))
              observed_images.extend(name.encode("ascii") + b"\x00")
              observed_images.extend(struct.pack("<Q", len(xyz)))
              for index, (x, y) in enumerate(pixels, 1):
                  observed_images.extend(struct.pack(
                      "<ddq", float(x), float(y), index
                  ))
          (sift_sparse / "images.bin").write_bytes(observed_images)
          reconstructed_points = bytearray(struct.pack("<Q", len(xyz)))
          for index, (point, color, predicted0, predicted1, measured0, measured1) in enumerate(
              zip(xyz, rgb, uv0, uv1, p0, p1, strict=True)
          ):
              residual = float(np.sqrt(
                  (np.sum((predicted0 - measured0) ** 2)
                   + np.sum((predicted1 - measured1) ** 2)) / 2
              ))
              assert np.isfinite(residual) and residual < 20.0
              reconstructed_points.extend(struct.pack(
                  "<Q3d3BdQ", index + 1, *[float(v) for v in point],
                  *[int(v) for v in color], residual, 2,
              ))
              for image_id in (1, 2):
                  reconstructed_points.extend(struct.pack("<II", image_id, index))
          (sift_sparse / "points3D.bin").write_bytes(reconstructed_points)
          siftdataset_zip = root / "wre-real-stereo-sift-colmap-dataset.zip"
          with zipfile.ZipFile(siftdataset_zip, "w", zipfile.ZIP_DEFLATED) as archive:
              for pathname in sorted(sift_root.rglob("*")):
                  if pathname.is_file():
                      archive.write(pathname, pathname.relative_to(sift_root))
          with zipfile.ZipFile(siftdataset_zip) as archive:
              assert sorted(archive.namelist()) == sorted([
                  "images/" + name for name in sift_names
              ] + [
                  "sparse/0/cameras.bin", "sparse/0/images.bin",
                  "sparse/0/points3D.bin",
              ])
          handoff = {
              "real_photographs": True,
              "image_only_estimated_camera_poses": True,
              "registered_camera_count": 2,
              "registered_3d_tracks": len(xyz),
              "tracks_sha256": hashlib.sha256(track_path.read_bytes()).hexdigest(),
              "estimated_pose_sha256": tracks["estimated_pose_sha256"],
              "colmap_zip_sha256": hashlib.sha256(siftdataset_zip.read_bytes()).hexdigest(),
              "approximate_intrinsics": True,
              "metric_scale_known": False,
              "upstream_colmap_parser_execution": "pending_native_execution",
              "gpu_training_executed": False,
