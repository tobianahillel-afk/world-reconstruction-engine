name: gsplat-common-runtime-import

# One exact Python/Torch/CUDA environment for the pinned trainer's *eager imports*.
# CPU-hosted CUDA toolkit only: no GPU kernels, reconstruction, or training.
on:
  pull_request:
    paths:
      - ".github/workflows/gsplat-common-runtime-import.yml"
      - "registry/dependencies.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined-native-import:
    name: pinned-trainer-eager-import-one-native-environment-no-gpu
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda@sha256:da6791294b0b04d7e65d87b7451d6f2390b4d36225ab0701ee7dfec5769829f5
    timeout-minutes: 120
    env:
      CUDA_HOME: /usr/local/cuda
      TORCH_CUDA_ARCH_LIST: "7.5"
      MAX_JOBS: "1"
      PYTHONPATH: ""
      GSPLAT_REVISION: 937e29912570c372bed6747a5c9bf85fed877bae
      GSPLAT_TREE: 90c3f0b2352e6d2725bcba1ef0407168f922c0fa
      GLM_REVISION: 33b4a621a697a305bc3a7610d290677b96beb181
      GLM_TREE: e57f342f0fb63852d65e0da2090528fdca9b0117
      SSIM_REVISION: 328dc9836f513d00c4b5bc38fe30478b4435cbb5
      SSIM_TREE: ac5f1d8fe5d519f9c44b220d235bf1f198463da7
      NERFVIEW_REVISION: 4538024fe0d15fd1a0e4d760f3695fc44ca72787
      NERFVIEW_TREE: e333400e39605978a3d1f9cf6d73ddf577a8c8e3
      SCENE_MANAGER_REVISION: cc7ea4b7301720ac29287dbe450952511b32125e

    steps:
      - name: Checkout exact WRE dependency registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned uv and Python 3.10.21
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.10.21"
          enable-cache: false

      - name: Create one native environment and hash-pinned wheel manifest
        shell: bash
        run: |
          set -euo pipefail
          test -x "$CUDA_HOME/bin/nvcc"
          "$CUDA_HOME/bin/nvcc" --version | grep 'release 12.4,'
          uv venv --seed --python 3.10.21 "$RUNNER_TEMP/gsplat-common-venv"
          echo "COMMON_PYTHON=$RUNNER_TEMP/gsplat-common-venv/bin/python" >> "$GITHUB_ENV"
          uv run --no-project --with "pyyaml==6.0.2" python - <<'PY'
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlsplit
          import yaml

          record = yaml.safe_load(Path("registry/dependencies.yaml").read_text())[
              "dependencies"
          ]["gsplat_static_appearance"]["runtime_python_lock"]
          assert record["target"]["python"] == "3.10.21"
          assert record["target"]["torch_cuda"] == "12.4"
          assert record["gpu_execution_evidence"] is False
          wheels = record["packages"]
          assert len(wheels) == 76
          assert next(x for x in wheels if x["name"] == "torch")["version"] == "2.4.0+cu124"
          lines = []
          for item in sorted(wheels, key=lambda entry: entry["name"].lower()):
              url, digest = item["url"], item["sha256"]
              parts = urlsplit(url)
              assert parts.scheme == "https" and not parts.fragment
              assert re.fullmatch("[0-9a-f]{64}", digest)
              lines.append(f'{item["name"]} @ {url}#sha256={digest}')
          (Path(os.environ["RUNNER_TEMP"]) / "common-locked-wheels.txt").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          print(f"One common environment requires {len(wheels)} pinned wheels")
          PY

      - name: Install all 76 reviewed wheels without resolving new dependencies
        shell: bash
        run: |
          set -euo pipefail
          "$COMMON_PYTHON" -m pip install --no-index --no-deps --no-cache-dir \
            --require-hashes -r "$RUNNER_TEMP/common-locked-wheels.txt"
          "$COMMON_PYTHON" -m pip check
          "$COMMON_PYTHON" - <<'PY'
          import sys
          import numpy
          import torch
          assert sys.version.startswith("3.10.21")
          assert numpy.__version__ == "1.26.4"
          assert torch.__version__ == "2.4.0+cu124"
          assert torch.version.cuda == "12.4"
          assert not torch.cuda.is_available()
          print("Exact Python/Torch/CUDA wheel ABI loaded, GPU unavailable")
          PY

      - name: Install git for immutable upstream source checkout
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          # The pinned opencv-python wheel needs libGL.so.1 when COLMAP imports cv2.
          # CUDA's minimal container lacks OpenCV's GL and GLib/gthread libraries.
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates libgl1 libglib2.0-0

      - name: Materialize exact gsplat, fused-ssim, nerfview and legacy COLMAP sources
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/wre-common-upstream"
          mkdir -p "$root"
          fetch_exact() {
            name="$1"; remote="$2"; revision="$3"; tree="$4"
            git init -q "$root/$name"
            git -C "$root/$name" remote add origin "$remote"
            git -C "$root/$name" fetch --quiet --depth=1 origin "$revision"
            git -C "$root/$name" checkout --quiet --detach FETCH_HEAD
            test "$(git -C "$root/$name" rev-parse HEAD)" = "$revision"
            if test "$tree" != "-"; then
              test "$(git -C "$root/$name" rev-parse HEAD^{tree})" = "$tree"
            fi
          }
          fetch_exact gsplat https://github.com/nerfstudio-project/gsplat.git \
            "$GSPLAT_REVISION" "$GSPLAT_TREE"
          fetch_exact ssim https://github.com/rahul-goel/fused-ssim.git \
            "$SSIM_REVISION" "$SSIM_TREE"
          fetch_exact nerfview https://github.com/nerfstudio-project/nerfview.git \
            "$NERFVIEW_REVISION" "$NERFVIEW_TREE"
          fetch_exact scene-manager https://github.com/rmbrualla/pycolmap.git \
            "$SCENE_MANAGER_REVISION" "-"
          test "$(git -C "$root/gsplat" ls-tree HEAD gsplat/cuda/csrc/third_party/glm | awk '{print $3}')" = "$GLM_REVISION"
          git -C "$root/gsplat" submodule update --init --depth 1 -- gsplat/cuda/csrc/third_party/glm
          glm="$root/gsplat/gsplat/cuda/csrc/third_party/glm"
          test "$(git -C "$glm" rev-parse HEAD)" = "$GLM_REVISION"
          test "$(git -C "$glm" rev-parse HEAD^{tree})" = "$GLM_TREE"
          echo "COMMON_SOURCES=$root" >> "$GITHUB_ENV"

      - name: Build BOTH upstream CUDA extensions into the SAME Python interpreter
        shell: bash
        run: |
          set -euo pipefail
          export BUILD_NO_CUDA=0
          "$COMMON_PYTHON" -m pip install --no-deps --no-build-isolation --no-cache-dir \
            "$COMMON_SOURCES/ssim"
          "$COMMON_PYTHON" -m pip install --no-deps --no-build-isolation --no-cache-dir \
            "$COMMON_SOURCES/gsplat"
          # Install the exact selected nerfview checkout into site-packages.
          # The -I child in PR #234 does not insert this repo onto sys.path.
          "$COMMON_PYTHON" -m pip install --no-deps --no-build-isolation --no-cache-dir \
            "$COMMON_SOURCES/nerfview"
          # The isolated trainer child has only gsplat/examples on sys.path.
          # Install the exact historic SceneManager rather than masking a
          # missing dependency by inserting its source checkout into sys.path.
          "$COMMON_PYTHON" -m pip install --no-deps --no-build-isolation --no-cache-dir \
            "$COMMON_SOURCES/scene-manager"

      - name: Actually import trainer, native extensions, viewer and COLMAP together
        shell: bash
        run: |
          set -euo pipefail
          "$COMMON_PYTHON" -I - <<'PY'
          import os
          import sys
          from pathlib import Path

          root = Path(os.environ["COMMON_SOURCES"])
          # Mirror PR #234: -I adds only the immutable trainer examples path.
          sys.path.insert(0, str(root / "gsplat" / "examples"))
          import torch
          import gsplat
          from gsplat.cuda._backend import _C
          from fused_ssim import fused_ssim
          from nerfview import CameraState
          import pycolmap
          from pycolmap import SceneManager
          from datasets.colmap import Dataset, Parser
          from simple_trainer import Config, main

          assert gsplat.__version__ == "1.5.3"
          assert torch.__version__ == "2.4.0+cu124"
          assert not torch.cuda.is_available(), "CPU-hosted gate must not claim GPU"
          assert _C is not None and callable(fused_ssim)
          assert all(obj is not None for obj in (CameraState, SceneManager, Dataset, Parser, main))
          assert Path(pycolmap.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          cfg = Config()
          assert cfg.camera_model == "pinhole"
          print("ALL selected trainer native/viewer/COLMAP modules imported together.")
          print("No CUDA kernel, training, reconstruction, or GPU was executed.")
          PY

      - name: Decode a real 3-view COLMAP binary dataset with the pinned trainer (CPU)
        shell: bash
        run: |
          set -euo pipefail
          "$COMMON_PYTHON" -I - <<'PY'
          import os
          import struct
          import sys
          import tempfile
          from pathlib import Path

          import numpy as np
          import torch
          from PIL import Image

          # Same -I and single source path as the real external trainer child.
          root = Path(os.environ["COMMON_SOURCES"])
          sys.path.insert(0, str(root / "gsplat" / "examples"))
          from datasets.colmap import Dataset, Parser

          # These are valid COLMAP binary records (not WRE's placeholder bytes).
          # Real 3D reference fixture: four colored 3D points, three RGB views,
          # twelve geometrically consistent 2D observations and three COLMAP
          # binary files. No new SfM solver or artificial parser replacement.
          from pycolmap import SceneManager
          
          points = (
              (1, (-0.4, -0.3, 2.0), (255, 64, 64)),
              (2, (0.4, -0.3, 2.0), (64, 255, 64)),
              (3, (-0.4, 0.3, 2.0), (64, 64, 255)),
              (4, (0.4, 0.3, 2.0), (255, 255, 64)),
          )
          with tempfile.TemporaryDirectory(prefix="wre-colmap-cpu-", dir=os.environ["RUNNER_TEMP"]) as temp:
              dataset = Path(temp)
              photos = dataset / "images"
              sparse = dataset / "sparse" / "0"
              photos.mkdir()
              sparse.mkdir(parents=True)
          
              (sparse / "cameras.bin").write_bytes(
                  struct.pack("<Q", 1)
                  + struct.pack("<IiQQ4d", 1, 1, 4, 4, 4.0, 4.0, 2.0, 2.0)
              )
              images_bin = bytearray(struct.pack("<Q", 3))
              preview = Image.new("RGB", (12, 4))
              for image_id in range(1, 4):
                  name = f"frame-{image_id:02d}.png"
                  tx = (2 - image_id) * 0.2
                  pixels = np.full((4, 4, 3), 12, dtype=np.uint8)
                  images_bin.extend(
                      struct.pack("<I4d3dI", image_id, 1.0, 0.0, 0.0, 0.0, tx, 0.0, 0.0, 1)
                  )
                  images_bin.extend(name.encode("ascii") + b"\x00")
                  images_bin.extend(struct.pack("<Q", len(points)))
                  for point_id, (x, y, z), rgb in points:
                      u, v = 4.0 * (x + tx) / z + 2.0, 4.0 * y / z + 2.0
                      images_bin.extend(struct.pack("<ddq", u, v, point_id))
                      pixels[int(round(v)), int(round(u))] = rgb
                  Image.fromarray(pixels).save(photos / name)
                  preview.paste(Image.fromarray(pixels), ((image_id - 1) * 4, 0))
              (sparse / "images.bin").write_bytes(images_bin)
              preview.save(Path(os.environ["RUNNER_TEMP"]) / "wre-colmap-cpu-views.png")
          
              point_bin = bytearray(struct.pack("<Q", len(points)))
              for point_index, (point_id, xyz, rgb) in enumerate(points):
                  point_bin.extend(struct.pack("<Q3d3BdQ", point_id, *xyz, *rgb, 0.01, 3))
                  for image_id in range(1, 4):
                      point_bin.extend(struct.pack("<II", image_id, point_index))
              (sparse / "points3D.bin").write_bytes(point_bin)
          
              # Decode through the real pinned gsplat/legacy COLMAP sources.
              parsed = Parser(str(dataset), factor=1, normalize=False, test_every=8)
              training = Dataset(parsed, split="train")
              testing = Dataset(parsed, split="test")
              assert parsed.image_names == [
                  "frame-01.png", "frame-02.png", "frame-03.png"
              ]
              assert parsed.points.shape == (4, 3)
              assert len(training) == 2 and len(testing) == 1
              for batch in (training[0], training[1], testing[0]):
                  assert isinstance(batch["image"], torch.Tensor)
                  assert batch["image"].shape == (4, 4, 3)
                  assert batch["image"].device.type == "cpu"
                  assert batch["K"].shape == (3, 3)
                  assert batch["camtoworld"].shape == (4, 4)
                  assert torch.isfinite(batch["K"]).all()
                  assert torch.isfinite(batch["camtoworld"]).all()
          
              # Use the actual decoded 2D observations, 3D points and camera
              # matrices to measure geometric reprojection accuracy in pixels.
              decoded = SceneManager(str(sparse))
              decoded.load_cameras()
              decoded.load_images()
              decoded.load_points3D()

              # Exercise the pinned upstream Dataset's native sparse-depth
              # generation, not only WRE's own point-cloud reprojection.
              train_depths = Dataset(parsed, split="train", load_depths=True)
              test_depths = Dataset(parsed, split="test", load_depths=True)
              batches = (test_depths[0], train_depths[0], train_depths[1])
              upstream_depth_errors = []
              upstream_depth_samples = 0
              for index, batch in enumerate(batches):
                  name = parsed.image_names[index]
                  original = decoded.images[decoded.name_to_image_id[name]]
                  predicted = np.asarray(batch["points"], dtype=np.float64)
                  observed = np.asarray(original.points2D, dtype=np.float64)
                  depths = np.asarray(batch["depths"], dtype=np.float64)
                  assert predicted.shape == observed.shape == (4, 2)
                  assert depths.shape == (4,)
                  assert np.all(np.isfinite(predicted))
                  assert np.all(np.isfinite(depths))
                  assert np.allclose(depths, 2.0, rtol=0, atol=1e-6)
                  # Comparing sorted coordinates avoids assuming matching
                  # iteration order between legacy SceneManager and Dataset.
                  projected_ordered = np.array(sorted(map(tuple, predicted)))
                  observed_ordered = np.array(sorted(map(tuple, observed)))
                  upstream_depth_errors.extend(
                      np.linalg.norm(projected_ordered - observed_ordered, axis=1)
                  )
                  upstream_depth_samples += len(depths)
              upstream_depth_rmse = float(
                  np.sqrt(np.mean(np.square(upstream_depth_errors)))
              )
              assert upstream_depth_samples == 12
              assert upstream_depth_rmse < 1e-5, upstream_depth_rmse
              residuals = []
              for image_index, name in enumerate(parsed.image_names):
                  image = decoded.images[decoded.name_to_image_id[name]]
                  K = parsed.Ks_dict[parsed.camera_ids[image_index]]
                  world_to_camera = np.linalg.inv(parsed.camtoworlds[image_index])
                  for observed_xy, point_id in zip(image.points2D, image.point3D_ids):
                      point_index = decoded.point3D_id_to_point3D_idx[point_id]
                      xyz = decoded.points3D[point_index]
                      position = world_to_camera[:3, :3] @ xyz + world_to_camera[:3, 3]
                      assert position[2] > 0.0
                      pixel = (K @ position)[:2] / position[2]
                      residuals.append(float(np.linalg.norm(pixel - observed_xy)))
              assert len(residuals) == 12
              rmse = float(np.sqrt(np.mean(np.square(residuals))))
              assert np.isfinite(rmse) and rmse < 1e-6, rmse
          
              # Reconstruct 3D positions from the *decoded 2D observations*
              # of two camera views. This is a real two-view linear triangulation
              # using pinned NumPy SVD; the COLMAP XYZ positions serve only as
              # independent ground-truth checks, not inputs to triangulation.
              projections = [
                  parsed.Ks_dict[parsed.camera_ids[index]]
                  @ np.linalg.inv(parsed.camtoworlds[index])[:3, :]
                  for index in range(3)
              ]
              measured_tracks = []
              for name in parsed.image_names:
                  view = decoded.images[decoded.name_to_image_id[name]]
                  measured_tracks.append(
                      {
                          int(point_id): np.asarray(xy, dtype=np.float64)
                          for xy, point_id in zip(view.points2D, view.point3D_ids)
                          if int(point_id) >= 0
                      }
                  )
              shared_ids = sorted(set(measured_tracks[0]) & set(measured_tracks[1]))
              assert len(shared_ids) == len(decoded.points3D) == 4
              assert all(point_id in measured_tracks[2] for point_id in shared_ids)
              sample_image = np.asarray(Image.open(photos / parsed.image_names[0]).convert("RGB"))
              triangulated = []
              xyz_errors = []
              heldout_errors = []
              for point_id in shared_ids:
                  u0, v0 = measured_tracks[0][point_id]
                  u1, v1 = measured_tracks[1][point_id]
                  P0, P1, P2 = projections
                  design = np.stack(
                      (
                          u0 * P0[2] - P0[0],
                          v0 * P0[2] - P0[1],
                          u1 * P1[2] - P1[0],
                          v1 * P1[2] - P1[1],
                      )
                  )
                  # Solve the homogeneous DLT system, not an ad-hoc ray solver.
                  _u, _singular_values, vh = np.linalg.svd(design)
                  homogeneous = vh[-1]
                  assert abs(homogeneous[3]) > 1e-12
                  estimate = homogeneous[:3] / homogeneous[3]
                  expected = decoded.points3D[
                      decoded.point3D_id_to_point3D_idx[point_id]
                  ]
                  xyz_errors.append(float(np.linalg.norm(estimate - expected)))
                  camera_xyz = P2 @ np.append(estimate, 1.0)
                  assert camera_xyz[2] > 0.0
                  heldout_pixel = camera_xyz[:2] / camera_xyz[2]
                  heldout_errors.append(
                      float(np.linalg.norm(heldout_pixel - measured_tracks[2][point_id]))
                  )
                  source_pixel = measured_tracks[0][point_id]
                  pixel_x, pixel_y = (int(round(float(v))) for v in source_pixel)
                  assert 0 <= pixel_x < sample_image.shape[1]
                  assert 0 <= pixel_y < sample_image.shape[0]
                  color = sample_image[pixel_y, pixel_x]
                  assert np.array_equal(
                      color,
                      decoded.point3D_colors[decoded.point3D_id_to_point3D_idx[point_id]],
                  )
                  triangulated.append((estimate, color))
              triangulation_xyz_rmse = float(
                  np.sqrt(np.mean(np.square(xyz_errors, dtype=np.float64)))
              )
              triangulation_heldout_rmse = float(
                  np.sqrt(np.mean(np.square(heldout_errors, dtype=np.float64)))
              )
              assert triangulation_xyz_rmse < 1e-6, triangulation_xyz_rmse
              assert triangulation_heldout_rmse < 1e-6, triangulation_heldout_rmse
              triangulated_ply = (
                  Path(os.environ["RUNNER_TEMP"]) / "wre-colmap-cpu-triangulated.ply"
              )
              triangulated_header = (
                  "ply\nformat ascii 1.0\n"
                  f"element vertex {len(triangulated)}\n"
                  "property float x\nproperty float y\nproperty float z\n"
                  "property uchar red\nproperty uchar green\nproperty uchar blue\n"
                  "end_header\n"
              )
              triangulated_lines = [
                  f"{xyz[0]:.9g} {xyz[1]:.9g} {xyz[2]:.9g} "
                  f"{int(rgb[0])} {int(rgb[1])} {int(rgb[2])}"
                  for xyz, rgb in triangulated
              ]
              triangulated_ply.write_text(
                  triangulated_header + "\n".join(triangulated_lines) + "\n",
                  encoding="ascii",
              )

              # A genuine, standards-compliant sparse *point-cloud* PLY for
              # external 3D viewers. This is NOT a trained Gaussian splat PLY.
              preview_ply = Path(os.environ["RUNNER_TEMP"]) / "wre-colmap-cpu-preview.ply"
              header = (
                  "ply\nformat ascii 1.0\n"
                  f"element vertex {len(decoded.points3D)}\n"
                  "property float x\nproperty float y\nproperty float z\n"
                  "property uchar red\nproperty uchar green\nproperty uchar blue\n"
                  "end_header\n"
              )
              lines = [
                  f"{xyz[0]:.9g} {xyz[1]:.9g} {xyz[2]:.9g} "
                  f"{int(rgb[0])} {int(rgb[1])} {int(rgb[2])}"
                  for xyz, rgb in zip(decoded.points3D, decoded.point3D_colors)
              ]
              preview_ply.write_text(header + "\n".join(lines) + "\n", encoding="ascii")
          
              # Functional CPU-only point-cloud projection: decode the
              # camera matrices and 3D colors, z-buffer into each 4x4 view,
              # then compare the projected RGB image against the real PNGs.
              # This is a sparse geometry renderer, NOT Gaussian splatting.
              render_strip = np.zeros((4, 12, 3), dtype=np.uint8)
              depth_strip = np.zeros((4, 12), dtype=np.float32)
              all_rgb_errors = []
              drawn_samples = 0
              for image_index, name in enumerate(parsed.image_names):
                  frame = np.full((4, 4, 3), 12, dtype=np.uint8)
                  depth = np.full((4, 4), np.inf, dtype=np.float32)
                  K = parsed.Ks_dict[parsed.camera_ids[image_index]]
                  world_to_camera = np.linalg.inv(parsed.camtoworlds[image_index])
                  for xyz, rgb in zip(decoded.points3D, decoded.point3D_colors):
                      position = world_to_camera[:3, :3] @ xyz + world_to_camera[:3, 3]
                      if position[2] <= 0:
                          continue
                      projected = K @ position
                      u, v = (int(round(float(v))) for v in projected[:2] / position[2])
                      if 0 <= u < 4 and 0 <= v < 4 and position[2] <= depth[v, u]:
                          frame[v, u] = rgb
                          depth[v, u] = position[2]
                          drawn_samples += 1
                  observed = np.asarray(Image.open(photos / name).convert("RGB"))
                  assert observed.shape == frame.shape
                  all_rgb_errors.extend((frame.astype(np.int16) - observed.astype(np.int16)).ravel())
                  x = image_index * 4
                  render_strip[:, x : x + 4] = frame
                  depth_strip[:, x : x + 4] = np.where(np.isfinite(depth), depth, 0.0)
              assert drawn_samples == 12, drawn_samples
              sparse_rgb_rmse = float(np.sqrt(np.mean(np.square(all_rgb_errors, dtype=np.float64))))
              assert sparse_rgb_rmse == 0.0, sparse_rgb_rmse
              # Upscaled nearest-neighbor PNGs are genuinely viewable without
              # adding a viewer framework or downloading JavaScript packages.
              Image.fromarray(render_strip).resize(
                  (768, 256), resample=Image.Resampling.NEAREST
              ).save(Path(os.environ["RUNNER_TEMP"]) / "wre-colmap-cpu-render.png")
              depth_shades = np.where(
                  depth_strip > 0.0,
                  np.clip(255.0 - depth_strip * 50.0, 0.0, 255.0),
                  0.0,
              ).astype(np.uint8)
              Image.fromarray(depth_shades).resize(
                  (768, 256), resample=Image.Resampling.NEAREST
              ).save(Path(os.environ["RUNNER_TEMP"]) / "wre-colmap-cpu-depth.png")
              np.save(Path(os.environ["RUNNER_TEMP"]) / "wre-colmap-cpu-depth.npy", depth_strip)

              import json
              report = {
                  "source": "actual pinned COLMAP Parser and SceneManager",
                  "registered_views": len(parsed.image_names),
                  "sparse_points": len(decoded.points3D),
                  "reprojection_observations": len(residuals),
                  "reprojection_rmse_px": rmse,
                  "upstream_sparse_depth_rmse_px": upstream_depth_rmse,
                  "upstream_sparse_depth_samples": upstream_depth_samples,
                  "two_view_triangulated_points": len(triangulated),
                  "two_view_xyz_rmse_model_units": triangulation_xyz_rmse,
                  "third_view_heldout_reprojection_rmse_px": triangulation_heldout_rmse,
                  "triangulated_colors_sampled_from_png": True,
                  "two_view_correspondences_provided": True,
                  "real_sfm_feature_matching": False,
                  "cpu_sparse_render_rgb_rmse": sparse_rgb_rmse,
                  "cpu_sparse_render_projected_samples": drawn_samples,
                  "cpu_sparse_depth_unit": "COLMAP model distance",
                  "real_cuda_execution": False,
                  "real_gaussian_training": False,
              }
              (Path(os.environ["RUNNER_TEMP"]) / "wre-colmap-cpu-metrics.json").write_text(
                  json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
              )
              print("COLMAP real 3D PLY and CPU RGB/depth reprojection previews generated.")
              print(f"Measured CPU reprojection RMSE: {rmse:.9f} pixels, 12 observations.")
              print(f"gsplat Dataset(load_depths=True): {upstream_depth_samples} CPU depths, RMS={upstream_depth_rmse:.9f} pixels.")
              print(f"Rendered 3-view RGB RMSE: {sparse_rgb_rmse:.9f}, {drawn_samples} projected samples.")
              print(f"Two-view triangulation: {len(triangulated)} RGB points, XYZ RMS={triangulation_xyz_rmse:.9g} model units.")
              print(f"Third-view held-out reprojection RMS={triangulation_heldout_rmse:.9g} pixels.")
              print("No CUDA kernels, Gaussian reconstruction or GPU training occurred.")
          PY
          
      - name: Detect image features, match three views and triangulate CPU geometry
        shell: bash
        run: |
          set -euo pipefail
          "$COMMON_PYTHON" - <<'PY'
          import json
          import os
          import struct
          import sys
          import zipfile
          from pathlib import Path

          import cv2
          import numpy as np
          import torch
          from scipy.spatial.transform import Rotation

          # One deterministic, textured synthetic two-depth scene. Matching is
          # performed on REAL image pixels using pinned OpenCV SIFT/knnMatch.
          # No ground-truth 2D track IDs or 3D points enter triangulatePoints.
          rng = np.random.default_rng(20261016)
          texture = rng.integers(0, 256, size=(240, 360, 3), dtype=np.uint8)
          views = []
          output = Path(os.environ["RUNNER_TEMP"])
          for view_index in range(3):
              rgb = np.empty((240, 320, 3), dtype=np.uint8)
              rgb[:120] = texture[:120, 14 * view_index : 320 + 14 * view_index]
              rgb[120:] = texture[120:, 7 * view_index : 320 + 7 * view_index]
              views.append(rgb)
              assert cv2.imwrite(str(output / f"wre-sift-cpu-view-{view_index}.png"), rgb)

          sift = cv2.SIFT_create(nfeatures=700, contrastThreshold=0.02)
          features = [
              sift.detectAndCompute(cv2.cvtColor(image, cv2.COLOR_BGR2GRAY), None)
              for image in views
          ]
          assert all(descriptor is not None for _, descriptor in features)
          matcher = cv2.BFMatcher(cv2.NORM_L2)
          correspondences = []
          for view_index in (1, 2):
              good_matches = {}
              for candidate, runner_up in matcher.knnMatch(
                  features[0][1], features[view_index][1], k=2
              ):
                  if candidate.distance >= 0.7 * runner_up.distance:
                      continue
                  point0 = features[0][0][candidate.queryIdx].pt
                  point1 = features[view_index][0][candidate.trainIdx].pt
                  # Calibrated parallel camera rig: matching image rows and
                  # positive left-right disparity. These are NOT supplied tracks.
                  if (
                      abs(point0[1] - point1[1]) < 1.0
                      and abs(point0[1] - 120.0) > 14.0
                      and 2.0 < point0[0] - point1[0] < 60.0
                  ):
                      good_matches[candidate.queryIdx] = candidate
              correspondences.append(good_matches)

          shared = sorted(set(correspondences[0]) & set(correspondences[1]))
          assert len(shared) >= 60, f"Only {len(shared)} three-view SIFT tracks"
          points0 = np.asarray(
              [features[0][0][idx].pt for idx in shared], dtype=np.float64
          )
          points1 = np.asarray(
              [features[1][0][correspondences[0][idx].trainIdx].pt for idx in shared],
              dtype=np.float64,
          )
          observed_third = np.asarray(
              [features[2][0][correspondences[1][idx].trainIdx].pt for idx in shared],
              dtype=np.float64,
          )
          focal, baseline = 210.0, 0.2
          intrinsic = np.array(
              [[focal, 0.0, 160.0], [0.0, focal, 120.0], [0.0, 0.0, 1.0]]
          )

          # New functional route: estimate the relative camera pose from the
          # matched image pixels. The solver sees ONLY image points and known
          # intrinsics, NOT reference poses, baselines or 3D ground truth.
          # OpenCV's 5-point essential matrix + RANSAC + cheirality reuse the
          # existing pinned native solver; monocular scale is unobservable.
          cv2.setRNGSeed(20261016)
          essential, ransac_mask = cv2.findEssentialMat(
              points0, points1, intrinsic,
              method=cv2.RANSAC, prob=0.999, threshold=0.5,
          )
          assert essential is not None and essential.shape == (3, 3)
          recovered_count, recovered_rotation, recovered_translation, pose_mask = (
              cv2.recoverPose(
                  essential, points0, points1, intrinsic, mask=ransac_mask
              )
          )
          inlier = pose_mask.reshape(-1) != 0
          assert recovered_count == int(inlier.sum()) >= 60
          angle_rad = float(np.arccos(np.clip(
              (np.trace(recovered_rotation) - 1.0) / 2.0, -1.0, 1.0
          )))
          # Only sanity checks use the synthetic fixture's expected direction,
          # never the pose estimator or its triangulation.
          assert angle_rad < 0.08, angle_rad
          assert recovered_translation[0, 0] < -0.9
          assert abs(recovered_translation[1, 0]) < 0.20
          assert abs(recovered_translation[2, 0]) < 0.20

          estimated_projection0 = intrinsic @ np.column_stack(
              (np.eye(3), np.zeros(3))
          )
          estimated_projection1 = intrinsic @ np.column_stack(
              (recovered_rotation, recovered_translation)
          )
          pose_homogeneous = cv2.triangulatePoints(
              estimated_projection0, estimated_projection1,
              points0[inlier].T, points1[inlier].T,
          )
          pose_xyz = (pose_homogeneous[:3] / pose_homogeneous[3]).T
          assert np.all(np.isfinite(pose_xyz))
          assert np.all(pose_xyz[:, 2] > 0)
          upper_inliers = points0[inlier, 1] < 120.0
          lower_inliers = points0[inlier, 1] > 120.0
          assert int(upper_inliers.sum()) >= 15
          assert int(lower_inliers.sum()) >= 15
          depth_ratio = float(
              np.median(pose_xyz[lower_inliers, 2])
              / np.median(pose_xyz[upper_inliers, 2])
          )
          assert 1.8 < depth_ratio < 2.2, depth_ratio

          def image_reprojection(projection, coordinates):
              projected = projection @ np.column_stack(
                  (coordinates, np.ones(len(coordinates)))
              ).T
              return (projected[:2] / projected[2]).T

          pose_rmse = float(np.sqrt(np.mean(
              (
                  np.sum(
                      np.square(
                          image_reprojection(estimated_projection0, pose_xyz)
                          - points0[inlier]
                      ), axis=1,
                  )
                  + np.sum(
                      np.square(
                          image_reprojection(estimated_projection1, pose_xyz)
                          - points1[inlier]
                      ), axis=1,
                  )
              ) / 2.0
          )))
          assert pose_rmse < 0.30, pose_rmse

          # Register a THIRD camera against the estimated 3D, with only
          # SIFT image observations and known K. Neither a reference camera
          # pose nor the scene baseline is passed into this PnP solver.
          cv2.setRNGSeed(20261016)
          pnp_ok, pnp_rotation_vector, pnp_translation, pnp_inliers = (
              cv2.solvePnPRansac(
                  np.ascontiguousarray(pose_xyz, dtype=np.float64),
                  np.ascontiguousarray(observed_third[inlier], dtype=np.float64),
                  intrinsic, None,
                  iterationsCount=500,
                  reprojectionError=1.0,
                  confidence=0.999,
                  flags=cv2.SOLVEPNP_EPNP,
              )
          )
          assert pnp_ok and pnp_inliers is not None
          assert len(pnp_inliers) >= 50, len(pnp_inliers)
          pnp_rotation, _ = cv2.Rodrigues(pnp_rotation_vector)
          pnp_projection = intrinsic @ np.column_stack(
              (pnp_rotation, pnp_translation)
          )
          local_ids = pnp_inliers.reshape(-1)
          predicted_third = image_reprojection(
              pnp_projection, pose_xyz[local_ids]
          )
          measured_third = observed_third[inlier][local_ids]
          pnp_rmse = float(np.sqrt(np.mean(
              np.sum(np.square(predicted_third - measured_third), axis=1)
          )))
          assert pnp_rmse < 0.50, pnp_rmse
          assert np.all(np.isfinite(pnp_rotation))
          assert np.all(np.isfinite(pnp_translation))
          # The unscaled two-view baseline is one length unit by convention.
          # All recovered camera translations share that SAME arbitrary gauge.
          assert 1.5 < float(np.linalg.norm(pnp_translation)) < 2.5

          estimated_cameras = {
              "source": "actual three-view SIFT image correspondences",
              "intrinsic_matrix": intrinsic.tolist(),
              "scale": "arbitrary; no metric ground truth was supplied",
              "world_to_camera": [
                  {"image": 0, "rotation": np.eye(3).tolist(),
                   "translation": [0.0, 0.0, 0.0]},
                  {"image": 1, "rotation": recovered_rotation.tolist(),
                   "translation": recovered_translation.reshape(-1).tolist()},
                  {"image": 2, "rotation": pnp_rotation.tolist(),
                   "translation": pnp_translation.reshape(-1).tolist()},
              ],
              "third_view_pnp_inliers": int(len(pnp_inliers)),
              "third_view_pnp_reprojection_rmse_px": pnp_rmse,
              "true_cuda_execution": False,
          }
          (output / "wre-sift-cpu-estimated-cameras.json").write_text(
              json.dumps(estimated_cameras, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          # FUNCTIONAL HANDOFF: take SIFT + EssentialMat + PnP estimates
          # and construct a real standard COLMAP dataset, then round-trip it
          # through the pinned gsplat Parser and Dataset. No supplied 3D
          # ground-truth xyz or camera extrinsics enter these binary files.
          from datasets.colmap import Dataset, Parser

          estimated_root = output / "wre-sift-estimated-colmap"
          estimated_images = estimated_root / "images"
          estimated_sparse = estimated_root / "sparse" / "0"
          estimated_images.mkdir(parents=True)
          estimated_sparse.mkdir(parents=True)
          selected = np.asarray(local_ids, dtype=np.int64)
          reconstructed = np.ascontiguousarray(pose_xyz[selected], dtype=np.float64)
          observed = [
              points0[inlier][selected],
              points1[inlier][selected],
              observed_third[inlier][selected],
          ]
          estimated_poses = [
              (np.eye(3), np.zeros(3)),
              (recovered_rotation, recovered_translation.reshape(3)),
              (pnp_rotation, pnp_translation.reshape(3)),
          ]
          assert len(reconstructed) >= 50
          assert np.all(np.isfinite(reconstructed))
          for rotation, translation in estimated_poses:
              depths = (rotation @ reconstructed.T + translation.reshape(3, 1))[2]
              assert np.all(depths > 0.0), "Invalid estimated COLMAP cheirality"

          # PINHOLE model id 1; COLMAP binary record layout reused from the
          # already exercised three-view fixture earlier in this workflow.
          (estimated_sparse / "cameras.bin").write_bytes(
              struct.pack("<Q", 1)
              + struct.pack(
                  "<IiQQ4d", 1, 1, 320, 240,
                  float(intrinsic[0, 0]), float(intrinsic[1, 1]),
                  float(intrinsic[0, 2]), float(intrinsic[1, 2]),
              )
          )
          observations_bin = bytearray(struct.pack("<Q", 3))
          colors = []
          for local, position in enumerate(observed[0]):
              x, y = (int(round(float(v))) for v in position)
              assert 0 <= x < 320 and 0 <= y < 240
              bgr = views[0][y, x]
              colors.append((int(bgr[2]), int(bgr[1]), int(bgr[0])))
          for view_index, ((rotation, translation), pixels) in enumerate(
              zip(estimated_poses, observed), start=1
          ):
              q_xyzw = Rotation.from_matrix(rotation).as_quat()
              q_wxyz = (
                  float(q_xyzw[3]), float(q_xyzw[0]),
                  float(q_xyzw[1]), float(q_xyzw[2]),
              )
              image_name = f"estimated-{view_index:02d}.png"
              assert cv2.imwrite(str(estimated_images / image_name), views[view_index - 1])
              observations_bin.extend(
                  struct.pack(
                      "<I4d3dI", view_index, *q_wxyz,
                      *[float(value) for value in translation], 1,
                  )
              )
              observations_bin.extend(image_name.encode("ascii") + b"\x00")
              observations_bin.extend(struct.pack("<Q", len(reconstructed)))
              for point_index, pixel in enumerate(pixels):
                  observations_bin.extend(
                      struct.pack(
                          "<ddq", float(pixel[0]), float(pixel[1]), point_index + 1,
                      )
                  )
          (estimated_sparse / "images.bin").write_bytes(observations_bin)
          estimated_points = bytearray(struct.pack("<Q", len(reconstructed)))
          for point_index, (xyz_point, rgb) in enumerate(zip(reconstructed, colors)):
              errors = []
              for (rotation, translation), pixels in zip(estimated_poses, observed):
                  camera_xyz = rotation @ xyz_point + translation
                  projected = intrinsic @ camera_xyz
                  errors.append(
                      np.linalg.norm(projected[:2] / projected[2] - pixels[point_index])
                  )
              track_error = float(np.sqrt(np.mean(np.square(errors))))
              assert np.isfinite(track_error) and track_error < 1.0
              estimated_points.extend(
                  struct.pack(
                      "<Q3d3BdQ", point_index + 1,
                      *[float(x) for x in xyz_point], *rgb, track_error, 3,
                  )
              )
              for image_id in range(1, 4):
                  estimated_points.extend(struct.pack("<II", image_id, point_index))
          (estimated_sparse / "points3D.bin").write_bytes(estimated_points)

          # This is a true on-disk handoff, not mock data: actual gsplat CPU
          # COLMAP parser and torch-backed Dataset load image pixels/poses/3D.
          sys.path.insert(0, str(Path(os.environ["COMMON_SOURCES"]) / "gsplat" / "examples"))
          parsed_estimated = Parser(
              str(estimated_root), factor=1, normalize=False, test_every=8
          )
          assert len(parsed_estimated.image_names) == 3
          assert parsed_estimated.points.shape == reconstructed.shape
          assert np.allclose(
              np.asarray(parsed_estimated.points), reconstructed, rtol=0, atol=1e-5
          )
          loaded_train = Dataset(parsed_estimated, split="train")
          loaded_test = Dataset(parsed_estimated, split="test")
          assert len(loaded_train) == 2 and len(loaded_test) == 1
          for batch in (loaded_train[0], loaded_train[1], loaded_test[0]):
              assert isinstance(batch["image"], torch.Tensor)
              assert batch["image"].shape == (240, 320, 3)
              assert batch["image"].device.type == "cpu"
              assert batch["K"].shape == (3, 3)
              assert batch["camtoworld"].shape == (4, 4)
              assert torch.isfinite(batch["image"]).all()
              assert torch.isfinite(batch["camtoworld"]).all()
          reprojection_errors = []
          for image_index, pixels in enumerate(observed):
              camera_to_world = parsed_estimated.camtoworlds[image_index]
              world_to_camera = np.linalg.inv(camera_to_world)
              camera_xyz = (
                  world_to_camera[:3, :3] @ reconstructed.T
                  + world_to_camera[:3, 3:4]
              )
              pixels_h = intrinsic @ camera_xyz
              projected = (pixels_h[:2] / pixels_h[2]).T
              reprojection_errors.extend(np.linalg.norm(projected - pixels, axis=1))
          handoff_rmse = float(np.sqrt(np.mean(np.square(reprojection_errors))))
          assert handoff_rmse < 0.65, handoff_rmse
          report = {
              "source": "SIFT image features + calibrated EssentialMat/RANSAC + PnP",
              "points_from_image_matches": int(len(reconstructed)),
              "registered_camera_count": 3,
              "reprojection_observation_count": int(len(reprojection_errors)),
              "roundtrip_colmap_reprojection_rmse_px": handoff_rmse,
              "colmap_model_reloaded_by": "pinned gsplat upstream Parser/Dataset",
              "intrinsics_known": True,
              "scale": "arbitrary; monocular metric scale is unrecovered",
              "synthetic_image_fixture": True,
              "real_cuda_execution": False,
              "real_gaussian_training": False,
          }
          (output / "wre-sift-estimated-colmap-handoff.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          with zipfile.ZipFile(
              output / "wre-sift-estimated-colmap-model.zip", "w", zipfile.ZIP_DEFLATED
          ) as archive:
              for file in sorted(estimated_root.rglob("*")):
                  if file.is_file():
                      archive.write(file, file.relative_to(estimated_root).as_posix())
          print(
              f"Estimated COLMAP handoff: {len(reconstructed)} 3D points, "
              f"three registered cameras, {handoff_rmse:.4f}px reprojection, "
              "parsed by actual upstream gsplat dataset on CPU."
          )

          # View the actual SIFT-reconstructed 3D from two camera positions
          # absent from the input dataset. This is a sparse colored point
          # projection, NOT a Gaussian radiance render or a quality benchmark.
          novel_images = []
          novel_visible = []
          for fraction in (0.5, 1.5):
              novel_rotation = Rotation.from_rotvec(
                  Rotation.from_matrix(recovered_rotation).as_rotvec() * fraction
              ).as_matrix()
              novel_translation = recovered_translation.reshape(3) * fraction
              camera_xyz = (novel_rotation @ reconstructed.T).T + novel_translation
              projected = (intrinsic @ camera_xyz.T).T
              frame = np.full((240, 320, 3), 16, dtype=np.uint8)
              inside_count = 0
              # Painter's algorithm: farthest points first so near points
              # replace them on overlapping pixels; bounded by point count.
              for point_index in np.argsort(camera_xyz[:, 2])[::-1]:
                  if camera_xyz[point_index, 2] <= 0:
                      continue
                  xy = projected[point_index, :2] / projected[point_index, 2]
                  if not np.all(np.isfinite(xy)):
                      continue
                  x, y = (int(round(float(value))) for value in xy)
                  if not (2 <= x < 318 and 2 <= y < 238):
                      continue
                  r, g, b = colors[int(point_index)]
                  cv2.circle(frame, (x, y), 2, (b, g, r), -1)
                  inside_count += 1
              assert inside_count >= 30, (fraction, inside_count)
              novel_visible.append(inside_count)
              cv2.putText(
                  frame, f"NOVEL CAMERA {fraction:g}x", (8, 18),
                  cv2.FONT_HERSHEY_SIMPLEX, 0.44, (255, 255, 255), 1,
                  cv2.LINE_AA,
              )
              novel_images.append(frame)
          novel_strip = cv2.hconcat(novel_images)
          assert cv2.imwrite(
              str(output / "wre-sift-cpu-estimated-novel-views.png"), novel_strip
          )
          print(
              f"Two real CPU projections of estimated 3D at unsampled poses: "
              f"{novel_visible} sparse points visible; no Gaussian renderer."
          )

          projections = [
              intrinsic
              @ np.column_stack((np.eye(3), [-baseline * index, 0.0, 0.0]))
              for index in range(3)
          ]
          homogeneous = cv2.triangulatePoints(
              projections[0], projections[1], points0.T, points1.T
          )
          xyz = (homogeneous[:3] / homogeneous[3]).T
          assert np.all(np.isfinite(xyz)) and np.all(xyz[:, 2] > 0.0)
          camera_third = projections[2] @ np.column_stack(
              (xyz, np.ones(len(xyz)))
          ).T
          heldout_xy = (camera_third[:2] / camera_third[2]).T
          heldout_rmse = float(np.sqrt(np.mean(
              np.sum(np.square(heldout_xy - observed_third), axis=1)
          )))
          upper, lower = points0[:, 1] < 120, points0[:, 1] > 120
          assert int(upper.sum()) >= 15 and int(lower.sum()) >= 15
          upper_depth = float(np.median(xyz[upper, 2]))
          lower_depth = float(np.median(xyz[lower, 2]))
          assert abs(upper_depth - 3.0) < 0.15, upper_depth
          assert abs(lower_depth - 6.0) < 0.15, lower_depth
          assert heldout_rmse < 0.25, heldout_rmse

          # Viewable standards-compliant XYZ + sampled image RGB point cloud.
          cloud = output / "wre-sift-cpu-image-triangulated.ply"
          header = (
              "ply\nformat ascii 1.0\n"
              f"element vertex {len(xyz)}\n"
              "property float x\nproperty float y\nproperty float z\n"
              "property uchar red\nproperty uchar green\nproperty uchar blue\n"
              "end_header\n"
          )
          rows = []
          for point, pixel in zip(xyz, points0):
              x, y = (int(round(value)) for value in pixel)
              bgr = views[0][y, x]
              rows.append(
                  f"{point[0]:.9g} {point[1]:.9g} {point[2]:.9g} "
                  f"{int(bgr[2])} {int(bgr[1])} {int(bgr[0])}"
              )
          cloud.write_text(header + "\n".join(rows) + "\n", encoding="ascii")
          # Recovered-camera 3D is a separate, scale-ambiguous cloud. Its
          # coordinates must never be presented as metric or COLMAP-anchored.
          pose_rows = []
          for xyz_point, image_xy in zip(pose_xyz, points0[inlier]):
              x, y = (int(round(value)) for value in image_xy)
              bgr = views[0][y, x]
              pose_rows.append(
                  f"{xyz_point[0]:.9g} {xyz_point[1]:.9g} {xyz_point[2]:.9g} "
                  f"{int(bgr[2])} {int(bgr[1])} {int(bgr[0])}"
              )
          pose_header = header.replace(
              f"element vertex {len(xyz)}", f"element vertex {len(pose_xyz)}"
          )
          (output / "wre-sift-cpu-estimated-pose.ply").write_text(
              pose_header + "\n".join(pose_rows) + "\n", encoding="ascii"
          )
          matches = [correspondences[0][idx] for idx in shared[:45]]
          preview = cv2.drawMatches(
              views[0], features[0][0], views[1], features[1][0],
              matches, None, flags=cv2.DrawMatchesFlags_NOT_DRAW_SINGLE_POINTS,
          )
          assert cv2.imwrite(
              str(output / "wre-sift-cpu-feature-correspondences.png"), preview
          )
          report = {
              "algorithm": "pinned OpenCV SIFT + BFMatcher + cv2.triangulatePoints",
              "input": "deterministic synthetic textured RGB images",
              "correspondences_from_pixel_features": True,
              "ground_truth_tracks_supplied_to_solver": False,
              "two_view_triangulated_points": len(xyz),
              "relative_pose_estimated_from_pixels": True,
              "relative_pose_known_intrinsics": True,
              "relative_pose_scale_recovered": False,
              "relative_pose_inliers": recovered_count,
              "relative_pose_rotation_angle_rad": angle_rad,
              "relative_pose_translation_unit_vector": [
                  float(v) for v in recovered_translation.reshape(-1)
              ],
              "relative_pose_two_view_reprojection_rmse_px": pose_rmse,
              "relative_pose_lower_upper_depth_ratio": depth_ratio,
              "third_view_camera_pose_estimated_from_reconstructed_xyz": True,
              "third_view_camera_pose_inliers": int(len(pnp_inliers)),
              "third_view_camera_pose_reprojection_rmse_px": pnp_rmse,
              "third_view_camera_translation_scale": "arbitrary",
              "upper_plane_median_depth_model_units": upper_depth,
              "lower_plane_median_depth_model_units": lower_depth,
              "third_view_heldout_reprojection_rmse_px": heldout_rmse,
              "real_scene_reconstruction_benchmark": False,
              "real_cuda_execution": False,
              "real_gaussian_training": False,
          }
          (output / "wre-sift-cpu-metrics.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(
              f"Real SIFT pixel matches: {len(xyz)} 3D points; "
              f"held-out reprojection RMSE {heldout_rmse:.5f} px; "
              f"depths {upper_depth:.3f}/{lower_depth:.3f} model units."
          )
          print("Synthetic scene only; no real-photo SfM, GPU or Gaussian training.")
          PY

      - name: Stage complete 3D CPU preview bundle for upload
        shell: bash
        run: |
          set -euo pipefail
          # Container RUNNER_TEMP (/__w/_temp) is NOT the host
          # runner.temp (/home/runner/work/_temp). The former led the
          # previous artifact upload to include only one unintended file.
          # Copy exact outputs into the shared checked-out workspace and
          # let upload-artifact resolve one relative directory.
          destination="$GITHUB_WORKSPACE/wre-cpu-3d-artifacts"
          mkdir -p "$destination"
          for file in \
            wre-colmap-cpu-preview.ply \
            wre-colmap-cpu-triangulated.ply \
            wre-colmap-cpu-views.png \
            wre-colmap-cpu-metrics.json \
            wre-colmap-cpu-render.png \
            wre-colmap-cpu-depth.png \
            wre-colmap-cpu-depth.npy \
            wre-sift-cpu-image-triangulated.ply \
            wre-sift-cpu-estimated-pose.ply \
            wre-sift-cpu-estimated-cameras.json \
            wre-sift-estimated-colmap-model.zip \
            wre-sift-estimated-colmap-handoff.json \
            wre-sift-cpu-estimated-novel-views.png \
            wre-sift-cpu-feature-correspondences.png \
            wre-sift-cpu-metrics.json \
            wre-sift-cpu-view-0.png \
            wre-sift-cpu-view-1.png \
            wre-sift-cpu-view-2.png
          do
            test -s "$RUNNER_TEMP/$file"
            cp "$RUNNER_TEMP/$file" "$destination/$file"
          done
          test "$(find "$destination" -maxdepth 1 -type f | wc -l)" -eq 18
          echo "Staged all 18 real PLY/PNG/NPY/JSON/ZIP files for artifact upload"

      - name: Publish CPU COLMAP 3D preview and measured reprojection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wre-colmap-cpu-3d-preview
          path: wre-cpu-3d-artifacts/
          if-no-files-found: error
          retention-days: 7
