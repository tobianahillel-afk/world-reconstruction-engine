          photoImageB.addEventListener('click',event=>
            selectNativePointFromPhoto(event,photoImageB,baselineChoice));
          photoImage.addEventListener('load',drawMeasuredPhotoPixels);
          photoImage.addEventListener('load',drawNativePhotoPixel);
          photoImageB.addEventListener('load',drawMeasuredPhotoPixels);
          photoImageB.addEventListener('load',drawNativePhotoPixel);
          const showLocalPhoto=()=>{
            updatePhotoHashLabels();
            for(const img of [photoImage,photoImageB]){
