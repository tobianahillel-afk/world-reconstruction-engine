          # Verify the exact same-run, lossless data product BEFORE archiving.
          portable_name = provenance["dense_disparity_uint16_png"]
          if portable_name != "wre-real-stereo-cpu-disparity-u16.png":
              raise ValueError("Unrecognized 16-bit disparity product")
