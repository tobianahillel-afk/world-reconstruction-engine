              # integer MouseEvent coordinates cannot land on an invalid edge.
              from struct import iter_unpack
              def actual_disparity(x, y):
                  index = (height - 1 - y) * width + x
                  return unpack_from("<f", actual_pfm, len(header) + 4 * index)[0]

              measured = None
              for index, (value,) in enumerate(iter_unpack("<f", actual_pfm[len(header):])):
                  px, py = index % width, height - 1 - index // width
                  if (1 <= px < width - 1 and 1 <= py < height - 1 and
                      all(2.0 < actual_disparity(px + dx, py + dy) < 128.0
                          for dx in (-1, 0, 1) for dy in (-1, 0, 1)) and
                      9 < px - value < width - 9 and 9 < py < height - 9):
                      measured = (px, py)
                      break
              assert measured is not None, "No observed contiguous valid stereo pixels"
              px, py = measured
              # A real Chrome run previously failed: an intended valid (158,545)
              # became invalid (156,545) on a downscaled CSS image because
              # MouseEvent.clientX was quantized in screen pixels. Exercise the
              # PUBLIC 1:1 toggle and verify actual rendered native dimensions.
              assert js("""const zoom=document.getElementById('wre-pixel-native-zoom');
                  const image=document.getElementById('wre-stereo-disparity');
                  zoom.click();
                  const box=image.getBoundingClientRect();
                  return zoom.getAttribute('aria-pressed')==='true' &&
                    Math.abs(box.width-image.naturalWidth)<0.01 &&
                    Math.abs(box.height-image.naturalHeight)<0.01 &&
                    image.closest('figure').scrollWidth >= image.naturalWidth;""")
              js(f"""const image = document.getElementById('wre-stereo-disparity');
                  const box = image.getBoundingClientRect();
                  image.dispatchEvent(new MouseEvent('click', {{
                      bubbles:true,cancelable:true,
                      clientX:box.left + ({px} + 0.5) * box.width / image.naturalWidth,
                      clientY:box.top + ({py} + 0.5) * box.height / image.naturalHeight
                  }})); return true;""")
              wait_for(lambda: js(
                  "return !!document.getElementById('wre-pixel-inspector').dataset.disparity "
                  "|| !!document.getElementById('wre-pixel-inspector').dataset.error"
              ), timeout=15)
              inspector_state = js("""return (() => {
                  const el=document.getElementById('wre-pixel-inspector');
                  return {x:el.dataset.x, y:el.dataset.y, disparity:el.dataset.disparity,
                          error:el.dataset.error, text:el.textContent};
              })()""")
              assert not inspector_state["error"], inspector_state
              # DOM MouseEvent client coordinates are CSS pixels, not exact
              # intrinsic image pixels. Audit the actual selected source pixel
              # against the independently decoded SHA256-checked PFM instead
              # of assuming CSS -> intrinsic coordinates are lossless.
              selected_x, selected_y = int(inspector_state["x"]), int(inspector_state["y"])
              assert abs(selected_x - px) <= 1 and abs(selected_y - py) <= 1, (
                  inspector_state, (px, py)
              )
              expected_disparity = actual_disparity(selected_x, selected_y)
              assert 2.0 < expected_disparity < 128.0, inspector_state
              observed = float(inspector_state["disparity"])
              assert abs(observed - expected_disparity) < 0.0001
              assert "PAS des mètres" in js(
                  "return document.getElementById('wre-pixel-inspector').textContent"
              )
              # Inspect the ACTUAL rectified source photographs from the same
              # extracted ZIP, not a synthetic photo or a copied DOM label.
              correspondences = js("""return (() => {
                  const status=document.getElementById('wre-pixel-inspector');
                  const photos=document.getElementById('wre-stereo-match-photos');
                  const overlay=document.getElementById('wre-stereo-match-overlay');
                  const context=overlay.getContext('2d');
                  const x=Number(status.dataset.x), y=Number(status.dataset.y);
                  const xr=Number(status.dataset.rightX);
                  function ring(x) {
                    return Array.from(context.getImageData(Math.round(x)+6,y,1,1).data);
                  }
                  return {
                    loaded:photos.complete && photos.naturalWidth===overlay.width &&
                      photos.naturalHeight===overlay.height,
                    width:photos.naturalWidth,height:photos.naturalHeight,
                    rightX:xr,rightY:Number(status.dataset.rightY),
                    modelX:Number(status.dataset.modelX),modelY:Number(status.dataset.modelY),
                    modelZ:Number(status.dataset.modelZ),
                    left:ring(x),right:ring(overlay.width/2+xr)
                  };
              })()""")
              assert correspondences["loaded"], correspondences
              assert correspondences["width"] == 2*width
              assert correspondences["height"] == height
              assert abs(correspondences["rightX"]-(selected_x-expected_disparity)) < 1e-4
              assert correspondences["rightY"] == selected_y
              assert abs(correspondences["modelX"] -
                         (selected_x-(width-1)/2)/expected_disparity) < 1e-4
              assert abs(correspondences["modelY"] -
                         (selected_y-(height-1)/2)/expected_disparity) < 1e-4
              assert abs(correspondences["modelZ"] - width/expected_disparity) < 1e-4
              assert correspondences["left"][0] > 150 and correspondences["left"][1] < 90
              assert correspondences["left"][3] > 0
              assert correspondences["right"][1] > 140 and correspondences["right"][0] < 100
              assert correspondences["right"][3] > 0
              print("PASS: actual Chrome marked two observed stereo pixels and relative 3D XYZ")
              assert js("""return !!document.querySelector(
                  'a[href="./wre-real-stereo-cpu-disparity-f32.pfm"][download]'
              )""")
              print("PASS: actual Chrome inspected pixel float32 from the same real-photo PFM")
              # User-facing batch export: two DISTINCT observed source pixels,
              # then verify downloaded JSON against the same SHA256-checked PFM.
              assert js("""const add=document.getElementById('wre-save-stereo-point');
                  const download=document.getElementById('wre-export-stereo-points');
                  if(add.disabled || !download.disabled) return false;
                  add.click();
                  return !download.disabled &&
                    document.getElementById('wre-stereo-point-count').textContent.includes('1 points');
              """)
              next_x = px - 1 if selected_x >= px else px + 1
              assert next_x != selected_x and 2.0 < actual_disparity(next_x, py) < 128.0
              js(f"""const img=document.getElementById('wre-stereo-disparity');
                  const box=img.getBoundingClientRect();
                  img.dispatchEvent(new MouseEvent('click',{{
                    bubbles:true,cancelable:true,
                    clientX:box.left+({next_x}+.5)*box.width/img.naturalWidth,
                    clientY:box.top+({py}+.5)*box.height/img.naturalHeight
                  }}));return true;""")
              wait_for(lambda: js("""const el=document.getElementById('wre-pixel-inspector');
                  return el.dataset.x!==\'""" + str(selected_x) + """\' &&
                    !document.getElementById('wre-save-stereo-point').disabled;"""), timeout=15)
              js("""document.getElementById('wre-save-stereo-point').click();
                  window.__wreObservedPoints=null;
                  const native=URL.createObjectURL.bind(URL);
                  URL.createObjectURL=blob=>{
                    if(blob.type==='application/json') blob.text().then(
                      content=>window.__wreObservedPoints=JSON.parse(content));
                    return native(blob);
                  };
                  document.getElementById('wre-export-stereo-points').click();
                  return true;""")
              wait_for(lambda: js("return !!window.__wreObservedPoints"), timeout=15)
              exported = js("return window.__wreObservedPoints")
              assert exported["schema"] == "wre.observed_stereo_points.v1"
              assert exported["source_pfm_sha256"] == numeric_metrics[
                  "dense_disparity_float32_pfm_sha256"
              ]
              assert exported["metric_scale_known"] is False
              assert exported["focal_assumption_pixels"] == width
              assert exported["baseline_assumption_model_units"] == 1
              assert len(exported["points"]) == 2
              for point in exported["points"]:
                  x, y = point["left_pixel"]
                  d = actual_disparity(x, y)
                  assert 2 < d < 128 and abs(point["disparity_pixels"] - d) < 1e-4
                  assert abs(point["right_pixel"][0] - (x-d)) < 1e-4
                  assert point["right_pixel"][1] == y
                  xyz = [(x-(width-1)/2)/d, (y-(height-1)/2)/d, width/d]
                  assert all(abs(a-b) < 1e-4 for a,b in
                             zip(point["xyz_relative_model_units"], xyz))
              assert len({tuple(p["left_pixel"]) for p in exported["points"]}) == 2
              print("PASS: actual Chrome exported two real-photo stereo XYZ observations")
              # Open the REAL browser's portable RGB point-cloud download, not
              # a fabricated Python fixture. Compare all XYZ to the original
              # float32 PFM and RGB to actual processed left-photo pixels.
              assert js("""const button=document.getElementById('wre-export-stereo-ply');
                  if(button.disabled) return false;
                  window.__wreObservedPly=null;
                  const original=URL.createObjectURL.bind(URL);
                  URL.createObjectURL=blob=>{
                    if(blob.type==='text/plain') blob.text().then(
                      text=>window.__wreObservedPly=text);
                    return original(blob);
                  };
                  button.click();
                  return true;""")
              wait_for(lambda: js("return !!window.__wreObservedPly"), timeout=15)
              ascii_ply = js("return window.__wreObservedPly")
              header, vertices = ascii_ply.split("end_header" + chr(10), 1)
              assert header.startswith("ply" + chr(10) + "format ascii 1.0")
              assert "element vertex 2" in header
              assert "comment metric_scale_known false" in header
              assert ("comment source_pfm_sha256 " +
                      numeric_metrics["dense_disparity_float32_pfm_sha256"]) in header
              assert all(("property " + field) in header for field in (
                  "float x", "float y", "float z",
                  "uchar red", "uchar green", "uchar blue",
              ))
              rows = [line.split() for line in vertices.splitlines() if line]
              assert len(rows) == len(exported["points"]) == 2
              observed_rgb = js("""return (() => {
                const img=document.getElementById('wre-stereo-match-photos');
                const canvas=document.createElement('canvas');
                canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
                const ctx=canvas.getContext('2d',{willReadFrequently:true});
                ctx.drawImage(img,0,0);
                return window.__wreObservedPoints.points.map(point=>{
                  const [u,v]=point.left_pixel;
                  return Array.from(ctx.getImageData(u,v,1,1).data).slice(0,3);
                });
              })()""")
              for row, point, rgb in zip(rows, exported["points"], observed_rgb):
                  assert len(row) == 6
                  assert all(abs(float(value)-expected) < 1e-4 for value, expected in
                             zip(row[:3], point["xyz_relative_model_units"]))
                  assert [int(value) for value in row[3:]] == rgb
              print("PASS: actual Chrome exported real-photo colored relative XYZ as PLY")
              # Functional 2D -> 3D navigation: the last point comes from the
              # SHA-256 verified on-disk PFM, not an invented camera landmark.
              link = js("""return (() => {
                  const anchor=document.getElementById('wre-inspected-point-live-3d');
                  if (!anchor || anchor.getAttribute('aria-disabled')!=='false' ||
                      !anchor.href) return null;
                  const url=new URL(anchor.href);
                  const q=url.searchParams;
                  return {url:anchor.href, path:url.pathname,
                      xyz:['stereo_x','stereo_y','stereo_z'].map(key=>Number(q.get(key)))};
              })()""")
              assert link and link["path"].endswith("/wre-real-stereo-cpu-viewer.html")
              expected_xyz = exported["points"][-1]["xyz_relative_model_units"]
              assert len(link["xyz"]) == 3
              assert all(abs(actual - expected) < 1e-4 for actual, expected in
                         zip(link["xyz"], expected_xyz))
              browser("POST", f"/session/{session}/url", {"url": link["url"]})
              loaded = """return (() => {
                  const scene = document.getElementById("wre-scene");
                  return Boolean(scene && scene.loaded && scene.model &&
                      document.getElementById("wre-camera-export").disabled === false);
              })()"""
              wait_for(lambda: js(loaded))
              # Validate the ACTUAL model-viewer WebGL model and hotspot in the
