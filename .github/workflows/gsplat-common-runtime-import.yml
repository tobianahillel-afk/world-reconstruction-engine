          if-no-files-found: error
          retention-days: 7


  browser-real-3d-smoke:
    name: Real Chrome 3D viewer modes (CPU SwiftShader)
    # The CPU preview is uploaded before the long native CUDA compilation.
    # Poll that same-run artifact rather than waiting for the parent job to
    # finish; otherwise the functional Chrome proof is needlessly delayed.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for exact-run CPU 3D artifact (independent of CUDA build)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          # Only THIS workflow run may satisfy the dependency; never accept a
          # similarly named artifact from another commit or previous job.
          for attempt in $(seq 1 60); do
            ready="$(gh api \
              "/repos/$RUN_REPO/actions/runs/$RUN_ID/artifacts?name=wre-real-stereo-cpu-early-preview" \
              --jq '[.artifacts[] | select(.name == "wre-real-stereo-cpu-early-preview" and .expired == false)] | length')"
            if [[ "$ready" == "1" ]]; then
              echo "Verified the same-run real-photo 3D artifact at attempt $attempt"
              exit 0
            fi
            sleep 10
          done
          echo "::error::CPU real-photo preview was not published within 10 minutes"
          exit 1

      - name: Download exact-run real-photo CPU 3D artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wre-real-stereo-cpu-early-preview
          path: wre-browser-preview

      - name: Render BOTH real-photo 3D modes using actual Chrome WebGL
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version
          driver="$CHROMEWEBDRIVER/chromedriver"
          test -x "$driver"
          test -s wre-browser-preview/wre-real-stereo-cpu-viewer.html
          test -s wre-browser-preview/wre-real-stereo-cpu-textured.glb
          test -s wre-browser-preview/wre-real-stereo-cpu-lr-consistent.glb
          test -s wre-browser-preview/wre-real-stereo-cpu-photometric-consistent.glb
          test -s wre-browser-preview/wre-real-stereo-sift-estimated-cameras.glb
          test -s wre-browser-preview/wre-model-viewer-4.1.0.min.js
          mkdir -p wre-browser-proof
          python3 -m http.server 8765 --bind 127.0.0.1 --directory wre-browser-preview > wre-browser-proof/http.log 2>&1 &
          http_pid="$!"
          "$driver" --port=9515 --allowed-ips=127.0.0.1 > wre-browser-proof/chromedriver.log 2>&1 &
          driver_pid="$!"
          trap 'kill "$http_pid" "$driver_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import math
          import time
          from pathlib import Path
          from urllib.error import URLError
          from urllib.request import Request, urlopen

          root = Path("wre-browser-preview")
          proof = Path("wre-browser-proof")
          expected_files = (
              "wre-real-stereo-cpu-textured.glb",
              "wre-real-stereo-sift-estimated-cameras.glb",
          )
          expected_hashes = {
              name: hashlib.sha256((root / name).read_bytes()).hexdigest()
              for name in expected_files
          }
          base = "http://127.0.0.1:9515"
          def call(method, route, body=None):
              data = None if body is None else json.dumps(body).encode("utf-8")
              req = Request(
                  base + route, data=data, method=method,
                  headers={"Content-Type": "application/json"}
              )
              with urlopen(req, timeout=40) as response:
                  raw = response.read()
              return json.loads(raw)["value"] if raw else None

          for attempt in range(50):
              try:
                  if call("GET", "/status")["ready"]:
                      break
              except (OSError, URLError, KeyError):
                  pass
              time.sleep(0.2)
          else:
              raise RuntimeError("ChromeDriver did not start on localhost")

          options = {
              "browserName": "chrome",
              "goog:chromeOptions": {
                  "args": [
                      "--headless=new", "--no-sandbox", "--disable-dev-shm-usage",
                      "--enable-unsafe-swiftshader", "--use-gl=angle",
                      "--use-angle=swiftshader", "--window-size=1280,900",
                      "--disable-background-networking",
                      "--host-resolver-rules=MAP * 0.0.0.0, EXCLUDE localhost",
                  ]
              }
          }
          session_data = call("POST", "/session", {"capabilities": {"alwaysMatch": options}})
          session = session_data["sessionId"]
          def js(script):
              return call(
                  "POST", f"/session/{session}/execute/sync",
                  {"script": script, "args": []}
              )
          try:
              call(
                  "POST", f"/session/{session}/url",
                  {"url": "http://127.0.0.1:8765/wre-real-stereo-cpu-viewer.html"}
              )
              def until(script, limit=70):
                  deadline = time.monotonic() + limit
                  while time.monotonic() < deadline:
                      result = js(script)
                      if result:
                          return result
                      time.sleep(0.4)
                  raise RuntimeError("Actual Chrome 3D render did not reach expected state")

              # model-viewer really initializes WebGL and decodes the first GLB.
              first = until("""
                const view=document.getElementById('wre-scene');
                return customElements.get('model-viewer') &&
                  view && view.loaded === true && view.model &&
                  view.getAttribute('src').startsWith('data:model/gltf-binary;base64,');
              """)
              assert first
              # Show actual 2D inputs NEXT TO the actively rendered real 3D
              # GLB. This is not a reprojected camera match or static image mock.
              js("""
                document.getElementById('wre-photo-toggle').click();
              """)
              assert until("""
                const pane=document.getElementById('wre-source-panel');
                const img=document.getElementById('wre-live-source-photos');
                const model=document.getElementById('wre-scene');
                return !pane.hidden && img.complete && img.naturalWidth >= 640 &&
                  img.naturalHeight >= 160 &&
                  img.currentSrc.endsWith('/wre-real-stereo-cpu-photos.png') &&
                  img.getBoundingClientRect().width >= 200 &&
                  model.loaded && model.model &&
                  model.getBoundingClientRect().width >= 260 &&
                  document.getElementById('wre-photo-toggle')
                    .getAttribute('aria-pressed') === 'true' &&
                  !!document.createElement('canvas').getContext('webgl2');
              """), "Actual observed 2D photos and rendered GLB not simultaneously visible"
              # Exercise each source-photo half with real pixels and a LIVE GLB.
              # This crop is evidence inspection, not calibrated 2D/3D registration.
              frames = js("""
                const choice=document.getElementById('wre-source-frame');
                const crop=document.getElementById('wre-photo-crop');
                const img=document.getElementById('wre-live-source-photos');
                const model=document.getElementById('wre-scene');
                function inspect(frame) {
                  choice.value=frame;
                  choice.dispatchEvent(new Event('change', {bubbles:true}));
                  const a=img.getBoundingClientRect(), b=crop.getBoundingClientRect();
                  return {frame:crop.dataset.frame, ratio:a.width/b.width,
                    leftOffset:a.left-b.left, rightOffset:a.right-b.right,
                    loaded:model.loaded && Boolean(model.model)};
                }
                const left=inspect('left'), right=inspect('right'), pair=inspect('pair');
                const canvas=document.createElement('canvas');
                canvas.width=12; canvas.height=12;
                const context=canvas.getContext('2d', {willReadFrequently:true});
                const half=img.naturalWidth/2, height=img.naturalHeight;
                function sample(x) {
                  context.clearRect(0,0,12,12);
                  context.drawImage(img,x,0,half,height,0,0,12,12);
                  return Array.from(context.getImageData(0,0,12,12).data);
                }
                return {left,right,pair,
                  distinct:JSON.stringify(sample(0)) !== JSON.stringify(sample(half)),
                  imageWidth:img.naturalWidth};
              """)
              assert frames["imageWidth"] >= 640
              assert frames["distinct"], "Original left and right photo pixels must differ"
              assert all(frames[v]["loaded"] for v in ("left", "right", "pair"))
              assert frames["left"]["frame"] == "left"
              assert frames["right"]["frame"] == "right"
              assert frames["pair"]["frame"] == "pair"
              assert 1.95 < frames["left"]["ratio"] < 2.05
              assert 1.95 < frames["right"]["ratio"] < 2.05
              assert 0.95 < frames["pair"]["ratio"] < 1.05
              assert abs(frames["left"]["leftOffset"]) < 3
              assert abs(frames["right"]["rightOffset"]) < 3
              # Real browser PNG export: inspect the actual downloaded Blob
              # while still delegating to the native URL API.
              assert js("""const img=document.getElementById('wre-live-source-photos');
                  const button=document.getElementById('wre-source-export');
                  if (button.disabled || !img.complete || img.naturalWidth < 640) return false;
                  window.__wreSourceExports=[];
                  window.__wreSourceURL=URL.createObjectURL;
                  URL.createObjectURL=function(blob) {
                    const frame=document.getElementById('wre-source-frame').value;
                    if (blob.type==='image/png') {
                      (async()=>{
                        const bitmap=await createImageBitmap(blob);
                        const bytes=await blob.arrayBuffer();
                        const hash=await crypto.subtle.digest('SHA-256',bytes);
                        const hex=Array.from(new Uint8Array(hash))
                          .map(b=>b.toString(16).padStart(2,'0')).join('');
                        // Compare at native pixel resolution: thumbnail interpolation can
