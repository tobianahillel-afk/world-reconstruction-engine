      - name: Package one complete offline interactive 3D exploration archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import shutil
          import struct
          from pathlib import Path
          
          source = Path("wre-browser-preview")
          proof = Path("wre-browser-proof")
          bundle = Path("wre-unified-offline-3d")
          receipt = json.loads((proof / "browser-verification.json").read_text(encoding="utf-8"))
          if receipt.get("real_gpu_training") is not False or receipt.get("metric_scale_known") is not False:
              raise ValueError("Missing explicit CPU/nonmetric proof")
          if not all(receipt.get(k) is True for k in (
              "surface_loaded", "stereo_cloud_mode_loaded", "photometric_cloud_mode_loaded",
              "sift_camera_mode_loaded", "surface_reload", "webgl_context",
          )):
              raise ValueError("The same-run browser did not load all four real 3D modes")
          if receipt.get("local_glb_file_loaded_in_chrome") is not True:
              raise ValueError("Actual Chrome did not open a user-selected GLB")
          if receipt.get("two_real_3d_models_compared_side_by_side") is not True:
              raise ValueError("Actual Chrome did not compare two real 3D GLBs side by side")
          if receipt.get("source_photos_and_live_3d_verified_in_chrome") is not True:
              raise ValueError("Actual Chrome did not show source photos beside a live GLB")
          if receipt.get("individual_left_right_photos_verified_in_chrome") is not True:
              raise ValueError("Actual Chrome did not verify both individual source-photo views")
          if receipt.get("observed_source_png_export_verified_in_chrome") is not True:
              raise ValueError("Actual Chrome did not export original source image pixels")
          hashes = receipt.get("observed_source_png_export_sha256")
          if not isinstance(hashes, dict) or set(hashes) != {"pair", "left", "right"} or any(
              not isinstance(v, str) or len(v) != 64 for v in hashes.values()
          ):
              raise ValueError("Actual Chrome source PNG export SHA evidence is incomplete")
          if receipt.get("dual_3d_linked_orbit_verified_in_chrome") is not True:
              raise ValueError("Actual Chrome did not verify independent linked 3D orbit angles")
          if receipt.get("surface_distance_measured_in_chrome") is not True:
              raise ValueError("Actual Chrome did not measure two real mesh points")
          if receipt.get("surface_measurement_export_verified_in_chrome") is not True:
              raise ValueError("Actual Chrome did not export a nonmetric 3D surface measurement")
          if receipt.get("surface_distance_restore_verified_in_chrome") is not True:
              raise ValueError("Actual Chrome did not roundtrip a saved 3D distance annotation")
          if receipt.get("surface_polyline_export_verified_in_chrome") is not True:
              raise ValueError("Actual Chrome did not export a measured multi-point 3D path")
          if receipt.get("surface_polyline_restore_verified_in_chrome") is not True:
              raise ValueError("Actual Chrome did not restore a 3D path on the real mesh")
          if receipt.get("surface_triangle_fan_area_export_verified_in_chrome") is not True:
              raise ValueError("Actual Chrome did not export a relative 3D polygon triangle-fan area")
          if receipt.get("surface_triangle_fan_area_restore_verified_in_chrome") is not True:
              raise ValueError("Actual Chrome did not restore the saved 3D polygon area")
          if receipt.get("user_reference_scale_verified_in_chrome") is not True:
              raise ValueError("Actual Chrome did not exercise user-supplied 3D scale")
          if receipt.get("second_reference_consistency_verified_in_chrome") is not True:
              raise ValueError("Actual Chrome did not compare two manual 3D scale references")
          if receipt.get("surface_chord_angle_export_verified_in_chrome") is not True:
              raise ValueError("Actual Chrome did not export a real-raycast 3D chord angle")
          if receipt.get("surface_chord_angle_restore_verified_in_chrome") is not True:
              raise ValueError("Actual Chrome did not roundtrip a saved 3D chord angle")
          if receipt.get("relative_3d_camera_bookmark_roundtrip_verified_in_chrome") is not True:
              raise ValueError("Actual Chrome did not roundtrip a relative 3D camera bookmark")
          if receipt.get("user_camera_tour_verified_in_chrome") is not True:
              raise ValueError("Actual Chrome did not replay a user camera tour")
          if receipt.get("portable_camera_tour_json_roundtrip_verified_in_chrome") is not True:
              raise ValueError("Actual Chrome did not export and restore a real camera tour")
          if receipt.get("camera_tour_keyframe_scrubbing_verified_in_chrome") is not True:
              raise ValueError("Actual Chrome did not scrub two real 3D camera keyframes")
          if receipt.get("smooth_camera_tour_interpolation_verified_in_chrome") is not True:
              raise ValueError("Actual Chrome did not render smooth 3D camera interpolation")
          if receipt.get("camera_tour_storyboard_verified_in_chrome") is not True:
              raise ValueError("Actual Chrome did not export actual 3D camera views as one PNG")
          if receipt.get("camera_tour_storyboard_png_dimensions") != [640, 240]:
              raise ValueError("Real WebGL camera storyboard dimensions are invalid")
          if not isinstance(receipt.get("camera_tour_storyboard_png_sha256"), str) or len(
              receipt["camera_tour_storyboard_png_sha256"]
          ) != 64:
              raise ValueError("Missing same-run camera storyboard SHA-256")
          if receipt.get("current_view_png_export_verified_in_chrome") is not True:
              raise ValueError("Actual Chrome did not export its current real-photo 3D view as PNG")
          dimensions = receipt.get("current_view_png_dimensions")
          if not isinstance(dimensions, list) or len(dimensions) != 2 or any(
              not isinstance(value, int) or value < 64 for value in dimensions
          ):
              raise ValueError("Actual Chrome PNG view dimensions are invalid")
          
          glbs = (
              "wre-real-stereo-cpu-textured.glb",
              "wre-real-stereo-cpu-lr-consistent.glb",
              "wre-real-stereo-cpu-photometric-consistent.glb",
              "wre-real-stereo-sift-estimated-cameras.glb",
          )
          source_hashes = {}
          for name in glbs:
              data = (source / name).read_bytes()
              if len(data) < 20 or data[:4] != b"glTF" or struct.unpack_from("<II", data, 4) != (2, len(data)):
                  raise ValueError(f"Invalid glTF 2.0 source: {name}")
              digest = hashlib.sha256(data).hexdigest()
              if name in receipt["input_glb_sha256"] and digest != receipt["input_glb_sha256"][name]:
                  raise ValueError(f"Chrome input and packaged GLB disagree: {name}")
              source_hashes[name] = digest
          for required in (
              "wre-real-stereo-cpu-viewer.html",
              "wre-model-viewer-4.1.0.min.js",
              "wre-model-viewer-4.1.0-LICENSE.txt",
          ):
              if not (source / required).is_file():
                  raise ValueError(f"Missing offline viewer dependency: {required}")
          
          png_hashes = {
              "real-stereo-3d-browser.png": receipt["screenshot_sha256"],
              "real-stereo-3d-side-by-side.png": receipt["side_by_side_screenshot_sha256"],
              "real-stereo-2d-and-3d.png": receipt["source_photos_live_3d_screenshot_sha256"],
              "real-stereo-3d-camera-storyboard.png": receipt["camera_tour_storyboard_png_sha256"],
              **{
                  f"real-stereo-3d-{mode}.png": digest
                  for mode, digest in receipt["mode_screenshot_sha256"].items()
              },
          }
          if set(png_hashes) != {
              "real-stereo-3d-browser.png",
              "real-stereo-3d-side-by-side.png",
              "real-stereo-2d-and-3d.png",
              "real-stereo-3d-camera-storyboard.png",
              "real-stereo-3d-stereo.png",
              "real-stereo-3d-quality.png",
              "real-stereo-3d-sift.png",
          }:
              raise ValueError("Seven Chrome screenshot identities required")
          for name, digest in png_hashes.items():
              data = (proof / name).read_bytes()
              if not data.startswith(bytes.fromhex("89504e470d0a1a0a")):
                  raise ValueError(f"Missing PNG signature: {name}")
              if hashlib.sha256(data).hexdigest() != digest:
                  raise ValueError(f"Corrupted same-run Chrome proof: {name}")
          
          shutil.copytree(source, bundle)
          for name in (*png_hashes, "browser-verification.json", "wre-real-3d-comparison.html"):
              shutil.copy2(proof / name, bundle / name)
          
          # Real same-run stereo input photos, not a synthetic 3D rendering.
          input_name = "wre-real-stereo-cpu-photos.png"
          input_png = (bundle / input_name).read_bytes()
          if len(input_png) < 24 or input_png[:16] != bytes.fromhex(
              "89504e470d0a1a0a0000000d49484452"
          ):
              raise ValueError("Missing real input stereo photograph PNG")
          input_width, input_height = struct.unpack_from(">II", input_png, 16)
          provenance = json.loads(
              (bundle / "wre-real-stereo-cpu-metrics.json").read_text(encoding="utf-8")
          )
          height, width = provenance["processed_photo_height_width"]
          if (input_width, input_height) != (2 * width, height):
              raise ValueError("Input photos disagree with CPU source dimensions")
          source_blobs = provenance["source_git_blobs"]
          if source_blobs != {
              "aloeL.jpg": "4c192768e4ddd2ada20f91a5e0bd3648fbc78818",
              "aloeR.jpg": "7ecdf48919be3ac7dd0cc6e594ab00398ac956b2",
          }:
              raise ValueError("Original stereo photographs have different provenance")
          input_sha256 = hashlib.sha256(input_png).hexdigest()
          # Both browser inspection and portable downloads must refer to the
