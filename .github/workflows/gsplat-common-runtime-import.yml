              actual_marker = js("""return (() => {
                  const scene=document.getElementById('wre-scene');
                  const marker=scene?.querySelector('[slot="hotspot-wre-observed-stereo"]');
                  const status=document.getElementById('wre-observed-stereo-marker-status');
                  if (!scene.loaded || !scene.model || !marker || marker.hidden ||
                      !status?.textContent.includes('relative units only')) return null;
                  return {coordinates:marker.dataset.position.split(' ').map(Number.parseFloat),
                      label:marker.getAttribute('aria-label'), slot:marker.slot,
                      src:scene.getAttribute('src'), visible:!marker.hidden};
              })()""")
              assert actual_marker is not None and actual_marker["visible"]
              assert actual_marker["slot"] == "hotspot-wre-observed-stereo"
              assert actual_marker["label"] == "Nonmetric photo stereo observation"
              assert actual_marker["src"].startswith("data:model/gltf-binary;base64,")
              expected_gltf = (expected_xyz[0], -expected_xyz[1], -expected_xyz[2])
              assert all(abs(actual - expected) < 1e-4 for actual, expected in
