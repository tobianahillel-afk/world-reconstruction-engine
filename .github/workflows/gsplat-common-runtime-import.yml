                  const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
                  if (!blob || blob.type !== "image/png" || blob.size < 1000 ||
                      frame !== photoFrame.value || photoPanel.hidden) {
                    throw new Error("Original photo export changed or failed.");
                  }
                  const url = URL.createObjectURL(blob);
                  const link = document.createElement("a");
                  link.href = url;
                  link.download = "wre-observed-source-" + frame + ".png";
                  document.body.appendChild(link);
                  link.click();
                  link.remove();
                  setTimeout(() => URL.revokeObjectURL(url), 1000);
                  sourceExportStatus.textContent =
                    "Saved the actual " + frame + " source pixels; NOT a registered 3D view.";
                } catch (error) {
                  sourceExportStatus.textContent = "Source export failed: " + String(error);
                } finally {
                  sourceExport.disabled = !sourceImageReady();
                }
              });
              photoToggle.addEventListener("click", () => {
                if (compareChoice.value) return;
                const show = photoPanel.hidden;
                photoPanel.hidden = !show;
                viewPair.classList.toggle("with-source", show);
                photoToggle.setAttribute("aria-pressed", String(show));
                photoToggle.textContent = show
                  ? "Hide source photos" : "Show source photos beside 3D";
              });
              // Compare two independently rendered real GLB assets. Copying a
              // camera does NOT register different geometries or prove scale.
              compareChoice.addEventListener("change", () => {
                const other = modes[compareChoice.value];
                if (other && !photoPanel.hidden) photoToggle.click();
                photoToggle.disabled = Boolean(other);
                compareSync.disabled = true;
                resetLinkedOrbit();
                if (!other) {
                  compareScene.removeAttribute("src");
                  compareScene.hidden = true;
                  viewPair.classList.remove("dual");
                  compareStatus.textContent = "Comparison off.";
                  return;
                }
                compareScene.hidden = false;
                viewPair.classList.add("dual");
                compareStatus.textContent = "Loading independent right-hand GLB...";
                compareScene.setAttribute("alt", other.alt);
                compareScene.setAttribute("src", other.src);
              });
              compareScene.addEventListener("load", () => {
                if (compareScene.hidden) return;
                compareSync.disabled = !scene.loaded;
                compareLink.disabled = !scene.loaded;
                compareStatus.textContent = "Both 3D models rendered; geometry uses uncalibrated units.";
              });
              compareScene.addEventListener("error", () => {
                compareSync.disabled = true;
                resetLinkedOrbit();
                compareStatus.textContent = "Right-hand model could not be loaded.";
              });
              compareSync.addEventListener("click", () => {
                if (!scene.loaded || !compareScene.loaded || compareScene.hidden) return;
                const orbit = scene.getCameraOrbit();
                const target = scene.getCameraTarget();
                const fov = scene.getFieldOfView();
                if (![orbit.theta, orbit.phi, orbit.radius, target.x, target.y,
                      target.z, fov].every(Number.isFinite)) return;
                compareScene.cameraOrbit = orbit.theta + "rad " + orbit.phi +
                  "rad " + orbit.radius + "m";
                compareScene.cameraTarget = [target.x, target.y, target.z]
                  .map(value => value + "m").join(" ");
                compareScene.fieldOfView = fov + "deg";
                compareScene.jumpCameraToGoal();
                compareStatus.textContent = "Copied camera coordinates only; 3D models are not registered.";
              });
              chooser.addEventListener("change", () => {
                const mode = modes[chooser.value];
                if (!mode) return;
                releaseLocalUrl();
                resetCameraTour();
                clearUserCalibration();
                resetMeasurement();
                viewExportButton.disabled = true;
                cameraExport.disabled = true;
                cameraImport.disabled = true;
                measureImport.disabled = true;
                measureImportStatus.textContent = "Loading selected 3D mode.";
                cameraStatus.textContent = "Loading selected 3D mode.";
                viewExportStatus.textContent = "Loading selected 3D mode.";
                localInput.value = "";
                scene.setAttribute("src", mode.src);
                scene.setAttribute("alt", mode.alt);
                provenance.textContent = mode.label;
              });
            </script>
            <div class="metrics">Observed right-view photometric MAE: WRE_STEREO_MAE/255
              (in-sample). SIFT two-view reprojection RMSE: WRE_SIFT_RMSE px
              (in-sample, WRE_TRACKS measured 3D tracks). Neither is held-out accuracy.</div>
            <section class="evidence" aria-label="Observed photographs and diagnostics">
              <figure><img alt="Two original observed photographs"
                src="data:image/png;base64,WRE_SOURCE_PHOTOS_BASE64">
                <figcaption>Original observed photos · SHA-256 WRE_SOURCE_PHOTOS_SHA</figcaption></figure>
              <figure><img alt="Observed pixels versus estimated camera reprojections"
                src="data:image/png;base64,WRE_SIFT_REPROJECTION_BASE64">
                <figcaption>Measured SIFT projection errors · SHA-256
                  WRE_SIFT_REPROJECTION_SHA</figcaption></figure>
              <figure><img alt="Observed right camera versus stereo depth reprojection"
                src="data:image/png;base64,WRE_STEREO_REPROJECTION_BASE64">
                <figcaption>Depth-based right view errors · SHA-256
                  WRE_STEREO_REPROJECTION_SHA</figcaption></figure>
            </section>
            <footer>All four GLBs and the estimated COLMAP dataset can be downloaded
              unchanged for inspection in compatible 3D/COLMAP tools. All scene data,
              diagnostics and the hash-pinned Apache-2.0 model-viewer 4.1.0 script
              ship together.
              To view without internet, extract the archive, run
              <code>python3 -m http.server 8765 --bind 127.0.0.1</code>
              in the extracted folder and open
              <code>http://127.0.0.1:8765/wre-real-stereo-cpu-viewer.html</code>.
              You can also select a local GLB file using the file input; it stays
              in your browser, is not uploaded, and its provenance is unverified.
              Measure distance by clicking two points, or trace a multi-point 3D
              polyline on the visible mesh. A third mode estimates polygon area
              by triangulating selected 3D points with a straight triangle fan.
              Chords are NOT surface geodesics, and triangle fans are NOT true
              curved physical surface areas. Units are arbitrary (or squared),
              never meters or square meters.
              Use only models you trust. No GPU training or held-out quality metric
              is implied.</footer>
          </main>
          </body>
          </html>
          """
          page = (
              page.replace("WRE_GLB_BASE64", encoded)
              .replace("WRE_SIFT_GLB_SHA256", sift_digest)
              .replace("WRE_STEREO_GLB_SHA256", cloud_digests["stereo"])
              .replace("WRE_QUALITY_GLB_SHA256", cloud_digests["quality"])
              .replace("WRE_GLB_SHA256", digest)
          )
          page = (
              page.replace("WRE_STEREO_MAE", f"{mae:.3f}")
              .replace("WRE_SIFT_RMSE", f"{rmse:.3f}")
              .replace("WRE_TRACKS", str(tracks))
          )
          for marker, (content, image_hash) in evidence.items():
              page = page.replace("WRE_" + marker + "_BASE64", content)
              page = page.replace("WRE_" + marker + "_SHA", image_hash)
          # Verify the browser artifact carries EXACTLY the validated source GLB.
          inline = page.split("data:model/gltf-binary;base64,", 1)[1].split('"', 1)[0]
          assert base64.b64decode(inline, validate=True) == payload
          assert page.count("data:model/gltf-binary;base64,") == 1
          assert page.count("data:image/png;base64,") == len(evidence)
          for marker, (image_bytes_base64, image_hash) in evidence.items():
              assert image_hash in page
              assert page.count(image_bytes_base64) == 1
              assert base64.b64decode(image_bytes_base64, validate=True) == (
                  output / dict(images)[marker]
              ).read_bytes()
          assert 'src="./wre-model-viewer-4.1.0.min.js"' in page
          assert 'id="wre-scene-choice"' in page
          assert 'id="wre-local-glb"' in page
          assert 'id="wre-measure-toggle"' in page
          assert 'id="wre-path-toggle"' in page
          assert 'hotspot-wre-pick-' in page
          assert 'wre.relative_3d_surface_polyline.v1' in page
          assert 'id="wre-angle-toggle"' in page
          assert 'wre.relative_3d_chord_angle.v1' in page
          assert 'id="wre-measure-export"' in page
          assert 'distance_model_units' in page
          assert 'positionAndNormalFromPoint' in page
          assert 'model units (NOT meters' in page
          assert 'URL.createObjectURL(file)' in page
          assert 'src="./wre-real-stereo-sift-estimated-cameras.glb"' not in page
          assert "./wre-real-stereo-sift-estimated-cameras.glb" in page
          assert "./wre-real-stereo-sift-colmap-dataset.zip" in page
          for label, filename in cloud_assets:
              assert f'<option value="{label}">' in page
              assert "./" + filename in page
              assert cloud_digests[label] in page
          assert sift_digest in page
          assert "WRE_SIFT_GLB_SHA256" not in page
          assert "WRE_STEREO_GLB_SHA256" not in page
          assert "WRE_QUALITY_GLB_SHA256" not in page
          assert "cdnjs.cloudflare.com" not in page
          viewer = output / "wre-real-stereo-cpu-viewer.html"
          viewer.write_text(page, encoding="utf-8")
          assert viewer.stat().st_size > len(payload)
          print(
              f"Real-photo stereo 3D viewer: {viewer.name}; GLB SHA256 {digest}; "
              f"HTML bytes {viewer.stat().st_size}. Browser render not CI-tested."
          )
          PY

