          assert ply.stat().st_size > 250
          # Preserve observed 2D/3D tracks: PLY alone loses pixel associations.
          track_path = root / "wre-real-stereo-sift-observed-tracks.json"
          tracks = {
              "source_montage_sha256": hashlib.sha256(
                  (root / "wre-real-stereo-cpu-photos.png").read_bytes()
              ).hexdigest(),
              "estimated_pose_sha256": hashlib.sha256(
                  (root / "wre-real-stereo-sift-estimated-pose.json").read_bytes()
              ).hexdigest(),
              "source_ply_sha256": hashlib.sha256(ply.read_bytes()).hexdigest(),
              "coordinate_system": "left_camera_opencv_xyz_arbitrary_scale",
              "image_coordinates": "left_and_right_crop_pixel_xy",
              "track_count": len(xyz),
              "left_observed_xy": p0.tolist(),
              "right_observed_xy": p1.tolist(),
              "triangulated_xyz": xyz.tolist(),
              "left_observed_rgb": rgb.tolist(),
              "left_reprojected_xy": uv0.tolist(),
              "right_reprojected_xy": uv1.tolist(),
          }
          track_path.write_text(
              json.dumps(tracks, sort_keys=True, allow_nan=False) + "\n", encoding="utf-8"
          )
          reloaded = json.loads(track_path.read_text(encoding="utf-8"))
          assert reloaded["track_count"] == len(xyz) >= 20
          for name, expected in (
