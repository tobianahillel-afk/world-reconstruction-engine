              "triangulated_positive_depth_rgb_points": int(len(xyz)),
              "two_view_in_sample_reprojection_rmse_pixels": rmse,
              "two_view_in_sample_reprojection_median_pixels": median,
              "two_view_in_sample_reprojection_p95_pixels": p95,
              "reprojection_diagnostic_png": diagnostic_path.name,
              "reprojection_diagnostic_sha256": diagnostic_sha256,
              "estimated_rotation_world_to_right_camera": R.tolist(),
              "estimated_translation_direction_world_to_right_camera": t.ravel().tolist(),
              "intrinsics_approximate": K.tolist(),
              "estimated_translation_metric_scale_known": False,
              "external_pose_or_precomputed_3d_tracks_used_in_solver": False,
              "reprojection_error_is_held_out": False,
              "gpu_execution": False,
              "gaussian_training": False,
              "dynamic_4d_scene": False,
          }
          (root / "wre-real-stereo-sift-estimated-pose.json").write_text(
              json.dumps(record, sort_keys=True, indent=2) + "\n"
