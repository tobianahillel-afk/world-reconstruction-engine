            <script>
              const scene = document.getElementById("wre-scene");
              const chooser = document.getElementById("wre-scene-choice");
              // The gallery passes only measured finite model-unit XYZ via URL.
              // The observed disparity frame has Y-down/Z-forward; glTF uses
              // Y-up/Z-back. This is a marker, not surface alignment/metric GT.
              const observedKeys = ["stereo_x", "stereo_y", "stereo_z"];
              const inspectedParams = new URLSearchParams(location.search);
              if (observedKeys.every(key => inspectedParams.has(key))) {
                const observed = observedKeys.map(key => Number(inspectedParams.get(key)));
                if (observed.every(v => Number.isFinite(v) && Math.abs(v) < 1000000)
                    && observed[2] > 0) {
