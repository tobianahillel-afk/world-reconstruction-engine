          (output / "wre-real-stereo-cpu-metrics.json").write_text(
              json.dumps(metrics, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(
              f"REAL-photograph CPU stereo: {len(xyz)} points, "
              f"{coverage:.1%} disparity coverage, "
