                for (const hit of hits.slice(1)) {
                  const d=Math.hypot(...hit.pos.map((n,i)=>n-a.pos[i]));
                  if (d>maxD) { maxD=d; b=hit; }
                }
                if (!b || !(maxD>0)) return {points:null,count:hits.length,maxD};
                let c=null, maxArea=0;
                for (const hit of hits) {
                  const u=b.pos.map((n,i)=>n-a.pos[i]);
                  const v=hit.pos.map((n,i)=>n-a.pos[i]);
                  const area=0.5*Math.hypot(
                    u[1]*v[2]-u[2]*v[1],
                    u[2]*v[0]-u[0]*v[2],
                    u[0]*v[1]-u[1]*v[0]
                  );
                  if (area>maxArea) { maxArea=area; c=hit; }
                }
                const valid=c && maxArea>maxD*maxD*1e-6;
                return {points:valid?[a,b,c]:null,count:hits.length,maxD,maxArea};
              """
              # One browser interaction samples and clicks the SAME current
              # mesh view. A separate scan followed by another WebDriver call
              # can become stale while the native camera is still settling.
              area_interaction = f"""
                const scene=document.getElementById('wre-scene');
                const button=document.getElementById('wre-area-toggle');
                scene.jumpCameraToGoal();
                // Take the first two REAL scene points, then choose the
                // third against the POSITIONS ACTUALLY RECORDED by clicks.
                // Prior source used a stale 3rd screen hit: Chrome run
                // 39026261749 then produced three collinear points (zero area).
                const fresh=(() => {{ {area_scan} }})();
                if (!fresh.points) return {{error:'area mesh sample vanished', count:fresh.count}};
                window.__wreClickedRaycasts=[];
                for (const p of fresh.points.slice(0,2)) {{
                  const hit=scene.positionAndNormalFromPoint(p.x,p.y);
                  if (!hit || !hit.position) continue;
                  window.__wreCapturingClick=true;
                  scene.dispatchEvent(new MouseEvent('click', {{
                    bubbles:true, clientX:p.x, clientY:p.y
                  }}));
                  window.__wreCapturingClick=false;
                }}
                if (window.__wreClickedRaycasts.length === 2 &&
                    scene.querySelectorAll('.wre-pick-marker').length === 2) {{
                  const [a,b]=window.__wreClickedRaycasts;
                  const u=b.map((v,i)=>v-a[i]);
                  const edge=Math.hypot(...u);
                  const box=scene.getBoundingClientRect(), candidates=[];
                  for (let yi=0;yi<=10;yi++) for (let xi=0;xi<=10;xi++) {{
                    const x=box.left+box.width*(0.15+0.7*xi/10);
                    const y=box.top+box.height*(0.15+0.7*yi/10);
                    const hit=scene.positionAndNormalFromPoint(x,y);
                    if (!hit || !hit.position) continue;
                    const v=[hit.position.x-a[0],hit.position.y-a[1],
                             hit.position.z-a[2]];
                    const area2=Math.hypot(
                      u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],
                      u[0]*v[1]-u[1]*v[0]);
                    if (area2>edge*edge*1e-6) candidates.push({{x,y,area2}});
                  }}
                  candidates.sort((p,q)=>q.area2-p.area2);
                  for (const p of candidates) {{
                    if (window.__wreClickedRaycasts.length !== 2) break;
                    window.__wreCapturingClick=true;
                    scene.dispatchEvent(new MouseEvent('click', {{
                      bubbles:true, clientX:p.x, clientY:p.y
                    }}));
                    window.__wreCapturingClick=false;
                  }}
                }}
                const clicked=window.__wreClickedRaycasts;
                let area2=0, edge2=0;
                if (clicked.length === 3) {{
                  const [a,b,c]=clicked;
                  const u=b.map((v,i)=>v-a[i]);
                  const v=c.map((n,i)=>n-a[i]);
                  edge2=Math.hypot(...u)**2;
                  area2=Math.hypot(
                    u[1]*v[2]-u[2]*v[1],
                    u[2]*v[0]-u[0]*v[2],
                    u[0]*v[1]-u[1]*v[0]);
                }}
                if (!(clicked.length===3 && area2>edge2*1e-6)) {{
                  // Reject zero-area or incomplete REAL raycast selections;
                  // reset and retry instead of accepting a false area proof.
                  const count=clicked.length;
                  button.click();
                  button.click();
                  return {{error:'noncollinear area click not completed',
                           count,area2,edge2}};
                }}
                return {{
                  status:document.getElementById('wre-measure-result').textContent,
                  pressed:button.getAttribute('aria-pressed'),
                  enabled:!document.getElementById('wre-measure-export').disabled,
                  stoppedAutoRotate:!scene.hasAttribute('auto-rotate'),
                  clicked:clicked.slice(),
                  triangleArea:area2/2,
                  markerCount:scene.querySelectorAll('.wre-pick-marker').length
                }};
              """
              area_status = js(area_interaction)
              for _ in range(15):
                  if len(area_status.get("clicked", [])) == 3:
                      break
                  time.sleep(0.4)
                  area_status = js(area_interaction)
              assert area_status.get("clicked") and len(area_status["clicked"]) == 3, area_status
              assert area_status["markerCount"] == 3
              assert area_status["pressed"] == "true"
              assert area_status["enabled"] and area_status["stoppedAutoRotate"]
              assert area_status["triangleArea"] > 0, area_status
              assert "3D triangle-fan area:" in area_status["status"]
              assert "NOT physical surface area or m²" in area_status["status"]
              js("""
                window.__wreExportedMeasurement = null;
                document.getElementById('wre-measure-export').click();
              """)
              area_json = json.loads(until("return window.__wreExportedMeasurement;"))
              assert area_json["schema"] == "wre.relative_3d_triangle_fan_area.v1"
              assert area_json["model_source"] == "surface"
              assert area_json["metric_scale_known"] is False
              assert area_json["units"] == "model_units_squared"
              assert area_json["triangulation"] == "fan_from_first_point"
              assert area_json["physical_surface_area"] is False
              assert area_json["points_xyz"] == area_status["clicked"]
              a,b,c = area_status["clicked"]
              u=[b[i]-a[i] for i in range(3)]
              v=[c[i]-a[i] for i in range(3)]
              cross=(
                  u[1]*v[2]-u[2]*v[1],
                  u[2]*v[0]-u[0]*v[2],
                  u[0]*v[1]-u[1]*v[0],
              )
              expected_area=0.5*math.sqrt(sum(x*x for x in cross))
              assert expected_area > 0.0
              assert abs(expected_area-area_status["triangleArea"]) < 1e-6
              assert len(area_json["triangle_areas_model_units_squared"]) == 1
              assert abs(area_json["triangle_areas_model_units_squared"][0]-expected_area) < 1e-6
              assert abs(area_json["total_area_model_units_squared"]-expected_area) < 1e-6
              assert js("""
                document.getElementById('wre-area-toggle').click();
                return document.getElementById('wre-measure-export').disabled &&
                  document.getElementById('wre-scene').hasAttribute('auto-rotate') &&
                  document.querySelectorAll('.wre-pick-marker').length === 0;
              """)

              # Roundtrip real photographed mesh raycast triangle-fan area.
