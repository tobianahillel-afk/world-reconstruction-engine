                      if all(
                          (ob["pixel"][0]-peer["pixel"][0])**2+
                          (ob["pixel"][1]-peer["pixel"][1])**2>64
                          for other,peer in second_available if other!=pid
                      )
                  ),None
              )
              assert second_pick is not None, (
                  "No isolated real camera B observation for reverse 2D-to-3D navigation"
              )
              second_id,second_obs=second_pick
              assert js("""
                const img=document.getElementById('wre-photo-image-b');
                if(img.hidden || !img.complete) return false;
                const r=img.getBoundingClientRect();
                img.dispatchEvent(new MouseEvent('click',{
                  bubbles:true,
                  clientX:r.left+__U__*r.width/img.naturalWidth,
                  clientY:r.top+__V__*r.height/img.naturalHeight
                }));
                return true;
              """.replace("__U__",repr(second_obs["pixel"][0]))
                 .replace("__V__",repr(second_obs["pixel"][1])))
              for _ in range(60):
                  second_state=js("""
                    const marker=document.getElementById('wre-native-photo-pixel-b');
                    return {
                      point:document.getElementById('wre-native-point-id').value,
                      cameraA:document.getElementById('wre-camera-choice').value,
                      cameraB:document.getElementById('wre-baseline-choice').value,
                      overlay:!marker.hidden,
                      pixel:[Number(marker.dataset.pixelX),Number(marker.dataset.pixelY)],
                      left:parseFloat(marker.style.left),
                      top:parseFloat(marker.style.top),
                      status:document.getElementById('wre-native-observation-status').textContent
                    };
                  """)
                  if (second_state["point"]==str(second_id)
                      and second_state["cameraA"]=="0"
                      and second_state["cameraB"]==str(best_overlap_index)
                      and second_state["overlay"]
                      and "Selected by clicking" in second_state["status"]):
                      break
                  time.sleep(0.1)
              else:
                  raise RuntimeError("Camera B photo pixel failed reverse SfM navigation")
              assert all(
                  math.isclose(actual,expected,abs_tol=1e-7)
                  for actual,expected in zip(
                      second_state["pixel"],second_obs["pixel"],strict=True
                  )
              )
              assert math.isclose(
                  second_state["left"],
                  100*second_obs["pixel"][0]/second_camera["image_width"],
                  abs_tol=1e-4,
              )
              assert math.isclose(
                  second_state["top"],
                  100*second_obs["pixel"][1]/second_camera["image_height"],
                  abs_tol=1e-4,
              )
              # Restore original camera pair for the existing A/B point and
              # screenshot tests. Its SfM pixel evidence remains unchanged.
              assert js("""
                const camera=document.getElementById('wre-camera-choice');
                camera.value='0';
                camera.dispatchEvent(new Event('change',{bubbles:true}));
                return camera.value==='0';
              """)
              # A native Point3D observed by BOTH chosen cameras must place
              # independent A and B markers at the two actual measured pixels.
              common=next(
                  (
                      (int(pid),a,b)
                      for pid,point in lookup["points"].items()
                      for a in point["observations"]
                      for b in point["observations"]
                      if a["image_id"]==overlay_cameras[0]["image_id"]
                      and a["image_name"]==overlay_cameras[0]["image_name"]
                      and b["image_id"]==second_camera["image_id"]
                      and b["image_name"]==second_camera["image_name"]
                      and 0<=a["pixel"][0]<overlay_cameras[0]["image_width"]
                      and 0<=a["pixel"][1]<overlay_cameras[0]["image_height"]
                      and 0<=b["pixel"][0]<second_camera["image_width"]
                      and 0<=b["pixel"][1]<second_camera["image_height"]
                  ),None
              )
              assert common is not None, "No real common SfM 3D point in camera A/B"
              common_id,common_a,common_b=common
              assert js("""
                const input=document.getElementById('wre-native-point-id');
                input.value='__ID__';
                document.getElementById('wre-native-point-find').click();
                return true;
              """.replace("__ID__",str(common_id)))
              for _ in range(60):
                  common_ready=js("""
                    const select=document.getElementById('wre-native-observation-camera');
                    return !select.disabled && [...select.options].some(o=>o.value==='0');
                  """)
                  if common_ready:
                      break
                  time.sleep(.1)
              else:
                  raise RuntimeError("Real common SfM point was not found in browser")
              assert js("""
                const select=document.getElementById('wre-native-observation-camera');
                select.value='0';
                document.getElementById('wre-native-observation-open').click();
                return true;
              """)
              for _ in range(60):
                  dual=js("""
                    const a=document.getElementById('wre-native-photo-pixel');
                    const b=document.getElementById('wre-native-photo-pixel-b');
                    return {
                      cameraA:document.getElementById('wre-camera-choice').value,
                      cameraB:document.getElementById('wre-baseline-choice').value,
                      hiddenA:a.hidden,hiddenB:b.hidden,
                      pixelA:[Number(a.dataset.pixelX),Number(a.dataset.pixelY)],
                      pixelB:[Number(b.dataset.pixelX),Number(b.dataset.pixelY)]
                    };
                  """)
                  if not dual["hiddenA"] and not dual["hiddenB"]:
                      break
                  time.sleep(.1)
              else:
                  raise RuntimeError("Common native SfM point did not overlay both photos")
              assert dual["cameraA"]=="0" and dual["cameraB"]==str(best_overlap_index)
              for actual,expected in (
                  (dual["pixelA"],common_a["pixel"]),
                  (dual["pixelB"],common_b["pixel"]),
              ):
                  assert all(
                      math.isclose(x,y,abs_tol=1e-7)
                      for x,y in zip(actual,expected,strict=True)
                  )
              # The very same native 3D track must display the opposite
              # measured pixels when camera A and B are reversed.
              reversed_text=js("""
                const a=document.getElementById('wre-camera-choice');
                const b=document.getElementById('wre-baseline-choice');
                const previousB=b.value;
                a.value=previousB;
                a.dispatchEvent(new Event('change',{bubbles:true}));
                b.value='0';
                b.dispatchEvent(new Event('change',{bubbles:true}));
                const marker=document.querySelector('[slot="hotspot-pair-shared-0"]');
                if(!marker) throw Error('Measured shared landmark missing after pair reversal');
                marker.click();
                const text=document.getElementById('wre-landmark-inspection').textContent;
                a.value='0';
                a.dispatchEvent(new Event('change',{bubbles:true}));
                b.value=previousB;
                b.dispatchEvent(new Event('change',{bubbles:true}));
                return text;
              """)
              assert "camera A measured pixel (" in reversed_text
              assert ", ".join(f"{value:.2f}" for value in point[8:10]) in reversed_text
              assert ", ".join(f"{value:.2f}" for value in point[6:8]) in reversed_text
              same_camera=js("""
                const second=document.getElementById('wre-baseline-choice');
                second.value='0';
                second.dispatchEvent(new Event('change',{bubbles:true}));
                return document.getElementById('wre-camera-baseline').textContent;
              """)
              assert "0.000000 local SfM units" in same_camera
              assert "Select a green shared 3D landmark" in js(
                "return document.getElementById('wre-landmark-inspection').textContent;")
              assert js("""
                return !document.querySelector('[slot^="hotspot-pair-shared-"]');
              """), "Shared 3D hotspots were not cleared on same-camera selection"
              # Real browser File API: use the actual generated 3D GLB as if
              # selected locally. This is a real WebGL interaction, no GPU CUDA.
              local_result = call("POST", f"/session/{session}/execute/async", {
                  "script": """
                    const done=arguments[arguments.length-1];
                    fetch('./wre-real16-viewable-scene.glb')
                      .then(response=>{
                        if(!response.ok) throw Error('Missing actual RGB scene');
                        return response.arrayBuffer();
                      })
                      .then(binary=>{
                        const file=new File([binary], 'my-reconstruction.glb',
                          {type:'model/gltf-binary'});
                        const transfer=new DataTransfer();
                        transfer.items.add(file);
                        const input=document.getElementById('wre-local-glb');
                        input.files=transfer.files;
                        input.dispatchEvent(new Event('change',{bubbles:true}));
                        done({ok:true,bytes:file.size});
                      })
                      .catch(error=>done({ok:false,error:String(error)}));
                  """,
                  "args": [],
              })
              assert local_result["ok"] and local_result["bytes"] == len(binary)
              for _ in range(40):
                  if js("""
                    const viewer=document.getElementById('wre-scene');
                    const camera=document.getElementById('wre-camera-choice');
                    return viewer.loaded && viewer.getAttribute('src').startsWith('blob:') &&
                      camera.disabled &&
                      document.getElementById('wre-baseline-choice').disabled &&
                      document.getElementById('wre-frame-baseline').disabled &&
                      document.getElementById('wre-nearest-camera').disabled &&
                      document.getElementById('wre-most-shared-camera').disabled &&
                      !viewer.querySelector('[slot^="hotspot-pair-"]') &&
                      document.getElementById('wre-camera-baseline').textContent
                        .includes('unavailable for unverified') &&
                      document.getElementById('local-model-status')
                        .textContent.includes('Local GLB loaded') &&
                      document.getElementById('wre-sfm-quality').hidden;
                  """):
                      break
                  time.sleep(0.25)
              else:
                  raise RuntimeError("Real Chrome local GLB import did not render")
              # A real Chrome/WebGL PNG is generated from the selected
              # LOCAL file, without exporting the original SfM provenance.
              assert js("""
                const click=HTMLAnchorElement.prototype.click;
                let saved=null;
                try {
                  HTMLAnchorElement.prototype.click=function(){
                    saved={name:this.download,data:this.href};
                  };
                  document.getElementById('wre-export-png').click();
                } finally {
                  HTMLAnchorElement.prototype.click=click;
                }
                if(!saved || saved.name!=='wre-local-3d-view.png' ||
                    !saved.data.startsWith('data:image/png;base64,')) return false;
                const raw=atob(saved.data.split(',')[1]);
                return raw.length>1000 && raw.charCodeAt(0)===137 &&
                  raw.slice(1,4)==='PNG' &&
                  document.getElementById('local-model-status').textContent
                    .includes('PNG view saved locally');
              """), "Real Chrome local GLB failed to export its WebGL PNG"
              assert js("""
                const input=document.getElementById('wre-local-glb');
                const viewer=document.getElementById('wre-scene');
                const original=viewer.getAttribute('src');
                const file=new File([new Uint8Array([1,2,3])],'broken.glb');
                const transfer=new DataTransfer();
                transfer.items.add(file);
                input.files=transfer.files;
                input.dispatchEvent(new Event('change',{bubbles:true}));
                return viewer.getAttribute('src')===original &&
                  document.getElementById('local-model-status')
                    .textContent.includes('Local import rejected');
              """), "Corrupt local GLB unexpectedly replaced the loaded scene"
              assert js("""
                document.getElementById('wre-restore-demo').click();
                const viewer=document.getElementById('wre-scene');
                const camera=document.getElementById('wre-camera-choice');
                return viewer.getAttribute('src')==='./wre-real16-viewable-scene.glb' &&
                  !camera.disabled && viewer.hasAttribute('auto-rotate') &&
                  document.getElementById('wre-frame-baseline').disabled &&
                  document.getElementById('wre-nearest-camera').disabled &&
                  !viewer.querySelector('[slot^="hotspot-pair-"]') &&
                  !document.getElementById('wre-sfm-quality').hidden;
              """), "Original real-photo viewer or camera control was not restored"
              for _ in range(40):
                  if js("""
                    const viewer=document.getElementById('wre-scene');
                    return viewer.loaded && viewer.getAttribute('src')===
                      './wre-real16-viewable-scene.glb';
                  """):
                      break
                  time.sleep(0.25)
              else:
                  raise RuntimeError("Original 16-camera GLB did not reload")
              assert js("""
                const click=HTMLAnchorElement.prototype.click;
                let saved=null;
                try {
                  HTMLAnchorElement.prototype.click=function(){
                    saved={name:this.download,data:this.href};
                  };
                  document.getElementById('wre-export-png').click();
                } finally {
                  HTMLAnchorElement.prototype.click=click;
                }
                return Boolean(saved && saved.name==='wre-real16-sfm-view.png' &&
                  saved.data.startsWith('data:image/png;base64,') &&
                  atob(saved.data.split(',')[1]).length>1000);
              """), "Restored genuine SfM GLB failed to export its WebGL PNG"
              print("REAL CHROME LOCAL GLB PASS: real SfM GLB loaded via File, "
                    "malformed rejected, source camera controls restored")
              png = base64.b64decode(
                  call("GET", f"/session/{session}/screenshot"), validate=True
              )
              assert png.startswith(bytes.fromhex("89504e470d0a1a0a"))
              assert len(png) > 10000
              (proof / "real16-browser-render.png").write_bytes(png)
              (proof / "browser-verification.json").write_text(
                  json.dumps({
                      "source_glb_sha256": receipt["sha256"],
                      "registered_cameras": 16,
                      "browser": "Chrome headless",
                      "backend": "CPU SwiftShader WebGL",
                      "real_gltf_loaded": True,
                      "webgl_context": True,
                      "screenshot_sha256": hashlib.sha256(png).hexdigest(),
                      "metric_scale_known": False,
                      "gpu_training_executed": False,
                      "temporal_reconstruction_executed": False,
                  }, indent=2, sort_keys=True) + "\n"
              )
              print("Real Chrome CPU WebGL loaded the 16-camera SfM GLB.")
          finally:
              call("DELETE", f"/session/{session}")
          PY

      - name: Retain real Chrome 3D rendering evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wre-real16-browser-render-proof
          path: wre-real16-browser-proof/
          if-no-files-found: warn
          retention-days: 7
