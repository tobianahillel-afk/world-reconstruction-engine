      - name: Recover two-view pose and 3D directly from real SIFT photograph matches (CPU)
        shell: bash
        run: |
          set -euo pipefail
          "$COMMON_PYTHON" - <<'PY'
          import hashlib
          import json
          import math
          import struct
          import os
          import zipfile
          from pathlib import Path

          import cv2
          import numpy as np
          from scipy.spatial.transform import Rotation

          root = Path(os.environ["RUNNER_TEMP"])
          metadata = json.loads((root / "wre-real-stereo-cpu-metrics.json").read_text())
          photographs = cv2.imread(str(root / "wre-real-stereo-cpu-photos.png"))
          assert photographs is not None and photographs.shape[1] % 2 == 0
          h, w2 = photographs.shape[:2]
          w = w2 // 2
          assert [h, w] == metadata["processed_photo_height_width"]
          left, right = photographs[:, :w], photographs[:, w:]
          focal = float(metadata["approximate_focal_pixels"])
          K = np.array([[focal, 0, (w - 1) / 2],
                        [0, focal, (h - 1) / 2], [0, 0, 1]], dtype=np.float64)
          sift = cv2.SIFT_create(nfeatures=3000, contrastThreshold=0.015)
          key0, des0 = sift.detectAndCompute(cv2.cvtColor(left, cv2.COLOR_BGR2GRAY), None)
          key1, des1 = sift.detectAndCompute(cv2.cvtColor(right, cv2.COLOR_BGR2GRAY), None)
          assert des0 is not None and des1 is not None
          pairs = []
          for nearest in cv2.BFMatcher(cv2.NORM_L2).knnMatch(des0, des1, k=2):
              if len(nearest) != 2:
                  continue
              a, b = nearest
              p0, p1 = key0[a.queryIdx].pt, key1[a.trainIdx].pt
              if (a.distance < 0.8 * b.distance and
                  abs(p0[1] - p1[1]) < 2.5 and
                  1.5 < p0[0] - p1[0] < 160):
                  pairs.append((p0, p1))
          assert len(pairs) >= 25, f"Only {len(pairs)} SIFT real-photo matches"
          p0 = np.array([x for x, _ in pairs], dtype=np.float64)
          p1 = np.array([y for _, y in pairs], dtype=np.float64)
          cv2.setRNGSeed(20261017)
          E, mask = cv2.findEssentialMat(
              p0, p1, K, method=cv2.RANSAC, prob=0.999, threshold=1.5
          )
          assert E is not None and E.shape == (3, 3)
          inlier_count, R, t, mask = cv2.recoverPose(E, p0, p1, K, mask=mask)
          inliers = mask.ravel() != 0
          assert inlier_count == int(inliers.sum()) >= 20
          p0, p1 = p0[inliers], p1[inliers]
          P0 = K @ np.column_stack((np.eye(3), np.zeros(3)))
          P1 = K @ np.column_stack((R, t))
          homogeneous = cv2.triangulatePoints(P0, P1, p0.T, p1.T)
          xyz = np.full((len(p0), 3), np.nan, dtype=np.float64)
          finite_w = np.abs(homogeneous[3]) > 1e-10
          xyz[finite_w] = (homogeneous[:3, finite_w] / homogeneous[3, finite_w]).T
          z1 = (R @ xyz.T + t).T[:, 2]
          accepted = np.isfinite(xyz).all(axis=1) & (xyz[:, 2] > 1e-6) & (z1 > 1e-6)
          assert accepted.sum() >= 20
          xyz, p0, p1 = xyz[accepted], p0[accepted], p1[accepted]
          X = np.column_stack((xyz, np.ones(len(xyz))))
          projection0 = (P0 @ X.T).T
          projection1 = (P1 @ X.T).T
          uv0 = projection0[:, :2] / projection0[:, 2:3]
          uv1 = projection1[:, :2] / projection1[:, 2:3]
          rmse = float(np.sqrt((
              np.square(uv0 - p0).sum() + np.square(uv1 - p1).sum()
          ) / (2 * len(xyz))))
          assert np.isfinite(rmse) and rmse < 8.0
          xy = np.rint(p0).astype(int)
          xy[:, 0] = np.clip(xy[:, 0], 0, w - 1)
          xy[:, 1] = np.clip(xy[:, 1], 0, h - 1)
          rgb = left[xy[:, 1], xy[:, 0], ::-1]
          # Visual proof using ACTUAL image observations and SIFT-derived 3D.
          # Circles=observed pixels; white crosses=reprojected XYZ; lines=residuals.
          # Metrics are in-sample, NEVER held-out reconstruction accuracy.
          residuals = np.sqrt(
              (np.square(uv0 - p0).sum(axis=1)
               + np.square(uv1 - p1).sum(axis=1)) / 2.0
          )
          assert len(residuals) == len(xyz) and np.all(np.isfinite(residuals))
          assert np.isclose(np.sqrt(np.mean(residuals**2)), rmse, atol=1e-8)
          banner = 38
          diagnostic = np.zeros((h + banner, 2 * w, 3), dtype=np.uint8)
          diagnostic[banner:, :w] = left
          diagnostic[banner:, w:] = right
          for i, (observed, projected) in enumerate(((p0, uv0), (p1, uv1))):
              horizontal_offset = i * w
              for obs, pred, error in zip(observed, projected, residuals, strict=True):
                  observed_at = (
                      int(round(obs[0])) + horizontal_offset, int(round(obs[1])) + banner
                  )
                  predicted_at = (
                      int(round(pred[0])) + horizontal_offset, int(round(pred[1])) + banner
                  )
                  if not (horizontal_offset <= observed_at[0] < horizontal_offset + w
                          and banner <= observed_at[1] < banner + h):
                      continue
                  color = (20, 200, 40) if error <= 2.0 else (20, 100, 255)
                  if (horizontal_offset <= predicted_at[0] < horizontal_offset + w
                          and banner <= predicted_at[1] < banner + h):
                      cv2.line(diagnostic, observed_at, predicted_at, color, 1)
                      cv2.drawMarker(
                          diagnostic, predicted_at, (255, 255, 255),
                          cv2.MARKER_CROSS, markerSize=5, thickness=1,
                      )
                  cv2.circle(diagnostic, observed_at, 2, color, thickness=-1)
          p95 = float(np.percentile(residuals, 95))
          median = float(np.median(residuals))
          cv2.putText(
              diagnostic,
              f"REAL SIFT observed vs 3D projection | in-sample RMSE {rmse:.2f}px",
              (8, 15), cv2.FONT_HERSHEY_SIMPLEX, 0.41, (255, 255, 255), 1,
          )
          cv2.putText(
              diagnostic,
              f"Left / right | {len(xyz)} tracks | p95 {p95:.2f}px | green <=2px",
              (8, 31), cv2.FONT_HERSHEY_SIMPLEX, 0.41, (255, 255, 255), 1,
          )
          diagnostic_path = root / "wre-real-stereo-sift-observed-reprojection.png"
          assert cv2.imwrite(str(diagnostic_path), diagnostic)
          decoded_diagnostic = cv2.imread(str(diagnostic_path), cv2.IMREAD_COLOR)
          assert decoded_diagnostic is not None
          assert decoded_diagnostic.shape == (h + banner, 2 * w, 3)
          diagnostic_sha256 = hashlib.sha256(diagnostic_path.read_bytes()).hexdigest()
          assert diagnostic_path.stat().st_size > 1000
          ply = root / "wre-real-stereo-sift-estimated-3d.ply"
          with ply.open("w", encoding="ascii") as file:
              file.write("ply\nformat ascii 1.0\n" +
                         f"element vertex {len(xyz)}\n" +
                         "property float x\nproperty float y\nproperty float z\n" +
                         "property uchar red\nproperty uchar green\nproperty uchar blue\nend_header\n")
              for point, color in zip(xyz, rgb, strict=True):
                  file.write(
                      f"{point[0]:.8g} {point[1]:.8g} {point[2]:.8g} " +
