name: gsplat-common-runtime-import

# One exact Python/Torch/CUDA environment for the pinned trainer's *eager imports*.
# CPU-hosted CUDA toolkit only: no GPU kernels, reconstruction, or training.
on:
  pull_request:
    paths:
      - ".github/workflows/gsplat-common-runtime-import.yml"
      - "registry/dependencies.yaml"
      - "src/wre/reconstruction/static_appearance_baseline.py"
      - "tests/test_static_appearance_baseline.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined-native-import:
    name: pinned-trainer-eager-import-one-native-environment-no-gpu
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda@sha256:da6791294b0b04d7e65d87b7451d6f2390b4d36225ab0701ee7dfec5769829f5
    timeout-minutes: 120
    env:
      CUDA_HOME: /usr/local/cuda
      TORCH_CUDA_ARCH_LIST: "7.5"
      MAX_JOBS: "1"
      PYTHONPATH: ""
      GSPLAT_REVISION: 937e29912570c372bed6747a5c9bf85fed877bae
      GSPLAT_TREE: 90c3f0b2352e6d2725bcba1ef0407168f922c0fa
      GLM_REVISION: 33b4a621a697a305bc3a7610d290677b96beb181
      GLM_TREE: e57f342f0fb63852d65e0da2090528fdca9b0117
      SSIM_REVISION: 328dc9836f513d00c4b5bc38fe30478b4435cbb5
      SSIM_TREE: ac5f1d8fe5d519f9c44b220d235bf1f198463da7
      NERFVIEW_REVISION: 4538024fe0d15fd1a0e4d760f3695fc44ca72787
      NERFVIEW_TREE: e333400e39605978a3d1f9cf6d73ddf577a8c8e3
      SCENE_MANAGER_REVISION: cc7ea4b7301720ac29287dbe450952511b32125e

    steps:
      - name: Checkout exact WRE dependency registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned uv and Python 3.10.21
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.10.21"
          enable-cache: false

      - name: Create one native environment and hash-pinned wheel manifest
        shell: bash
        run: |
          set -euo pipefail
          test -x "$CUDA_HOME/bin/nvcc"
          "$CUDA_HOME/bin/nvcc" --version | grep 'release 12.4,'
          uv venv --seed --python 3.10.21 "$RUNNER_TEMP/gsplat-common-venv"
          echo "COMMON_PYTHON=$RUNNER_TEMP/gsplat-common-venv/bin/python" >> "$GITHUB_ENV"
          uv run --no-project --with "pyyaml==6.0.2" python - <<'PY'
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlsplit
          import yaml

          record = yaml.safe_load(Path("registry/dependencies.yaml").read_text())[
              "dependencies"
          ]["gsplat_static_appearance"]["runtime_python_lock"]
          assert record["target"]["python"] == "3.10.21"
          assert record["target"]["torch_cuda"] == "12.4"
          assert record["gpu_execution_evidence"] is False
          wheels = record["packages"]
          assert len(wheels) == 76
          assert next(x for x in wheels if x["name"] == "torch")["version"] == "2.4.0+cu124"
          lines = []
          audit_versions = []
          for item in sorted(wheels, key=lambda entry: entry["name"].lower()):
              url, digest = item["url"], item["sha256"]
              parts = urlsplit(url)
              assert parts.scheme == "https" and not parts.fragment
              assert re.fullmatch("[0-9a-f]{64}", digest)
              lines.append(f'{item["name"]} @ {url}#sha256={digest}')
              audit_versions.append(f'{item["name"]}=={item["version"]}')
          (Path(os.environ["RUNNER_TEMP"]) / "common-locked-wheels.txt").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          (Path(os.environ["RUNNER_TEMP"]) / "common-locked-advisories.txt").write_text(
              "\n".join(audit_versions) + "\n", encoding="utf-8"
          )
          print(f"One common environment requires {len(wheels)} pinned wheels")
          PY

      - name: Install all 76 reviewed wheels without resolving new dependencies
        shell: bash
        run: |
          set -euo pipefail
          "$COMMON_PYTHON" -m pip install --no-index --no-deps --no-cache-dir \
            --require-hashes -r "$RUNNER_TEMP/common-locked-wheels.txt"
          "$COMMON_PYTHON" -m pip check
          "$COMMON_PYTHON" - <<'PY'
          import sys
          import numpy
          import torch
          assert sys.version.startswith("3.10.21")
          assert numpy.__version__ == "1.26.4"
          assert torch.__version__ == "2.4.0+cu124"
          assert torch.version.cuda == "12.4"
          assert not torch.cuda.is_available()
          print("Exact Python/Torch/CUDA wheel ABI loaded, GPU unavailable")
          PY

      - name: Install git for immutable upstream source checkout
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          # The pinned opencv-python wheel needs both libGL.so.1 and
          # libgthread-2.0.so.0 when the real COLMAP reader imports cv2.
          # Neither is included in the minimal Ubuntu 22.04 CUDA container.
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates libgl1 libglib2.0-0
          ldconfig -p | grep -F 'libGL.so.1'
          ldconfig -p | grep -F 'libgthread-2.0.so.0'

      - name: Materialize exact gsplat, fused-ssim, nerfview and legacy COLMAP sources
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/wre-common-upstream"
          mkdir -p "$root"
          fetch_exact() {
            name="$1"; remote="$2"; revision="$3"; tree="$4"
            git init -q "$root/$name"
            git -C "$root/$name" remote add origin "$remote"
            git -C "$root/$name" fetch --quiet --depth=1 origin "$revision"
            git -C "$root/$name" checkout --quiet --detach FETCH_HEAD
            test "$(git -C "$root/$name" rev-parse HEAD)" = "$revision"
            if test "$tree" != "-"; then
              test "$(git -C "$root/$name" rev-parse HEAD^{tree})" = "$tree"
            fi
          }
          fetch_exact gsplat https://github.com/nerfstudio-project/gsplat.git \
            "$GSPLAT_REVISION" "$GSPLAT_TREE"
          fetch_exact ssim https://github.com/rahul-goel/fused-ssim.git \
            "$SSIM_REVISION" "$SSIM_TREE"
          fetch_exact nerfview https://github.com/nerfstudio-project/nerfview.git \
            "$NERFVIEW_REVISION" "$NERFVIEW_TREE"
          fetch_exact scene-manager https://github.com/rmbrualla/pycolmap.git \
            "$SCENE_MANAGER_REVISION" "-"
          test "$(git -C "$root/gsplat" ls-tree HEAD gsplat/cuda/csrc/third_party/glm | awk '{print $3}')" = "$GLM_REVISION"
          git -C "$root/gsplat" submodule update --init --depth 1 -- gsplat/cuda/csrc/third_party/glm
          glm="$root/gsplat/gsplat/cuda/csrc/third_party/glm"
          test "$(git -C "$glm" rev-parse HEAD)" = "$GLM_REVISION"
          test "$(git -C "$glm" rev-parse HEAD^{tree})" = "$GLM_TREE"
          echo "COMMON_SOURCES=$root" >> "$GITHUB_ENV"

      - name: Build BOTH upstream CUDA extensions into the SAME Python interpreter
        shell: bash
        run: |
          set -euo pipefail
          export BUILD_NO_CUDA=0
          "$COMMON_PYTHON" -m pip install --no-deps --no-build-isolation --no-cache-dir \
            "$COMMON_SOURCES/ssim"
          "$COMMON_PYTHON" -m pip install --no-deps --no-build-isolation --no-cache-dir \
            "$COMMON_SOURCES/gsplat"
          # Install the exact selected nerfview checkout into site-packages.
          # The -I child in PR #234 does not insert this repo onto sys.path.
          "$COMMON_PYTHON" -m pip install --no-deps --no-build-isolation --no-cache-dir \
            "$COMMON_SOURCES/nerfview"
          # Same interpreter as PR #234's isolated child: install the exact
          # historical SceneManager package rather than patching sys.path.
          "$COMMON_PYTHON" -m pip install --no-deps --no-build-isolation --no-cache-dir \
            "$COMMON_SOURCES/scene-manager"

      - name: Actually import trainer, native extensions, viewer and COLMAP together
        shell: bash
        run: |
          set -euo pipefail
          "$COMMON_PYTHON" -I - <<'PY'
          import os
          import sys
          from pathlib import Path

          root = Path(os.environ["COMMON_SOURCES"])
          # Match the actual isolated trainer child (single source import root).
          sys.path.insert(0, str(root / "gsplat" / "examples"))
          import torch
          import gsplat
          from gsplat.cuda._backend import _C
          from fused_ssim import fused_ssim
          from nerfview import CameraState
          import pycolmap
          from pycolmap import SceneManager
          from datasets.colmap import Dataset, Parser
          from simple_trainer import Config, main

          assert gsplat.__version__ == "1.5.3"
          assert torch.__version__ == "2.4.0+cu124"
          assert not torch.cuda.is_available(), "CPU-hosted gate must not claim GPU"
          assert _C is not None and callable(fused_ssim)
          assert all(obj is not None for obj in (CameraState, SceneManager, Dataset, Parser, main))
          assert Path(pycolmap.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          cfg = Config()
          assert cfg.camera_model == "pinhole"
          print("ALL selected trainer native/viewer/COLMAP modules imported together.")
          print("No CUDA kernel, training, reconstruction, or GPU was executed.")
          PY

      # Execute WRE's exact optional trainer child against the true selected
      # interpreter, not a mocked subprocess. This runner has no GPU; the
      # production child MUST refuse before it can train or emit a Gaussian.
      - name: Run actual WRE trainer child and verify CPU-hosted CUDA refusal
        shell: bash
        run: |
          set -euo pipefail
          "$COMMON_PYTHON" -I - <<'PY'
          import ast
          import os
          import subprocess
          from pathlib import Path

          source = Path("src/wre/reconstruction/static_appearance_baseline.py")
          assignments = [
              statement for statement in ast.parse(source.read_text()).body
              if isinstance(statement, ast.Assign)
              and any(
                  isinstance(target, ast.Name)
                  and target.id == "_GSPLAT_TRAINER_CHILD"
                  for target in statement.targets
              )
          ]
          assert len(assignments) == 1
          child = ast.literal_eval(assignments[0].value)
          assert isinstance(child, str)
          assert "from simple_trainer import Config, main" in child

          source_examples = Path(os.environ["COMMON_SOURCES"]) / "gsplat" / "examples"
          assert source_examples.is_dir()
          environment = {
              key: os.environ[key] for key in ("PATH", "HOME", "LD_LIBRARY_PATH")
              if key in os.environ
          }
          environment.update({
              "CUDA_VISIBLE_DEVICES": "",
              "PYTHONNOUSERSITE": "1",
              "PIP_NO_INDEX": "1",
          })
          completed = subprocess.run(
              [
                  os.environ["COMMON_PYTHON"], "-I", "-c",
                  child, str(source_examples),
              ],
              input=b"{}",
              capture_output=True,
              cwd=source_examples,
              env=environment,
              timeout=120,
              check=False,
          )
          assert completed.returncode != 0, "CPU environment unexpectedly executed trainer"
          assert (
              b"gsplat requires an approved external runtime manifest digest"
              in completed.stderr
          ), completed.stderr.decode(errors="replace")[-4000:]
          print("Real pinned WRE trainer child rejected missing approved native manifest.")
          print("No Torch import, GPU kernel or Gaussian training ran.")
          PY

      - name: Record real imported Python and native-extension file hashes
        shell: bash
        run: |
          set -euo pipefail
          "$COMMON_PYTHON" -I - <<'PY'
          import hashlib
          import importlib
          import json
          import os
          import sys
          import sysconfig
          from pathlib import Path

          environment = Path(sys.prefix).resolve()
          packages = Path(sysconfig.get_path("purelib")).resolve(strict=True)
          if not packages.is_relative_to(environment):
              raise RuntimeError("Native receipt site-packages is outside the pinned environment")
          files = {}
          modules = ("torch", "torchvision", "numpy", "gsplat", "fused_ssim", "fused_ssim_cuda", "nerfview", "pycolmap")
          for name in modules:
              module = importlib.import_module(name)
              location = getattr(module, "__file__", None)
              if not location:
                  raise RuntimeError(f"Native manifest lacks module origin: {name}")
              origin = Path(location).resolve(strict=True)
              if not origin.is_relative_to(packages):
                  raise RuntimeError(f"Native module is outside pinned site-packages: {name}")

          # The approved receipt must bind EVERY importable Python/native file,
          # including otherwise unlisted transitive modules and top-level .so
          # modules. An exact digest for eight root packages is insufficient.
          for item in packages.rglob("*"):
              # A symlinked directory can hide executable files from rglob.
              # Record no implicit link escapes, including extensionless links.
              if item.is_symlink():
                  raise RuntimeError("Native receipt contains symbolic-link paths")
              if not (item.suffix.lower() in (".py", ".pyc", ".so", ".pyd", ".dylib", ".dll")
                      or ".so." in item.name):
                  continue
              if not item.is_file():
                  raise RuntimeError("Native receipt contains missing importable files")
              relative = item.relative_to(environment).as_posix()
              digest = hashlib.sha256()
              with item.open("rb") as data:
                  for chunk in iter(lambda: data.read(1024 * 1024), b""):
                      digest.update(chunk)
              files[relative] = digest.hexdigest()

          evidence = {
              "schema": "wre.gsplat.common_runtime_native_files.v1",
              "python": ".".join(map(str, sys.version_info[:3])),
              "gpu_executed": False,
              "source_revisions": {
                  "gsplat": os.environ["GSPLAT_REVISION"],
                  "fused_ssim": os.environ["SSIM_REVISION"],
                  "nerfview": os.environ["NERFVIEW_REVISION"],
              },
              "modules": list(modules),
              "files": [{"path": key, "sha256": files[key]} for key in sorted(files)],
          }
          target = Path(os.environ["RUNNER_TEMP"]) / "gsplat-common-runtime-native-files.json"
          target.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n")
          assert files and any(name.endswith(".so") for name in files)
          print(f"Recorded {len(files)} REAL installed module/native-file SHA-256 identities.")
          print("No CUDA device, kernel or training was executed.")
          PY

      - name: Verify approved native receipt before CUDA execution on CPU-only host
        shell: bash
        run: |
          set -euo pipefail
          # The pinned CUDA container has no bare `python` on PATH; the
          # exact CPython 3.10.21 interpreter is provisioned by setup-uv.
          "$COMMON_PYTHON" - <<'PY'
          import ast
          import hashlib
          import os
          import subprocess
          from pathlib import Path

          source = Path("src/wre/reconstruction/static_appearance_baseline.py")
          assignments = [
              statement for statement in ast.parse(source.read_text()).body
              if isinstance(statement, ast.Assign)
              and any(
                  isinstance(target, ast.Name)
                  and target.id == "_GSPLAT_TRAINER_CHILD"
                  for target in statement.targets
              )
          ]
          child = ast.literal_eval(assignments[0].value)
          manifest = Path(os.environ["RUNNER_TEMP"]) / "gsplat-common-runtime-native-files.json"
          expected_sha256 = hashlib.sha256(manifest.read_bytes()).hexdigest()
          examples = Path(os.environ["COMMON_SOURCES"]) / "gsplat" / "examples"
          environment = {
              key: os.environ[key] for key in ("PATH", "HOME", "LD_LIBRARY_PATH")
              if key in os.environ
          }
          environment.update({
              "CUDA_VISIBLE_DEVICES": "",
              "PYTHONNOUSERSITE": "1",
              "PIP_NO_INDEX": "1",
          })
          completed = subprocess.run(
              [os.environ["COMMON_PYTHON"], "-I", "-S", "-c", child,
               str(examples), str(manifest), expected_sha256],
              input=b"{}",
              capture_output=True,
              cwd=examples,
              env=environment,
              timeout=120,
              check=False,
          )
          assert completed.returncode != 0, "CPU environment unexpectedly executed trainer"
          assert b"gsplat reference training requires exactly one visible CUDA GPU" in completed.stderr, (
              completed.stderr.decode(errors="replace")[-4000:]
          )
          print("Approved live native manifest hashes and imports matched; no CUDA device available.")
          # Python -I alone still executes site-packages *.pth before the
          # receipt guard. Prove that risk, then prove -I -S suppresses it
          # without breaking the exact native import/GPU refusal path.
          import importlib.util
          torch_spec = importlib.util.find_spec("torch")
          assert torch_spec is not None and torch_spec.origin is not None
          startup_pth = Path(torch_spec.origin).parent.parent / "wre_unapproved_startup.pth"
          marker = Path(os.environ["RUNNER_TEMP"]) / "wre-pth-startup-marker"
          assert not startup_pth.exists()
          assert not marker.exists()
          try:
              startup_pth.write_text(
                  f"import pathlib; pathlib.Path({str(marker)!r}).write_text('injected')\n"
              )
              vulnerable = subprocess.run(
                  [os.environ["COMMON_PYTHON"], "-I", "-c", "pass"],
                  capture_output=True, env=environment, timeout=120, check=False,
              )
              assert vulnerable.returncode == 0, vulnerable.stderr.decode(errors="replace")
              assert marker.exists(), "The control must prove -I executes the injected .pth"
              marker.unlink()
              hardened = subprocess.run(
                  [os.environ["COMMON_PYTHON"], "-I", "-S", "-c", child,
                   str(examples), str(manifest), expected_sha256],
                  input=b"{}", capture_output=True, cwd=examples, env=environment,
                  timeout=120, check=False,
              )
              assert hardened.returncode != 0
              assert b"gsplat reference training requires exactly one visible CUDA GPU" in hardened.stderr, (
                  hardened.stderr.decode(errors="replace")[-4000:]
              )
              assert not marker.exists(), "The -S child must not execute startup .pth code"
          finally:
              startup_pth.unlink(missing_ok=True)
              marker.unlink(missing_ok=True)
          print("Unsafe .pth startup demonstrated with -I; hardened -I -S did not execute it.")
          # Negative control: a NEW importable Python file under a reviewed
          # package is untrusted even if all previously listed hashes match.
          # An entrypoint-only or .so-only receipt would incorrectly accept it.
          import importlib.util
          torch_spec = importlib.util.find_spec("torch")
          assert torch_spec is not None and torch_spec.origin is not None
          rogue = Path(torch_spec.origin).parent / "wre_unapproved_trainer_import.py"
          assert not rogue.exists()
          try:
              rogue.write_text("raise RuntimeError('unapproved python executed')\n")
              rejected = subprocess.run(
                  [os.environ["COMMON_PYTHON"], "-I", "-S", "-c", child,
                   str(examples), str(manifest), expected_sha256],
                  input=b"{}",
                  capture_output=True,
                  cwd=examples,
                  env=environment,
                  timeout=120,
                  check=False,
              )
              assert rejected.returncode != 0
              assert b"unapproved importable package files" in rejected.stderr, (
                  rejected.stderr.decode(errors="replace")[-4000:]
              )
              assert b"unapproved python executed" not in rejected.stderr
          finally:
              rogue.unlink(missing_ok=True)
          print("Tampered native package with an added Python file: rejected before CUDA.")
          # A top-level module outside the eight named roots is also reachable
          # through sys.path; it must not escape the same approved closure.
          rogue = Path(torch_spec.origin).parent.parent / "wre_unapproved_transitive.py"
          assert not rogue.exists()
          try:
              rogue.write_text("raise RuntimeError('unapproved transitive code executed')\n")
              rejected = subprocess.run(
                  [os.environ["COMMON_PYTHON"], "-I", "-S", "-c", child,
                   str(examples), str(manifest), expected_sha256],
                  input=b"{}", capture_output=True, cwd=examples, env=environment,
                  timeout=120, check=False,
              )
              assert rejected.returncode != 0
              assert b"unapproved importable package files" in rejected.stderr, (
                  rejected.stderr.decode(errors="replace")[-4000:]
              )
              assert b"unapproved transitive code executed" not in rejected.stderr
          finally:
              rogue.unlink(missing_ok=True)
          print("Unreviewed TOP-LEVEL transitive module: rejected before third-party imports.")
          # Source-free .pyc is an executable import target. Hashing .py alone
          # does not attest such code; a new .pyc MUST invalidate the receipt.
          import importlib.util
          import marshal
          import tempfile
          packages = Path(torch_spec.origin).parent.parent
          bytecode = packages / "wre_unapproved_bytecode.pyc"
          marker = Path(os.environ["RUNNER_TEMP"]) / "wre-unapproved-pyc-marker"
          assert not bytecode.exists() and not marker.exists()
          code = compile(
              f"from pathlib import Path; Path({str(marker)!r}).write_text('executed')",
              "<unapproved-bytecode>", "exec",
          )
          try:
              bytecode.write_bytes(
                  importlib.util.MAGIC_NUMBER + b"\x00" * 12 + marshal.dumps(code)
              )
              rejected = subprocess.run(
                  [os.environ["COMMON_PYTHON"], "-I", "-S", "-c", child,
                   str(examples), str(manifest), expected_sha256],
                  input=b"{}", capture_output=True, cwd=examples, env=environment,
                  timeout=120, check=False,
              )
              assert rejected.returncode != 0
              assert b"unapproved importable package files" in rejected.stderr, (
                  rejected.stderr.decode(errors="replace")[-4000:]
              )
              assert not marker.exists(), "Unapproved bytecode must not execute"
          finally:
              bytecode.unlink(missing_ok=True)
              marker.unlink(missing_ok=True)
          print("Unapproved importable source-free BYTECODE: rejected before import.")
          # A symlinked directory is normally skipped by Path.rglob and can
          # expose unapproved executable package files via sys.path imports.
          with tempfile.TemporaryDirectory(
              prefix="wre-native-symlink-", dir=os.environ["RUNNER_TEMP"]
          ) as private:
              external = Path(private) / "unreviewed"
              external.mkdir()
              (external / "__init__.py").write_text(
                  "raise RuntimeError('unapproved linked module executed')\n"
              )
              linked = packages / "wre_unapproved_linked_package"
              assert not linked.exists() and not linked.is_symlink()
              try:
                  linked.symlink_to(external, target_is_directory=True)
                  rejected = subprocess.run(
                      [os.environ["COMMON_PYTHON"], "-I", "-S", "-c", child,
                       str(examples), str(manifest), expected_sha256],
                      input=b"{}", capture_output=True, cwd=examples, env=environment,
                      timeout=120, check=False,
                  )
                  assert rejected.returncode != 0
                  assert b"unapproved symbolic-link paths" in rejected.stderr, (
                      rejected.stderr.decode(errors="replace")[-4000:]
                  )
                  assert b"unapproved linked module executed" not in rejected.stderr
              finally:
                  linked.unlink(missing_ok=True)
          print("Extensionless symlinked PACKAGE DIRECTORY: rejected before import.")
          print("No GPU kernel, Gaussian optimizer or training executed.")
          PY

      - name: Decode actual COLMAP records and RGB camera tensors with pinned reader
        shell: bash
        run: |
          set -euo pipefail
          "$COMMON_PYTHON" -I - <<'PY'
          import os
          import struct
          import sys
          from pathlib import Path

          import numpy as np
          from PIL import Image

          # Exercise the exact COLMAP reader imported by simple_trainer.py.
          source = Path(os.environ["COMMON_SOURCES"]) / "gsplat" / "examples"
          sys.path.insert(0, str(source))
          from datasets.colmap import Dataset, Parser
          from pycolmap import SceneManager

          root = Path(os.environ["RUNNER_TEMP"]) / "gsplat-colmap-decode-smoke"
          model = root / "sparse" / "0"
          images = root / "images"
          model.mkdir(parents=True)
          images.mkdir()

          # Minimal COLMAP binary scene: 3 registered views, one real shared
          # track, 8x8 RGB PNGs and a nonzero baseline between camera poses.
          (model / "cameras.bin").write_bytes(
              struct.pack("<QIiQQ4d", 1, 1, 1, 8, 8, 8., 8., 4., 4.)
          )
          binary_images = bytearray(struct.pack("<Q", 3))
          for image_id, tx in ((1, 0.), (2, -0.2), (3, 0.2)):
              name = f"view-{image_id:02d}.png"
              binary_images.extend(
                  struct.pack("<I4d3dI", image_id, 1., 0., 0., 0., tx, 0., 0., 1)
              )
              binary_images.extend(name.encode() + b"\x00")
              binary_images.extend(struct.pack("<QddQ", 1, 4., 4., 1))
              rgb = np.zeros((8, 8, 3), dtype=np.uint8)
              rgb[..., 0] = 32 * image_id
              rgb[..., 1] = 48
              rgb[..., 2] = 144
              Image.fromarray(rgb, "RGB").save(images / name)
          (model / "images.bin").write_bytes(binary_images)
          (model / "points3D.bin").write_bytes(
              struct.pack(
                  "<QQ3d3BdQ6I", 1, 1, 0., 0., 2., 200, 100, 50, 0.1, 3,
