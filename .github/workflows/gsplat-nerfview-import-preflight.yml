name: gsplat-static-appearance-import-preflight

# V2L18.3: one consolidated source-bound Python eager-import preflight.
# Qualifies real nerfview, gsplat reference trainer helpers and COLMAP reader;
# not the complete simple_trainer or native CUDA/appearance training.
on:
  pull_request:
    paths:
      - ".github/workflows/gsplat-nerfview-import-preflight.yml"
      - "registry/dependencies.yaml"
      - "PROJECT_STATE.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHON_TARGET: "3.10.21"
      GSPLAT_REV: 937e29912570c372bed6747a5c9bf85fed877bae
      GSPLAT_TREE: 90c3f0b2352e6d2725bcba1ef0407168f922c0fa
      NERFVIEW_REV: 4538024fe0d15fd1a0e4d760f3695fc44ca72787
      NERFVIEW_TREE: e333400e39605978a3d1f9cf6d73ddf577a8c8e3
      READER_REV: cc7ea4b7301720ac29287dbe450952511b32125e
      READER_TREE: b4fe292e93a8f6ca77a52912fcda5ff9b42ea3d7
      REVIEWED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONPATH: ""

    steps:
      - name: Checkout reviewed WRE lock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bootstrap exact Python and uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.10.21"
          enable-cache: false

      - name: Create private unseeded trainer-helper import environment
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python "$PYTHON_TARGET" "$RUNNER_TEMP/trainer-helper-venv"
          echo "IMPORT_PYTHON=$RUNNER_TEMP/trainer-helper-venv/bin/python" >> "$GITHUB_ENV"

      - name: Bootstrap hash-locked YAML and requirement parsers
        shell: bash
        run: |
          set -euo pipefail
          # These two exact artifacts are already reviewed in the 76-wheel lock.
          # Do not fetch floating bootstrap tools to generate verified manifests.
          uv venv --python "$PYTHON_TARGET" "$RUNNER_TEMP/trainer-helper-bootstrap"
          cat > "$RUNNER_TEMP/trainer-helper-bootstrap.txt" <<'WHEELS'
          PyYAML @ https://files.pythonhosted.org/packages/7a/1e/7acc4f0e74c4b3d9531e24739e0ab832a5edf40e64fbae1a9c01941cabd7/pyyaml-6.0.3-cp310-cp310-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl#sha256=9c7708761fccb9397fe64bbc0395abcae8c4bf7b0eac081e12b809bf47700d0b
          packaging @ https://files.pythonhosted.org/packages/63/34/ba1c580383c9eada3711951fef0795c80b829a078d72188184bcab9dd527/packaging-26.3-py3-none-any.whl#sha256=d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c
          WHEELS
          uv pip install --python "$RUNNER_TEMP/trainer-helper-bootstrap/bin/python" \
            --no-index --no-deps --no-cache --require-hashes \
            -r "$RUNNER_TEMP/trainer-helper-bootstrap.txt"
          uv pip check --python "$RUNNER_TEMP/trainer-helper-bootstrap/bin/python"

      - name: Derive exact hash-locked upstream helper import wheel closure
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/trainer-helper-bootstrap/bin/python" - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          import yaml
          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name

          lock = yaml.safe_load(Path("registry/dependencies.yaml").read_text(encoding="utf-8"))[
              "dependencies"
          ]["gsplat_static_appearance"]["runtime_python_lock"]
          assert lock["target"]["python"] == "3.10.21"
          assert lock["target"]["torch_cuda"] == "12.4"
          assert lock["gpu_execution_evidence"] is False
          packages = {canonicalize_name(p["name"]): p for p in lock["packages"]}
          assert len(packages) == len(lock["packages"]) == 76
          assert packages["torch"]["version"] == "2.4.0+cu124"
          assert packages["numpy"]["version"] == "1.26.4"
          assert packages["pyyaml"]["version"] == "6.0.3"
          assert packages["pyyaml"]["sha256"] == "9c7708761fccb9397fe64bbc0395abcae8c4bf7b0eac081e12b809bf47700d0b"
          assert packages["packaging"]["version"] == "26.3"
          assert packages["packaging"]["sha256"] == "d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c"

          # Direct Python eager imports observed in pinned examples/utils.py,
          # datasets/traj.py, gsplat_viewer.py and nerfview v0.1.2 source.
          # Dependency metadata recursively adds the remaining pinned wheels.
          pending = {
              "numpy", "torch", "scikit-learn", "matplotlib", "scipy",
              "viser", "splines", "jaxtyping", "rich", "imageio",
              "typing-extensions", "opencv-python", "pillow", "tqdm",
          }
          selected = set()
          while pending:
              name = pending.pop()
              if name in selected:
                  continue
              item = packages.get(name)
              if item is None:
                  raise SystemExit(f"unlocked parser import: {name}")
              selected.add(name)
              for raw in item["requires_dist"]:
                  req = Requirement(raw)
                  if req.marker is not None and not req.marker.evaluate({
                      "extra": "", "python_version": "3.10",
                      "python_full_version": "3.10.21",
                  }):
                      continue
                  dep = canonicalize_name(req.name)
                  other = packages.get(dep)
                  if other is None or not req.specifier.contains(
                      other["version"], prereleases=True
                  ):
                      raise SystemExit(f"unlocked/incompatible {name} -> {dep}")
                  pending.add(dep)

          lines, manifest = [], []
          for name in sorted(selected):
              item = packages[name]
              url, sha = item["url"], item["sha256"]
              u = urlsplit(url)
              if (u.scheme != "https" or u.hostname not in {
                  "files.pythonhosted.org", "download.pytorch.org",
                  "download-r2.pytorch.org", "pypi.nvidia.com",
              } or u.fragment or u.username or u.password):
                  raise SystemExit(f"unexpected wheel host for {name}")
              if not re.fullmatch("[a-f0-9]{64}", sha):
                  raise SystemExit(f"invalid SHA-256 for {name}")
              lines.append(f"{item['name']} @ {url}#sha256={sha}")
              manifest.append({
                  "name": item["name"], "version": item["version"],
                  "url": url, "sha256": sha,
              })
          temp = Path(os.environ["RUNNER_TEMP"])
          (temp / "trainer-helpers-pinned-wheels.txt").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          (temp / "trainer-helpers-wheel-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(f"Selected {len(manifest)} pinned wheels for real trainer helper imports.")
          PY

      - name: Install strictly reviewed wheel subset
        shell: bash
        run: |
          set -euo pipefail
          uv pip install --python "$IMPORT_PYTHON" --no-index --no-deps --no-cache \
            --require-hashes -r "$RUNNER_TEMP/trainer-helpers-pinned-wheels.txt"
          uv pip check --python "$IMPORT_PYTHON"

      - name: Fetch exact immutable upstream source trees
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            "gsplat|https://github.com/nerfstudio-project/gsplat.git|$GSPLAT_REV|$GSPLAT_TREE" \
            "nerfview|https://github.com/nerfstudio-project/nerfview.git|$NERFVIEW_REV|$NERFVIEW_TREE" \
            "reader|https://github.com/rmbrualla/pycolmap.git|$READER_REV|$READER_TREE"; do
            IFS='|' read -r name remote revision tree <<< "$spec"
            dir="$RUNNER_TEMP/$name"
            git init -q "$dir"
            git -C "$dir" remote add origin "$remote"
            git -C "$dir" fetch --quiet --depth=1 origin "$revision"
            git -C "$dir" checkout --quiet --detach FETCH_HEAD
            test "$(git -C "$dir" rev-parse HEAD)" = "$revision"
            test "$(git -C "$dir" rev-parse HEAD^{tree})" = "$tree"
            test -z "$(git -C "$dir" status --porcelain)"
          done
          test -f "$RUNNER_TEMP/gsplat/examples/simple_trainer.py"
          test -f "$RUNNER_TEMP/gsplat/examples/utils.py"
          test -f "$RUNNER_TEMP/gsplat/examples/datasets/traj.py"
          test -f "$RUNNER_TEMP/gsplat/examples/gsplat_viewer.py"
          test -f "$RUNNER_TEMP/nerfview/nerfview/__init__.py"
          test -f "$RUNNER_TEMP/gsplat/examples/datasets/colmap.py"
          test -f "$RUNNER_TEMP/reader/pycolmap/scene_manager.py"

      - name: Import genuine trainer utilities, trajectory helpers and viewer
        shell: bash
        run: |
          set -euo pipefail
          "$IMPORT_PYTHON" - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          from importlib import metadata
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          manifest_bytes = (root / "trainer-helpers-wheel-manifest.json").read_bytes()
          declared = json.loads(manifest_bytes)
          canonical = lambda name: re.sub(r"[-_.]+", "-", name).lower()
          expected = {canonical(item["name"]): item["version"] for item in declared}
          assert len(expected) == len(declared), "duplicated pinned wheels"
          installed = {}
          for dist in metadata.distributions():
              name = canonical(dist.metadata["Name"])
              assert name not in installed, f"duplicate installed distribution: {name}"
              installed[name] = dist.version
          assert installed == expected, (
              f"unexpected installed closure: "
              f"missing={sorted(expected.keys() - installed.keys())}, "
              f"extra={sorted(installed.keys() - expected.keys())}, "
              f"wrong_versions={sorted(n for n in expected.keys() & installed.keys() if expected[n] != installed[n])}"
          )

          gsplat_root = (root / "gsplat").resolve(strict=True)
          nerfview_root = (root / "nerfview").resolve(strict=True)
          reader_root = (root / "reader").resolve(strict=True)
          sys.path[:0] = [str(gsplat_root / "examples"), str(nerfview_root), str(reader_root)]

          import numpy
          import torch
          import nerfview
          import splines
          import splines.quaternion
          import cv2
          import pycolmap
          from pycolmap import SceneManager
          from datasets.colmap import Dataset, Parser
          from nerfview import CameraState, RenderTabState, apply_float_colormap
          import utils
          import gsplat_viewer
          import datasets.traj as traj
          from utils import (
              AppearanceOptModule, CameraOptModule, knn, rgb_to_sh, set_random_seed,
          )
          from gsplat_viewer import GsplatViewer, GsplatRenderTabState
          from datasets.traj import (
              generate_ellipse_path_z, generate_interpolated_path, generate_spiral_path,
          )

          modules = {
              "examples/utils.py": utils.__file__,
              "examples/gsplat_viewer.py": gsplat_viewer.__file__,
              "examples/datasets/traj.py": traj.__file__,
              "examples/datasets/colmap.py": sys.modules[Parser.__module__].__file__,
          }
          source_hashes = {}
          for relative, module_file in modules.items():
              actual = Path(module_file).resolve(strict=True)
              assert actual == (gsplat_root / relative).resolve(strict=True)
              source_hashes[relative] = hashlib.sha256(actual.read_bytes()).hexdigest()
          assert Path(nerfview.__file__).resolve(strict=True) == (
              nerfview_root / "nerfview" / "__init__.py"
          ).resolve(strict=True)
          assert nerfview.__version__ == "0.1.2"
          assert Path(pycolmap.__file__).resolve(strict=True) == (
              reader_root / "pycolmap" / "__init__.py"
          ).resolve(strict=True)
          reader_file = (reader_root / "pycolmap" / "scene_manager.py").resolve(strict=True)
          assert Path(sys.modules[SceneManager.__module__].__file__).resolve(strict=True) == reader_file
          assert numpy.__version__ == "1.26.4"
          assert torch.__version__ == "2.4.0+cu124"
          assert torch.version.cuda == "12.4"
          assert not torch.cuda.is_available(), "GPU execution is not a supported gate"
          assert all(callable(item) for item in (
              AppearanceOptModule, CameraOptModule, knn, rgb_to_sh, set_random_seed,
              GsplatViewer, GsplatRenderTabState, generate_ellipse_path_z,
              generate_interpolated_path, generate_spiral_path, Parser, Dataset,
              SceneManager, CameraState, RenderTabState, apply_float_colormap,
          ))
          checkout_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], cwd=os.environ["GITHUB_WORKSPACE"], text=True
          ).strip()
          assert checkout_sha == os.environ["REVIEWED_HEAD_SHA"]
          evidence = {
              "schema_version": 1,
              "wre_repository": os.environ["GITHUB_REPOSITORY"],
              "wre_source_commit": checkout_sha,
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "github_run_url": (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                  f"{os.environ['GITHUB_RUN_ID']}"
              ),
              "github_workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "kind": "pinned_gsplat_reference_trainer_python_eager_import_consolidated",
              # GitHub's triggering SHA can be a synthetic PR merge SHA;
              # the only reviewed WRE source commit is the checked-out head above.
              "github_trigger_sha": os.environ["GITHUB_SHA"],
              "gsplat_revision": os.environ["GSPLAT_REV"],
              "gsplat_tree": os.environ["GSPLAT_TREE"],
              "nerfview_revision": os.environ["NERFVIEW_REV"],
              "nerfview_tree": os.environ["NERFVIEW_TREE"],
              "reader_revision": os.environ["READER_REV"],
              "reader_tree": os.environ["READER_TREE"],
              "reader_scene_manager_sha256": hashlib.sha256(reader_file.read_bytes()).hexdigest(),
              "opencv_version": cv2.__version__,
              "splines_version": metadata.version("splines"),
              "trainer_helper_sha256": source_hashes,
              "wheel_manifest_sha256": hashlib.sha256(manifest_bytes).hexdigest(),
              "exact_installed_wheel_versions": installed,
              "python": ".".join(map(str, sys.version_info[:3])),
              "torch": torch.__version__,
              "numpy": numpy.__version__,
              "nerfview": nerfview.__version__,
              "actual_trainer_helper_imports": True,
              "nerfview_import": True,
              "real_gsplat_colmap_parser_scene_manager_import": True,
              "dataset_loading": False,
              "simple_trainer_import": False,
              "gsplat_fused_ssim_native_abi": False,
              "gpu_kernel_execution": False,
              "appearance_training": False,
              "redistribution_review": "pending",
          }
          (Path(os.environ["GITHUB_WORKSPACE"]) / "gsplat-trainer-helpers-import-evidence.json").write_text(
              json.dumps(evidence, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          print("Real pinned nerfview, gsplat helpers, COLMAP Parser and SceneManager imports verified; no GPU or trainer execution.")
          PY

      - name: Upload exact-source import evidence
        id: combined-evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v2l18-3-consolidated-static-appearance-eager-import
          path: gsplat-trainer-helpers-import-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Report SHA-bound provenance and finite artifact retention
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ steps.combined-evidence.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.combined-evidence.outputs.artifact-url }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_DIGEST"
          test -n "$ARTIFACT_URL"
          {
            echo "### WRE V2L18.3 consolidated gsplat Python imports evidence"
            echo "Reviewed HEAD: $REVIEWED_HEAD_SHA"
            echo "GitHub run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Attempt: $GITHUB_RUN_ATTEMPT"
            echo "Evidence JSON SHA-256:"
            sha256sum gsplat-trainer-helpers-import-evidence.json
            echo "Artifact SHA-256 digest: $ARTIFACT_DIGEST"
            echo "Artifact URL: $ARTIFACT_URL"
            echo "Retention: 30 days; keep the run and digest in the reviewed registry before expiry."
            echo "This evidence proves eager imports only; no GPU, native ABI or training."
          } >> "$GITHUB_STEP_SUMMARY"
