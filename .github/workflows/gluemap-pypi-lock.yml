name: gluemap-pypi-lock

on:
  pull_request:
    paths:
      - ".github/workflows/gluemap-pypi-lock.yml"
      - "registry/external-environments/gluemap-linux-64-pypi-lock.json"
      - "registry/dependencies.yaml"
      - "registry/work-items/v2m2.yaml"
      - "PROJECT_STATE.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: linux-x86_64-cp312-pypi-artifact-resolution-only
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LOCK_PATH: registry/external-environments/gluemap-linux-64-pypi-lock.json
      CONDA_LOCK_PATH: registry/external-environments/gluemap-linux-64-cuda12.4.conda-lock.json
      TARGET_PYTHON: "3.12.12"
      TARGET_IMPLEMENTATION: cp
      TARGET_ABI: cp312
      TARGET_PLATFORM: linux_x86_64

    steps:
      - name: Checkout WRE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12.12"
          enable-cache: false

      - name: Resolve and hash exact PyPI wheel artifacts without installing
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --python 3.12.12 python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import urllib.request
          import zipfile
          from email.parser import BytesParser
          from email.policy import compat32
          from pathlib import Path

          target_python = os.environ["TARGET_PYTHON"]
          target_impl = os.environ["TARGET_IMPLEMENTATION"]
          target_abi = os.environ["TARGET_ABI"]
          target_platform = os.environ["TARGET_PLATFORM"]
          generated = Path(os.environ["RUNNER_TEMP"]) / "gluemap-linux-64-pypi-lock.json"
          downloads = Path(os.environ["RUNNER_TEMP"]) / "gluemap-pypi-artifacts"
          downloads.mkdir(parents=True, exist_ok=True)
          conda_lock = json.loads(Path(os.environ["CONDA_LOCK_PATH"]).read_text(encoding="utf-8"))
          conda_by_name = {item["name"]: item for item in conda_lock["packages"]}

          requested = [
              ("faiss-cpu", "1.13.2"),
              ("kornia", "0.8.2"),
              ("kornia-rs", "0.1.10"),
              ("opencv-python", "4.13.0.92"),
              ("pycolmap-cuda12", "4.0.4"),
              ("pyceres", "2.6"),
          ]

          source_license_evidence = {
              "kornia-rs": {
                  "repository": "kornia/kornia-rs",
                  "tag": "v0.1.10",
                  "revision": "2c62e6f11a46404f107cad71202c75f5cb975548",
                  "license_git_blob_sha1": "261eeb9e9f8b2b4b0d119366dda99c6fd7d35c64",
                  "license": "Apache-2.0",
              }
          }

          def get_json(url: str) -> dict:
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "WRE-V2L14.4-PyPI-qualification/1"},
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          def get_bytes(url: str) -> bytes:
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "WRE-V2L14.4-PyPI-qualification/1"},
              )
              with urllib.request.urlopen(req, timeout=120) as response:
                  return response.read()

          def wheel_tags(filename: str) -> tuple[str, str, str]:
              if not filename.endswith(".whl"):
                  raise ValueError(filename)
              stem = filename[:-4]
              _prefix, python_tag, abi_tag, platform_tag = stem.rsplit("-", 3)
              return python_tag, abi_tag, platform_tag

          def python_compatible(python_tag: str, abi_tag: str) -> bool:
              py_tags = python_tag.split(".")
              abi_tags = abi_tag.split(".")
              if "py3" in py_tags and "none" in abi_tags:
                  return True
              if "cp312" in py_tags and ("cp312" in abi_tags or "abi3" in abi_tags):
                  return True
              if "abi3" in abi_tags:
                  for tag in py_tags:
                      match = re.fullmatch(r"cp3(\d+)", tag)
                      if match and int(match.group(1)) <= 12:
                          return True
              return False

          def platform_rank(platform_tag: str) -> int | None:
              ranks = []
              for tag in platform_tag.split("."):
                  if tag == "any":
                      ranks.append(1)
                      continue
                  if tag == "linux_x86_64":
                      ranks.append(2)
                      continue
                  match = re.fullmatch(r"manylinux_(\d+)_(\d+)_x86_64", tag)
                  if match:
                      major, minor = map(int, match.groups())
                      if major == 2 and minor <= 39:
                          ranks.append(1000 + minor)
                      continue
                  legacy = {"1": 5, "2010": 12, "2014": 17}
                  match = re.fullmatch(r"manylinux(1|2010|2014)_x86_64", tag)
                  if match:
                      ranks.append(1000 + legacy[match.group(1)])
              return max(ranks) if ranks else None

          def python_rank(python_tag: str, abi_tag: str) -> int | None:
              py_tags = python_tag.split(".")
              abi_tags = abi_tag.split(".")
              if "cp312" in py_tags and "cp312" in abi_tags:
                  return 300
              if "abi3" in abi_tags:
                  compatible = []
                  for tag in py_tags:
                      match = re.fullmatch(r"cp3(\d+)", tag)
                      if match and int(match.group(1)) <= 12:
                          compatible.append(int(match.group(1)))
                  if compatible:
                      return 200 + max(compatible)
              if "py3" in py_tags and "none" in abi_tags:
                  return 100
              return None

          def select_wheel(files: list[dict], package: str, version: str) -> dict:
              candidates = []
              for item in files:
                  if item.get("packagetype") != "bdist_wheel":
                      continue
                  filename = item["filename"]
                  try:
                      py_tag, abi_tag, platform_tag = wheel_tags(filename)
                  except ValueError:
                      continue
                  py_rank = python_rank(py_tag, abi_tag)
                  plat_rank = platform_rank(platform_tag)
                  if py_rank is not None and plat_rank is not None:
                      candidates.append(
                          (py_rank, plat_rank, filename, py_tag, abi_tag, platform_tag, item)
                      )

              if not candidates:
                  summary = [
                      {
                          "filename": item.get("filename"),
                          "packagetype": item.get("packagetype"),
                          "python_version": item.get("python_version"),
                          "requires_python": item.get("requires_python"),
                      }
                      for item in files
                  ]
                  raise SystemExit(
                      f"{package}=={version}: no compatible Linux x86_64 CPython 3.12 "
                      "wheel. Published files: " + json.dumps(summary, sort_keys=True)
                  )

              candidates.sort(key=lambda candidate: (candidate[0], candidate[1], candidate[2]))
              best_rank = candidates[-1][:2]
              best = [candidate for candidate in candidates if candidate[:2] == best_rank]
              if len(best) != 1:
                  raise SystemExit(
                      f"{package}=={version}: ambiguous best compatible wheels at rank "
                      f"{best_rank}: {[candidate[2] for candidate in best]}"
                  )
              _py_rank, _plat_rank, filename, py_tag, abi_tag, platform_tag, item = best[0]
              return {
                  "item": item,
                  "python_tag": py_tag,
                  "abi_tag": abi_tag,
                  "platform_tag": platform_tag,
                  "filename": filename,
                  "selection_rank": {
                      "python": best_rank[0],
                      "platform": best_rank[1],
                  },
              }

          artifacts = []
          for package, version in requested:
              project_json = get_json(f"https://pypi.org/pypi/{package}/{version}/json")
              info = project_json["info"]
              selected = select_wheel(project_json["urls"], package, version)
              item = selected["item"]
              payload = get_bytes(item["url"])
              sha256 = hashlib.sha256(payload).hexdigest()
              expected_sha = item["digests"]["sha256"]
              if sha256 != expected_sha:
                  raise SystemExit(
                      f"{package}=={version}: downloaded SHA-256 {sha256} "
                      f"does not match PyPI metadata {expected_sha}"
                  )
              if len(payload) != item["size"]:
                  raise SystemExit(
                      f"{package}=={version}: byte length {len(payload)} "
                      f"does not match PyPI metadata {item['size']}"
                  )

              wheel_path = downloads / selected["filename"]
              wheel_path.write_bytes(payload)
              with zipfile.ZipFile(wheel_path) as archive:
                  metadata_names = [
                      name for name in archive.namelist()
                      if name.endswith(".dist-info/METADATA")
                  ]
                  if len(metadata_names) != 1:
                      raise SystemExit(
                          f"{package}=={version}: expected one dist-info/METADATA, "
                          f"found {metadata_names}"
                      )
                  metadata_bytes = archive.read(metadata_names[0])
              metadata = BytesParser(policy=compat32).parsebytes(metadata_bytes)
              metadata_name = str(metadata.get("Name") or "").strip()
              metadata_version = str(metadata.get("Version") or "").strip()
              if metadata_name.lower().replace("_", "-") != package.lower().replace("_", "-"):
                  raise SystemExit(
                      f"{package}=={version}: METADATA name mismatch {metadata_name!r}"
                  )
              if metadata_version != version:
                  raise SystemExit(
                      f"{package}=={version}: METADATA version mismatch {metadata_version!r}"
                  )

              requires_dist = sorted(
                  str(value).strip()
                  for value in (metadata.get_all("Requires-Dist") or [])
                  if str(value).strip()
              )
              license_expression = str(
                  metadata.get("License-Expression")
                  or info.get("license_expression")
                  or ""
              ).strip()
              legacy_license = str(metadata.get("License") or info.get("license") or "").strip()
              classifiers = sorted(
                  str(value).strip()
                  for value in (metadata.get_all("Classifier") or [])
                  if str(value).startswith("License ::")
              )
              external_license = source_license_evidence.get(package)
              if not (license_expression or legacy_license or classifiers or external_license):
                  raise SystemExit(
                      f"{package}=={version}: no direct or exact-source license evidence"
                  )

              artifacts.append(
                  {
                      "name": package,
                      "version": version,
                      "filename": selected["filename"],
                      "packagetype": item["packagetype"],
                      "python_tag": selected["python_tag"],
                      "abi_tag": selected["abi_tag"],
                      "platform_tag": selected["platform_tag"],
                      "selection_rank": selected["selection_rank"],
                      "requires_python": item.get("requires_python") or info.get("requires_python"),
                      "url": item["url"],
                      "sha256": sha256,
                      "byte_length": len(payload),
                      "metadata_name": metadata_name,
                      "metadata_version": metadata_version,
                      "license_expression": license_expression or None,
                      "legacy_license": legacy_license or None,
                      "license_classifiers": classifiers,
                      "source_license_evidence": external_license,
                      "requires_dist": requires_dist,
                  }
              )

          artifacts.sort(key=lambda item: (item["name"], item["version"], item["filename"]))
          by_name = {item["name"]: item for item in artifacts}
          if len(by_name) != len(artifacts):
              raise SystemExit("duplicate PyPI artifact names")

          expected_requires_dist = {
              "faiss-cpu": ["numpy<3.0,>=1.25.0", "packaging"],
              "kornia": sorted([
                  'PyYAML>=5.1; extra == "docs"',
                  'accelerate; extra == "dev"',
                  'accelerate; extra == "x"',
                  'coverage; extra == "dev"',
                  'diffusers; extra == "dev"',
                  'furo; extra == "docs"',
                  'ivy>=1.0.0.0; extra == "dev"',
                  'ivy>=1.0.0.0; extra == "docs"',
                  'kornia_moons; extra == "docs"',
                  "kornia_rs>=0.1.9",
                  'matplotlib; extra == "docs"',
                  'mypy; extra == "dev"',
                  'numpy<3; extra == "dev"',
                  'onnx; extra == "dev"',
                  'onnx; extra == "docs"',
                  'onnxruntime-gpu>=1.16; sys_platform != "darwin" and extra == "x"',
                  'onnxruntime; extra == "dev"',
                  'onnxruntime; extra == "docs"',
                  'opencv-python; extra == "docs"',
                  "packaging",
                  'pillow; extra == "dev"',
                  'pre-commit>=2; extra == "dev"',
                  'pytest-cov; extra == "dev"',
                  'pytest-timeout; extra == "dev"',
                  'pytest==8.3.5; extra == "dev"',
                  'requests; extra == "dev"',
                  'setuptools>=61.2; extra == "dev"',
                  'sphinx-autodoc-defaultargs; extra == "docs"',
                  'sphinx-autodoc-typehints; extra == "docs"',
                  'sphinx-copybutton>=0.3; extra == "docs"',
                  'sphinx-design; extra == "docs"',
                  'sphinx-notfound-page; extra == "docs"',
                  'sphinx; extra == "docs"',
                  'sphinxcontrib-bibtex; extra == "docs"',
                  'sphinxcontrib-gtagjs; extra == "docs"',
                  'sphinxcontrib-youtube; extra == "docs"',
                  "torch>=2.0.0",
                  'transformers<4.57; extra == "dev"',
                  'types-requests; extra == "dev"',
              ]),
              "kornia-rs": [],
              "opencv-python": sorted([
                  'numpy<2.0; python_version < "3.9"',
                  'numpy>=2; python_version >= "3.9"',
              ]),
              "pyceres": ["numpy"],
              "pycolmap-cuda12": sorted([
                  "cuda-toolkit[cudart,curand]<13,>=12",
                  "numpy",
              ]),
          }
          for package, expected in expected_requires_dist.items():
              if by_name[package]["requires_dist"] != sorted(expected):
                  raise SystemExit(
                      f"{package}: Requires-Dist drift: "
                      f"{by_name[package]['requires_dist']} != {sorted(expected)}"
                  )

          assert conda_by_name["numpy"]["version"] == "2.4.3"
          assert conda_by_name["packaging"]["version"] == "26.3"
          assert conda_by_name["pytorch"]["version"] == "2.4.1"
          assert conda_by_name["cuda-version"]["version"].startswith("12.4")
          assert conda_by_name["cuda-cudart"]["version"].startswith("12.4.")
          assert "libcurand" in conda_by_name
          assert by_name["kornia-rs"]["version"] == "0.1.10"

          compatibility = {
              "faiss-cpu": "numpy 2.4.3 satisfies >=1.25,<3; packaging 26.3 is locked in conda",
              "kornia": "torch 2.4.1 satisfies >=2.0; packaging 26.3 is locked; kornia-rs 0.1.10 satisfies >=0.1.9",
              "kornia-rs": "exact CPython 3.12 Linux wheel; no Requires-Dist entries",
              "opencv-python": "target Python 3.12 activates numpy>=2; locked NumPy is 2.4.3",
              "pyceres": "NumPy requirement is satisfied by locked NumPy 2.4.3",
              "pycolmap-cuda12": "NumPy 2.4.3 is locked; CUDA 12.4 with cuda-cudart and libcurand is present in the conda closure; pip dependency resolution remains disabled",
          }

          lock = {
              "schema_version": 1,
              "evidence_kind": "pypi_artifact_resolution_only",
              "runtime_execution_evidence": False,
              "gpu_execution_evidence": False,
              "installer_execution_evidence": False,
              "index": "https://pypi.org/",
              "target": {
                  "python": target_python,
                  "implementation": target_impl,
                  "abi": target_abi,
                  "platform": target_platform,
                  "glibc_ceiling_for_qualification_host": "2.39",
              },
              "requested": [
                  {"name": package, "version": version}
                  for package, version in requested
              ],
              "conda_lock_sha256": "0b9a91630a1e15fd2fe61f0c22bcf6605cd5f5997adc312cf6b549935f311c9f",
              "compatibility_assertions": compatibility,
              "artifacts": artifacts,
          }
          generated.write_text(
              json.dumps(lock, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(
              f"resolved {len(artifacts)} exact PyPI wheels / "
              f"{sum(item['byte_length'] for item in artifacts)} bytes"
          )
          PY

      - name: Verify committed artifact lock or expose first qualification result
        shell: bash
        run: |
          set -euo pipefail
          generated="$RUNNER_TEMP/gluemap-linux-64-pypi-lock.json"
          sha256sum "$generated"
          if test -f "$LOCK_PATH"; then
            diff -u "$LOCK_PATH" "$generated"
            echo "Committed GLUEMAP PyPI artifact lock matches exact regeneration."
          else
            echo "No committed GLUEMAP PyPI artifact lock exists yet; this run is first-artifact qualification evidence."
            echo "----- BEGIN GENERATED GLUEMAP PYPI LOCK -----"
            cat "$generated"
            echo "----- END GENERATED GLUEMAP PYPI LOCK -----"
          fi

      - name: Retain machine-readable PyPI artifact evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v2l14-4-gluemap-pypi-lock
          path: ${{ runner.temp }}/gluemap-linux-64-pypi-lock.json
          if-no-files-found: error
          retention-days: 30
