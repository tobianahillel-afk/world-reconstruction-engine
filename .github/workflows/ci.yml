name: fast-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install locked development environment
        run: uv sync --frozen --group dev

      - name: Validate repository metadata
        run: uv run python scripts/validate_repo.py

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Unit tests (pure and mockable checks; FFmpeg tests run in dedicated lane)
        run: >-
          uv run pytest
          --ignore=tests/test_audio_sync.py
          --ignore=tests/test_decoded_image_pyramids.py
          --ignore=tests/test_frame_selection_extraction_regression.py
          --ignore=tests/test_keyframe_extraction.py
          --ignore=tests/test_ffmpeg_toolchain_compatibility.py

      - name: Lint GitHub Actions
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          version: "1.7.12"
          shellcheck: false
          pyflakes: false
          cache: true
