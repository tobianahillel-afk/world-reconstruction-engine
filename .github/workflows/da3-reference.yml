name: da3-reference

on:
  pull_request:
    paths:
      - ".github/workflows/da3-reference.yml"
      - "registry/dependencies.yaml"
      - "registry/adapter-models.yaml"
      - "src/wre/reconstruction/da3_runtime.py"
      - "src/wre/reconstruction/da3_preview.py"
      - "src/wre/reconstruction/__init__.py"
      - "tests/test_da3_runtime.py"
      - "docs/14_TECHNOLOGY_SELECTION.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  da3-base-cpu:
    name: da3-base-cpu-reference
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout WRE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and exact Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.12.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Create isolated DA3 reference environment
        run: |
          uv venv --python 3.12.12 .venv-da3
          uv pip install --python .venv-da3/bin/python -e . "pytest==8.4.2"
          uv pip install --python .venv-da3/bin/python \
            "addict==2.4.0" \
            "einops==0.8.0" \
            "imageio==2.35.1" \
            "numpy==1.26.4" \
            "omegaconf==2.3.0" \
            "opencv-python==4.10.0.84" \
            "Pillow==10.4.0" \
            "safetensors==0.4.5" \
            "tqdm==4.66.5"
          uv pip install --python .venv-da3/bin/python \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            "torch==2.4.1+cpu" \
            "torchvision==0.19.1+cpu"

      - name: Verify exact reference package identity
        run: |
          .venv-da3/bin/python - <<'PY'
          import importlib.metadata
          import importlib.util
          import sys

          expected = {
              "addict": "2.4.0",
              "einops": "0.8.0",
              "imageio": "2.35.1",
              "numpy": "1.26.4",
              "omegaconf": "2.3.0",
              "opencv-python": "4.10.0.84",
              "Pillow": "10.4.0",
              "safetensors": "0.4.5",
              "torch": "2.4.1+cpu",
              "torchvision": "0.19.1+cpu",
              "tqdm": "4.66.5",
          }
          assert sys.version.split()[0] == "3.12.12"
          for distribution, version in expected.items():
              actual = importlib.metadata.version(distribution)
              assert actual == version, (distribution, actual, version)
          assert importlib.util.find_spec("xformers") is None
          PY

      - name: Provision exact reviewed DA3 source
        run: |
          source_root="$RUNNER_TEMP/da3-source"
          git init "$source_root"
          git -C "$source_root" remote add origin https://github.com/ByteDance-Seed/Depth-Anything-3.git
          git -C "$source_root" fetch --depth 1 origin 3d835ec1a5802d64a8b8b15f817a1ab54809bfe4
          git -C "$source_root" checkout --detach FETCH_HEAD
          test "$(git -C "$source_root" rev-parse HEAD)" = "3d835ec1a5802d64a8b8b15f817a1ab54809bfe4"
          test "$(git -C "$source_root" rev-parse HEAD:src/depth_anything_3)" = "be87985cb286f0747d4fd9bfaec47f1b765457ea"
          test -z "$(git -C "$source_root" status --porcelain --untracked-files=all)"
          echo "WRE_DA3_SOURCE_ROOT=$source_root" >> "$GITHUB_ENV"

      - name: Provision exact reviewed DA3-BASE checkpoint
        run: |
          checkpoint="$RUNNER_TEMP/model.safetensors"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "$checkpoint" \
            "https://huggingface.co/depth-anything/DA3-BASE/resolve/main/model.safetensors?download=true"
          test "$(stat --format='%s' "$checkpoint")" = "541518028"
          echo "e01067dc1659613083d9145a9a2547ccdbe6ccbbf83c4fe7b3e8a4e2bdae78b5  $checkpoint" \
            | sha256sum --check --strict
          echo "WRE_DA3_CHECKPOINT_PATH=$checkpoint" >> "$GITHUB_ENV"

      - name: Record material CPU hardware identity
        run: |
          {
            uname -srm
            lscpu
          } > "$RUNNER_TEMP/da3-hardware.txt"
          hardware_sha256="$(sha256sum "$RUNNER_TEMP/da3-hardware.txt" | awk '{print $1}')"
          test "${#hardware_sha256}" = "64"
          echo "WRE_DA3_HARDWARE_RUNTIME_SHA256=$hardware_sha256" >> "$GITHUB_ENV"

      - name: Exercise real DA3-BASE through canonical WRE normalization
        env:
          WRE_DA3_INTEGRATION: "1"
        run: >-
          .venv-da3/bin/python -m pytest
          tests/test_da3_runtime.py
          -k real_da3_base_reference_integration
