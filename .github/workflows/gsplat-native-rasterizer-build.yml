name: gsplat-native-rasterizer-build

# Audited gsplat v1.5.3 rasterizer native build/import on a CPU-hosted CUDA toolkit.
# This is NOT GPU execution, training, image quality, or shipping approval.
on:
  pull_request:
    paths:
      - ".github/workflows/gsplat-native-rasterizer-build.yml"
      - "src/wre/reconstruction/static_appearance_baseline.py"
      - "registry/dependencies.yaml"
      - "registry/work-items/v2m3.yaml"
      - "PROJECT_STATE.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-extension:
    name: exact-gsplat-rasterizer-build-import-no-gpu
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda@sha256:da6791294b0b04d7e65d87b7451d6f2390b4d36225ab0701ee7dfec5769829f5
    timeout-minutes: 90
    env:
      CUDA_HOME: /usr/local/cuda
      PYTHON_TARGET: "3.10.21"
      TORCH_CUDA_ARCH_LIST: "7.5"
      MAX_JOBS: "1"
      GSPLAT_REVISION: 937e29912570c372bed6747a5c9bf85fed877bae
      GSPLAT_TREE: 90c3f0b2352e6d2725bcba1ef0407168f922c0fa
      GSPLAT_GLM_REVISION: 33b4a621a697a305bc3a7610d290677b96beb181
      GSPLAT_GLM_TREE: e57f342f0fb63852d65e0da2090528fdca9b0117
      GSPLAT_GLM_LICENSE_BLOB: 779c32fb9afef1180798d46f08b4373e427ac693
      PYTHONPATH: ""

    steps:
      - name: Checkout WRE exact registry and source pins
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap exact Python without touching WRE's mandatory environment
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.10.21"
          enable-cache: false

      - name: Create private Python 3.10.21 native build environment
        shell: bash
        run: |
          set -euo pipefail
          test -x "$CUDA_HOME/bin/nvcc"
          "$CUDA_HOME/bin/nvcc" --version | grep 'release 12.4,'
          uv venv --seed --python "$PYTHON_TARGET" "$RUNNER_TEMP/gsplat-native-venv"
          echo "NATIVE_PYTHON=$RUNNER_TEMP/gsplat-native-venv/bin/python" >> "$GITHUB_ENV"

      - name: Derive audited Torch dependency closure and exact wheel URLs
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --with "pyyaml==6.0.2" --with "packaging==26.0" python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          import yaml
          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name

          entry = yaml.safe_load(Path("registry/dependencies.yaml").read_text(encoding="utf-8"))[
              "dependencies"
          ]["gsplat_static_appearance"]
          lock = entry["runtime_python_lock"]
          assert lock["target"]["python"] == "3.10.21"
          assert lock["target"]["torch_cuda"] == "12.4"
          assert lock["gpu_execution_evidence"] is False
          packages = {canonicalize_name(p["name"]): p for p in lock["packages"]}
          assert len(packages) == len(lock["packages"]) == 75
          assert packages["torch"]["version"] == "2.4.0+cu124"

          pending = {"torch", "numpy", "ninja", "setuptools", "wheel", "jaxtyping", "rich"}
          selected: set[str] = set()
          while pending:
              name = pending.pop()
              if name in selected:
                  continue
              item = packages.get(name)
              if item is None:
                  raise SystemExit(f"unlocked Torch build dependency: {name}")
              selected.add(name)
              for requirement_string in item["requires_dist"]:
                  requirement = Requirement(requirement_string)
                  if requirement.marker is not None and not requirement.marker.evaluate({"extra": ""}):
                      continue
                  dependency = canonicalize_name(requirement.name)
                  if dependency not in packages:
                      raise SystemExit(f"unlocked required dependency: {name} -> {dependency}")
                  if not requirement.specifier.contains(packages[dependency]["version"], prereleases=True):
                      raise SystemExit(f"incompatible reviewed lock: {name} -> {dependency}")
                  pending.add(dependency)

          lines = []
          manifest = []
          for name in sorted(selected):
              item = packages[name]
              url = item["url"]
              sha = item["sha256"]
              parsed = urlsplit(url)
              if parsed.scheme != "https" or parsed.fragment:
                  raise SystemExit(f"non-canonical exact wheel URL for {name}")
              if not re.fullmatch("[0-9a-f]{64}", sha):
                  raise SystemExit(f"invalid exact wheel digest for {name}")
              lines.append(f"{item['name']} @ {url}#sha256={sha}")
              manifest.append({
                  "name": item["name"],
                  "version": item["version"],
                  "url": url,
                  "sha256": sha,
              })

          output = Path(os.environ["RUNNER_TEMP"])
          (output / "gsplat-locked-wheel-urls.txt").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          (output / "gsplat-wheel-subset.json").write_text(
              json.dumps(manifest, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          print(f"Selected {len(selected)} exact locked Torch/build wheel URLs.")
          PY

      - name: Install only hash-verified reviewed wheel URLs, without dependency resolution
        shell: bash
        run: |
          set -euo pipefail
          "$NATIVE_PYTHON" -m pip install --no-index --no-deps --no-cache-dir \
            --require-hashes -r "$RUNNER_TEMP/gsplat-locked-wheel-urls.txt"
          "$NATIVE_PYTHON" -m pip check
          "$NATIVE_PYTHON" - <<'PY'
          import sys
          import numpy
          import torch
          assert numpy.__version__ == "1.26.4", numpy.__version__
          assert sys.version.startswith("3.10.21")
          assert torch.__version__ == "2.4.0+cu124", torch.__version__
          assert torch.version.cuda == "12.4", torch.version.cuda
          assert not torch.cuda.is_available(), "a CPU-only native preflight must not claim GPU"
          print("Reviewed PyTorch 2.4.0+cu124 imported with GPU unavailable.")
          PY

      - name: Install Git fetch tooling in isolated build container
        shell: bash
        run: |
          set -euo pipefail
          # Official NVIDIA CUDA runtime image lacks Git; this package is only a
          # source-fetch helper and is not distributed with the gsplat extension.
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates
          git --version

      - name: Materialize exact gsplat v1.5.3 source with the sole pinned GLM submodule
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/gsplat-source"
          test ! -e "$source_root"
          git init -q "$source_root"
          git -C "$source_root" remote add origin https://github.com/nerfstudio-project/gsplat.git
          git -C "$source_root" fetch --quiet --depth=1 origin "$GSPLAT_REVISION"
          git -C "$source_root" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$source_root" rev-parse HEAD)" = "$GSPLAT_REVISION"
          test "$(git -C "$source_root" rev-parse HEAD^{tree})" = "$GSPLAT_TREE"
          test "$(git -C "$source_root" ls-tree HEAD gsplat/cuda/csrc/third_party/glm | awk '{print $3}')" = "$GSPLAT_GLM_REVISION"
          test "$(git -C "$source_root" config -f .gitmodules --get submodule.gsplat/cuda/csrc/third_party/glm.url)" = "https://github.com/g-truc/glm.git"
          git -C "$source_root" submodule update --init --depth 1 -- gsplat/cuda/csrc/third_party/glm
          glm="$source_root/gsplat/cuda/csrc/third_party/glm"
          test "$(git -C "$glm" rev-parse HEAD)" = "$GSPLAT_GLM_REVISION"
          test "$(git -C "$glm" rev-parse HEAD^{tree})" = "$GSPLAT_GLM_TREE"
          test "$(git -C "$glm" rev-parse HEAD:copying.txt)" = "$GSPLAT_GLM_LICENSE_BLOB"
          test -f "$source_root/setup.py"
          test -f "$source_root/gsplat/cuda/ext.cpp"
          test -d "$source_root/gsplat/cuda/csrc/third_party/glm/glm"
          test "$(git -C "$source_root" submodule status | wc -l)" -eq 1
          test "$(git -C "$source_root" status --porcelain | wc -l)" -eq 0
          echo "Reviewed immutable gsplat + GLM sources and full source-tree identity verified."

      - name: Compile exact gsplat CUDA C++ rasterizer and import linked extension
        shell: bash
        run: |
          set -euo pipefail
          test -x "$CUDA_HOME/bin/nvcc"
          export BUILD_NO_CUDA=0
          export MAX_JOBS=1
          export TORCH_CUDA_ARCH_LIST=7.5
          "$NATIVE_PYTHON" -m pip install --no-deps --no-build-isolation --no-cache-dir \
            "$RUNNER_TEMP/gsplat-source"
          "$NATIVE_PYTHON" - <<'PY'
          from pathlib import Path
          import torch
          import gsplat
          from gsplat import csrc
          from gsplat.cuda._backend import _C

          assert gsplat.__version__ == "1.5.3", gsplat.__version__
          assert torch.__version__ == "2.4.0+cu124", torch.__version__
          assert torch.version.cuda == "12.4"
          assert not torch.cuda.is_available(), "CPU-hosted native gate must not claim GPU"
          assert csrc is _C, "gsplat backend must import the installed native extension"
          path = Path(csrc.__file__)
          assert path.suffix == ".so" and path.is_file()
          assert path.stat().st_size > 0
          print(f"Built and imported exact gsplat v1.5.3 rasterizer: {path.name}. No CUDA kernel was executed.")
          PY

      - name: Retain exact native rasterizer build/import evidence
        shell: bash
        run: |
          set -euo pipefail
          "$NATIVE_PYTHON" - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          from pathlib import Path
          import torch
          import gsplat
          from gsplat import csrc

          native_path = Path(csrc.__file__)
          output = Path(os.environ["GITHUB_WORKSPACE"]) / "gsplat-rasterizer-native-evidence.json"
          data = {
              "schema_version": 1,
              "evidence_kind": "gsplat_native_build_import_cpu_host_only",
              "source_revision": os.environ["GSPLAT_REVISION"],
              "source_tree": os.environ["GSPLAT_TREE"],
              "glm_submodule_revision": os.environ["GSPLAT_GLM_REVISION"],
              "glm_submodule_tree": os.environ["GSPLAT_GLM_TREE"],
              "glm_license_git_blob_sha1": os.environ["GSPLAT_GLM_LICENSE_BLOB"],
              "cuda_toolkit_image_index_sha256": "da6791294b0b04d7e65d87b7451d6f2390b4d36225ab0701ee7dfec5769829f5",
              "python_version": "3.10.21",
              "torch_version": torch.__version__,
              "torch_cuda_version": torch.version.cuda,
              "gsplat_version": gsplat.__version__,
              "compile_arch": "sm_75",
              "native_module_sha256": hashlib.sha256(native_path.read_bytes()).hexdigest(),
              "native_module_byte_length": native_path.stat().st_size,
              "python_wheel_subset": json.loads(
                  (Path(os.environ["RUNNER_TEMP"]) / "gsplat-wheel-subset.json").read_text()
              ),
              "native_extension_build_evidence": True,
              "native_extension_import_evidence": True,
              "gpu_execution_evidence": False,
              "rasterizer_kernel_execution_evidence": False,
              "appearance_training_execution_evidence": False,
              "binary_reproducibility": "unverified",
              "redistribution_review": "pending",
          }
          output.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n")
          print(f"Rasterizer native artifact: {data['native_module_byte_length']} bytes.")
          PY

      - name: Retain rasterizer qualification artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v2l18-3-gsplat-rasterizer-native-build-import
          path: gsplat-rasterizer-native-evidence.json
          if-no-files-found: error
          retention-days: 30
