          from datasets.colmap import Dataset, Parser

          root = Path(os.environ["RUNNER_TEMP"]) / "wre-real-photo-colmap-rgb"
          dataset = root / "gsplat-capture"
          manifest_path = dataset / "wre-capture-manifest.json"
          receipt = json.loads(manifest_path.read_text())
          for relative, expected in receipt["file_sha256"].items():
              target_path = dataset / relative
