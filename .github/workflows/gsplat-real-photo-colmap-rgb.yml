name: gsplat-real-photo-colmap-rgb

on:
  pull_request:
    paths:
      - ".github/workflows/gsplat-real-photo-colmap-rgb.yml"
      - "src/wre/reconstruction/static_appearance_baseline.py"
      - "src/wre/reconstruction/__init__.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observed-real-photo-sparse-rgb:
    name: Actual Middlebury images -> PyCOLMAP sparse -> observed RGB PLY (CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pinned WRE code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install locked WRE + pinned native PyCOLMAP and JPEG decoder
        run: |
          uv sync --frozen --group dev
          uv pip install --python .venv/bin/python "numpy==2.5.3" "pycolmap==4.2.0" "pillow==11.3.0"
          .venv/bin/python -c 'import numpy, pycolmap, PIL; assert numpy.__version__ == "2.5.3"; assert pycolmap.__version__ == "4.2.0"; assert PIL.__version__ == "11.3.0"'
      - name: Real photo feature matching and native sparse model to verified RGB artifact
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          from __future__ import annotations
          
          import hashlib
          import io
          import json
          import os
          import struct
          import urllib.request
          import zlib
          from datetime import UTC, datetime, timedelta
          from pathlib import Path
          
          import pycolmap
          from PIL import Image, ImageOps
          
          from wre.domain import (
              ArtifactProducerIdentity,
              ConfigurationIdentity,
              ImageObservation,
              MediaAssetRef,
              ObservationId,
              Sha256Digest,
              SourceId,
              SourceRef,
          )
          from wre.domain.appearance import AppearanceRepresentationName
          from wre.domain.runs import ProducerRef, ReconstructionRun, ReconstructionRunId
          from wre.reconstruction import (
              ColmapFeatureExtractionConfig,
              ColmapFeatureExtractionRequest,
              ColmapFeatureInput,
              ColmapGeometricVerificationConfig,
              ColmapGeometricVerificationRequest,
              ColmapIncrementalReconstructionConfig,
              ColmapIncrementalReconstructionRequest,
              ColmapPairMatchingConfig,
              ColmapPairMatchingRequest,
              ColmapReconstructionInput,
              canonicalize_colmap_sparse_model,
              extract_colmap_features,
              match_colmap_pairs,
              reconstruct_colmap_incrementally,
              verify_colmap_geometry,
          )
          from wre.reconstruction.colmap_geometry_refinement import (
              colmap_native_sparse_model_artifact_ref,
          )
          from wre.reconstruction.geometry_solution_comparison import GeometrySolutionCandidate
          from wre.reconstruction.static_appearance_baseline import (
              GSPLAT_STATIC_APPEARANCE_REPRESENTATION,
              GsplatStaticAppearancePreflightSource,
              export_verified_colmap_observed_rgb_glb,
              export_verified_colmap_observed_rgb_ply,
              inspect_verified_gsplat_rgb_centers_glb,
          )
          from wre.reconstruction.static_appearance_candidate import StaticAppearanceCandidateRequest
          
          ROOT = Path(os.environ["RUNNER_TEMP"]).resolve() / "wre-real-photo-colmap-rgb"
          IMAGES = ROOT / "images"
          IMAGES.mkdir(parents=True, exist_ok=False)
          UPSTREAM = "323989164b1ea003aade5bf49480630ffc64acde"
          PHOTOS = {
              "DJI_0042.JPG": "7b799d410074a779dddbe840ec0d249889d25d8e",
              "DJI_0043.JPG": "82398bb391df8625cc99d2cb08a7f917ca34f9a6",
              "DJI_0044.JPG": "3b8067e31ceee8d6610e9eb43a225dd46eb0caf6",
          }
          RECEIPT = {
              "source": "OpenMVG Palm Desert Micro three consecutive real DJI Mini 2 drone photos",
              "source_license": "CC BY-NC 4.0: Attribution-NonCommercial; experimental use only",
              "source_credit": "Copyright 2021 Pierre MOULON; openMVG/Image_datasets",
              "source_license_url": "https://creativecommons.org/licenses/by-nc/4.0/",
              "source_dataset_git_revision": UPSTREAM,
              "source_photographs": {},
              "sRGB_interpretation": "assumed for JPEG to RGB8 PNG preview only; no calibrated radiometry",
              "metric_scale_known": False,
              "gpu_kernel_executed": False,
              "gpu_training_executed": False,
              "photometric_training_approved": False,
              "environment": {
                  "pycolmap": pycolmap.__version__,
                  "colmap": str(pycolmap.COLMAP_version),
              },
          }
          assert pycolmap.__version__ == "4.2.0"
          
          def git_blob(data: bytes) -> str:
              return hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
          
          def png_chunk(kind: bytes, data: bytes) -> bytes:
              return (
                  struct.pack(">I", len(data)) + kind + data
                  + struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)
              )
          
          def srgb_png(rgb: Image.Image) -> bytes:
              """Explicit PNG RGB8+sRGB declaration from decoded, size-limited real photos."""
              width, height = rgb.size
              assert 2 <= width <= 768 and 2 <= height <= 768
              raster = rgb.tobytes()
              stride = width * 3
              scanlines = b"".join(
                  b"\x00" + raster[start : start + stride]
                  for start in range(0, len(raster), stride)
              )
              return (
                  b"\x89PNG\r\n\x1a\n"
                  + png_chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 2, 0, 0, 0))
                  + png_chunk(b"sRGB", b"\x00")
                  + png_chunk(b"IDAT", zlib.compress(scanlines, 6))
                  + png_chunk(b"IEND", b"")
              )
          
          inputs = []
          for filename, expected_git_blob in sorted(PHOTOS.items()):
              url = f"https://raw.githubusercontent.com/openMVG/Image_datasets/{UPSTREAM}/Drone/Palm_Desert_Micro/{filename}"
              with urllib.request.urlopen(url, timeout=60) as response:
                  original = response.read(8_000_001)
              assert 0 < len(original) <= 8_000_000
              assert git_blob(original) == expected_git_blob, "real photograph Git blob mismatch"
              with Image.open(io.BytesIO(original)) as opened:
                  assert opened.width >= 320 and opened.height >= 240, (filename, opened.format, opened.size)
                  image = ImageOps.exif_transpose(opened).convert("RGB")
              image.thumbnail((768, 768), Image.Resampling.LANCZOS)
              png = srgb_png(image)
              stem = Path(filename).stem
              path = IMAGES / f"{stem}.png"
              path.write_bytes(png)
              digest = hashlib.sha256(png).hexdigest()
              observation = ImageObservation(
                  observation_id=ObservationId(f"obs:openmvg:{stem}"),
                  asset=MediaAssetRef(
                      uri=path.as_uri(),
                      sha256=Sha256Digest(digest),
                      byte_length=len(png),
                      mime_type="image/png",
                  ),
                  source=SourceRef(
                      source_id=SourceId("openmvg:palm-desert-micro"),
                      locator=filename,
                  ),
                  received_at=datetime(2026, 10, 17, tzinfo=UTC),
              )
              inputs.append(ColmapReconstructionInput(
                  observation=observation, source_path=path, image_name=path.name
              ))
              RECEIPT["source_photographs"][filename] = {
                  "source_git_blob_sha1": expected_git_blob,
                  "source_jpeg_sha256": hashlib.sha256(original).hexdigest(),
                  "derived_srgb8_png_sha256": digest,
                  "width": image.width,
                  "height": image.height,
              }
          
          inputs = tuple(inputs)
          observation_ids = tuple(x.observation.observation_id for x in inputs)
          revision = str(pycolmap.COLMAP_build)
          
          def run(step: str, config_sha: Sha256Digest, minute: int) -> ReconstructionRun:
              return ReconstructionRun(
                  run_id=ReconstructionRunId(f"run:real-aloe:{step}"),
                  producer=ProducerRef(
                      implementation={
                          "features": "pycolmap.extract_features",
                          "matching": "pycolmap.match_exhaustive",
                          "verification": "pycolmap.geometric_verification",
                          "mapping": "pycolmap.incremental_mapping",
                      }[step],
                      version="4.2.0",
                      revision=revision,
                  ),
                  input_observation_ids=observation_ids,
                  started_at=datetime(2026, 10, 17, tzinfo=UTC) + timedelta(minutes=minute),
                  configuration_sha256=config_sha,
              )
          
          feature_config = ColmapFeatureExtractionConfig()
          features = extract_colmap_features(
              ColmapFeatureExtractionRequest(
                  run=run("features", feature_config.sha256, 0),
                  inputs=tuple(
                      ColmapFeatureInput(observation=x.observation, source_path=x.source_path)
                      for x in inputs
                  ),
                  database_path=ROOT / "features.db",
                  config=feature_config,
              ),
              module=pycolmap,
          )
          # Use the exact canonical names registered in the WRE feature database.
          feature_names = {item.observation_id: item.image_name for item in features.images}
          canonical_images = ROOT / "canonical-images"
          canonical_images.mkdir()
          native_inputs = []
          for item in inputs:
              name = feature_names[item.observation.observation_id]
              staged_path = canonical_images / name
              staged_path.write_bytes(item.source_path.read_bytes())
              native_inputs.append(ColmapReconstructionInput(
                  observation=item.observation,
                  source_path=staged_path,
                  image_name=name,
              ))
          native_inputs = tuple(native_inputs)
          match_config = ColmapPairMatchingConfig()
          matches = match_colmap_pairs(
              ColmapPairMatchingRequest(
                  run=run("matching", match_config.sha256, 1),
                  features=features,
                  database_path=ROOT / "matches.db",
                  config=match_config,
              ),
              module=pycolmap,
          )
          verification_config = ColmapGeometricVerificationConfig()
          verified = verify_colmap_geometry(
              ColmapGeometricVerificationRequest(
                  run=run("verification", verification_config.sha256, 2),
                  matching=matches,
                  database_path=ROOT / "verified.db",
                  config=verification_config,
              ),
              module=pycolmap,
          )
          mapping_config = ColmapIncrementalReconstructionConfig(
              min_model_size=2,
              max_num_models=1,
              max_runtime_seconds=900,
          )
          reconstruction = reconstruct_colmap_incrementally(
              ColmapIncrementalReconstructionRequest(
                  run=run("mapping", mapping_config.sha256, 3),
                  verification=verified,
                  inputs=native_inputs,
                  output_path=ROOT / "native-sparse",
                  config=mapping_config,
              ),
              module=pycolmap,
          )
          models = [
              m for m in reconstruction.models
              if m.num_registered_images == len(inputs) and m.num_points3d > 0
          ]
          if not models:
              raise RuntimeError(
                  "Real drone photos did not produce a verified all-view COLMAP sparse model; "
                  f"produced {reconstruction.model_count} model(s), not a 3D proof"
              )
          model = models[0]
          canonical = canonicalize_colmap_sparse_model(
              output_path=reconstruction.output_path,
              model_artifact=model,
              features=features,
              expected_environment=reconstruction.environment,
              module=pycolmap,
          )
          source_ref = colmap_native_sparse_model_artifact_ref(model)
          geometry_candidate = GeometrySolutionCandidate(
              geometry_solution=canonical.geometry_solution,
              camera_solutions=canonical.camera_solutions,
              depth_fields=(),
              point_maps=(canonical.point_map,),
              producer=ArtifactProducerIdentity(
                  producer=ProducerRef(
                      implementation="pycolmap.incremental_mapping",
                      version="4.2.0",
                      revision=revision,
                  ),
                  configuration=ConfigurationIdentity(sha256=mapping_config.sha256),
              ),
              source_artifacts=(source_ref,),
          )
          appearance_request = StaticAppearanceCandidateRequest(
              source_geometry=geometry_candidate,
              source_surface=None,
              source_observation_ids=tuple(
                  sorted((x.observation.observation_id for x in inputs), key=lambda o: o.value)
              ),
              output_representation=AppearanceRepresentationName(
                  GSPLAT_STATIC_APPEARANCE_REPRESENTATION
              ),
              supporting_artifacts=(source_ref,),
          )
          preflight_source = GsplatStaticAppearancePreflightSource(
              image_root=canonical_images,
              images=native_inputs,
              native_model_root=reconstruction.output_path,
              native_model_artifact=model,
              native_model_ref=source_ref,
          )
          preview = ROOT / "observed-real-colmap-rgb.ply"
          digest = export_verified_colmap_observed_rgb_ply(
              appearance_request,
              preflight_source,
              features=features,
              expected_environment=reconstruction.environment,
              module=pycolmap,
              preview_path=preview,
          )
          payload = preview.read_bytes()
          assert hashlib.sha256(payload).hexdigest() == digest.value
          header, separator, body = payload.partition(b"end_header\n")
          exported_points = int(
              next(line.split()[2] for line in header.splitlines() if line.startswith(b"element vertex "))
          )
          assert 0 < exported_points <= model.num_points3d
          assert len(body) == exported_points * struct.calcsize("<3f3B")
          assert f"element vertex {exported_points}".encode() in header
          assert f"comment wre_native_source_points {model.num_points3d}".encode() in header
          assert b"comment wre_metric_scale_known false" in header
          assert len(canonical.camera_solutions) == len(inputs)
          assert any(sum(item[3:]) > 0 for item in struct.iter_unpack("<3f3B", body))
          # Re-run the verified native-model converter to produce an actual glTF 2.0
          # POINTS asset alongside the original full-resolution observed RGB PLY.
          # This is not Gaussian-splat rendering or learned appearance.
          viewable_glb = ROOT / "observed-real-colmap-rgb.glb"
          glb_digest = export_verified_colmap_observed_rgb_glb(
              appearance_request,
              preflight_source,
              features=features,
              expected_environment=reconstruction.environment,
              module=pycolmap,
              preview_path=viewable_glb,
          )
          inspected = inspect_verified_gsplat_rgb_centers_glb(path=viewable_glb)
          assert inspected["kind"] == "wre_colmap_observed_rgb_points"
          assert inspected["source_colmap_points"] == model.num_points3d
          assert inspected["shown_points"] == exported_points
          assert inspected["metric_scale_known"] is False
          assert inspected["gpu_training_verified"] is False
          assert inspected["sha256"] == glb_digest.value
          glb_bytes = viewable_glb.read_bytes()
          json_length = struct.unpack_from("<I", glb_bytes, 12)[0]
          glb_binary = glb_bytes[28 + json_length :]
          assert len(glb_binary) == exported_points * 16
          for i, ply_record in enumerate(struct.iter_unpack("<3f3B", body)):
              assert struct.unpack_from("<3f3B", glb_binary, 16 * i) == ply_record
              assert glb_binary[16 * i + 15] == 0
          RECEIPT["reconstruction"] = {
              "registered_images": model.num_registered_images,
              "sparse_points": model.num_points3d,
          "exported_rgb_points": exported_points,
          "excluded_uncolorable_points": model.num_points3d - exported_points,
              "source_sparse_identity_sha256": canonical.source_model_identity_sha256.value,
              "source_geometry_id": canonical.geometry_solution.geometry_solution_id.value,
              "scale_status": canonical.geometry_solution.scale_status.value,
              "ply_sha256": digest.value,
              "ply_bytes": len(payload),
              "glb_sha256": glb_digest.value,
              "glb_bytes": len(glb_bytes),
              "glb_verified_readback": True,
              "source_photo_reconstruction_executed_on_cpu": True,
              "native_pycolmap_model_canonicalized": True,
          }
          (ROOT / "real-photo-colmap-rgb-receipt.json").write_text(
              json.dumps(RECEIPT, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print("REAL DRONE CPU PHOTO->COLMAP->OBSERVED RGB PLY+GLB PASS")
          print(json.dumps(RECEIPT["reconstruction"], sort_keys=True))
          
          PY
      - name: Materialize self-contained offline viewer from real SfM GLB
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "wre-real-photo-colmap-rgb"
          receipt = json.loads((root / "real-photo-colmap-rgb-receipt.json").read_text())
          model = root / "observed-real-colmap-rgb.glb"
          content = model.read_bytes()
          assert hashlib.sha256(content).hexdigest() == receipt["reconstruction"]["glb_sha256"]
          assert receipt["reconstruction"]["exported_rgb_points"] > 0
          version = "4.1.0"
          component_name = "wre-model-viewer-4.1.0.min.js"
          url = f"https://cdnjs.cloudflare.com/ajax/libs/model-viewer/{version}/model-viewer.min.js"
          expected_sri = "PMy/x5h09gVKwc21Cdcgu/VWJwgmeJ7uivJkbTar3vh5t8uzYo3NQgTkZE0fsfUd+9vihkAcLNAh6mv9mEXkZQ=="
          with urllib.request.urlopen(url, timeout=40) as response:
              component = response.read(5_000_001)
          assert 100_000 < len(component) <= 5_000_000
          assert base64.b64encode(hashlib.sha512(component).digest()).decode() == expected_sri
          (root / component_name).write_bytes(component)
          with urllib.request.urlopen(
              "https://raw.githubusercontent.com/google/model-viewer/v4.1.0/LICENSE",
              timeout=40,
          ) as response:
              license_bytes = response.read(20_001)
          assert 11_000 < len(license_bytes) <= 20_000
          assert b"Apache License" in license_bytes[:110]
          (root / "wre-model-viewer-4.1.0-LICENSE.txt").write_bytes(license_bytes)

          count = receipt["reconstruction"]["exported_rgb_points"]
          native = receipt["reconstruction"]["sparse_points"]
          digest = receipt["reconstruction"]["glb_sha256"]
          html = """<!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>WRE · Real-photograph reconstructed 3D</title>
          <script type="module" src="./wre-model-viewer-4.1.0.min.js"
            integrity="sha512-PMy/x5h09gVKwc21Cdcgu/VWJwgmeJ7uivJkbTar3vh5t8uzYo3NQgTkZE0fsfUd+9vihkAcLNAh6mv9mEXkZQ=="></script>
          <style>
          html,body{margin:0;background:#101720;color:#e6edf6;font:15px system-ui,sans-serif;height:100%}
          main{height:100%;display:flex;flex-direction:column}
          header{padding:16px 22px;background:#192638;border-bottom:1px solid #46556b}
          h1{margin:0 0 5px;font-size:19px}
          p{margin:5px 0;line-height:1.45}
          model-viewer{flex:1;width:100%;min-height:350px;background:#182232}
          footer{padding:12px 22px;font-size:12px;background:#192638}
          a{color:#a8d7ff}
          </style></head><body><main>
          <header><h1>WRE · Native real-photo 3D point cloud</h1>
          <p>Real DJI images → PyCOLMAP CPU → original observed RGB → portable GLB</p>
          <p>COUNT_NATIVE original COLMAP XYZ points · COUNT_COLORED uniquely colorable points
          · scale not metric · no gsplat training · no 4D</p></header>
          <model-viewer id="wre-scene" camera-controls auto-rotate
            interaction-prompt="auto" loading="eager" reveal="auto"
            alt="3D colored sparse scene reconstructed by real native PyCOLMAP"
            src="./observed-real-colmap-rgb.glb"></model-viewer>
          <footer>GLB SHA-256: HASH_GLB · Copyright 2021 Pierre Moulon,
          sample CC BY-NC 4.0 (noncommercial). Offline library: model-viewer 4.1.0,
          Apache-2.0. Drag to orbit; scroll to zoom.
          <a href="./observed-real-colmap-rgb.glb" download>Original verified GLB</a>
          · <a href="./real-photo-colmap-rgb-receipt.json">Provenance</a></footer>
          </main></body></html>"""
          html = (
              html.replace("COUNT_NATIVE", str(native))
                  .replace("COUNT_COLORED", str(count))
                  .replace("HASH_GLB", digest)
          )
          (root / "wre-real-photo-3d-viewer.html").write_text(html, encoding="utf-8")
          (root / "HOW_TO_VIEW.txt").write_text(
              "WRE real-photo experimental 3D: noncommercial CC BY-NC 4.0 dataset.\n"
              "Unzip the artifact. In the extracted directory run:\n"
              "  python3 -m http.server 8765 --bind 127.0.0.1\n"
              "Then open http://127.0.0.1:8765/wre-real-photo-3d-viewer.html\n"
              "All model/JS bytes are local; no network needed to VIEW.\n"
              "GLB POINTS only; no Gaussian photorealism, metric scale, or 4D.\n",
              encoding="utf-8",
          )
          print(f"OFFLINE VIEWER BUNDLED: {native} native, {count} RGB points")
          PY

      - name: Exercise actual offline Chrome WebGL viewer with real reconstructed GLB
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/wre-real-photo-colmap-rgb"
          google-chrome --version
          driver="$CHROMEWEBDRIVER/chromedriver"
          test -x "$driver"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$root" >/tmp/wre-real-http.log 2>&1 &
          http_pid="$!"
          "$driver" --port=9515 --allowed-ips=127.0.0.1 >/tmp/wre-real-driver.log 2>&1 &
          driver_pid="$!"
          trap 'kill "$http_pid" "$driver_pid" 2>/dev/null || true' EXIT
          .venv/bin/python - <<'PY'
          import base64
          import io
          import json
          import os
          import time
          from pathlib import Path
          from urllib.request import Request, urlopen

          base = "http://127.0.0.1:9515"
          def browser(method, route, value=None):
              payload = None if value is None else json.dumps(value).encode()
              request = Request(
                  base + route, data=payload, method=method,
                  headers={"Content-Type": "application/json"},
              )
              with urlopen(request, timeout=40) as response:
                  data = json.load(response)
              if data.get("value", {}).get("error"):
                  raise RuntimeError(str(data["value"]))
              return data["value"]

          for _ in range(50):
              try:
                  if browser("GET", "/status")["ready"]:
                      break
              except (OSError, KeyError):
                  pass
              time.sleep(0.2)
          else:
              raise RuntimeError("ChromeDriver did not start")
          caps = {"browserName":"chrome","goog:chromeOptions":{"args":[
              "--headless=new","--no-sandbox","--disable-dev-shm-usage",
              "--enable-unsafe-swiftshader","--use-gl=angle","--use-angle=swiftshader",
              "--window-size=1280,900","--disable-background-networking",
              "--host-resolver-rules=MAP * 0.0.0.0, EXCLUDE localhost",
          ]}}
          session = browser("POST", "/session", {"capabilities":{"alwaysMatch":caps}})["sessionId"]
          def js(source):
              return browser(
                  "POST",f"/session/{session}/execute/sync",
                  {"script":source,"args":[]},
              )
          try:
              browser("POST",f"/session/{session}/url",{
                  "url":"http://127.0.0.1:8765/wre-real-photo-3d-viewer.html",
              })
              for _ in range(100):
                  result = js("""
                    const view=document.getElementById('wre-scene');
                    return Boolean(
                      customElements.get('model-viewer') && view &&
                      view.loaded && view.model &&
                      view.getBoundingClientRect().width > 640 &&
                      view.getBoundingClientRect().height > 300 &&
                      !!document.createElement('canvas').getContext('webgl2')
                    );
                  """)
                  if result:
                      break
                  time.sleep(0.4)
              else:
                  raise RuntimeError("Real reconstructed POINTS GLB never loaded in Chrome WebGL")
              screenshot = base64.b64decode(
                  browser("GET",f"/session/{session}/screenshot")
              )
              from PIL import Image
              png = Image.open(io.BytesIO(screenshot))
              png.load()
              assert png.size[0] >= 1100 and png.size[1] >= 700
              assert len(screenshot) > 10_000
              output = Path(os.environ["RUNNER_TEMP"]) / "wre-real-photo-colmap-rgb"
              (output / "wre-real-photo-3d-chrome.png").write_bytes(screenshot)
              print("REAL CHROME WEBGL: loaded actual observed GLB, screenshot saved")
          finally:
              browser("DELETE",f"/session/{session}")
          PY

      - name: Publish actual reconstructed RGB PLY, inspectable GLB and verified receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wre-real-photo-colmap-observed-rgb
          path: |
            ${{ runner.temp }}/wre-real-photo-colmap-rgb/observed-real-colmap-rgb.ply
            ${{ runner.temp }}/wre-real-photo-colmap-rgb/observed-real-colmap-rgb.glb
