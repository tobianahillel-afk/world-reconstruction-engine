      - exact finite float depth validation including bool integer string NaN infinity negative and valid-zero rejection plus canonical invalid-zero enforcement
      - exact bool validity validation including integer and string rejection
      - absent confidence acceptance plus populated exact-float finite zero-to-one validation length checks and invalid-pixel zero-confidence enforcement
