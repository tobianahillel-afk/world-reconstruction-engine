      - Add immutable GeometrySolutionId using the established 1-128 character opaque identifier syntax.
      - Add GeometryScaleStatus as a stable string enum containing exactly UNRESOLVED with value unresolved and METRIC with value metric.
      - Add immutable GeometrySolution containing exactly geometry_solution_id GeometrySolutionId local_frame_id LocalFrameId scale_status GeometryScaleStatus camera_solution_ids tuple of CameraSolutionId depth_field_ids tuple of DepthFieldId point_map_ids tuple of PointMapId and metrics MetricVector.
