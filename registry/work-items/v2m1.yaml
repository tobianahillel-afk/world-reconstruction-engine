      - no-metadata and ordinary-phone-metadata fixtures proving no specialist candidate is fabricated
      - exact two-to-one dimensions fixture proving equirectangular_360 is candidate only plus non-two-to-one negative fixture
      - explicit fisheye and rolling-shutter raw metadata phrase fixtures plus generic focal-length and exposure-time negative fixtures
      - allowlisted UAV make or model fixture plus GPS-only and ordinary-camera negative fixtures
      - multi-signal fixture proving specialist candidate classes can coexist in canonical order
      - regression proving no camera mutation projection solve route threshold QualityDecision learned model network lookup or V2L5.5 behavior is introduced
      - full fast CI
