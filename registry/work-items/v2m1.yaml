    reuse:
      - retained ObservationId as the exact subject identity instead of creating a competing media source identifier
      - existing ArtifactRef as the exact derived-evidence link instead of filenames paths timestamps or generic strings
      - existing immutable frozen slots dataclass and canonical tuple validation conventions in wre.domain
      - retained image/video ingestion and fail-closed raw metadata semantics as evidence donors without rewriting them
    acceptance:
      - MediaProfile is an immutable typed value whose subject is exactly one existing ObservationId; it does not duplicate URI byte hash mime type ObservationKind camera identity or mutable source metadata.
      - MediaProfile carries an immutable tuple of exact ArtifactRef evidence links and no untyped dictionary list raw path filename timestamp free-form note or catch-all metadata field.
      - An empty evidence tuple is an explicit valid contract state because V2L5.1 establishes the profile boundary before later signal producers exist; it does not imply positive or negative quality claims.
      - Populated evidence is caller supplied in canonical ArtifactId/ArtifactKind order, contains unique exact references and rejects duplicate unsorted mutable raw-string or wrong-type members rather than silently sorting deduplicating or coercing them.
      - One logical ArtifactId may not appear with conflicting ArtifactKind declarations inside one profile evidence set.
      - MediaProfile equality and hashing are deterministic from typed immutable subject identity and exact evidence links only and perform no registry filesystem database environment media-decode or network lookup.
      - The contract does not infer ObservationKind specialist class blur exposure duplicate dynamic coverage or routing state from the subject or evidence artifact kinds.
      - No MetricVector QualityDecision FailureCategory QualityPolicy benchmark score or route is embedded merely to anticipate later profile consumers.
      - Existing observations ingestion artifact identity artifact metadata V2L4 quality contracts and retained V1 donor behavior remain unchanged.
    tests:
      - focused construction equality hashing and immutability tests for empty and populated MediaProfile values
      - exact ObservationId subject typing and wrong-type negative tests
      - canonical evidence ordering uniqueness conflicting-ArtifactId-kind mutable-collection raw-string and wrong-member-type negative tests
      - regression proving no generic signal dictionary quality decision failure policy route filename path timestamp or inferred ObservationKind fields exist
      - regression proving retained ImageObservation VideoObservation and VideoFrameObservation contracts are unchanged and remain valid MediaProfile subjects through ObservationId only
      - full fast CI
  - id: V2L5.2
    lot: V2L5
    title: Blur sharpness exposure clipping metrics
    status: done
    objective: Implement the first deterministic solver-independent image-quality measurement baseline over an explicit immutable caller-supplied 8-bit luma raster, returning one canonical MetricVector containing sharpness via normalized-luma discrete-Laplacian variance plus mean-luma exact-black-clipping and exact-white-clipping measurements with caller-supplied MetricProvenance, without decoding media files or making quality decisions.
    allowed_scope:
      - src/wre/profiling/__init__.py
      - src/wre/profiling/image_quality.py
      - tests/test_image_quality.py
      - focused lifecycle updates to registry/components.yaml PROJECT_STATE.yaml and this work-item registry after implementation evidence is green so V2L5.3 can be activated without implementing it
    out_of_scope:
      - changing MediaProfile Observation MediaAssetRef MetricVector MetricDescriptor MetricObservation MetricProvenance QualityDecision QualityPolicy or benchmark semantics
      - reading image files paths URIs observations artifact storage databases registries environment variables or network resources
      - JPEG PNG video or other media decode RGB-to-luma color conversion orientation correction resizing reusable decoded-image artifacts pyramids GPU decode or accelerated image I/O
      - adding Pillow OpenCV libvips numpy scipy torch CUDA or any new runtime dependency merely for this deterministic baseline
      - learned blur exposure quality aesthetic or no-reference IQA models
      - adaptive thresholds pass/fail labels quality decisions routing retry fallback or specialist-route selection
      - duplicate near-duplicate or visual-diversity signals owned by V2L5.3
      - camera/input-class specialist flags owned by V2L5.4
      - dynamic long-sequence sparse-coverage signals owned by V2L5.5
      - frame selection decode caching and image pyramids owned by V2L6
      - starting V2L5.3 implementation in this work item
    depends_on: [V2L5.1]
    read_before:
      - docs/02_ARCHITECTURE.md
      - docs/03_PIPELINE.md
      - docs/14_TECHNOLOGY_SELECTION.md
      - docs/23_ENGINEERING_EXECUTION.md
      - docs/24_SYSTEM_INVARIANTS.md
      - docs/25_V2_ROADMAP.md
      - docs/28_PERFORMANCE_OPTIMIZATION_PLAYBOOK.md
      - docs/29_PERFORMANCE_INTEGRATION_MAP.md
      - src/wre/domain/media_profiles.py
      - src/wre/domain/metrics.py
      - src/wre/domain/observations.py
      - tests/test_media_profiles.py
      - tests/test_metrics.py
    reuse:
      - MetricName MetricDescriptor MetricDimension MetricUnit MetricDirection MetricAggregation MetricObservation MetricProvenance and MetricVector as the only measurement vocabulary
      - caller-supplied MetricProvenance for exact evaluator and input-artifact identity rather than hidden global producer metadata
      - pure Python standard-library arithmetic for the first deterministic baseline so decode and accelerated execution remain separately owned
      - MediaProfile remains an evidence-link boundary and is not expanded to embed this metric vector
    acceptance:
      - Define one immutable local luma-raster input value with positive integer width and height at least 3 pixels each and exact immutable bytes payload length width times height; booleans non-integers mutable buffers and inconsistent dimensions fail closed.
      - The evaluator performs no file media observation artifact registry persistence environment or network lookup and accepts only the explicit luma raster plus typed MetricProvenance supplied by the caller.
      - Return exactly four MetricObservation values in canonical MetricName order, namely media.exposure.black_clip_fraction media.exposure.mean_luma media.exposure.white_clip_fraction and media.sharpness.laplacian_variance.
      - Mean luma is the arithmetic mean of 8-bit samples normalized by 255 and is INFORMATIONAL; exact black and white clipping fractions count only samples equal to 0 and 255 respectively and are LOWER_IS_BETTER.
      - Sharpness uses population variance of the four-neighbour discrete Laplacian evaluated on normalized luma over interior pixels only and is HIGHER_IS_BETTER; no border padding interpolation or hidden smoothing is introduced.
      - Metric descriptor dimension unit direction and aggregation tokens are fixed explicitly by this baseline and all observations reuse the exact caller-supplied MetricProvenance object.
      - All produced metric scalars are finite floats and satisfy the existing MetricVector canonical uniqueness contract.
      - Constant luma produces zero Laplacian variance; a non-flat synthetic pattern produces a positive value; all-black and all-white fixtures produce exact clipping fractions and normalized means.
      - No threshold class blur label exposure label warning decision quality score route or MediaProfile mutation is returned.
      - Existing MediaProfile observations metrics quality contracts and retained ingestion behavior remain unchanged.
    tests:
      - luma-raster dimension payload-type payload-length immutability and wrong-type negative tests
      - exact flat black flat white mid-gray and structured-edge synthetic fixtures for mean luma clipping and sharpness
      - exact four metric names canonical order descriptor semantics finite-float values and shared provenance assertions
      - deterministic repeatability and no input mutation regression
      - regression proving no filesystem decode external dependency threshold QualityDecision route or MediaProfile mutation surface is introduced
      - full fast CI
  - id: V2L5.3
    lot: V2L5
    title: Near duplicate and visual diversity signals
    status: done
    objective: Implement the first deterministic threshold-free pairwise perceptual similarity and diversity baseline over two explicit LumaRaster values, returning a canonical MetricVector with fixed-grid normalized luma mean-absolute difference and average-hash Hamming fraction while retaining SHA-256 plus byte length as the separate exact-content duplicate mechanism.
    allowed_scope:
      - src/wre/profiling/__init__.py
      - src/wre/profiling/visual_similarity.py
      - tests/test_visual_similarity.py
      - focused lifecycle updates to registry/components.yaml PROJECT_STATE.yaml and this work-item registry after implementation evidence is green so V2L5.4 can be activated without implementing it
    out_of_scope:
      - changing LumaRaster image-quality MediaProfile Observation MediaAssetRef MetricVector MetricProvenance or exact-content hashing semantics
      - file path URI database registry artifact-store network or environment lookup
      - JPEG PNG video RGB or other media decode color conversion orientation correction resizing cache or image-pyramid materialization
      - reimplementing hash_file_content DuplicateObservationLookup LocalImageIngestor exact SHA-256 matching or persisted exact-duplicate lookup
      - returning is_duplicate is_near_duplicate diverse-enough labels thresholds scores rankings selection decisions or quality decisions
      - learned perceptual embeddings foundation models retrieval indexes ANN or same-scene discovery owned by later retrieval work
      - collection clustering grouping deduplication destructive collapse or source-observation deletion
      - camera and specialist input-class signals owned by V2L5.4
      - dynamic long-sequence sparse-coverage signals owned by V2L5.5
      - frame-selection quality-diversity policy owned by V2L6
      - adding Pillow OpenCV numpy scipy torch or any new runtime dependency
      - starting V2L5.4 implementation in this work item
    depends_on: [V2L5.2]
    read_before:
      - docs/02_ARCHITECTURE.md
      - docs/03_PIPELINE.md
      - docs/14_TECHNOLOGY_SELECTION.md
      - docs/23_ENGINEERING_EXECUTION.md
      - docs/24_SYSTEM_INVARIANTS.md
      - docs/25_V2_ROADMAP.md
      - src/wre/domain/metrics.py
      - src/wre/profiling/image_quality.py
      - src/wre/ingestion/hashing.py
      - tests/test_image_quality.py
      - tests/test_hashing_duplicates.py
    reuse:
      - retained SHA-256 plus byte-length duplicate lookup as the only exact-content duplicate mechanism
      - LumaRaster as the explicit already-decoded 8-bit luma input boundary
      - MetricName MetricDescriptor MetricDimension MetricUnit MetricDirection MetricAggregation MetricObservation MetricProvenance and MetricVector as the only signal vocabulary
      - pure Python standard-library arithmetic so perceptual comparison remains independent from decode and learned retrieval dependencies
    acceptance:
      - Define one pure evaluator taking exactly left LumaRaster right LumaRaster and typed caller-supplied MetricProvenance; wrong input types fail closed and no external lookup occurs.
      - Sample each raster into exactly 64 luma values on an 8 by 8 grid using source coordinate floor of open parenthesis 2 times grid index plus 1 close parenthesis times source size divided by 16 for each axis.
      - Compute media.visual.grid_luma_mae as the arithmetic mean absolute difference of corresponding 8 by 8 samples normalized by 255, yielding a finite float in the closed interval zero to one.
      - Compute media.visual.average_hash_hamming_fraction by thresholding each raster's 64 sampled values against that raster's own arithmetic sample mean with a bit set when sample is greater than or equal to the mean, then dividing mismatched bits by 64.
      - Return exactly two MetricObservation values in canonical MetricName order, media.visual.average_hash_hamming_fraction followed by media.visual.grid_luma_mae.
      - Both metrics use dimension visual_similarity and direction INFORMATIONAL; Hamming uses unit fraction aggregation fraction and grid luma distance uses unit normalized_luma aggregation mean.
      - Both produced observations reuse the exact caller-supplied MetricProvenance object and all values satisfy the existing finite MetricVector contract.
      - Pair evaluation is symmetric and deterministic; comparing a raster with itself yields exactly zero for both metrics.
      - Uniform black versus uniform white yields zero average-hash Hamming fraction but grid luma MAE exactly one, proving the two threshold-free signals carry complementary evidence rather than one silently substituting for the other.
      - A structural synthetic contrast fixture yields positive Hamming and grid-luma distance without converting either value into a duplicate or diversity decision.
      - Existing SHA-256 exact duplicate handling remains unchanged and no exact-content boolean is recomputed from luma pixels.
      - No threshold duplicate label ranking selection route QualityDecision clustering or MediaProfile mutation is returned.
    tests:
      - exact public function signature and wrong-type negative tests for both rasters and MetricProvenance
      - identical raster deterministic zero-distance and symmetry tests
      - uniform black versus white complementary-signal regression
      - structural synthetic fixture with exact or tolerance-bounded positive Hamming and grid-luma distances
      - exact metric names canonical order descriptor semantics finite interval bounds and shared provenance assertions
      - regression proving no filesystem decode exact-hash reimplementation threshold duplicate label selection route clustering learned-model or MediaProfile mutation surface is introduced
      - full fast CI
