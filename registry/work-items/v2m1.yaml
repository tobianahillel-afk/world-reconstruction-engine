      - optional video-duration exact conversion plus absent-duration omission regression
      - temporal visual-change mean and coverage visual-diversity mean exact synthetic fixtures plus empty-evidence omission tests
      - canonical metric ordering finite-float shared-provenance and deterministic repeatability assertions
      - regression proving no dynamic static long sparse-overlap threshold route frame-selection retrieval tracking geometry solver or external-I-O surface is introduced
      - full fast CI
