    reuse:
      - ObservationKind as the exact source for still-versus-video observation evidence instead of guessing from MIME type filename or dimensions
      - ObservationMetadata ImageDimensions and canonical RawMetadataEntry values as caller-supplied evidence only
      - immutable frozen slots dataclass and StrEnum conventions already used by wre domain values
      - raw metadata preservation and fail-closed interpretation rules without changing existing GPS capture-time or camera semantics
    acceptance:
      - Define a closed InputClass enum with still video equirectangular_360 drone_aerial fisheye and rolling_shutter values and a closed InputClassEvidenceKind enum with observed and candidate values only.
      - Define an immutable InputClassEvidence value containing exactly one InputClass one InputClassEvidenceKind and an immutable canonical tuple of non-blank evidence keys; duplicate unsorted mutable or wrong-type evidence fails closed.
      - Define one pure evaluator accepting exactly ObservationKind and optional ObservationMetadata and returning a canonical immutable tuple of unique InputClassEvidence values with no external lookup.
      - ObservationKind IMAGE emits exactly one observed still signal and ObservationKind VIDEO or VIDEO_FRAME emits exactly one observed video signal using observation.kind as its evidence key.
      - Missing optional metadata is valid and produces no specialist candidate merely because evidence is unavailable.
      - An exact two-to-one ImageDimensions ratio may emit only an equirectangular_360 candidate and never an observed 360 claim.
      - Raw metadata may emit fisheye or rolling_shutter candidates only when a canonical key or value contains an explicit case-insensitive fisheye or rolling-shutter phrase; generic focal length exposure time or lens distortion values do not imply either class.
      - Raw EXIF Image Make or Image Model may emit a drone_aerial candidate only for a small explicit baseline allowlist of unambiguous UAV-family tokens documented in the module; GPS presence altitude absence or ordinary camera metadata alone must not imply drone capture.
      - Specialist candidate evidence records exact contributing metadata keys and never rewrites ObservationMetadata Camera or MediaProfile.
      - Multiple independent candidate signals may coexist because 360 fisheye drone and rolling-shutter properties are not mutually exclusive.
      - No false negative is asserted from missing evidence; the evaluator returns only positive observed or candidate evidence and has no absent false rejected or unsupported class state.
      - Returned evidence uses a fixed canonical InputClass order and contains no confidence score threshold route solver QualityDecision or inferred camera model.
      - Existing raw EXIF ingestion GPS and capture-time interpretation image-quality visual-similarity and exact-duplicate behavior remain unchanged.
    tests:
