      - MetricName MetricDescriptor MetricDimension MetricUnit MetricDirection MetricAggregation MetricObservation MetricProvenance and MetricVector as the only summary-metric vocabulary
      - V2L5.3 normalized grid-luma visual-distance values as caller-supplied temporal-change or collection-diversity evidence rather than recomputing image comparisons
      - caller-supplied MetricProvenance for exact evaluator and source-evidence identity
      - pure Python standard-library arithmetic with no media decode or external dependency
    acceptance:
      - Define one immutable ProfileSummaryInput value containing positive integer observation_count positive integer distinct_source_count not exceeding observation_count optional non-negative integer video_duration_us and immutable tuples temporal_grid_luma_changes and coverage_grid_luma_distances.
      - Boolean non-integer negative inconsistent mutable non-finite or out-of-range input values fail closed; visual-distance members must be finite floats in the closed interval zero to one and are never silently clamped sorted or deduplicated.
      - Empty temporal or coverage distance tuples are valid and mean that aggregate evidence is unavailable rather than zero change or complete coverage.
      - Define one pure evaluator accepting exactly ProfileSummaryInput plus typed caller-supplied MetricProvenance and performing no external lookup.
      - Return media.collection.observation_count and media.collection.distinct_source_count for every input as INFORMATIONAL count metrics.
      - When video_duration_us is present return media.sequence.duration_seconds as an INFORMATIONAL second metric using exact microsecond-to-second conversion and do not convert duration into a long-sequence label.
      - When temporal_grid_luma_changes is non-empty return media.temporal.grid_luma_change_mean as the arithmetic mean of those normalized V2L5.3 distances using INFORMATIONAL normalized_luma units.
      - When coverage_grid_luma_distances is non-empty return media.coverage.grid_luma_diversity_mean as the arithmetic mean of those normalized V2L5.3 distances using INFORMATIONAL normalized_luma units.
      - Omit optional metrics whose evidence tuple or duration is absent instead of fabricating zero evidence and return observations in canonical MetricName order.
      - All produced values are finite floats reuse the exact caller-supplied MetricProvenance object and satisfy existing MetricVector uniqueness and ordering contracts.
      - High temporal visual change remains only an input to later dynamic reasoning because camera motion illumination and viewpoint change can cause the same signal.
      - High visual diversity remains only an input to later sparse-coverage reasoning because it does not prove low geometric overlap or disconnected scene structure.
      - No dynamic static long-sequence sparse-coverage duplicate specialist route QualityDecision threshold ranking selection or MediaProfile mutation is returned.
      - Existing V2L5.1 through V2L5.4 contracts exact duplicate handling EXIF semantics and ingestion behavior remain unchanged.
    tests:
