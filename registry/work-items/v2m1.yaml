      - A benchmark request requires at least one source-candidate set, source IDs are unique and canonical, fixture membership is exact and no filesystem registry network model checkpoint or source adapter execution is discovered implicitly.
      - Deterministic union concatenates only the supplied source-specific PairCandidate tuples and delegates deduplication/evidence combination exclusively to merge_pair_candidates; repeated equal input produces equal output independent of supplied source-set order after canonical validation.
      - Union output preserves every unique source ID and ArtifactRef evidence reference for duplicate endpoint pairs exactly as merge_pair_candidates defines; V2L7.6 never discards a lower-priority source because no source priority exists.
      - Benchmark relevant-pair matching compares canonical endpoint identity only. A proposed pair is counted retrieved when its endpoints equal one fixture relevant pair; proposal score rank source count evidence count or source type cannot change relevance.
      - For each source set and for the union compute exact finite candidate_count relevant_pair_count retrieved_relevant_pair_count and candidate_recall where candidate_recall equals retrieved_relevant_pair_count divided by relevant_pair_count and is within 0..1.
      - The union benchmark additionally records source_count and deterministic union_candidate_count; it may record incremental recall relative to an explicitly named comparison source only when that baseline is supplied, but must not declare a winner or select a default source.
      - Metric descriptors use stable retrieval benchmark names dimensions units directions and aggregations; counts are informational count metrics, candidate recall is a higher-is-better fraction, and all MetricObservation values use caller-supplied explicit MetricProvenance rather than hidden evaluator identity.
      - Define one immutable RetrievalBenchmarkResult containing exactly fixture source_results union_candidates union_metrics and optional comparison metadata required to construct existing BenchmarkRecord values; result ordering is canonical and contains no production SceneCluster same-scene truth route choice or QualityDecision.
      - A helper may construct BenchmarkRecord values only from caller-supplied record IDs producer QualityMode HardwareRuntimeIdentity MetricProvenance/performance evidence and the exact fixture identity; it must not infer hardware quality mode artifact refs or comparison baselines.
      - Empty candidate sets are valid and yield zero retrieved count and zero recall; empty relevant-pair truth is invalid because recall would be undefined.
      - Duplicate source IDs malformed candidates foreign observation IDs source-ID mismatches duplicate relevant pairs self-pairs NaN/Inf metric construction and noncanonical tuples fail closed before benchmark output.
      - Unit tests exercise sequential GPS vocabulary and learned source IDs together using bounded in-memory PairCandidate fixtures and require union source-evidence preservation plus recall improvement/neutrality semantics without executing PyCOLMAP PyTorch FFmpeg network or external model assets.
      - V2L7 lot review explicitly verifies V2L7.1 through V2L7.6 compose into proposal-only evidence: retrieval candidates remain worth-considering-together hypotheses and no retrieval source or benchmark result establishes physical scene identity.
      - The lot review records source-specific limitations including sequential locality assumptions GPS availability classical vocabulary dependence learned-model experimental/license status and the fact that repeated/symmetric look-alikes still require V2L8 geometric/disambiguation evidence.
      - No learned candidate is promoted from experimental solely because it achieves higher fixture recall; promotion still requires representative benchmark evidence licensing reproducibility and later continuous/default-selection governance.
    tests:
      - RetrievalRelevantPair and RetrievalBenchmarkFixture exact field-set type canonical ordering uniqueness membership empty-truth and self-pair negative tests
      - RetrievalSourceCandidateSet exact field-set source-ID uniqueness candidate canonicality endpoint membership one-source-only and source-ID mismatch negative tests
      - deterministic union fixture covering disjoint pairs duplicate endpoints multi-source evidence merge duplicate ArtifactRef collapse source-set input-order independence and empty-source candidate tuples
      - recall fixtures covering zero partial full recall exact fraction arithmetic candidate-count versus retrieved-count distinction and union recall never below any constituent source on the same relevant-pair fixture
      - false-positive candidate fixture proving extra non-relevant proposals increase candidate_count without increasing retrieved_relevant_pair_count or candidate_recall and are not reclassified as negative scene truth
      - metric descriptor/vector fixtures proving exact names units directions aggregations finite float values explicit MetricProvenance and canonical ordering
      - BenchmarkRecord construction fixture proving caller-supplied fixture producer quality-mode hardware evidence and comparison IDs are preserved exactly with no inferred environment lookup
      - regression combining sequential gps colmap.vocab_tree and selavpr_plus PairCandidate values without importing/running their external engines and proving all original source evidence survives union
      - regression proving no weighting ranking default selection local matching geometric verification SceneCluster QualityDecision ANN model inference network filesystem discovery or later-lot execution path exists
      - full fast CI native COLMAP lane FFmpeg 8 compatibility where triggered CodeQL and final V2L7 lot-review evidence
