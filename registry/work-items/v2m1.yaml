      - focused public-domain exports only if required for the new MediaProfile contract
      - tests/test_media_profiles.py
      - focused lifecycle updates to registry/components.yaml PROJECT_STATE.yaml and this work-item registry after implementation evidence is green so V2L5.2 can be activated without implementing it
    out_of_scope:
