      - changing V2L17.1 SourcePhotometryMetadata semantics or V2L17.2 color-conversion request plan backend identity or converted-buffer semantics
      - deriving normalization automatically from image histograms learned appearance camera make model neighboring frames scene brightness or geometry
      - treating ISO shutter f-number exposure compensation or color temperature alone as calibrated scene radiance white point or authoritative per-channel gains
      - automatic exposure matching automatic white balance chromatic adaptation matrices camera response estimation HDR fusion tone mapping gamut conversion clipping saturation masks or highlight recovery
      - mutating the V2L17.2 ConvertedLinearRgbBuffer source or overwriting decoded-image pyramid files
      - constraining normalized linear values to the zero-to-one display range because clipping and saturation handling belongs to V2L17.4
      - AppearanceModel material environment scene geometry routing quality policy V2L17.4 V2L17.5 or later behavior
