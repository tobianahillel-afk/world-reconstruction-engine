    reuse:
      - exact SourcePhotometryMetadata and ObservationId evidence from V2L17.1 without modifying its interpretation or pretending the caller-supplied raw evidence has already been independently verified by a decoder
      - existing DecodedImagePyramidManifest source asset hash observation identity pixel layout orientation policy and level descriptors
      - existing provenance and artifact identity primitives for any derived reference-conversion materialization
      - maintained color-management libraries and documented transfer semantics when actual conversion is required rather than a homegrown universal ICC engine; choose the smallest reproducible CPU reference path after checking exact source license runtime and test evidence
    acceptance:
      - Add frozen typed domain records that separately name source-declared color metadata decoded-pixel encoding working color convention and output color convention, plus explicit status for unsupported or unresolved transformations. Pixel byte layout alone must never imply a color encoding.
      - Bind a conversion request to one existing DecodedImagePyramidManifest and SourcePhotometryMetadata with matching ObservationId. Preserve source observation hash and raw metadata evidence and reject mismatched image identity unsupported layout or conflicting declarations.
      - Permit a resolved conversion only when source color convention and target working and output conventions are explicitly specified and mutually compatible under a reviewed reference conversion route. Missing contradictory or unsupported information must yield an explicit unresolved or rejected outcome, never an implicit sRGB Rec.709 D65 or linear default.
      - Define a deterministic canonical conversion plan with explicit input and output conventions transform sequence backend identity precision and quantization assumptions. Changing any input evidence convention or backend configuration must change the declared provenance or conversion identity.
      - Implement and test one bounded CPU reference conversion for a fully declared supported RGB8 source convention and explicit target convention using a verified maintained library when needed. Prove its numerical result against a small independent fixed-color fixture and reject unsupported transfer ICC matrix and range combinations instead of silently approximating them.
      - Keep existing decoded-image pyramid files and SourcePhotometryMetadata immutable. If a converted buffer or artifact is emitted, give it a distinct output identity and complete source transform provenance rather than overwriting the RGB8 bytes or calling them radiance truth.
      - The conversion boundary must not normalize ISO shutter aperture exposure compensation or white-balance gains; those remain distinct future V2L17.3 responsibilities.
      - On green acceptance evidence mark only V2L17.2 done and activate V2L17.3 with a complete executable contract. Do not implement V2L17.3 in the V2L17.2 PR.
    tests:
      - immutable exact-shape enum state and strict type validation for every color convention record and conversion request
      - observation hash identity and decoded pixel-layout mismatch failures plus unresolved unsupported contradictory source-declaration regressions
      - no inferred sRGB Rec.709 D65 gamma range ICC or working/output default when metadata is absent
      - explicit supported source working output convention fixture with deterministic reference conversion and independent numeric tolerances
      - explicit rejection or unresolved results for ambiguous matrix range transfer white point ICC and unsupported source color evidence
      - immutable input image and raw photometry evidence with distinct derived output identity when materializing
      - precise backend version source license deterministic transform and configuration provenance identity regression
      - no white-balance exposure normalization clipping mask tone mapping AppearanceModel geometry mutation or route policy
      - full fast CI and any affected image decode or photometry reference lane
  - id: V2L17.3
    lot: V2L17
    title: Exposure white balance normalization artifact
    status: done
    objective: Define one immutable provenance-rich exposure and white-balance normalization artifact over the explicit linear working-color output from V2L17.2, with caller-supplied finite normalization factors and fail-closed unresolved semantics when factors are absent or unsupported, without estimating factors from pixels or pretending capture metadata alone is radiometric calibration.
    allowed_scope:
