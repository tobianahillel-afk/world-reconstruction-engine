      - exact V2L17.3 PhotometricNormalizationAssessment plan source-content and derived identities plus NormalizedLinearRgbBuffer when normalization is ready
      - original immutable RGB8 bytes only when supplied by the caller and verified against the already-bound V2L17.2 materialization digest; do not reopen or reinterpret the source image file
      - simple exact endpoint comparisons and finite linear-value comparisons for the bounded CPU reference; no external image-processing dependency is needed for mask construction
    acceptance:
      - Add frozen typed domain records for per-channel source-low-endpoint candidate source-high-endpoint candidate and normalized-above-one masks with explicit observation source-plan normalization identity dimensions and deterministic mask identity. Endpoint masks are descriptive candidates only and must never be labeled proven sensor clipping.
      - Bind every ready mask request to one exact V2L17.2 decoded materialization entry and one exact V2L17.3 normalized result lineage for the same observation. Reject foreign paths byte lengths digests plans normalization identities dimensions or channel counts.
      - Implement one bounded deterministic CPU reference that marks an RGB8 channel low-endpoint candidate exactly when its verified source byte equals 0, high-endpoint candidate exactly when it equals 255, and normalized-over-range exactly when the corresponding finite normalized linear channel is greater than 1.0. Values exactly 1.0 are not over-range.
      - Preserve separate masks rather than collapsing source endpoint evidence and post-normalization over-range evidence into one saturation truth label. A white value or endpoint alone is not proof that the original sensor clipped.
