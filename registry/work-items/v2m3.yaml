  - id: V2L18.1
    lot: V2L18
    title: Canonical AppearanceModel contract
    status: ready
    objective: Define one pure immutable solver-independent canonical AppearanceModel metadata and provenance contract for a retained static photorealistic appearance artifact so later Gaussian radiance neural or other renderable representations can share exact WRE identity ancestry local-frame and scale semantics without turning appearance into physical geometry materials environment runtime assets or a solver-specific payload.
    allowed_scope:
      - src/wre/domain/appearance.py
      - focused exports in src/wre/domain/__init__.py
      - tests/test_appearance.py
      - focused lifecycle updates to registry/components.yaml PROJECT_STATE.yaml and this work-item registry only after implementation evidence is green so V2L18.2 can be activated without implementing it
    out_of_scope:
      - implementing training optimization rendering rasterization splatting radiance-field neural-field texture baking image synthesis or another appearance solver
      - adding 3D Gaussian Splatting 2DGS NeRF Mip-Splatting gsplat nerfstudio OpenSplat CUDA GPU NPU model checkpoint or external rendering dependencies
      - changing GeometrySolutionCandidate SurfaceModel SourcePhotometryMetadata color-conversion normalization validity-mask material environment or physical-surface semantics
      - using AppearanceModel as collision measurement navigation watertightness support or physical-geometry truth
      - inventing resolving aligning transforming or coercing LocalFrameId GeometryScaleStatus camera pose depth point geometry or surface scale
      - creating MaterialModel EnvironmentModel MasterScene RuntimeScene LOD compression streaming viewer or V2L18.2 through V2L18.6 behavior
      - adding held-out rendering metrics geometry-disagreement metrics routing ranking default promotion fallback QualityDecision or benchmark policy
      - relabeling generated completion synthetic content or unsupported regions as observed reconstructed appearance
    depends_on: [V2L17.5]
    read_before:
      - docs/00_START_HERE.md
      - docs/01_PRODUCT.md
      - docs/02_ARCHITECTURE.md
      - docs/03_PIPELINE.md
      - docs/14_TECHNOLOGY_SELECTION.md
