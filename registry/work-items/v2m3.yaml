    reuse:
      - ObservationId ObservationMetadata RawMetadataEntry CameraId and ImageDimensions from the canonical media domain rather than defining parallel source or metadata identities
      - the existing metadata interpretation precedent that missing evidence stays absent or ambiguous and invalid evidence never exposes a fabricated resolved value
      - immutable caller-supplied raw metadata evidence already retained by ObservationMetadata; V2L17.1 interprets only explicitly supplied metadata entries and does not re-read source files
      - DecodedImagePyramidManifest only as a boundary reminder that decoded pixel convention belongs to V2L17.2 and must not be inferred or altered by this item
    acceptance:
      - Add one pure domain module using only the Python standard library plus existing canonical WRE domain contracts. Define frozen slots source-photometry records and explicit status enums needed to distinguish absent unknown invalid and resolved color exposure and white-balance evidence.
      - Bind every SourcePhotometryMetadata value to exactly one existing ObservationMetadata value and the same ObservationId. The raw ObservationMetadata record remains immutable source evidence and must not be rewritten normalized or replaced.
      - Represent source-color declarations separately from decoded pixel convention. The contract may retain explicitly declared color-space primaries transfer-characteristic matrix/range or profile-name tokens when supplied by evidence, but must not translate those tokens into a working/output color space or assume defaults when declarations are absent.
      - Represent exposure capture hints separately from normalization. Canonical numeric hints such as ISO speed exposure time f-number and exposure compensation may be retained only when explicitly supported by raw metadata evidence and finite with physically valid sign/domain constraints; partial evidence may remain partial and must not be completed from camera heuristics or pixels.
      - Represent white-balance capture hints separately from normalization. Explicit mode or color-temperature style hints may be retained only when supported by raw metadata evidence; missing white-balance metadata remains absent or unknown and must not become D65 auto white balance unity gains or a guessed temperature.
      - Every resolved unknown or invalid interpretation that cites evidence must retain exact RawMetadataEntry values originating from the bound ObservationMetadata raw_entries. Evidence tuples must be immutable deterministic and fail closed on foreign fabricated duplicated or non-canonical entries.
      - ABSENT state must carry no interpreted value evidence or issue. UNKNOWN must carry relevant raw evidence that cannot be safely mapped to supported semantics and an explanatory issue. INVALID must carry relevant raw evidence plus an explanatory issue and must expose no invalid canonical numeric value. RESOLVED must carry at least one explicit interpreted value and exact supporting evidence with no issue.
      - Accept image and video-frame observation identities without introducing different semantics merely because the source came from a still image or extracted frame. Video-container-specific extraction remains a future adapter concern; this item defines the canonical result contract only.
      - Keep color exposure and white-balance interpretations independently stateful so one field family can be resolved while another is absent unknown or invalid.
      - Do not create or mutate decoded pixel artifacts. V2L17.1 must contain no pixel buffers paths filesystem handles image dimensions derived from decoding color transforms lookup tables response curves normalized gains or output-space values.
      - On green implementation evidence mark V2L17.1 done add the new contract/test files under photometric_pipeline in registry/components.yaml and activate only V2L17.2 with a complete executable decode working output color-convention contract. Do not implement V2L17.2 in the same PR.
    tests:
      - frozen slots exact field-shape and status-enum regressions plus wrong-type failures for ObservationMetadata ObservationId raw evidence and numeric values
      - exact observation-identity regression proving bound ObservationMetadata and top-level ObservationId cannot disagree
      - absent-state regressions proving no evidence value issue default color space ISO exposure aperture or white balance appears when metadata is missing
      - unknown-state regressions proving unsupported declarations remain explicit raw evidence plus issue rather than being guessed into sRGB Rec.709 D65 or another familiar default
      - invalid-state regressions for malformed non-finite zero-or-negative exposure time non-positive ISO/f-number invalid temperature and contradictory evidence with no invalid canonical numeric value exposed
      - resolved color-declaration regressions proving only explicitly evidenced declaration tokens survive and decoded/working/output color spaces remain absent
      - resolved exposure regressions proving independently evidenced ISO exposure-time f-number and exposure-compensation hints remain descriptive capture metadata and are not converted into normalized exposure
      - resolved white-balance regressions proving explicitly evidenced mode/temperature hints remain capture metadata and do not create gains chromatic adaptation or normalized pixels
      - evidence-integrity regressions proving every evidence RawMetadataEntry comes from the exact bound ObservationMetadata record with canonical deterministic ordering and no foreign duplicate or fabricated entry
      - image-versus-video-frame identity regression proving the contract is observation-bound and does not infer photometric semantics from ObservationKind
      - module-surface regression proving filesystem network subprocess EXIF parser ffmpeg Pillow OpenCV colour-science LittleCMS NumPy torch image decode pixel transformation AppearanceModel V2L17.2 and routing behavior are absent
      - full fast CI and CodeQL
  - id: V2L17.2
    lot: V2L17
    title: Decode working output color convention layer
    status: done
    objective: Define and verify one auditable decoded-to-working-to-output color convention layer for existing RGB8 decoded observations with explicit supported input color evidence and explicit target semantics, while preserving unknown source declarations and prohibiting implicit conversion or photometric normalization.
    allowed_scope:
      - src/wre/domain/color_conventions.py
      - src/wre/photometry/color_conventions.py and focused src/wre/photometry/__init__.py when needed for the reference path
      - focused exports in src/wre/domain/__init__.py
      - tests/test_color_conventions.py and tests/test_color_convention_reference.py
      - focused adapter or dependency registry updates only if needed to record one verified reusable color-management reference library and its exact version/license
      - focused lifecycle updates to registry/components.yaml PROJECT_STATE.yaml and this work-item registry after implementation checks are green
    out_of_scope:
      - re-reading source EXIF or container metadata or reinterpreting unsupported raw photometry as resolved
      - changing V2L17.1 source metadata evidence status or semantics
      - silently treating rgb8_packed decoded pixel layout as sRGB Rec.709 linear-light or a known ICC profile
      - guessing missing primaries transfer matrix range white point profile or decoded-pixel convention
      - accepting a color-space conversion when source evidence is absent unknown invalid contradictory or unsupported
      - mutating raw observations existing decoded-image pyramid bytes or source files
      - exposure or white-balance normalization chromatic adaptation by default auto tone mapping clipping or saturation correction
      - AppearanceModel material environment scene geometry routing quality decisions or V2L17.3 through V2L17.5 behavior
      - implementing a custom general ICC color-management engine or claiming universal camera or gamut support
