  - id: V2L17.1
    lot: V2L17
    title: Source color exposure metadata contract
    status: done
    objective: Define one pure immutable solver-independent source-photometry metadata contract over an exact ObservationMetadata record so declared source-color evidence exposure capture hints and white-balance hints can be represented with explicit absent unknown invalid or resolved state without decoding pixels transforming color normalizing exposure or guessing missing metadata.
    allowed_scope:
      - src/wre/domain/source_photometry.py
      - focused exports in src/wre/domain/__init__.py
      - tests/test_source_photometry.py
      - focused lifecycle updates to registry/components.yaml PROJECT_STATE.yaml and this work-item registry only after implementation evidence is green so V2L17.2 can be activated without implementing it
    out_of_scope:
      - reading image or video payload bytes opening files invoking EXIF parsers ffmpeg Pillow OpenCV colour-science LittleCMS or another decode/color runtime
      - changing raw Observation ObservationMetadata RawMetadataEntry EXIF ingestion metadata interpretation decoded-image or persistence contracts
      - assuming sRGB Rec.709 linear light D65 full range limited range gamma transfer primaries matrix coefficients or ICC behavior from MIME type file extension codec camera make model or decoded pixel layout
      - inferring ISO exposure time aperture exposure compensation white balance color temperature tint or camera response from pixel statistics brightness histograms MediaProfile values or neighboring observations
      - decoding pixels applying orientation color conversion transfer functions gamma linearization chromatic adaptation ICC transforms tone mapping clipping masks exposure normalization or white-balance normalization
      - creating an AppearanceModel texture radiance Gaussian material environment MasterScene RuntimeScene or V2L17.2 through V2L17.5 behavior
      - selecting routes ranking observations emitting QualityDecision safety accuracy realism or reconstruction-truth claims
      - modifying V2M2 geometry depth or physical-surface artifacts
    depends_on: [V2L16.6]
