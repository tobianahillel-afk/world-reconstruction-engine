      - src/wre/domain/__init__.py
      - src/wre/reconstruction/geometry_solution_comparison.py
      - tests/test_surfaces.py
      - tests/test_geometry_solution_comparison.py
      - tests/test_photometric_pipeline_fixture.py
    reuse:
      - ArtifactRef ArtifactKind ArtifactProducerIdentity ObservationId LocalFrameId GeometryScaleStatus and canonical tuple ordering rules from existing WRE domain contracts rather than creating parallel identity provenance frame or scale vocabularies
      - GeometrySolutionCandidate unchanged as the exact spatial reconstruction hypothesis supporting appearance and as the authoritative source of local-frame and scale state
      - SurfaceModel unchanged as optional explicit physical support when an appearance representation was built against one; absence of a SurfaceModel must remain distinct from a fabricated surface
      - source ObservationId values and canonical source-artifact ancestry as provenance links only; V2L18.1 must not reinterpret pixels color metadata normalization or validity evidence
      - V2L17 reviewed photometric evidence only as an upstream responsibility boundary; no V2L17 value is mutated or promoted into appearance truth by this contract
      - the open-token pattern used by SurfaceRepresentationName for solver-independent retained representation names
    acceptance:
      - Add one pure src/wre/domain/appearance.py module using only the Python standard library plus existing canonical WRE domain contracts and one focused export update. Do not import an appearance solver renderer learned model numerical array library or hardware runtime.
      - Define one frozen slots AppearanceRepresentationName open lowercase token so Gaussian radiance neural texture or future representations can be named without making any current solver family part of core semantics.
      - Define one frozen slots AppearanceModel immutable metadata/provenance envelope with one exact output ArtifactRef of canonical static-appearance kind one complete source GeometrySolutionCandidate one optional exact SurfaceModel support value a non-empty canonical tuple of source ObservationId values one AppearanceRepresentationName exact LocalFrameId exact GeometryScaleStatus ArtifactProducerIdentity and a non-empty canonical tuple of source ArtifactRef ancestry.
      - AppearanceModel local_frame_id and scale_status must exactly preserve the source GeometrySolutionCandidate values. The contract must not resolve unresolved scale or reinterpret a local frame as world Earth geographic or runtime coordinates.
      - When source_surface is present it must refer to the same complete source GeometrySolutionCandidate and preserve the same LocalFrameId and GeometryScaleStatus. A foreign geometry surface frame or scale must fail closed rather than be aligned or coerced.
      - source_observation_ids must be an immutable non-empty unique tuple in canonical ObservationId value order. The contract records which observations support appearance but does not read their pixel payloads infer visibility weights or claim complete scene coverage.
      - source_artifacts must be immutable non-empty unique and canonically ordered by ArtifactId and ArtifactKind. They must retain every artifact in source_geometry.source_artifacts and when source_surface is present must retain both its artifact_ref and every source_surface.source_artifact. The output appearance artifact identity must not reuse a source artifact identity.
      - The contract must not inline solver-private Gaussian positions covariance spherical-harmonic coefficients neural weights texture pixels material channels environment maps rendering settings or runtime payloads. Those remain artifact payloads owned by later adapters and runtime stages.
      - AppearanceModel is visual evidence only. Its docstring and tests must make explicit that it is not collision measurement navigation physical-surface material environment or generated-completion truth.
      - Generated or synthetic completion must not be silently represented as ordinary reconstructed appearance by this item. V2L18.1 defines the static reconstructed appearance envelope only; future generated completion retains its separate provenance responsibility.
      - On green implementation evidence mark V2L18.1 done add appearance.py and tests/test_appearance.py under static_appearance in registry/components.yaml and activate only V2L18.2 with a complete Gaussian/radiance adapter capability contract. Do not implement V2L18.2 in the same PR.
    tests:
      - frozen slots exact field-shape representation-token and canonical static-appearance artifact-kind regressions
      - wrong-type failures for output artifact source geometry optional source surface source observations representation frame scale producer and source artifacts
      - frame-and-scale regressions proving AppearanceModel exactly preserves source geometry LocalFrameId and GeometryScaleStatus including unresolved scale
      - optional-surface integrity regressions proving foreign geometry frame or scale fails closed while absence remains valid and does not fabricate a physical surface
      - source-observation regressions proving non-empty immutable unique canonical ordering with no implicit sorting mutation duplicate or inferred observation
      - ancestry regressions proving all source GeometrySolutionCandidate artifacts and when present the SurfaceModel artifact plus its ancestry are retained and the output artifact cannot alias a source identity
      - representation openness regression accepting a valid future lowercase token while rejecting blank uppercase whitespace overlength or illegal-character names without enumerating solver brands in core semantics
      - immutability regressions proving source geometry surface observation tuples producer and ancestry are not mutated by AppearanceModel construction
      - separation regressions proving the module contains no Gaussian payload coefficients neural weights pixels MaterialModel EnvironmentModel MasterScene RuntimeScene renderer training optimization routing QualityDecision collision measurement or navigation implementation behavior
      - module-surface regression proving NumPy torch CUDA gsplat nerfstudio OpenSplat image decode filesystem network subprocess checkpoint download and accelerator behavior are absent
      - full fast CI and CodeQL
