    reuse:
      - exact SourcePhotometryMetadata ObservationId and RawMetadataEntry evidence from V2L17.1 as descriptive capture context only; never reinterpret those hints into hidden normalization factors
      - exact V2L17.2 ColorConversionPlan and ConvertedLinearRgbBuffer identities as the immutable linear-working-color source of any bounded normalization result
      - existing Sha256Digest artifact provenance and producer identity primitives rather than inventing parallel content identities
      - direct positive scalar multiplication in linear light for one bounded deterministic CPU reference once explicit exposure-EV adjustment and RGB white-balance gains are supplied; do not introduce a general auto-white-balance or radiometric-calibration engine
    acceptance:
      - Add frozen typed domain records for explicit exposure adjustment white-balance RGB gains normalization request assessment plan and derived normalization identity. Unknown missing contradictory non-finite zero-or-negative gain inputs must remain unresolved or rejected rather than receiving unity or camera-derived defaults.
      - Bind every normalization request to one exact V2L17.2 ColorConversionPlan or ConvertedLinearRgbBuffer and the same ObservationId and SourcePhotometryMetadata lineage. Reject foreign observation source-plan content or transform identities.
      - Keep normalization parameters semantically separate from capture hints. Source ISO exposure time f-number exposure compensation white-balance mode and color temperature may be retained in provenance but must not automatically produce exposure-EV adjustment RGB gains or a scene white point.
      - Permit one bounded reference normalization only when the caller explicitly supplies a finite exposure adjustment in EV and three finite strictly positive RGB gains. Apply exposure as a linear-light scale of two raised to the explicit EV adjustment and apply the three gains channel-wise without tone mapping clipping saturation correction or gamut conversion.
      - The bounded reference output must preserve finite non-negative linear values even when they exceed 1.0. Values above display range are intentional evidence for V2L17.4 and must not be silently clipped or renormalized.
      - Define deterministic plan and result identities over the complete source conversion identity source content digest explicit normalization parameters backend identity and transform sequence. Changing any factor evidence source buffer or backend configuration must change the appropriate identity.
      - Preserve the exact V2L17.2 input buffer and all source/raw metadata immutably. A normalized buffer or materialization must have a distinct identity and explicit provenance and must never be described as calibrated radiance truth.
      - Missing normalization factors may produce an explicit unresolved assessment but must not silently fall back to exposure zero EV unity RGB gains auto white balance or metadata-derived guesses.
      - On green implementation evidence mark only V2L17.3 done and activate V2L17.4 with a complete executable clipping saturation and incompatible-camera handling contract. Do not implement V2L17.4 in the V2L17.3 PR.
    tests:
      - frozen exact-shape enum record and strict type validation for normalization factors request assessment plan and result
      - observation and V2L17.2 plan or content identity mismatch failures with no cross-observation normalization
      - absent explicit factor regression proving ISO shutter aperture exposure compensation white-balance mode and color temperature never synthesize adjustment values
      - invalid parameter regressions for NaN infinity zero negative RGB gains non-float values and contradictory source identities
      - deterministic explicit-factor fixture proving linear-light two-to-the-EV scaling plus independent RGB gain multiplication against fixed expected values
      - above-one output regression proving the reference path does not clip tone-map saturate or renormalize normalized linear values
      - provenance regressions proving any source plan source content factor or backend change changes normalization identity
      - input immutability and distinct derived-output identity regressions
      - module-surface regression proving image statistics auto exposure auto white balance chromatic adaptation camera response HDR clipping saturation AppearanceModel geometry and routing behavior remain absent
      - full fast CI and CodeQL
