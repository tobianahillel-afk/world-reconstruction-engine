    reuse:
      - validated ArtifactDependencyGraph as the only accepted graph-write input instead of accepting unvalidated raw edge collections
      - ArtifactRef as exact persisted node/dependency identity
      - retained SQLiteLocalStore generic wre_records table transaction and immutable conflict semantics
      - retained canonical_json and strict fail-closed decoder helpers
      - existing database and record schema versions without a speculative migration framework
    acceptance:
      - Dependency persistence records every declared graph node including isolated nodes as its exact ArtifactRef plus its immutable set of direct dependency ArtifactRef values; no transitive edges are synthesized.
      - The wire representation of set-like nodes/dependencies is deterministic through explicit canonical ordering while the public lookup contract returns immutable frozenset values.
      - SQLiteLocalStore accepts only a typed already-validated ArtifactDependencyGraph for graph persistence and writes all graph dependency records transactionally so a conflict or malformed existing record cannot leave a partial graph write.
      - Rewriting an identical graph or an overlapping graph whose existing node dependency records are identical is idempotent.
      - Reusing one ArtifactId with a different ArtifactKind or a different direct-dependency set raises PersistenceConflictError and rolls back the entire attempted graph write.
      - Exact direct-dependency lookup by ArtifactRef returns the stored immutable direct dependency set, returns None when no dependency record exists, and fails closed if the stored record identity/kind does not exactly match the requested ArtifactRef.
      - Exact direct-dependent lookup returns the immutable set of artifacts that directly depend on the requested ArtifactRef; an artifact with no direct dependents yields an empty frozenset and no transitive closure is performed.
      - Corrupted malformed unsupported-version or wrong-type dependency records fail closed through the retained persistence error boundary rather than being skipped or repaired.
      - Reopening the SQLite store preserves direct dependency and direct-dependent lookup exactly, including isolated nodes and empty dependency sets.
      - Dependency persistence does not require create fetch repair or mutate SceneProject or ArtifactMetadata records and does not resolve ArtifactKey values.
      - Existing SceneProject ArtifactMetadata observation camera metadata fragment reconstruction-run and V2L2.1 graph behavior remain unchanged.
      - No cache lookup reuse invalidation materialization scheduling routing or solver behavior is introduced.
    tests:
      - deterministic dependency-record codec tests including canonical ordering and empty dependency sets
      - SQLite graph-write reopen and exact direct-dependency lookup tests for isolated chain diamond and disconnected graphs
      - direct-dependent lookup tests proving only immediate dependents are returned
      - idempotent repeated and overlapping graph-write tests
      - transactional rollback tests for dependency-set and ArtifactKind conflicts
      - malformed-record identity-kind and unsupported-version fail-closed tests
      - regression tests for V2L1 metadata persistence V2L2.1 graph behavior and retained V1 persistence
      - full fast CI
  - id: V2L2.3
    lot: V2L2
    title: Canonical cache lookup
    status: ready
    objective: Add deterministic exact candidate lookup for persisted ArtifactMetadata by canonical ArtifactKey so prior identical computations can be discovered without filename timestamp or fuzzy heuristics, while explicitly stopping before materialization verification reuse selection or invalidation.
    allowed_scope:
      - src/wre/persistence/sqlite_store.py
      - src/wre/persistence/__init__.py only if focused public persistence exports require it
      - tests/test_artifact_cache_lookup.py
      - focused additions to tests/test_persistence.py if required for retained-regression coverage
    out_of_scope:
      - changing ArtifactKey ArtifactMetadata ArtifactRef producer identity provenance or dependency-DAG semantics
      - recomputing deriving normalizing or partially matching ArtifactKey values inside the store
      - selecting one candidate as the winner or declaring any candidate reusable merely because its key matches
      - materialization path URI byte length output-content digest existence integrity or corruption verification owned by V2L2.5
      - dependency-scoped invalidation traversal planning deletion garbage collection or destructive mutation owned by V2L2.4
      - cache population side effects eviction ranking recency preference project preference or hidden mutable cache state
      - filename path timestamp mtime producer-only model-only configuration-only or other fuzzy fallback lookup
      - schema migration new table external database backend ORM or new dependency
      - scheduler routing solver adapter-registry quality runtime or V2L2.4+ behavior
    depends_on: [V2L2.2]
    read_before:
      - docs/02_ARCHITECTURE.md
      - docs/15_PRODUCTION_RUNTIME.md
      - docs/23_ENGINEERING_EXECUTION.md
      - docs/24_SYSTEM_INVARIANTS.md
