    reuse:
      - QualityDecision as the only evaluator decision vocabulary and QualityMode as a separate compute/product-mode vocabulary
      - FailureCategory as stable caller-supplied cross-adapter failure meaning without parsing raw adapter signals
      - MetricVector and MetricName as the complete typed measurement input without recomputation or flattening into one score
      - immutable explicit identity and canonical tuple conventions already used throughout wre.domain
      - fail-closed unresolved-state and bounded-escalation principles from docs/24_SYSTEM_INVARIANTS.md
    acceptance:
      - The quality policy is an immutable explicitly versioned caller-selected contract; evaluation never discovers a mutable latest policy from registry environment path filename or global state.
      - Policy metric rules refer only to exact MetricName values and declare whether a metric is required or optional plus any explicit finite threshold comparison and non-PASS decision produced when that threshold is violated; informational known metrics can be admitted without a threshold.
      - Policy failure rules map exact FailureCategory values to explicit non-PASS QualityDecision values; a stable failure category is never silently treated as success merely because no metric rule fires.
      - Metric and failure rule collections are immutable unique and canonically ordered; duplicate mutable raw or untyped collections fail closed rather than being sorted deduplicated or coerced silently.
      - Evaluation accepts exactly a typed policy MetricVector and immutable tuple of explicit FailureCategory values and performs no metric calculation adapter execution registry lookup logging parse filesystem network or environment inspection.
      - Every required policy metric must be present exactly once through MetricVector semantics; a missing required metric yields QualityDecision.UNRESOLVED with a typed reason rather than PASS.
      - Every supplied metric must be explicitly admitted by the policy as a thresholded or informational metric; an unknown metric yields UNRESOLVED rather than being ignored.
      - Every supplied FailureCategory must have an exact policy mapping; an unmapped failure yields UNRESOLVED rather than being ignored or inferred.
      - Threshold comparisons use the supplied finite MetricObservation value exactly with no normalization rounding weighting or unit conversion; policy construction requires explicit compatible MetricDirection expectations rather than guessing semantics.
      - If no failure rule or metric threshold produces a non-PASS decision and all required/known-input checks succeed the result is PASS.
      - When multiple rules produce decisions the evaluator uses one documented fixed deterministic precedence local to quality evaluation, with UNRESOLVED strongest followed by ESCALATE RETRY ACCEPT_WITH_WARNINGS and PASS; this precedence selects a returned decision only and executes no action.
      - Evaluation output is immutable and contains the selected QualityDecision policy identity/revision and a canonical tuple of typed machine-readable reasons sufficient to audit which missing unknown failure or threshold condition determined the result; no free-form catch-all metadata route target retry count or scheduler action is included.
      - QualityMode benchmark records failure taxonomy metric contracts adapter registry persistence routing and retained V1 behavior remain unchanged.
    tests:
      - policy identity/revision rule construction immutability canonical-order uniqueness and wrong-type negative tests
      - PASS case with all required metrics present and all thresholds satisfied
      - explicit threshold violations producing ACCEPT_WITH_WARNINGS RETRY ESCALATE and UNRESOLVED decisions
      - explicit mapped FailureCategory decision cases and deterministic multi-rule precedence tests
      - missing required metric unknown input metric and unmapped failure fail-closed UNRESOLVED tests
      - optional and informational known metric cases proving absence or presence is deterministic and does not affect unrelated thresholds
      - regression proving evaluator does not mutate MetricVector infer failures execute retry fallback routing scheduling or change benchmark and QualityMode semantics
      - full fast CI
