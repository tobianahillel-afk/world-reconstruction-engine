      - tests/test_artifact_keys.py
      - tests/test_artifact_metadata.py
      - tests/test_artifact_dependencies.py
      - tests/test_persistence.py
    reuse:
      - ArtifactKey as the only canonical computation-identity lookup input
      - persisted ArtifactMetadata as the candidate record returned to callers without inventing a second cache-entry identity type
      - retained SQLiteLocalStore generic wre_records table and strict ArtifactMetadata decoder
      - deterministic ordering and fail-closed corrupted-record handling conventions from V2L1.6 and V2L2.2
    acceptance:
      - SQLiteLocalStore exposes one typed lookup accepting exactly ArtifactKey and returning all persisted ArtifactMetadata records whose stored ArtifactKey equals it exactly.
      - No partial digest prefix filename timestamp project producer model checkpoint configuration provenance or ArtifactKind fallback matching is performed.
      - Zero exact matches returns an empty immutable tuple rather than None or a synthesized miss record.
      - Multiple exact matches are preserved rather than arbitrarily collapsed; candidates from different SceneProject values remain discoverable because ArtifactKey identity is computation-oriented rather than project-oriented.
      - Returned candidates use a documented deterministic order by project identity then ArtifactId then ArtifactKind so result order does not depend on SQLite row order or insertion history.
      - Lookup is read-only and does not create mutate repair rank evict or otherwise alter ArtifactMetadata dependency records projects or any other persisted state.
      - A matching ArtifactKey is only a cache candidate discovery signal; this item does not claim that bytes exist are healthy are compatible for resume or are safe to reuse before later materialization and policy checks.
      - Every artifact_metadata row inspected by the lookup is schema-version checked and decoded through the retained strict decoder; malformed payloads unsupported versions or record-id versus payload ArtifactId mismatches fail closed rather than being silently skipped.
      - Raw strings Sha256Digest values or other untyped substitutes are rejected at the public lookup boundary instead of being coerced into ArtifactKey.
      - Reopening SQLiteLocalStore preserves exact candidate lookup results and deterministic ordering.
      - Existing ArtifactMetadata put/get direct dependency lookups V2L2.1 graph behavior and retained V1 persistence remain unchanged.
      - No invalidation materialization scheduling routing solver adapter-registry quality or runtime behavior is introduced.
    tests:
      - exact-key no-match single-match and near-key non-match lookup tests
      - multiple exact-match tests including cross-project candidates and deterministic ordering independent of insertion order
      - reopen regression preserving lookup results
      - negative untyped lookup-input tests
      - malformed artifact_metadata unsupported-version and record-id/payload-identity mismatch fail-closed tests
      - regression tests for existing ArtifactMetadata and dependency persistence APIs
      - full fast CI
