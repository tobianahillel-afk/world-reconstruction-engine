schema_version: 1
milestone: V2M0
work_items:
  - id: V2L0.1
    lot: V2L0
    title: Inventory and migration map
    status: done
    objective: Define the executable v2 roadmap and classify every implemented/planned v1 capability before machine-state migration.
    allowed_scope:
      - docs/25_V2_ROADMAP.md
      - registry/v1-v2-migration.yaml
      - docs/07_ROADMAP.md
    out_of_scope: [source-code changes, dependency changes, machine-state replacement]
    depends_on: []
    read_before: [docs/00_START_HERE.md, docs/23_ENGINEERING_EXECUTION.md, docs/24_SYSTEM_INVARIANTS.md]
    reuse: [existing Git/PR/review history]
    acceptance:
      - Every implemented v1 component has a forward migration decision.
      - The v2 roadmap covers all canonical blueprint capability families.
      - Work-item identity is capability-oriented rather than tied to one research model.
      - No implementation state or source behavior changes.
    tests: [fast CI, documentation/inventory review]
  - id: V2L0.2
    lot: V2L0
    title: Machine roadmap and state migration
    status: done
    objective: Replace legacy machine roadmap/state/component/review metadata with v2.0 identifiers and validation rules while preserving historical evidence and source behavior.
    allowed_scope:
      - registry/work-items.yaml and registry/work-items/v2m*.yaml
      - PROJECT_STATE.yaml
      - registry/components.yaml
      - registry/reviews.yaml
      - repository validator and its focused tests
      - canonical startup documentation needed to point agents at the v2 roadmap
    out_of_scope:
      - product feature implementation
      - changes to ingestion/reconstruction/retrieval behavior
      - dependency/model installation
      - deletion or rewrite of retained v1 source modules
    depends_on: [V2L0.1]
    read_before:
      - docs/25_V2_ROADMAP.md
      - registry/v1-v2-migration.yaml
      - docs/23_ENGINEERING_EXECUTION.md
      - docs/24_SYSTEM_INVARIANTS.md
      - src/wre/repo_validation.py
      - tests/test_repo_validation.py
    reuse: [existing repository validator and review-gate architecture]
    acceptance:
      - V2 milestones, lots and every planned work-item ID are machine-readable.
      - Exactly one active v2 item exists and legacy L4.3 is no longer active.
      - Planned work may stay concise, but any ready/in_progress/in_review/done item must have a full executable contract.
      - Validator enforces deny-by-default activation metadata and maximum six work items per lot.
      - Component and review registries cover every v2 lot/milestone.
      - Historical v1 evidence remains referenced and recoverable.
      - Fast CI and validator tests pass without changing product code behavior.
    tests: [repository validator tests, full fast CI]
  - id: V2L0.3
    lot: V2L0
    title: Retained baseline compatibility review
    status: done
    objective: Prove that the v2 governance migration preserved the retained v1 implementation, tests and external integration behavior, close the V2L0 migration lot, and prepare the first implementation item without adding product functionality.
    allowed_scope:
      - compatibility and migration review evidence under docs/reviews
      - registry/reviews.yaml V2L0 review state
      - registry/components.yaml migration-governance completion state
      - PROJECT_STATE.yaml and v2m0 work-item handoff metadata
      - focused validation/test metadata needed to prove retained baseline compatibility
    out_of_scope:
      - SceneProject or artifact-domain implementation
      - refactoring retained ingestion persistence reconstruction or retrieval modules
      - new external dependencies models or reconstruction algorithms
      - changing accepted geometry retrieval or metadata semantics
      - starting V2L1.1 implementation in the compatibility-review PR
    depends_on: [V2L0.2]
    read_before:
      - registry/v1-v2-migration.yaml
      - docs/25_V2_ROADMAP.md
      - docs/23_ENGINEERING_EXECUTION.md
      - docs/24_SYSTEM_INVARIANTS.md
      - docs/reviews/L0-M0-bootstrap-review.md
      - docs/reviews/L1-core-domain-review.md
      - docs/reviews/L2-media-ingestion-review.md
      - docs/reviews/L3-M1-colmap-baseline-review.md
      - .github/workflows/ci.yml
      - .github/workflows/colmap-integration.yml
    reuse:
      - existing fast CI and full pytest suite
      - retained native PyCOLMAP integration lane
      - existing deterministic COLMAP end-to-end fixture
      - Git history and V1-to-V2 migration map
    acceptance:
      - Fast CI passes under the v2 roadmap and validator.
      - The exact retained PyCOLMAP integration lane passes without weakening solver or fixture semantics.
      - No product source module was deleted or behaviorally rewritten by V2L0 migration.
      - V1 review and regression evidence remains traceable from the migration map and Git history.
      - V2L0 lot review records a PASS only if governance and retained baseline compatibility are both evidenced.
      - V2L1.1 is expanded to a complete executable contract before becoming ready.
      - Final handoff makes V2L1.1 the sole active item and does not implement it.
    tests:
      - repository validator and fast CI
      - retained PyCOLMAP integration workflow
      - source-tree migration diff audit
      - V2L0 lot review checklist
  - id: V2L1.1
    lot: V2L1
    title: SceneProject contract
    status: done
    objective: Define the minimal immutable SceneProjectId and SceneProject root contract that establishes a distinct project identity boundary for all later V2 project and artifact metadata without pulling later manifest responsibilities forward.
    allowed_scope:
      - src/wre/domain/projects.py
      - focused public-domain exports only if required for the new contract
      - tests/test_scene_projects.py
    out_of_scope:
      - ArtifactId artifact kinds or exact input-artifact references owned by V2L1.2
      - producer model checkpoint or configuration identity owned by V2L1.3
      - provenance classes owned by V2L1.4
      - canonical artifact keys or content addressing owned by V2L1.5
      - codec database or metadata persistence owned by V2L1.6
      - source-media collections coordinate frames quality modes user overrides scene clusters temporal groups artifact roots master-scene versions runtime exports or warnings
      - generic placeholder dictionaries strings or lists standing in for later typed manifest responsibilities
      - ingestion reconstruction retrieval routing solver runtime or external-dependency behavior changes
      - refactoring existing ObservationId or SourceId behavior merely to share implementation code
    depends_on: [V2L0.3]
    read_before:
      - docs/02_ARCHITECTURE.md
      - docs/15_PRODUCTION_RUNTIME.md
      - docs/23_ENGINEERING_EXECUTION.md
      - docs/24_SYSTEM_INVARIANTS.md
      - docs/25_V2_ROADMAP.md
      - src/wre/domain/observations.py
      - tests/test_observations.py
    reuse:
      - existing frozen dataclass and slots value-object conventions in the domain layer
      - existing opaque identifier lexical semantics used by ObservationId and SourceId
      - existing deterministic ValueError-based validation and unit-test style
    acceptance:
      - SceneProjectId is a distinct identity type and is not an alias of observation source camera scene or temporal identity.
      - SceneProjectId uses the established WRE opaque-ID lexical contract and rejects empty whitespace invalid-character and overlength values.
      - Project identity is caller supplied; the contract does not generate random hidden identity.
      - SceneProject is immutable and carries exactly the project identity in this work item, with no mutable catch-all configuration or placeholder future-manifest fields.
      - Equality and hashing are deterministic from the typed immutable project identity.
      - No I/O persistence artifact DAG routing solver media processing or runtime behavior is introduced.
      - Existing domain behavior and tests remain unchanged.
    tests:
      - focused positive construction equality hashing and string/identity tests for SceneProjectId and SceneProject
      - negative tests for invalid IDs and immutability
      - regression tests confirming no existing observation/source identity behavior changes
      - full fast CI
  - id: V2L1.2
    lot: V2L1
    title: Artifact identity and exact input references
    status: done
    objective: Define the minimal immutable ArtifactId, ArtifactKind and ArtifactRef vocabulary required for later artifacts to identify themselves and refer to one exact input artifact without filename path timestamp or fuzzy lookup semantics.
    allowed_scope:
      - src/wre/domain/artifacts.py
      - focused public-domain exports only if required for the new contract
      - tests/test_artifacts.py
    out_of_scope:
      - producer model checkpoint configuration or hardware identity owned by V2L1.3
      - provenance classes owned by V2L1.4
      - canonical artifact keys content hashes or content-addressing rules owned by V2L1.5
      - codec database or project/artifact metadata persistence owned by V2L1.6
      - dependency collections DAG traversal cycle detection invalidation caching or materialization owned by V2L2
      - adapter registry routing quality failure benchmark solver or runtime behavior
      - file URI path timestamp or mutable-name fallback resolution
      - hard-coding a closed list of all future artifact kinds before their owning capabilities exist
      - refactoring retained V1 IDs or provenance contracts merely to share implementation code
    depends_on: [V2L1.1]
    read_before:
      - docs/02_ARCHITECTURE.md
      - docs/15_PRODUCTION_RUNTIME.md
      - docs/23_ENGINEERING_EXECUTION.md
      - docs/24_SYSTEM_INVARIANTS.md
      - docs/25_V2_ROADMAP.md
      - src/wre/domain/projects.py
      - src/wre/domain/observations.py
      - src/wre/domain/runs.py
    reuse:
      - existing frozen dataclass and slots value-object conventions in the domain layer
      - established WRE opaque identifier lexical semantics for ArtifactId
      - explicit typed-reference patterns rather than untyped strings or dictionaries
      - existing deterministic ValueError-based validation and focused pytest style
    acceptance:
      - ArtifactId is an immutable identity type distinct from project observation source camera run scene and temporal identities.
      - ArtifactId follows the established WRE opaque-ID lexical contract and rejects empty whitespace invalid-character and overlength values.
      - ArtifactKind is a distinct immutable symbolic value with a conservative validated token syntax and is not inferred from a filename extension Python class or solver-private type.
      - ArtifactKind remains open to later capability-owned kinds instead of encoding a speculative closed enum in core.
      - ArtifactRef is immutable and identifies exactly one artifact through typed ArtifactId plus declared ArtifactKind.
      - ArtifactRef equality and hashing are deterministic and do not consult filesystem paths timestamps registries or mutable external state.
      - No dependency collection DAG traversal cache key producer provenance persistence or artifact materialization behavior is introduced.
      - Existing SceneProject and retained V1 domain behavior remain unchanged.
    tests:
      - focused positive construction equality hashing and string/identity tests for ArtifactId ArtifactKind and ArtifactRef
      - negative tests for invalid artifact IDs and kind tokens
      - immutability tests for all new value objects
      - regression tests proving artifact identity remains distinct from SceneProjectId and retained domain IDs
      - full fast CI
  - id: V2L1.3
    lot: V2L1
    title: Producer model checkpoint configuration identity
    status: done
    objective: Define the minimal immutable execution-identity composition for artifacts by reusing retained ProducerRef as producer implementation identity and adding only typed model, checkpoint and normalized-configuration identities needed for exact reproducibility metadata.
    allowed_scope:
      - src/wre/domain/producer_identity.py
      - focused public-domain exports only if required for the new contract
      - tests/test_producer_identity.py
    out_of_scope:
      - modifying or replacing retained ProducerRef ReconstructionRun or DerivedArtifactProvenance behavior
      - provenance classes OBSERVED_RECONSTRUCTED INFERRED GENERATED owned by V2L1.4
      - canonical artifact-key composition content addressing or configuration normalization algorithms owned by V2L1.5
      - codec database or metadata persistence owned by V2L1.6
      - adapter capability registries model/download registries shipping status license metadata hardware requirements or benchmark state owned by V2L3
      - artifact DAG cache invalidation checkpoint-resume execution or scheduling behavior
      - downloading resolving loading or executing any model/checkpoint
      - inferring identities from filenames paths package environments or mutable latest aliases
      - refactoring retained V1 producer/run code solely to share helpers
    depends_on: [V2L1.2]
    read_before:
      - docs/02_ARCHITECTURE.md
      - docs/15_PRODUCTION_RUNTIME.md
      - docs/23_ENGINEERING_EXECUTION.md
      - docs/24_SYSTEM_INVARIANTS.md
      - docs/25_V2_ROADMAP.md
      - src/wre/domain/artifacts.py
      - src/wre/domain/runs.py
      - src/wre/domain/observations.py
      - tests/test_runs.py
    reuse:
      - retained ProducerRef as the producer implementation version revision identity rather than creating a competing V2 producer type
      - existing Sha256Digest for exact checkpoint/configuration digest values
      - existing frozen dataclass and slots value-object conventions
      - deterministic fail-closed validation and focused pytest style
    acceptance:
      - Retained ProducerRef remains unchanged and is directly reused inside the new execution identity contract.
      - ModelIdentity is immutable and requires explicit non-blank model name and version with an optional non-blank revision; no floating latest or path inference.
      - CheckpointIdentity is immutable and requires an explicit checkpoint identifier plus exact Sha256Digest content identity.
      - ConfigurationIdentity is immutable and wraps a caller-supplied Sha256Digest representing already-normalized configuration; this item does not define normalization or hashing algorithms.
      - ArtifactProducerIdentity is immutable and composes ProducerRef plus ConfigurationIdentity with optional ModelIdentity and CheckpointIdentity.
      - A checkpoint identity without a model identity is rejected fail-closed; native/non-learned producers may explicitly have neither model nor checkpoint.
      - Equality and hashing are deterministic from typed immutable identity only and perform no filesystem registry network or environment lookup.
      - No provenance class artifact key persistence registry licensing hardware scheduling model loading or execution behavior is introduced.
      - Existing ReconstructionRun ProducerRef artifact identity and retained V1 behavior remain unchanged.
    tests:
      - focused positive construction equality and hashing tests for model checkpoint configuration and aggregate producer identity
      - native producer case with no model/checkpoint
      - learned producer case with model plus checkpoint
      - negative tests for blank model/checkpoint fields wrong digest types and checkpoint-without-model
      - immutability tests for all new value objects
      - regression tests proving retained ProducerRef and ReconstructionRun behavior remains unchanged
      - full fast CI
  - id: V2L1.4
    lot: V2L1
    title: Provenance class contract
    status: ready
    objective: Define the minimal closed provenance-class vocabulary that marks whether an artifact is observed/reconstructed, inferred or generated without conflating epistemic classification with retained run/observation lineage.
    allowed_scope:
      - src/wre/domain/provenance.py
      - focused public-domain exports only if required for the new contract
      - tests/test_provenance.py
    out_of_scope:
      - modifying replacing or migrating retained DerivedArtifactProvenance ReconstructionRun or Observation lineage behavior
      - artifact lineage graphs source-observation collections producer identity or dependency edges
      - confidence scores quality metrics review state or evidence strength
      - automatic provenance classification from solver model file path artifact kind or route
      - mixed unknown verified synthetic-confidence or other speculative provenance classes
      - canonical artifact-key composition or content addressing owned by V2L1.5
      - codec database or metadata persistence owned by V2L1.6
      - generated-completion policy user visibility or rendering behavior owned by later capabilities
    depends_on: [V2L1.3]
    read_before:
      - docs/01_PRODUCT.md
      - docs/02_ARCHITECTURE.md
      - docs/15_PRODUCTION_RUNTIME.md
      - docs/23_ENGINEERING_EXECUTION.md
      - docs/24_SYSTEM_INVARIANTS.md
      - docs/25_V2_ROADMAP.md
      - src/wre/domain/runs.py
      - src/wre/domain/producer_identity.py
      - tests/test_runs.py
    reuse:
      - retained DerivedArtifactProvenance for run and source-observation lineage rather than replacing it
      - existing explicit symbolic-domain conventions in wre.domain
      - focused deterministic pytest style
    acceptance:
      - ProvenanceClass is a closed symbolic type with exactly OBSERVED_RECONSTRUCTED INFERRED and GENERATED values.
      - The three values have stable explicit lowercase wire tokens observed_reconstructed inferred and generated.
      - No UNKNOWN MIXED VERIFIED or solver-specific class is admitted by the core contract.
      - ProvenanceClass carries classification only and does not contain confidence lineage producer artifact dependency or review metadata.
      - Callers must supply the class explicitly; no filename artifact-kind solver model route or environment inference is performed.
      - Retained DerivedArtifactProvenance remains unchanged and continues to represent run/source-observation lineage independently of epistemic class.
      - No artifact key persistence cache routing generation policy or runtime behavior is introduced.
    tests:
      - focused tests for exact member set names and stable wire tokens
      - construction equality hashing and iteration behavior
      - negative tests proving arbitrary unknown and speculative classes are rejected
      - regression test proving retained DerivedArtifactProvenance behavior is unchanged
      - full fast CI
