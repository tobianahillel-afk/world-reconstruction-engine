schema_version: 1
migration: v1_to_v2
source_repository_state:
  legacy_main_before_blueprint: 415f28d8f2a157d3227b2c73e139150901608df2
  blueprint_v2_merge: 203341fd7ff1b27138394ab27bd41f4d0c58fdc2
  legacy_active_work_item: L4.3
  legacy_completed_through: [L4.1, L4.2]
policy:
  v2_product_architecture_authoritative: true
  v1_role: legacy_implementation_donor
  v1_backward_compatibility_target: false
  finish_v1_before_v2: false
  reuse_requires_v2_contract_fit: true
  delete_only_with_replacement_evidence: true
  preserve_historical_pr_evidence: true
  preserve_passing_regression_fixtures: true
  compatibility_before_rewrite: false
  decisions: [retain, generalize, wrap_compatibly, deprecate, remove_later]
  retained_baseline_semantics: >-
    A retained v1 baseline is temporary regression/reference evidence and a source of reusable
    implementation, not a product architecture or backward-compatibility promise. V2 contracts may
    replace legacy APIs, data structures and sequencing whenever the validated v2 design is cleaner
    or better aligned with the frozen product architecture.
components:
  agent_resume_protocol:
    decision: generalize
    rationale: >-
      The resume/state/review discipline is essential and already effective. V2 keeps the useful
      governance behavior, adds deny-by-default scope, one-run sizing and canonical frozen blueprint
      documents, without preserving legacy product architecture.
    v2_destination: governance_and_execution
  development_quality_gates:
    decision: retain
    rationale: >-
      uv/frozen CI, Ruff, Pyright, pytest, actionlint, CodeQL, dependency review capability checks,
      repo validation and regression harness remain directly useful as development infrastructure.
    v2_destination: development_quality_gates
  observation_core:
    decision: generalize
    rationale: >-
      Observation/media identity, camera metadata, immutable provenance and local-frame concepts remain
      useful. Legacy SpatialFragment/ReconstructionRun types do not constrain v2; later v2 contracts
      may reuse concepts, convert historical data where useful, or replace legacy structures entirely.
    v2_destination: scene_project_and_artifact_identity
  local_persistence:
    decision: generalize
    rationale: >-
      Canonical JSON, explicit schema versions, idempotent writes and conflict rejection remain sound.
      SQLite stays a useful local implementation donor while v2 owns its artifact-DAG/cache/job semantics.
    v2_destination: artifact_persistence_and_cache
  image_ingestion:
    decision: retain
    rationale: Raw image observation ingestion is solver-independent and cleanly matches v2 observation semantics.
    v2_destination: media_ingestion
  hashing_and_duplicate_detection:
    decision: retain
    rationale: >-
      Streaming SHA-256 identity and duplicate-as-evidence semantics are directly compatible with
      content-addressed artifact/project design.
    v2_destination: media_ingestion_and_artifact_identity
  exif_metadata:
    decision: retain
    rationale: Raw metadata preservation without semantic guessing is a v2 invariant.
    v2_destination: media_ingestion
  gps_time_interpretation:
    decision: retain
    rationale: >-
      Explicit absent/incomplete/invalid/resolved GPS and ambiguous-time handling is exactly the
      fail-closed behavior required by v2.
    v2_destination: media_profiling_and_temporal_evidence
  video_ingestion:
    decision: retain
    rationale: Whole source videos remain immutable raw observations before frame selection.
    v2_destination: media_ingestion
  deterministic_keyframes:
    decision: wrap_compatibly
    rationale: >-
      The interval policy is a useful deterministic donor/baseline and may temporarily sit behind a
      FrameSelection adapter. V2 is free to replace its legacy API or implementation once the owning
      frame-selection contracts and regression evidence are established.
    v2_destination: V2L6
  colmap_environment:
    decision: retain
    rationale: >-
      Exact external solver identity/version/error normalization remains useful as a classical baseline
      donor. It does not make COLMAP or the v1 wrapper architecture mandatory for v2 routes.
    v2_destination: V2L12
  colmap_feature_extraction:
    decision: wrap_compatibly
    rationale: >-
      Tested native behavior and artifact-integrity evidence are useful donors. V2 normalizes inputs and
      outputs through its own artifact contracts and may replace legacy wrapper structure without preserving
      its API.
    v2_destination: V2L12
  colmap_matching:
    decision: wrap_compatibly
    rationale: >-
      Raw matching remains reusable evidence. V2 scene organization and geometry routes consume it
      through canonical PairCandidate/Correspondence artifacts rather than treating v1 interfaces as stable.
    v2_destination: [V2L8, V2L12]
  colmap_geometric_verification:
    decision: wrap_compatibly
    rationale: >-
      Verified two-view evidence remains valuable for scene disambiguation and precision geometry;
      it is not globally mandated for every future learned geometry route and its legacy wrapper is not a
      compatibility target.
    v2_destination: [V2L8, V2L12]
  colmap_incremental_reconstruction:
    decision: wrap_compatibly
    rationale: >-
      Keep the proven behavior as a precision/classical donor baseline while useful. It becomes one
      GeometrySolution producer under v2 contracts, not the universal reconstruction path or a legacy API
      that future solvers must imitate.
    v2_destination: V2L12
  colmap_reconstruction_import:
    decision: generalize
    rationale: >-
      SparseReconstructionEstimate/local-frame/scale ideas remain useful evidence. V2 introduces canonical
      CameraSolution/GeometrySolution and may provide conversion for historical data, but it has no obligation
      to preserve the legacy representation once validated v2 coverage exists.
    v2_destination: V2L11
  colmap_end_to_end_fixture:
    decision: retain
    rationale: >-
      The real PyCOLMAP composition fixture remains valuable regression evidence and can be migrated to v2
      artifact contracts. Passing it protects retained behavior; it does not make v1 architecture authoritative.
    v2_destination: V2L12
  sequential_pairing:
    decision: wrap_compatibly
    rationale: >-
      Deterministic explicit-order candidate generation remains a useful donor baseline and can become one
      canonical PairCandidate source without preserving the legacy API.
    v2_destination: V2L7
  gps_pairing:
    decision: wrap_compatibly
    rationale: >-
      Explicit resolved-WGS84-only proximity remains useful candidate evidence; it can become one v2
      PairCandidate source without making its legacy interface or assumptions a compatibility requirement.
    v2_destination: V2L7
legacy_future_plan:
  strategy_routing_fast_standard_escalated:
    decision: deprecate
    replacement: V2L10
    reason: PREVIEW/FAST/QUALITY/MASTER plus explicit bounded escalation supersedes the legacy route enum.
  evidence_geometry_l5:
    decision: deprecate
    replacement: [V2L8, V2L11, V2L14]
    reason: Useful ideas are redistributed into scene verification, canonical geometry and competing-solution quality.
  fragment_engine_l6:
    decision: deprecate
    replacement: [V2L11, V2L20]
    reason: Fragment/local-component ideas survive only where needed; MasterScene/GeometrySolution become the product-centered contracts.
  limap_structural_geometry_l7:
    decision: deprecate
    replacement: [V2L14, V2L41]
    reason: LIMAP becomes a specialist/precision candidate rather than a mandatory sequential lot.
  fragment_merging_l8:
    decision: deprecate
    replacement: [V2L14, V2L20, V2L37]
    reason: Registration/merge capabilities are used where route/scale requires them, not as universal product architecture.
  world_graph_absolute_anchoring_l9:
    decision: deprecate
    replacement: [V2L11, V2L14, V2L32]
    reason: Absolute/cross-state constraints remain useful but a MONDE-style world graph is not the organizing product abstraction.
  hypotheses_uncertainty_l10:
    decision: deprecate
    replacement: [V2L4, V2L11, V2L14, V2L33]
    reason: Uncertainty becomes cross-cutting rather than a late isolated subsystem.
  video_motion_l11:
    decision: deprecate
    replacement: [V2L24, V2L28, V2L29]
    reason: Split into tracking/decomposition, long-sequence geometry and multi-video event reconstruction.
  multi_solver_validation_l12:
    decision: deprecate
    replacement: [V2L4, V2L14, V2L49]
    reason: Benchmark/comparison is first-class throughout the architecture.
  hard_case_escalation_l13:
    decision: deprecate
    replacement: [V2L36, V2L38, V2L39, V2L40, V2L41]
    reason: Specialist routes are explicit per data/failure profile instead of one catch-all hard-case lot.
  dense_reconstruction_l14:
    decision: deprecate
    replacement: [V2L15, V2L16, V2L18]
    reason: Dense depth, physical surface and photorealistic appearance are deliberately separate products.
  temporal_4d_world_l15:
    decision: deprecate
    replacement: [V2L24, V2L25, V2L26, V2L27, V2L28, V2L29, V2L31, V2L32, V2L33, V2L34, V2L35]
    reason: Continuous event-time 4D and long-term chronology are separated into distinct capability families.
  validation_program_l16:
    decision: deprecate
    replacement: [V2L4, V2L23, V2L30, V2L35, V2L49, V2L51]
    reason: Validation exists continuously, with a final comprehensive validation milestone.
  monde_boundary_l17:
    decision: remove_later
    replacement: optional_external_integration_only
    reason: WRE is independently useful; MONDE-specific semantics do not define internal architecture.
historical_evidence:
  pull_requests: 1-28
  lot_reviews:
    - docs/reviews/L0-M0-bootstrap-review.md
    - docs/reviews/L1-core-domain-review.md
    - docs/reviews/L2-media-ingestion-review.md
    - docs/reviews/L3-M1-colmap-baseline-review.md
  note: >-
    The pre-v2 machine roadmap remains recoverable from Git history at legacy_main_before_blueprint.
    V2 does not duplicate or rewrite old PR evidence; this migration map is the explicit forward mapping.
    Historical evidence is preserved even when the legacy implementation it describes is later removed.
