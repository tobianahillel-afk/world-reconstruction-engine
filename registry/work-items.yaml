  - id: L15.1
    lot: L15
    title: Temporal evidence and epoch model
    status: planned
    objective: Define solver-independent temporal evidence/epoch contracts that preserve uncertain dates and source semantics without equating publication time with capture time.
    depends_on: [L14.6]
    read_before: [docs/13_TEMPORAL_WORLD.md, docs/04_DATA_MODEL.md, docs/adr/0001-adaptive-routing-anchoring-temporal-world.md]
    reuse: []
    out_of_scope: [change detection, exact-date guessing]
    acceptance:
      - Epoch membership retains temporal evidence/provenance and can represent uncertain intervals.
      - Publication/upload time remains distinct from capture time.
      - No geometry is overwritten by epoch assignment.
    tests: [temporal-evidence and uncertain-epoch unit tests]
  - {id: L15.2, lot: L15, title: Observation-to-epoch association, status: planned, depends_on: [L15.1]}
  - id: L15.3
    lot: L15
    title: Cross-epoch geometry alignment
    status: planned
    objective: Align comparable epoch geometry with an explicit transform model and uncertainty before any metric physical-change interpretation.
    depends_on: [L15.2]
    read_before: [docs/13_TEMPORAL_WORLD.md, docs/12_ADAPTIVE_RECONSTRUCTION.md]
    reuse: [existing validated fragment transforms, Open3D/TEASER++ where appropriate]
    out_of_scope: [treating unresolved scale as metric, using changed regions as unquestioned alignment control]
    acceptance:
      - Alignment records source/target frames, transform model and uncertainty.
      - Sim3 versus rigid/metric alignment is explicit and justified by available scale evidence.
      - Metric change measurement is blocked when scale/frame uncertainty is insufficiently resolved.
      - Stable control geometry can be distinguished from candidate changed regions during alignment.
    tests: [known-transform cross-epoch test, unresolved-scale rejection test, misregistration-change guard test]
  - id: L15.4
    lot: L15
    title: py4dgeo adapter
    status: planned
    objective: Reuse py4dgeo multi-epoch point-cloud change algorithms behind a provenance-preserving adapter rather than implementing foundational change measurement in WRE.
    depends_on: [L15.3]
    read_before: [docs/13_TEMPORAL_WORLD.md, docs/05_REUSE.md, registry/dependencies.yaml]
    reuse: [py4dgeo]
    out_of_scope: [custom M3C2 implementation, semantic state acceptance]
    acceptance:
      - Exact py4dgeo version/license/integration mode are reviewed and pinned when integrated.
      - Measurements retain input epoch/geometry and producer/configuration provenance.
      - Adapter outputs remain derived evidence rather than accepted GeometryState.
    tests: [known-change adapter fixture, unchanged-geometry fixture]
  - {id: L15.5, lot: L15, title: 3D change measurement ingestion, status: planned, depends_on: [L15.4]}
  - id: L15.6
    lot: L15
    title: GeometryChangeHypothesis model
    status: planned
    objective: Represent competing evidence-backed physical-change hypotheses without treating every cross-epoch disagreement as an outlier.
    depends_on: [L15.5]
    read_before: [docs/13_TEMPORAL_WORLD.md, docs/04_DATA_MODEL.md]
    reuse: []
    out_of_scope: [destructive state replacement]
    acceptance:
