  - id: L16.3
    lot: L16
    title: Absolute-anchor holdout (GPS/GCP/reference fragment)
    status: planned
    objective: Validate absolute-world anchoring independently of the observations/control evidence used to optimize the placement.
    depends_on: [L16.2]
    read_before: [docs/12_ADAPTIVE_RECONSTRUCTION.md, docs/06_TESTING.md, docs/09_FIXTURES.md]
    reuse: [GPS/GCP/reference-fragment factors implemented by L9]
    out_of_scope: [using optimization inputs as their own holdout, forcing a world placement when anchors conflict]
    acceptance:
      - GPS anchor accuracy can be evaluated against independent holdout evidence.
      - A no-GPS fragment can be anchored and independently checked through GCP/known-landmark or georeferenced-reference evidence.
      - Scale resolution is validated where the local reconstruction began in an arbitrary similarity frame.
      - Conflicting/withheld anchors expose residual/error or unresolved placement rather than false certainty.
    tests: [GPS holdout fixture, GCP holdout fixture, late reference-fragment anchor fixture, conflicting-anchor fixture]
