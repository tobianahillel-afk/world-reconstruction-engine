schema_version: 2
roadmap_version: '2.0'
status_values: [planned, ready, in_progress, in_review, done, blocked]
policy:
  one_active_item: true
  deny_by_default_scope: true
  one_pr_per_work_item: true
  ready_requires_full_contract: true
  max_work_items_per_lot: 6
  canonical_roadmap: docs/25_V2_ROADMAP.md
  migration_map: registry/v1-v2-migration.yaml
  planned_items_may_be_concise: true
  activation_must_expand_contract: true
  activation_requires_candidate_refresh: true
  activation_requires_one_run_complexity_gate: true
  activation_requires_performance_review: true
  final_validation_is_validation_only: true
work_item_files:
  - registry/work-items/v2m0.yaml
  - registry/work-items/v2m1.yaml
  - registry/work-items/v2m2.yaml
  - registry/work-items/v2m3.yaml
  - registry/work-items/v2m4.yaml
  - registry/work-items/v2m5.yaml
  - registry/work-items/v2m6.yaml
  - registry/work-items/v2m7.yaml
milestones:
  V2M0: {title: Production substrate ready, lots: [V2L0, V2L1, V2L2, V2L3, V2L4]}
  V2M1: {title: Arbitrary media understood and organized, lots: [V2L5, V2L6, V2L7, V2L8, V2L9, V2L10]}
  V2M2: {title: Reliable static physical reconstruction, lots: [V2L11, V2L12, V2L13, V2L14, V2L15, V2L16]}
