work_items:
  - id: L0.1
    lot: L0
    title: Repository bootstrap and agent protocol
    status: done
    objective: Establish canonical docs, project state, machine-readable roadmap and review gates.
    depends_on: []
    read_before: [docs/00_START_HERE.md, AGENTS.md]
    reuse: []
    out_of_scope: [Python tooling, GitHub Actions CI, reconstruction code]
    acceptance:
      - New agent can identify the active work item without conversation history.
      - Work roadmap and review gates are machine-readable.
      - Reuse-before-implementation and epistemic separation rules are explicit.
      - Lot and milestone reviews are represented in repository state.
      - Pull request review evidence has a standard template.
    tests: [manual repository-structure review]
  - id: L0.2
    lot: L0
    title: Python tooling and fast CI
    status: done
    objective: Add uv, Ruff, type checking, pytest, actionlint-aware workflow and a fast PR CI lane.
    depends_on: [L0.1]
    read_before: [docs/06_TESTING.md, AGENTS.md]
    reuse: [uv, ruff, pyright, pytest, actionlint]
    out_of_scope: [COLMAP, LIMAP, GPU tests]
    acceptance:
      - Fresh checkout has one documented bootstrap command path.
      - Fast CI runs lint, format, types, unit tests and repository validation.
      - Obsolete CI runs are cancelled by concurrency policy.
      - CI is suitable as a required merge check.
    tests: [fast CI workflow]
  - id: L0.3
    lot: L0
    title: Repository state validator
    status: done
    objective: Automatically detect inconsistent work-item, state, component and review metadata and validate the existing PR evidence contract.
    depends_on: [L0.2]
    read_before: [AGENTS.md, PROJECT_STATE.yaml, registry/work-items.yaml, .github/PULL_REQUEST_TEMPLATE.md]
    reuse: [pyyaml]
    out_of_scope: [geometry validation, redesigning the PR workflow]
    acceptance:
      - Validator catches unknown active work item and invalid dependencies/statuses.
      - Validator checks referenced read_before paths exist.
      - Validator checks core PR-template sections remain present.
      - Validator runs in fast CI.
    tests: [unit tests for validator, fast CI]
  - id: L0.4
    lot: L0
    title: Dependency and supply-chain baseline
    status: done
    objective: Pin development dependencies and configure low-friction dependency/security automation where repository permissions allow it.
    depends_on: [L0.3]
    read_before: [docs/05_REUSE.md, registry/dependencies.yaml]
    reuse: [Dependabot, GitHub dependency review, CodeQL, secret scanning]
    out_of_scope: [choosing the final WRE license, native geometry dependencies]
    acceptance:
      - Development dependencies are locked.
      - Dependency update policy is documented/configured.
      - Security automation decisions are recorded, including any GitHub-setting steps not writable by the agent.
    tests: [configuration review, fast CI, CodeQL, dependency review capability preflight]
  - id: L0.5
    lot: L0
    title: Fixture and regression harness skeleton
    status: done
    objective: Create deterministic fixture conventions and regression metric schema without adding heavy geometry engines.
    depends_on: [L0.4]
    read_before: [docs/06_TESTING.md]
    reuse: [pytest]
    out_of_scope: [real COLMAP reconstruction fixtures]
    acceptance:
      - Fixture directories and metadata convention exist.
      - Regression result schema exists.
      - Tiny synthetic smoke fixture runs in fast CI.
    tests: [fixture harness tests]
  - id: L0.R
    lot: L0
    title: L0 lot review
    status: done
    objective: Verify the bootstrap is complete, fast and resumable before product code begins.
    depends_on: [L0.1, L0.2, L0.3, L0.4, L0.5]
    read_before: [AGENTS.md, docs/06_TESTING.md, registry/components.yaml, registry/reviews.yaml]
    reuse: []
    out_of_scope: [feature implementation]
    acceptance:
      - Every promised L0 capability exists and has appropriate tests/evidence.
      - Fresh-agent resume path is coherent.
      - Fast CI is green and intentionally small.
      - No product/reconstruction algorithm was prematurely implemented.
      - L0 review is marked passed in registry/reviews.yaml.
    tests: [full L0 review checklist]
