      - Candidate/rejected/unresolved/accepted outcomes remain auditable.
    tests: [change-hypothesis invariant tests]
  - {id: L15.7, lot: L15, title: Change-point inference, status: planned, depends_on: [L15.6]}
  - id: L15.8
    lot: L15
    title: GeometryState validity intervals
    status: planned
    objective: Represent time-valid estimated geometry states without overwriting previously supported historical geometry.
    depends_on: [L15.7]
    read_before: [docs/13_TEMPORAL_WORLD.md, docs/04_DATA_MODEL.md]
    reuse: []
    out_of_scope: [continuous dynamic-object reconstruction]
    acceptance:
      - States can express validity intervals and uncertain boundaries.
      - State geometry/support/provenance remain traceable.
      - Multiple historical states can coexist for one spatial lineage.
    tests: [state-validity and non-overwrite tests]
