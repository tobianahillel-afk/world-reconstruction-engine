  - id: L4.6
    lot: L4
    title: Reconstruction Strategy Router
    status: planned
    objective: Select the cheapest deterministic FAST/STANDARD/ESCALATED route likely to reach the unchanged acceptance policy/evidence standard and record auditable reasons/escalation conditions.
    depends_on: [L4.5]
    read_before: [docs/12_ADAPTIVE_RECONSTRUCTION.md, docs/03_PIPELINE.md, docs/adr/0001-adaptive-routing-anchoring-temporal-world.md]
    reuse: [COLMAP candidate/matching mechanisms, cached WRE evidence]
    out_of_scope: [weakening acceptance policy, implementing heavy hard-case algorithms, accepting learned matches without geometry]
    acceptance:
      - Route selection is deterministic for identical inputs/configuration.
      - FAST/STANDARD/ESCALATED change attempted work but not the final acceptance policy/evidence standard.
      - Solver-specific intermediate thresholds may differ only when calibrated to equivalent semantics and documented.
      - Decision reasons, relevant inputs/configuration and escalation outcome are auditable.
      - Insufficient or contradictory evidence can remain unresolved.
      - L13 remains the owner of expensive hard-case algorithms.
    tests: [router decision unit tests, route-equivalence acceptance tests]
