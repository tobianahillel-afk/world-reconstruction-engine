  - id: L9.5
    lot: L9
    title: GCP and known-landmark factors
    status: planned
    objective: Represent surveyed/known world-point anchors as provenance-bearing uncertain factors without destructively rewriting local fragment geometry.
    depends_on: [L9.4]
    read_before: [docs/12_ADAPTIVE_RECONSTRUCTION.md, docs/02_ARCHITECTURE.md, docs/adr/0001-adaptive-routing-anchoring-temporal-world.md]
    reuse: [GTSAM, OpenSfM GCP/checkpoint patterns, PROJ, GeographicLib]
    out_of_scope: [assuming anchors are infallible, hidden fragment merges]
    acceptance:
      - GCP/known-landmark constraints preserve source, world-frame/CRS identity and uncertainty where available.
      - Optimization residuals remain inspectable.
      - Conflicting anchors can remain contradictory/unresolved rather than being silently averaged.
    tests: [known-control-point synthetic factor tests, conflicting-anchor tests]
  - id: L9.6
    lot: L9
    title: Reference-fragment and absolute anchor factors
    status: planned
    objective: Allow an already-georeferenced fragment/world reference to anchor a locally reconstructed fragment through explicit validated constraints.
    depends_on: [L9.5]
    read_before: [docs/12_ADAPTIVE_RECONSTRUCTION.md, docs/02_ARCHITECTURE.md]
    reuse: [GTSAM, validated fragment transforms]
    out_of_scope: [destructive coordinate rewrite, implicit merge]
    acceptance:
      - A no-GPS fragment can receive world placement from later independent anchor evidence.
      - Relative placement evidence remains distinct from absolute anchor evidence.
      - The transform model used for anchoring is explicit; unresolved local scale may require a validated Sim3 rather than a hidden rigid transform.
      - Anchor transform/scale uncertainty, provenance and residuals are retained.
    tests: [late-anchor synthetic test, conflicting-reference-anchor test]
