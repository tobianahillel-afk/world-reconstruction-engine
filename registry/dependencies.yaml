      permission to execute or redistribute the entire upstream tree. GLUEMAP's top-level source
      is BSD-3-Clause-style, but upstream explicitly warns that third-party dependencies are
      separately licensed. Static review of this exact revision confirms that the bounded WRE
      route can bypass SALAD by constructing BaseTwoViewDataset directly with no descriptor cache,
      skip Doppelgangers++ with skip_doppelgangers=true, avoid VGGSfM model loading with
      use_dummy_tracks=true, and stop after the global coarse COLMAP model with coarse_only=true.
      Earlier qualification used MapAnything and produced PR #129's bounded source
      manifest, but deeper exact-source review found that MapAnything's UniCeption import path
      reaches CroCo/DUSt3R-derived CC-BY-NC-SA-4.0 code. That route is therefore retained only
      as superseded audit evidence. The new provisional shipping-oriented backbone is the exact
      GLUEMAP-pinned VGGT source revision 44b3afbd1869d8bde4894dd8ea1e293112dd5eba.
      The future executable profile must use a new verified allowlisted GLUEMAP+VGGT
      materialization, construct the model outside GLUEMAP from the exact source plus a locally
      supplied and verified official VGGT-1B-Commercial model.safetensors, and inject it through
      GluemapPipeline models={"vggt": model}. This bypasses gluemap.utils.model_loader and must
      prove at runtime that SALAD, mast3r/dust3r, CroCo, UniCeption, MapAnything, Pi3 and vggsfm
      modules never enter sys.modules and that no Git/Hugging Face/torch.hub network fetch occurs.
      This qualification strategy must be validated before adapter code is added. Upstream currently pins
      pycolmap-cuda12==4.0.4 in its external GPU environment, which remains isolated from WRE's
      PyCOLMAP 4.2.0 canonicalization environment. Static native review now identifies the
      source-level Ceres 2.2.0 Eigen 3.4.0 METIS 5.1.0 Boost 1.85.0 and GNU 15.2.0
      runtime terms, and confirms Ceres CUDA is optional for pygluemap. The exact
      193-build conda license inventory is now technically partitioned into 132
      permissive-or-notice builds, 10 public-domain-or-special-notice builds, 26
      reciprocal-or-dual-review builds, 8 GCC-runtime-exception builds and 17
      vendor/custom-EULA builds. The six exact PyPI wheels all expose direct
      permissive-or-notice license evidence. This partition is triage evidence only:
      it does not determine linking/distribution obligations, approve NVIDIA/cuDNN/Intel
      vendor terms, approve reciprocal/copyleft use modes, approve the custom VGGT
      license/AUP, or authorize shipping/default promotion. Exact-tree inspection
      found no upstream conda-lock pixi lock environment export or equivalent build-string manifest.
      WRE therefore uses the separate CPU-only linux-64 micromamba resolution lane with an explicit
      CUDA 12.4 virtual-package override as dependency-lock evidence only. PR #127 first froze
      the native 157-package closure; PR #131 added direct license expressions, PR #135 pinned
      upstream NumPy 2.4.3, and the current V2L14.4 Python-closure qualification extends the
      reviewed conda solve to 193 packages. The resolver now explicitly pins NetworkX 3.6.1,
      Pillow 12.2.0, SciPy 1.17.1, tqdm 4.67.3, einops 0.8.2, imagesize 2.0.0,
      safetensors 0.7.0 and huggingface_hub 1.12.0 because those packages are imported by
      the active GLUEMAP+VGGT path. The current
      registry/external-environments/gluemap-linux-64-cuda12.4.conda-lock.json identity is
      SHA-256 0b9a91630a1e15fd2fe61f0c22bcf6605cd5f5997adc312cf6b549935f311c9f.
      The separate PyPI artifact gate now freezes six exact wheels at
      registry/external-environments/gluemap-linux-64-pypi-lock.json with file SHA-256
      1f87940324d6827839400dd404ff58006172df5d4b15c49f4b5bf2d2bb64c66b:
      faiss-cpu 1.13.2, kornia 0.8.2, kornia-rs 0.1.10, opencv-python 4.13.0.92,
      pycolmap-cuda12 4.0.4 and pyceres 2.6. The lane verifies 167,573,589 artifact bytes
      against official PyPI digests and exact wheel metadata without installing or importing
      them, and binds their runtime requirements to the reviewed 193-package conda lock.
      Exact source/runtime qualification is still required for the pinned LightGlue source,
      and PyPI artifact evidence is not runtime/GPU execution evidence.
      The accepted solve uses Ceres build cpulgplh45c08c3_10 with no SuiteSparse,
      Clang++ 22.1.8 plus LLVM OpenMP 23.1.1 and no libgomp, and the exact CUDA 12.4
      package closure recorded in that lock. A GNU-only OpenMP solve was rejected because
      conda-forge PyTorch GPU 2.4.1 requires the LLVM/KMP OpenMP family. This lock is still
      dependency-resolution evidence only, not GPU execution. PR #129 separately froze and
      exactly regenerated registry/external-sources/gluemap-bounded-materialization.json
      with 91 regular files, 1,058,652 bytes and canonical materialization SHA-256
      6503a2ea5d4c46c6273a3bd56ef5150b59c3e249c350bdc14dbed20b95664ca8.
      It remains immutable evidence for the rejected MapAnything candidate, not the active
      executable source identity. PR #133 now freezes and exactly regenerates the active
      registry/external-sources/gluemap-vggt-bounded-materialization.json at 93 regular files,
      744,299 bytes and materialization SHA-256
      19efc825c7627dc2d7fdf3fed3aa410823e90e81d2f126c57148549aac5fced1.
      That active source manifest contains 67 reviewed GLUEMAP files plus 26 VGGT files,
      retains VGGT LICENSE.txt as Git blob 079cb728fea5b11bb46c0c9f6ad4b3d2e4d216c7,
      excludes MapAnything UniCeption Pi3 SALAD Doppelgangers++ VGGSfM training and
      vggt/dependency source bytes, and records no runtime or GPU execution evidence.
      PR #143 closes the bounded VGGT source/no-deps import-compatibility check under
      NumPy 2.4.3; this does not make the full Python runtime or model execution approved.
      The official gated checkpoint identity, custom-license/redistribution review,
      supported real GPU evidence and cross-version native-model evidence remain unresolved.
