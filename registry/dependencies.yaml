schema_version: 1
project_license: undecided
policy:
  reuse_before_implement: true
  custom_foundational_algorithm_requires_adr: true
  mandatory_dependency_requires_license_review: true
  github_actions_pin_full_sha: true
  dependency_updates_require_ci_review: true
development_supply_chain:
  package_manager: uv
  package_manager_version: 0.12.13
  lockfile: uv.lock
  ci_install_mode: frozen
  dependabot_ecosystems: [uv, github-actions]
  update_schedule: weekly_grouped
  dependency_review_severity: moderate
  dependency_review_scopes: [runtime, development, unknown]
  code_scanning: codeql_separate_lane
  secret_scanning_setting: manual_verification_required
  push_protection_setting: manual_verification_required
  main_ruleset_setting: manual_verification_required
dependencies:
  exifread:
    status: core
    role: [raw_exif_metadata]
    integration: library_adapter
    version_policy: pin_exact
    pinned_version: 3.5.1
    license: BSD-3-Clause
    license_review: approved
  colmap:
    status: candidate_core
    role: [features, matching, geometry, sfm, bundle_adjustment, mvs, candidate_retrieval]
    integration: adapter
    version_policy: pin_when_integrated
    license_review: pending
  limap:
    status: candidate_core
    role: [lines, structural_sfm, planes, vanishing_points, wireframe]
    integration: adapter
    version_policy: pin_when_integrated
    license_review: pending
  gtsam:
    status: candidate_core
    role: [factor_graph, incremental_optimization, absolute_anchor_factors]
    integration: adapter
    version_policy: pin_when_integrated
    license_review: pending
  teaserpp:
    status: candidate_optional
    role: [robust_fragment_registration]
    integration: adapter
    version_policy: pin_when_integrated
    license_review: pending
  open3d:
    status: candidate_optional
    role: [icp, gicp, geometry_refinement]
    integration: adapter
    version_policy: pin_when_integrated
    license_review: pending
  openmvg:
    status: candidate_validation
    role: [ac_ransac, global_geometry_validation]
    integration: optional_adapter
    version_policy: pin_when_integrated
    license_review: pending
  alicevision:
    status: candidate_validation
    role: [matching_validation, alternative_reconstruction]
    integration: optional_adapter
    version_policy: pin_when_integrated
    license_review: pending
  opensfm:
    status: candidate_validation
    role: [gps, gcp, checkpoints, rolling_shutter, alternative_reconstruction]
    integration: optional_adapter
    version_policy: pin_when_integrated
    license_review: pending
  ffmpeg:
    status: candidate_core
    role: [video_io]
    integration: subprocess_or_library_adapter
    version_policy: pin_when_integrated
    license_review: pending
  proj:
    status: candidate_core
    role: [coordinate_reference_systems]
    integration: adapter
    version_policy: pin_when_integrated
    license_review: pending
  geographiclib:
    status: candidate_optional
    role: [geodesy, geodesic_distance]
    integration: adapter
    version_policy: pin_when_integrated
    license_review: pending
  kimera_rpgo:
    status: candidate_optional
    role: [robust_pose_graph, loop_closure_outlier_rejection]
    integration: optional_adapter
    version_policy: pin_when_integrated
    upstream_repository: MIT-SPARK/Kimera-RPGO
    license: BSD-2-Clause
    license_review: pending
    notes: Top-level LICENSE.BSD verified on 2026-09-15; full integration and transitive-dependency review remains pending.
  basalt:
    status: candidate_optional
    role: [visual_odometry, visual_inertial_odometry, video_trajectory]
    integration: optional_adapter
    version_policy: pin_when_integrated
    upstream_repository: VladyslavUsenko/basalt
    license: BSD-3-Clause
    license_review: pending
    notes: Top-level LICENSE verified on 2026-09-15; bundled/transitive components still require integration review.
  kalibr:
    status: candidate_optional
    role: [multi_camera_calibration, camera_imu_calibration, rolling_shutter_calibration]
    integration: optional_subprocess_or_adapter
    version_policy: pin_when_integrated
    upstream_repository: ethz-asl/kalibr
    license: BSD-4-Clause
    license_review: pending
    notes: Top-level four-clause BSD-style LICENSE verified on 2026-09-15; bundled packages require separate review when integrated.
  hloc:
    status: candidate_optional
    role: [difficult_visual_retrieval, visual_localization, mapping_proposals]
    integration: optional_adapter
    version_policy: pin_when_integrated
    upstream_repository: cvg/Hierarchical-Localization
    license: Apache-2.0
    license_review: pending
    notes: Framework license verified on 2026-09-15; it does not automatically cover every selected feature extractor/model/checkpoint.
  lightglue:
    status: candidate_optional
    role: [adaptive_learned_matching, difficult_pair_proposals]
    integration: optional_adapter
    version_policy: pin_when_integrated
    upstream_repository: cvg/LightGlue
    license: Apache-2.0
    license_review: pending
    notes: LightGlue code and pretrained LightGlue weights are Apache-2.0; upstream feature extractors/checkpoints can differ (notably SuperPoint) and require separate review.
  py4dgeo:
    status: candidate_core
    role: [multi_epoch_point_cloud_change, m3c2, temporal_change_measurement]
    integration: adapter
    version_policy: pin_when_integrated
    upstream_repository: 3dgeo-heidelberg/py4dgeo
    license: MIT
    license_review: pending
    notes: Core/top-level license verified on 2026-09-15. Upstream COPYING documents a PSF-licensed source file and CC-BY-SA-4.0 test data; WRE must not assume bundled test/data artifacts share the MIT terms.
  nerfstudio:
    status: candidate_visualization
    role: [photorealistic_view_synthesis, nerf, gaussian_splat_visualization]
    integration: optional_adapter_or_export
    version_policy: pin_when_integrated
    upstream_repository: nerfstudio-project/nerfstudio
    license: Apache-2.0
    license_review: pending
    notes: Top-level code license verified on 2026-09-15. Visualization only; never canonical WRE world geometry, and concrete models/plugins/assets require their own review.
