schema_version: 1
project_license: undecided
policy:
  reuse_before_implement: true
  custom_foundational_algorithm_requires_adr: true
  mandatory_dependency_requires_license_review: true
  github_actions_pin_full_sha: true
  dependency_updates_require_ci_review: true
development_supply_chain:
  package_manager: uv
  package_manager_version: 0.12.13
  lockfile: uv.lock
  ci_install_mode: frozen
  dependabot_ecosystems: [uv, github-actions]
  update_schedule: weekly_grouped
  dependency_review_severity: moderate
  dependency_review_scopes: [runtime, development, unknown]
  code_scanning: codeql_separate_lane
  secret_scanning_setting: manual_verification_required
  push_protection_setting: manual_verification_required
  main_ruleset_setting: manual_verification_required
dependencies:
  exifread:
    status: core
    role: [raw_exif_metadata]
    integration: library_adapter
    version_policy: pin_exact
    pinned_version: 3.5.1
    license: BSD-3-Clause
    license_review: approved
  colmap:
    status: core
    role: [features, matching, geometry, sfm, bundle_adjustment, mvs, candidate_retrieval]
    integration: official_pycolmap_external_environment
    version_policy: pin_exact_external_environment
    pinned_version: 4.2.0
    python_package: pycolmap==4.2.0
    integration_test_numpy: 2.5.3
    upstream_repository: colmap/colmap
    license: BSD-3-Clause
    license_review: approved
    notes: >-
      L3 uses the official PyCOLMAP 4.2.0 binding as its reference COLMAP environment.
      L3.2 deliberately retains PyCOLMAP as an exact external solver environment rather than a
      mandatory core WRE runtime dependency: WRE ingestion, persistence and evidence inspection
      remain usable without installing the native reconstruction engine, while every solver-backed
      operation lazily validates the exact PyCOLMAP/COLMAP identity before use. The dedicated CI
      lane installs exact pycolmap==4.2.0 with numpy==2.5.3 and now exercises real CPU SIFT feature
      extraction as well as environment inspection. Upstream COPYING states that COLMAP itself is
      BSD-3-Clause but separately licensed dependencies can affect a concrete build/distribution.
      Any alternate COLMAP build, bundled redistribution, mandatory-runtime packaging, or other
      integration mode requires a fresh dependency and license review.
