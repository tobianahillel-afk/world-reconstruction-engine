      chosen_model: map_anything
      skip_doppelgangers: true
      use_dummy_tracks: true
      coarse_only: true
      pair_generation: exhaustive_without_salad_descriptor_cache
    notes: >-
      V2L14.4 qualification targets exact GLUEMAP source revision
      adc9e4bb5f41014d3f7c157a879edc278588c829 with Git tree
      9f4b6090baca9ad6da78a138372afb17a7f70626 as provenance evidence, not as
      permission to execute or redistribute the entire upstream tree. GLUEMAP's top-level source
      is BSD-3-Clause-style, but upstream explicitly warns that third-party dependencies are
      separately licensed. Static review of this exact revision confirms that the bounded WRE
      route can bypass SALAD by constructing BaseTwoViewDataset directly with no descriptor cache,
      skip Doppelgangers++ with skip_doppelgangers=true, avoid VGGSfM model loading with
      use_dummy_tracks=true, and stop after the global coarse COLMAP model with coarse_only=true.
      However gluemap.utils.model_loader imports thirdparty.path_to_thirdparty at module load, and
      that helper requires directory sentinels for unused Pi3, Doppelgangers++, VGGT and VGGSfM
      paths even when those modules are never imported. The exact upstream tree also vendors
      VGGSfM-derived tracker source with Meta copyright headers while facebookresearch/vggsfm
      publishes its root under CC-BY-NC-4.0. Therefore the future executable profile must use a
      verified allowlisted materialization derived from the pinned GLUEMAP revision: retain only
      reviewed GLUEMAP core bytes plus the separately pinned Apache MapAnything source, create
      empty temporary path sentinels for unused third-party checks, invoke BaseTwoViewDataset and
      GluemapPipeline directly rather than gluemap.cli demo preprocessing, and prove at runtime
      that SALAD, mast3r/dust3r and vggsfm modules never enter sys.modules. This qualification
      strategy must be validated before adapter code is added. Upstream currently pins
      pycolmap-cuda12==4.0.4 in its external GPU environment, which remains isolated from WRE's
      PyCOLMAP 4.2.0 canonicalization environment. Static native review now identifies the
      source-level Ceres 2.2.0 Eigen 3.4.0 METIS 5.1.0 Boost 1.85.0 and GNU 15.2.0
      runtime terms, and confirms Ceres CUDA is optional for pygluemap. Exact-tree inspection
      found no upstream conda-lock pixi lock environment export or equivalent build-string manifest.
      WRE therefore uses the separate CPU-only linux-64 micromamba resolution lane with an explicit
      CUDA 12.4 virtual-package override as dependency-lock evidence only. PR #127 froze and
      exactly regenerated registry/external-environments/gluemap-linux-64-cuda12.4.conda-lock.json
      with 157 packages and SHA-256
      88112dbfd8149e58e28b1e7309ea6933001058bb058ac6bff8338ea41a6aee52.
      The accepted solve uses Ceres build cpulgplh45c08c3_10 with no SuiteSparse,
      Clang++ 22.1.8 plus LLVM OpenMP 23.1.1 and no libgomp, and the exact CUDA 12.4
      package closure recorded in that lock. A GNU-only OpenMP solve was rejected because
      conda-forge PyTorch GPU 2.4.1 requires the LLVM/KMP OpenMP family. This lock is still
      dependency-resolution evidence only, not GPU execution. PR #129 separately froze and
      exactly regenerated registry/external-sources/gluemap-bounded-materialization.json:
      91 regular files, 1,058,652 bytes and canonical materialization SHA-256
      6503a2ea5d4c46c6273a3bd56ef5150b59c3e249c350bdc14dbed20b95664ca8.
      That manifest retains 72 reviewed GLUEMAP core/build files plus 19 MapAnything
      core/inference files, contains no forbidden third-party source-file prefix, and
      records runtime_execution_evidence=false and gpu_execution_evidence=false.
      Exact locked-package/model redistribution review, supported real GPU evidence and
      cross-version native-model evidence remain unresolved.
