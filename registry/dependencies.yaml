schema_version: 1
project_license: undecided
policy:
  reuse_before_implement: true
  custom_foundational_algorithm_requires_adr: true
  mandatory_dependency_requires_license_review: true
  github_actions_pin_full_sha: true
  dependency_updates_require_ci_review: true
development_supply_chain:
  package_manager: uv
  package_manager_version: 0.12.13
  lockfile: uv.lock
  ci_install_mode: frozen
  dependabot_ecosystems: [uv, github-actions]
  update_schedule: weekly_grouped
  dependency_review_severity: moderate
  dependency_review_scopes: [runtime, development, unknown]
  code_scanning: codeql_separate_lane
  secret_scanning_setting: manual_verification_required
  push_protection_setting: manual_verification_required
  main_ruleset_setting: manual_verification_required
dependencies:
  exifread:
    status: core
    role: [raw_exif_metadata]
    integration: library_adapter
    version_policy: pin_exact
    pinned_version: 3.5.1
    license: BSD-3-Clause
    license_review: approved
  colmap:
    status: core
    role: [features, matching, geometry, sfm, bundle_adjustment, mvs, candidate_retrieval]
    integration: official_pycolmap_external_environment
    version_policy: pin_exact_external_environment
    pinned_version: 4.2.0
    python_package: pycolmap==4.2.0
    integration_test_numpy: 2.5.3
    upstream_repository: colmap/colmap
    license: BSD-3-Clause
    license_review: approved
    notes: >-
      L3 uses the official PyCOLMAP 4.2.0 binding as its reference COLMAP environment.
      L3.2 deliberately retains PyCOLMAP as an exact external solver environment rather than a
      mandatory core WRE runtime dependency: WRE ingestion, persistence and evidence inspection
      remain usable without installing the native reconstruction engine, while every solver-backed
      operation lazily validates the exact PyCOLMAP/COLMAP identity before use. The dedicated CI
      lane installs exact pycolmap==4.2.0 with numpy==2.5.3 and now exercises real CPU SIFT feature
      extraction as well as environment inspection. Upstream COPYING states that COLMAP itself is
      BSD-3-Clause but separately licensed dependencies can affect a concrete build/distribution.
      Any alternate COLMAP build, bundled redistribution, mandatory-runtime packaging, or other
      integration mode requires a fresh dependency and license review.
  limap:
    status: candidate_core
    role: [lines, structural_sfm, planes, vanishing_points, wireframe]
    integration: adapter
    version_policy: pin_when_integrated
    license_review: pending
  gtsam:
    status: candidate_core
    role: [factor_graph, incremental_optimization, absolute_anchor_factors]
    integration: adapter
    version_policy: pin_when_integrated
    license_review: pending
  teaserpp:
    status: candidate_optional
    role: [robust_fragment_registration]
    integration: adapter
    version_policy: pin_when_integrated
    license_review: pending
  open3d:
    status: candidate_optional
    role: [icp, gicp, geometry_refinement]
    integration: adapter
    version_policy: pin_when_integrated
    license_review: pending
  openmvg:
    status: candidate_validation
    role: [ac_ransac, global_geometry_validation]
    integration: optional_adapter
    version_policy: pin_when_integrated
    license_review: pending
  alicevision:
    status: candidate_validation
    role: [matching_validation, alternative_reconstruction]
    integration: optional_adapter
    version_policy: pin_when_integrated
    license_review: pending
  opensfm:
    status: candidate_validation
    role: [gps, gcp, checkpoints, rolling_shutter, alternative_reconstruction]
    integration: optional_adapter
    version_policy: pin_when_integrated
    license_review: pending
  ffmpeg:
    status: core
    role: [video_io, deterministic_frame_extraction, decoded_image_pyramid_reference]
    integration: subprocess_cli
    version_policy: pin_exact_system_package
    pinned_version: 6.1.1-3ubuntu5
    ci_package: ffmpeg=7:6.1.1-3ubuntu5
    upstream_repository: FFmpeg/FFmpeg
    license: GPL-2.0-or-later
    license_review: approved
    notes: >-
      FFmpeg upstream is primarily LGPL-2.1-or-later with optional GPL parts. The selected
      Debian/Ubuntu Noble package uses GPL-licensed files, so its resulting binaries are
      GPL-2.0-or-later. WRE invokes ffmpeg/ffprobe only as external subprocesses and does not
      link or bundle those binaries. CI installs the exact Ubuntu package and verifies both
      CLI version strings. Any future binary redistribution, library linkage or different
      build/package requires a new license and version review.
  proj:
    status: candidate_core
    role: [coordinate_reference_systems]
    integration: adapter
    version_policy: pin_when_integrated
    license_review: pending
  geographiclib:
    status: candidate_optional
    role: [geodesy, geodesic_distance]
    integration: adapter
    version_policy: pin_when_integrated
    license_review: pending
  kimera_rpgo:
    status: candidate_optional
    role: [robust_pose_graph, loop_closure_outlier_rejection]
    integration: optional_adapter
    version_policy: pin_when_integrated
    upstream_repository: MIT-SPARK/Kimera-RPGO
    license: BSD-2-Clause
    license_review: pending
    notes: Top-level LICENSE.BSD verified on 2026-09-15; full integration and transitive-dependency review remains pending.
  basalt:
    status: candidate_optional
    role: [visual_odometry, visual_inertial_odometry, video_trajectory]
    integration: optional_adapter
    version_policy: pin_when_integrated
    upstream_repository: VladyslavUsenko/basalt
    license: BSD-3-Clause
    license_review: pending
    notes: Top-level LICENSE verified on 2026-09-15; bundled/transitive components still require integration review.
  kalibr:
    status: candidate_optional
    role: [multi_camera_calibration, camera_imu_calibration, rolling_shutter_calibration]
    integration: optional_subprocess_or_adapter
    version_policy: pin_when_integrated
    upstream_repository: ethz-asl/kalibr
    license: BSD-4-Clause
    license_review: pending
    notes: Top-level four-clause BSD-style LICENSE verified on 2026-09-15; bundled packages require separate review when integrated.
  selavpr_plus:
    status: candidate_optional
    role: [learned_visual_retrieval]
    integration: optional_exact_external_environment
    version_policy: pin_exact_external_environment
    pinned_version: 56bd921cbd3d53e9c5f91d0aafff147f95fb362a
    upstream_repository: Lu-Feng/SelaVPRplusplus
    license: MIT
    license_review: pending
    notes: >-
      V2L7.5 evaluates only the exact SelaVPR++ Base/GeM standard floating-point path at source
      revision 56bd921cbd3d53e9c5f91d0aafff147f95fb362a with the official
      SelaVPRplusplus_base.pth checkpoint SHA-256
      b048490dbd1c27dee67fce6faaec7bec267d19a044c85877af94b8588e596a62. The reviewed
      reference environment is Python 3.12 with torch==2.14.0, numpy==2.5.3,
      faiss-cpu==1.15.1 and tqdm==4.68.2, kept outside the mandatory WRE uv environment.
      Upstream source code and the official model repository report MIT licensing, but full
      transitive package/redistribution review remains pending; this dependency is experimental
      and cannot become a shipping default before V2L7.6 benchmark evidence and license review.
      Runtime execution accepts only explicit local source/checkpoint material, verifies the exact
      reviewed Python source-file set plus SHA-256 identities for the executable model subtree,
      rejects unreviewed bytecode/native-module shadows, and performs no implicit network download.
  hloc:
    status: candidate_optional
    role: [difficult_visual_retrieval, visual_localization, mapping_proposals]
    integration: optional_adapter
    version_policy: pin_when_integrated
    upstream_repository: cvg/Hierarchical-Localization
    license: Apache-2.0
    license_review: pending
    notes: Framework license verified on 2026-09-15; it does not automatically cover every selected feature extractor/model/checkpoint.
  lightglue:
    status: candidate_optional
    role: [adaptive_learned_matching, difficult_pair_proposals]
    integration: optional_adapter
    version_policy: pin_when_integrated
    upstream_repository: cvg/LightGlue
    license: Apache-2.0
    license_review: pending
    notes: LightGlue code and pretrained LightGlue weights are Apache-2.0; upstream feature extractors/checkpoints can differ (notably SuperPoint) and require separate review.
  py4dgeo:
    status: candidate_core
    role: [multi_epoch_point_cloud_change, m3c2, temporal_change_measurement]
    integration: adapter
    version_policy: pin_when_integrated
    upstream_repository: 3dgeo-heidelberg/py4dgeo
    license: MIT
    license_review: pending
    notes: Core/top-level license verified on 2026-09-15. Upstream COPYING documents a PSF-licensed source file and CC-BY-SA-4.0 test data; WRE must not assume bundled test/data artifacts share the MIT terms.
  nerfstudio:
    status: candidate_visualization
    role: [photorealistic_view_synthesis, nerf, gaussian_splat_visualization]
    integration: optional_adapter_or_export
    version_policy: pin_when_integrated
    upstream_repository: nerfstudio-project/nerfstudio
    license: Apache-2.0
    license_review: pending
    notes: Top-level code license verified on 2026-09-15. Visualization only; never canonical WRE world geometry, and concrete models/plugins/assets require their own review.
