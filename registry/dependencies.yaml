    notes: >-
      V2L18.3's provisional first static appearance integration target is official
      gsplat v1.5.3 plus its exact-source upstream simple_trainer reference; it is not
      an approved execution profile or the standalone gsplat rasterizer alone.
      The official trainer uses external Torch/CUDA and example dataset, viewer,
      rendering and metrics imports that still need a complete exact wheel/source
      and transitive license lock. Exact-source audit of the trainer's referenced
      Git VCS packages identified nerfview commit
      4538024fe0d15fd1a0e4d760f3695fc44ca72787 (project metadata declares MIT),
      fused-ssim commit 328dc9836f513d00c4b5bc38fe30478b4435cbb5 (MIT source
      LICENSE), and fused-bilagrid commit 90f9788e57d3545e3a033c1038bb9986549632fe
      (MIT source LICENSE). The upstream trainer imports fused_ssim eagerly and
      uses its fused CUDA loss during training. The trainer only imports fused_bilagrid
      conditionally when use_fused_bilagrid is enabled; the reviewed WRE profile
      explicitly disables it and both bilateral-grid variants. Accordingly the
      future bounded environment must include and verify the exact fused-ssim
      native CUDA extension. A pure offline preflight now binds its MIT LICENSE,
      README, Python import wrapper, setup.py, ext.cpp, ssim.cu and ssim.h to
      seven reviewed Git blob identities and byte lengths and rejects tampering,
      additional Python/CUDA build entrypoints and package symlinks. This is
      source evidence only, not a compiled CUDA wheel, Torch/CUDA ABI, full tree,
      transitive-license or actual training proof. Do not add fused-bilagrid as
      a mandatory runtime dependency. Importing simple_trainer still eagerly requires nerfview, viser,
      torchmetrics image metrics and torch.utils.tensorboard even with viewer/video/
      TensorBoard use disabled. The reviewed nerfview v0.1.2 source import
      package, README and MIT-declaring pyproject are now covered by a pure
      seven-file Git-blob and length preflight without importing viewer code.
      nerfview's reviewed pyproject directly declares only viser>=0.2.1,
      whereas its eagerly imported viewer.py also imports numpy and jaxtyping;
      those need explicit exact Python runtime closure rather than an assumed
      transitive dependency. These are import-closure observations only; exact
      Python package/build hashes, CUDA ABI, native wheel licenses, runtime import
      proof and supported GPU training are still unresolved. V2L18.3 now audits ten exact reviewed upstream
      trainer-entrypoint/source files offline using their Git blob identities and
      byte lengths, without importing packages or executing the trainer. This is
      only a partial source-byte gate, not a full upstream tree, CUDA or license
      closure. The exact official examples/requirements.txt at blob
      ea0a940ea796e486aa68e8fc284ee01cb5a27662 requests numpy<2.0.0
      and rmbrualla/pycolmap commit cc7ea4b7301720ac29287dbe450952511b32125e,
      rather than the independent approved WRE PyCOLMAP 4.2.0 path.
      The referenced rmbrualla/pycolmap commit is a distinct pure-Python
      SceneManager reader, whose pinned package source declares version 0.0.1
      and MIT license (source license blob 5156d3d49e0c312561c59680658b6261f635abe3).
      A separate offline CPU preflight now verifies its exact nine selected
      package/metadata/license files including SceneManager and rejects
      unexpected package Python files or any source-byte drift. PR #207
      additionally proves a CPU-only native binary cross-read on the exact
      reviewed 12-image / 477-point L3.7 fixture generated by PyCOLMAP 4.2.0.
      Camera models, intrinsics, local poses, registered image-name identities,
      2D associations, 3D xyz/RGB/error values, reciprocal tracks and source
      binary hashes agree between the native and exact historical reader.
      The historical SceneManager does not import under NumPy 2.5.3 because
      its np.uint64(-1) declaration raises OverflowError; PR #207 executes
      the unchanged reviewed source in an isolated Python 3.12 NumPy 1.26.4
      SciPy 1.16.2 process instead. This is one tested native-model format
      compatibility fixture, not a universal format guarantee, full transitive
      runtime/license approval or successful gsplat GPU training. Do not install
      that historical fork into WRE's native PyCOLMAP 4.2.0 environment.
      PR qualification now records an exact 75-wheel external Python runtime
      closure for CPython 3.10.21 with torch 2.4.0+cu124, torchvision
      0.19.0+cu124, NumPy 1.26.4 and the CUDA 12.4 wheel family. The lock
      records exact artifact URLs/SHA-256 identities, Requires-Dist metadata
      and direct wheel license metadata for every resolved package, while the
      exact gsplat, fused-ssim, nerfview and historical SceneManager sources
      remain separately revision-pinned and are to be installed with no
      dependency re-resolution. This is resolver evidence only: it is not a
      CUDA-extension build, import, GPU or training proof. Next close the exact
      CUDA toolkit/host-compiler/native-extension build identity before any
      supported GPU run.
      Its COLMAP parser expects native sparse cameras
      images tracks and colored points that cannot be reconstructed by inventing
      private information from a canonical geometry envelope. The default upstream
      world normalization and image downsampling cannot be used silently because WRE
      must preserve exact local frame scale camera calibration photometry and
      observation identities. Only an exact verified materialized dataset and
      reviewed no-normalization no-pose-change local execution profile may enter an
      experimental adapter, with one PLY output and content-addressed manifest.
      No unreviewed checkpoint, default promotion, quality ranking or GPU result
      is authorized. Hardware-dependent execution remains DEFERRED/UNVERIFIED
      until an actual supported GPU fixture succeeds.
