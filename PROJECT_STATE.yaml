current_goal: >-
  V2L16.3 is complete with one pure deterministic solver-independent descriptive mesh inspection layer over existing SurfaceModel evidence.
  SurfaceMeshInspection now binds exact caller topology counts to one matching materialized mesh and SurfaceSuitabilityReport emits canonical
  finite-vertex degenerate-triangle boundary-edge non-manifold-edge largest-component and connected-component observations with exact
  provenance. The metrics remain descriptive only: favorable topology does not prove watertightness collision safety navigation readiness or
  measurement accuracy, and intended-use metadata does not change the metric vector. Advance only V2L16.4 with the pure optional hybrid
  surface-candidate adapter boundary; do not integrate or select a concrete hybrid surface technology in that item.
next_action: >-
  Implement only V2L16.4 under its executable registry contract. Add a pure immutable HybridSurfaceCandidateRequest/Result plus one
  HybridSurfaceCandidateAdapter Protocol and build helper over canonical GeometrySolutionCandidate SurfaceModel ArtifactRef and
  ArtifactMaterializationMetadata contracts. Preserve exact source geometry local frame scale status caller-declared surface representation
  intended uses and canonical ancestry while keeping physical surface separate from appearance even for future jointly optimized methods. Do
  not execute or integrate 2DGS OMeGa SurfaceSplat MeshSplatting Open3D or another solver, select rank merge repair fill or replace candidates,
  create unsupported-region semantics, apply QualityDecision or safety/accuracy claims, or implement V2L16.5 or later behavior in the same PR.
