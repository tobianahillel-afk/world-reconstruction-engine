current_goal: >-
  V2M3 has the reviewed V2L17 photometric evidence and the canonical AppearanceModel envelope from V2L18.1. V2L18.2 now supplies a pure
  solver-independent static appearance candidate request result adapter Protocol and exact artifact-materialization boundary. Preserve exact
  geometry surface observation producer frame and scale identities as static appearance moves to the first experimental baseline integration.
next_action: >-
  Continue only V2L18.3. CPU-only gsplat preflights now verify source PNG byte/pixel identities,
  native COLMAP geometry equivalence, audited final PLY bytes and exact per-PNG V2L17 READY/COMPATIBLE
  photometric evidence without silently applying normalization. PR #203 adds a CPU-only
  multi-observation necessary-evidence check: after revalidating each exact source PNG and
  V2L17 assessment, fully resolved ISO, shutter time, aperture, exposure compensation,
  white-balance mode and color temperature must match across two or more observations.
  Missing or differing metadata fail closed; equal capture declarations do not prove
  equal scene radiance, tone mapping, actual overlap or camera-response calibration.
  PR #205 adds a separate CPU-only necessary-evidence gate over the exact audited COLMAP native
  sparse model: all selected registered source observations must form a connected graph of
  reciprocal, valid shared Point3D/Point2D tracks with exact image-name identities. This
  proves bounded geometric overlap only, not equal radiance, photometric calibration, view
  quality or GPU training success.
  The additional exact-source gate verifies ten reviewed gsplat v1.5.3 trainer
  entrypoint/requirements/parser/helper files against
  immutable upstream Git blob SHA-1 identities and byte lengths before any future external import.
  This is a partial local source-byte proof only, not full source-tree, wheel, native ABI, GPU or
  transitive-license approval. Official gsplat examples/requirements.txt requests numpy<2.0.0
  and a pinned old rmbrualla/pycolmap fork; never silently install it in WRE or assume it is
  interchangeable with WRE's PyCOLMAP 4.2.0 environment. PR #206 adds a separate offline source-byte
  gate for the exact MIT rmbrualla/pycolmap SceneManager reader commit cc7ea4b7301720ac29287dbe450952511b32125e:
  nine reviewed package/metadata/license files are Git-blob pinned, while unexpected package files
  and symlinks fail closed. PR #207 now adds a separate CPU-only real native-model
  compatibility fixture: exact PyCOLMAP 4.2.0 reconstructs 12 registered images and 477
  points; the unchanged reviewed SceneManager fork, isolated under Python 3.12 NumPy 1.26.4
  and SciPy 1.16.2, reads camera models intrinsics poses image names 2D links 3D RGB/error
  and reciprocal tracks identically, with audited native binary hashes unchanged. The old
  fork fails to import under NumPy 2.5.3 because np.uint64(-1) raises OverflowError,
  so do not put the two PyCOLMAP readers in one runtime. This is one real fixture only,
  not universal compatibility or trainer GPU approval. PR #209 adds a separate CPU-only,
  source-byte-bound cross-observation pixel diagnostic: after exact V2L17 metadata checks
  and reciprocal COLMAP 3D track support, it decodes the actual original sRGB PNG pixels
  at common tracks and retains per-observation-pair raw sRGB-channel differences and exact
  PNG identities. This is descriptive observation evidence only, not a color/radiance
  calibration, threshold-based quality gate, camera-response solution or GPU training proof.
  Next close the exact gsplat trainer
  Python/Torch/CUDA and isolated SceneManager dependency/license lock, prove actual
  cross-observation photometric suitability using independently supported shared-scene
  evidence beyond capture-setting metadata equality, execute a private supported-GPU
  fixture, and
  construct a complete AppearanceModel plus actual ArtifactMaterializationMetadata behind V2L18.2.
  Preserve caller geometry, local frame, scale, original pixel bytes and source lineage. Keep
  unsupported hardware DEFERRED/UNVERIFIED. No default route, held-out scoring, router promotion
  or V2L18.4 implementation.
