  Continue V2L14.4 qualification only. The active GLUEMAP+VGGT source-byte gate is closed and the reviewed conda resolver now freezes a
  193-package partial runtime closure at SHA-256 0b9a91630a1e15fd2fe61f0c22bcf6605cd5f5997adc312cf6b549935f311c9f, including exact
  NetworkX 3.6.1 Pillow 12.2.0 SciPy 1.17.1 tqdm 4.67.3 einops 0.8.2 imagesize 2.0.0 safetensors 0.7.0 and huggingface_hub 1.12.0.
