  V2L15 is complete and its lot review passes with one retained CPU-only controlled benchmark over canonical DenseDepthArtifact evidence.
  The optional V2L15.2 real CUDA PatchMatch donor remains explicitly deferred and unverified, no universal dense-depth backend is selected,
