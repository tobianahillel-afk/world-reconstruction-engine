  resulting geometric per-camera depth maps to camera-z DepthField evidence. Fusion, learned priors, surface creation and CPU fallback remain
  outside this work item.
next_action: >-
  Implement only V2L15.2 according to its executable registry contract. Add the experimental COLMAP dense-depth adapter around exact PyCOLMAP
  4.2.0 undistort_images plus patch_match_stereo, reconstruct source image snapshots from explicitly supplied ColmapFeatureInput bytes, require
  the audited native sparse model and exact canonical candidate match, fail closed before external work unless a CUDA-enabled build exposes at
