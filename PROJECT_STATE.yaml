next_action: >-
  Continue V2L14.4 qualification only. The current GLUEMAP and Apache MapAnything source/checkpoint identities are pinned in
  registry/dependencies.yaml; next establish a supported reproducible GPU execution lane, prove the reduced profile does not import or execute
