current_goal: >-
  V2L15.4 now provides the pure model-independent learned-depth-prior boundary from one exact GeometrySolutionCandidate plus explicit immutable
  supporting evidence to canonical DenseDepthArtifact output with an explicitly declared DepthValueConventionName, exact ancestry-union
  semantics and no model runtime conversion calibration or automatic truth promotion. Real CUDA PatchMatch execution for the optional V2L15.2
  donor remains explicitly deferred and unverified. Advance only V2L15.5 by making DenseDepthArtifact support visible through deterministic
  coverage hole and confidence reporting without modifying depth evidence or making quality decisions.
next_action: >-
  Implement only V2L15.5 under its executable registry contract. Add a pure dense-depth support evaluator with immutable per-DepthField coverage
  summaries and canonical aggregate MetricVector outputs for source-camera support, valid-pixel coverage, hole ratio, confidence availability
  and descriptive valid-pixel confidence where present. Treat DepthField.validity as the only hole signal, keep absent confidence absent, keep
  confidence informational and preserve source artifact provenance exactly. Do not fill interpolate inpaint convert calibrate fuse rank select
  benchmark route or create surfaces, do not implement V2L15.6, and do not reinterpret the deferred V2L15.2 real CUDA PatchMatch lane as passed.
