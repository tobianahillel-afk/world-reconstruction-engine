  Qualify the strongest currently viable hybrid/global geometry route through the mandatory technology gate and integrate only one exact
  experimental candidate after source checkpoint license hardware reproducibility and cross-version COLMAP evidence is complete, while keeping
  WRE geometry contracts solver-independent and preserving the classical V2L14.3 baseline.
next_action: >-
  Continue V2L14.4 qualification only. Source-level identities and direct licenses are recorded. Next use the newly authorized CPU-only
  gluemap-environment-lock lane to resolve and freeze the exact linux-64 conda package/build/channel closure with an explicit CUDA 12.4 virtual
  package override; this solve is dependency evidence only and is not GPU execution evidence. Then prove the allowlisted runtime
  import/materialization boundary, establish a supported real GPU lane, and exercise a real GLUEMAP-output to WRE PyCOLMAP 4.2.0 cross-read
  fixture. Do not add the adapter while any technology-gate blocker remains.
blockers:
  - V2L14.4 has no executable supported GPU runner in repository CI; the reviewed GLUEMAP reference environment is CUDA/GPU while current WRE workflows are CPU-hosted.
  - V2L14.4 executable-source and transitive license closure is incomplete. Direct source identities/licenses are recorded, and a CPU-only dependency-resolution lane is now authorized because upstream publishes no lockfile/export. The gate remains blocked until that lane produces and freezes exact linux-64 package versions/build strings/channels plus compiler/libstdc++/OpenMP provider, non-SuiteSparse Ceres variant and concrete CUDA 12.4 package set; afterward prove the allowlisted materialization omits non-approved VGGSfM/Doppelgangers++/SALAD/Pi3/VGGT source bytes, keep salad mast3r/dust3r and vggsfm out of the runtime import set, and complete redistribution review for the exact locked native/CUDA packages.
  - V2L14.4 has not yet produced a real GLUEMAP native sparse model for WRE PyCOLMAP 4.2.0 cross-read compatibility evidence against GLUEMAP's isolated pycolmap-cuda12 4.0.4 environment.
