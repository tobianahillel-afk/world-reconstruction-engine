current_goal: >-
  V2L15.1 now provides the solver-independent DenseDepthArtifact boundary. Advance only V2L15.2 by integrating the first classical COLMAP
  PatchMatch dense-depth donor against one exact audited COLMAP-origin GeometrySolutionCandidate, producing canonical camera-z DepthField
  evidence without stereo fusion, source-camera relabeling, metric-scale promotion, learned priors, surface generation or default routing.
next_action: >-
  Implement only V2L15.2 under its executable registry contract. First qualify and freeze the separate official pycolmap-cuda12==4.2.0
  accelerator environment from COLMAP tag commit be5e29168d4aff238409d60424812df66aac919f without changing WRE's approved CPU
  pycolmap==4.2.0 environment. Bind one audited native COLMAP sparse model and exact image evidence, accept only already-undistorted
  perspective-pinhole cameras whose no-resize MVS workspace remains exactly linkable to the source CameraSolution values, execute
  undistort_images plus patch_match_stereo only, and normalize emitted donor depth maps into DenseDepthArtifact camera-z evidence. Do not call
  stereo_fusion, synthesize confidence, relabel resized/distorted cameras, create point/surface output, implement V2L15.3, or promote this
  accelerator donor to the mandatory CPU/default route.
blockers:
  - V2L15.2 real COLMAP PatchMatch evidence requires a supported CUDA accelerator runner and an exact reviewed pycolmap-cuda12==4.2.0 runtime. The repository currently has no self-hosted or hosted GPU workflow runner, so the adapter may be implemented and fail-closed unit-tested but V2L15.2 must not be marked done until retained real accelerator execution evidence exists.
